提供。", "id": "6f64ba14f44d2e04ccf9ece7bb9a1c16a362ceae", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "OpenAI API 新增 12 小时提示缓存：共享指令、工具和上下文可缓存更久，请求间隔数小时仍按更低的缓存输入价计费", "url": "https://developers.openai.com/api/docs/changelog", "source": "OpenAI API Changelog", "date": "2026-10-20", "summary": "10 月 20 日更新日志显示，Responses API 可选择 12 小时提示缓存，12 小时缓存写入按输入 token 价格的 2.5 倍计费。OpenAI Devs 称这主要面向全天反复复用上下文的常驻智能体。", "id": "337afc339ead3cd20d75e452dff34fef176cb910", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "Bria 发布并开源 Fibo 2：8B 统一图像生成与编辑模型，全部使用授权数据训练，称在 Artificial Analysis 图像编辑榜位列开源权重第一", "url": "https://docs.bria.ai/whats-new/fibo-2", "source": "Bria AI", "date": "2026-10-20", "summary": "Fibo 2 Generate 与 Edit 权重已上 Hugging Face（如 briaai/Fibo-2.0-dev），Diffusers 首日支持；编辑可一次组合最多 4 张参考图，每次生成都返回结构化提示 VGL 便于复现与微调，新增 12 种画幅共 21 种。Bria 称其编辑效果优于 Ideogram、字节跳动和 Black Forest Labs 的闭源模型，文生图位列开源前二；API 接口不变。", "id": "fd2fa98fc88ee4e35b9388bff0103f59445fccdf", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "Semafor：Anthropic 游说国会的联邦 AI 安全法案草案外泄引发反弹，安全倡导者批其力度不够、抢占州法；OpenAI 首席全球事务官 Lehane 暗讽“没有哪家公司该独自制定规则”", "url": "https://www.semafor.com/article/10/20/2026/anthropics-leaked-ai-bill-sparks-backlash", "source": "Semafor", "date": "2026-10-20", "summary": "Anthropic 发言人称草案是其数月来推介的 AI 安全框架的立法版本，其一名高级说客已公开表示将调整草案，以更贴合 AI 进展速度并澄清其在联邦优先于州法上的立场。OpenAI 借机与对手划清界限，Lehane 周一发文称政策须经民主程序、由民选官员主导。", "id": "c42646dd03d2145745832bbd8d5e8c320638a843", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "HeyChengC/wallstreet-explainer", "url": "https://github.com/HeyChengC/wallstreet-explainer", "source": "GitHub", "stars": 310, "stars_week": null, "language": "Python", "date": "2026-10-20", "summary": "华尔街风格财经/科技解读短片 Skill：让 Claude Code 等编码智能体自己找真实发布会与新闻素材、抠出人物、把数字做成可视化镜头，按时间线逐帧渲染并自动混音，附 77 秒样片《AI 到底有多烧钱》。", "why": "10 月 18 日开源，两天约 310 星，是近期新建仓库中热度较高的中文 AI 视频生成 Skill。", "id": "9e405476ac4a6d0463a0bd5d770be072a8dcc912", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "@OpenAIDevs", "url": "https://x.com/OpenAIDevs/status/2112603916076781778", "source": "@OpenAIDevs", "date": "2026-10-20", "summary": "OpenAI 开发者账号宣布 API 可选 12 小时提示缓存：常驻智能体全天复用上下文，请求间隔数小时也能按更低的缓存输入价计费。", "metrics": {"likes": 1104, "reposts": 39, "views": 63592}, "id": "286ddd704e58166f4626420d44a067dd21def4c1", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112605106642600283", "source": "@testingcatalog", "date": "2026-10-20", "summary": "ChatGPT 锁定聊天开始向 Free、Go、Plus、Pro、Business、Enterprise、Edu 推送：网页和桌面端用 PIN，移动端可用 Face ID、Touch ID 或设备解锁。", "metrics": {"likes": 248, "reposts": 4, "views": 11508}, "id": "79ebbe15a5c59f21b60f2033233cfce22ce83431", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "@theinformation", "url": "https://x.com/theinformation/status/2112612337932812694", "source": "@theinformation", "date": "2026-10-20", "summary": "The Information：奥特曼称 OpenAI 需要弄清 AI 何时强大到无法安全开发或发布，内部代号“pacing 2.0”的工作将为可持续自我改进的 AI 系统设定界限。", "metrics": {"likes": 3, "reposts": 0, "views": 1923}, "id": "575e8be058908e9bc912045dea8cd5226599e4c5", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "谷歌 Gemini 推出小企业工具：新增商家专属落地页、营销与财务技能，可连接 Google 商家资料、Ads、Workspace 及 Adobe、Canva、Shopify、Xero 等应用", "url": "https://blog.google/innovation-and-ai/products/gemini-app/new-tools-small-business-owners/", "source": "Google Blog", "date": "2026-10-20", "summary": "谷歌称已有数千万小企业主在用 Gemini。新功能允许上传网站、品牌包、字体或配色定义品牌风格，搭配 Nano Banana 2.1 生成风格一致的营销素材并记住该风格；还能把杂乱的表格、收据和采购记录转成财务图表与交互模型。商家落地页、营销与财务技能及新连接应用将在未来几天面向全球所有 Gemini 应用用户陆续推出。", "id": "cbc887d67feaee019cbc714a3d0e083681c86e63", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "OpenAI 收购药物研发协同平台 Orchestra Bio：团队与技术并入生命科学模型与工具线 Rosalind，打造协调药物项目的智能体", "url": "https://openai.com/index/openai-to-acquire-orchestra-bio", "source": "OpenAI", "date": "2026-10-20", "summary": "Orchestra Bio 让科学家和项目负责人把研究与试验的监控、跟踪交给智能体，并在某个环节出问题（如一批生产失败可能推迟临床试验）时识别受影响的活动与时间线、汇总信息并比较应对方案。OpenAI 称将把它与 GPT-Rosalind、Rosalind Workbench 结合，帮助把科学发现更快推进为可上市的疗法；交易金额未披露。", "id": "dbaa902542534b3aef2de952931670bbaaa97f74", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Visa、BILL 与 Billtrust 启动首个可信 AI 智能体 B2B 支付实盘试点：经认证的智能体可端到端登录供应商门户完成已审批的发票付款", "url": "https://investor.visa.com/news/news-details/2026/Visa-BILL-and-Billtrust-Launch-First-Live-Pilot-for-Trusted-AI-Agent-Payments-Between-Buyer-and-Supplier-Platforms/default.aspx", "source": "Visa", "date": "2026-10-20", "summary": "BILL 的付款智能体通过 Visa 可信智能体协议（Trusted Agent Protocol）与智能体目录注册，使用令牌化支付凭证并受买方已批准的付款指令约束；Billtrust 侧据此识别并放行该智能体，可替代验证码等反机器人机制，无需共享门户登录。三方称智能体不做付款决策，只执行已获批准的付款，试点已在处理真实交易。", "id": "7b0400b2a99802a8cad4632c49a3cc27db98dbd5", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Meta 提出 RPL（检索程序学习）：让策略把搜索原语组合成带状态与控制流的可执行检索程序，4B 模型超过所有 8B 基线", "url": "https://ai.meta.com/research/publications/learning-to-program-retrievals-composing-search-primitives-via-reinforcement-learning/", "source": "AI at Meta", "date": "2026-10-20", "summary": "针对多步检索中固定管线或原子工具的局限，RPL 允许模型先广泛检索、处理中间结果再有选择地构建上下文；为解决稀疏奖励下的探索难题，提出“程序变异”：对 RL 采样到的次优程序做语法约束、经执行验证的局部改写并蒸馏回策略。在开放域问答上多跳任务提升尤其明显，语料级推理任务答案 F1 与文档覆盖 F1 均最高，同时显著减少上下文消耗与检索轮数。", "id": "62bf04ea7632706ea4e24f915a6216631c2ba4a3", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "IBM Research 发布 ALTK-Evolve：用学到的“行为准则”记忆，让 GPT-4.1 基础 ReAct 智能体在 τ²-bench 零售客服任务 Pass^4 达 67.5%，超过榜单所有条目", "url": "https://huggingface.co/blog/ibm-research/altk-evolve-bc", "source": "Hugging Face Blog / IBM Research", "date": "2026-10-20", "summary": "ALTK-Evolve 分析智能体在训练任务上的成功与失败，把经验提炼成简短的行为规则（如如何验证身份）追加到系统提示中，不更新模型权重。IBM 称准则同时提升能力与可靠性，最佳准则量因领域而异，性能提升主要多花 token 而非多轮次，且对前沿模型驱动的智能体同样有效。", "id": "94e7f4f5c0e52bb75e66cbfeaab71589104be947", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "蚂蚁百灵开源 Ming-3.0 语音系列五款模型：覆盖语音合成（支持文字描述音色与“导演模式”）、长音频理解与对话、语音识别", "url": "https://www.ithome.com/1/015/117.htm", "source": "IT之家", "date": "2026-10-20", "summary": "Ming-3.0-tts 系列可用文字描述或参考音频设定音色，并能说明台词的情绪变化、重读与节奏；Ming-3.0-audio-flash/tiny 可直接对长音频做转写、总结和观点分析并结构化输出，保留情绪与说话人信息；Ming-3.0-asr-tiny 结合热词与上下文提升识别，已用于阿福、支付宝搜索等业务。模型已上架 Hugging Face 与魔搭，Ling Studio 提供 API。", "id": "9519466b099115beeaf32d8e2946dd421b8d844d", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Meta 暂停 Muse 对话分享功能：安全公司 Claroc 通过公开 DNS 记录找出 6800 多个分享链接，曝光公司营收、贷款申请、员工日程等隐私内容", "url": "https://www.theverge.com/tech/1014627/meta-muse-ai-sharing-ai-chats", "source": "The Verge", "date": "2026-10-20", "summary": "据 Ars Technica 与 The Verge 报道，Muse 分享链接的主机名由对话标题加随机 ID 构成，链接被打开后会被被动 DNS 服务记录，研究者据此可重建链接并免登录查看数百段对话，其中包括一份与某前沿 AI 实验室负责人保密通话的准备笔记。Meta 发言人称已暂停该功能并评估如何改变链接被发现的方式；此前 ChatGPT、Claude、Grok 的分享对话也曾出现在谷歌搜索中。", "id": "f52190a49967b68da7ad63d8e5297c5a8a841b2d", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "交通运输部在北外滩国际航运论坛发布首批《水运领域人工智能应用场景指引》，同步公布 2027 年拟建成的十大智能体和十大垂类模型", "url": "https://www.yicai.com/brief/103400431.html", "source": "第一财经", "date": "2026-10-20", "summary": "10 月 20 日 2026 北外滩国际航运论坛在上海开幕。为落实《关于“人工智能+交通运输”的实施意见》、聚焦“一网四化”，交通运输部发布第一批水运领域 AI 应用场景指引（覆盖安全提升、提质增效、绿色转型三方面共 22 个场景），并公布到 2027 年拟建成的十大智能体与十大垂类模型，推动 AI 在港口、航运等水运领域的创新应用。", "id": "1bfeb95ea850e1916f43f24d4be92f8698d367b8", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "VictorTaelin/uniichat", "url": e": "@theinformation", "url": "https://x.com/theinformation/status/2112597246042603587", "source": "@theinformation", "date": "2026-10-20", "summary": "The Information：奥特曼对员工称，AI 安全的一种路径可能是把最大的几家 AI 实验室合并成一个组织，但 OpenAI 与 Anthropic 都在冲刺 IPO，与对手协调恐怕很难。", "metrics": {"likes": 8, "reposts": 1, "views": 4796}, "id": "7b379e156a537c8368676d73df792e40045416b8", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112597259388850456", "source": "@business", "date": "2026-10-20", "summary": "彭博：随着美国各地反对 AI 的声音蔓延，保险公司 Arbol 押注数据中心开发商会购买保单，以弥补许可延误或项目被阻导致的损失。", "metrics": {"likes": 5, "reposts": 2, "views": 15908}, "id": "2f528bcdb661a5adc540bd3a699de975f89b5794", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Zoom 在 Zoomtopia 推出 AI 治理套件：集中式 AI 智能体管理、自定义 AI 护栏，以及实时“深度伪造风险检测”", "url": "https://news.zoom.com/zoomtopia-2026-security/", "source": "Zoom", "date": "2026-10-20", "summary": "Zoom 称 AI 智能体越来越多地接触会议内容与企业系统，管理员需要像管控其他关键系统一样管控 AI：集中式 AI 管理可查看组织内运行的智能体、访问的数据并审计其活动（预计 2026 年 12 月）；自定义 AI 护栏可阻止指定敏感信息出现在 AI 摘要中，并可要求人工审核（预计 2027 年 Q1）；与 Microsoft Purview 的敏感度标签同步已上线。深度伪造风险检测实时分析音视频信号，识别可能在 Zoom 之外被篡改的参会者画面或声音并给出置信度提示，面向招聘面试、客户沟通等场景，预计 12 月推出。", "id": "3060598f4bdebc466fcabc2f7710d50b92afa639", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Salesforce 宣布以约 56.6 亿美元收购 AI 营销平台 Braze：每股现金 47.50 美元，Braze 股价盘前飙升逾 50%", "url": "https://www.cnbc.com/2026/10/20/salesforce-braze-acquisition-deal.html", "source": "CNBC", "date": "2026-10-20", "summary": "Braze 周一收于 30.04 美元，消息公布后短暂停牌、随后大涨逾 50%；Salesforce 股价小幅下跌约 1%。交易预计在 Salesforce 2028 财年完成，尚需 Braze 股东与监管批准。Braze 提供基于 AI 的客户数据与消息触达工具；这是 Salesforce 继数月前以约 36 亿美元收购 AI 客服平台 Fin 之后的又一笔 AI 相关并购，也延续其 8 月与 Anthropic 扩大合作（推出 Claudeforce 插件）的智能体布局。", "id": "857b61bdc6beef201d12adade8198c8da71013c7", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Radical Numerics 发布多模态基因组语言模型 Omnii-1：AI 设计的噬菌体首次在“同情用药”途径下给到人类患者，用于治疗耐药菌感染", "url": "https://www.radicalnumerics.ai/blog/omnii-phage", "source": "Radical Numerics", "date": "2026-10-20", "summary": "由 Evo/Evo 2 原班人马创立的 Radical Numerics 称，Omnii-1 把 DNA、RNA、蛋白质等 28 类生物数据统一表示；团队针对 T7 噬菌体尾丝蛋白 gp17 生成变体，在 11–15 个氨基酸改动时 69.9% 的设计可成功“重启”，随机对照仅 4.8%。含 AI 设计噬菌体的鸡尾酒在体外清除了患者的耐药菌株，随后在医生主导、受监管的同情用药途径下给药；公司出于隐私未披露疗效，并强调单一病例不能证明安全性或有效性。Omnii 同时被用于生物防御，已与劳伦斯利弗莫尔国家实验室合作。", "id": "44add383a8c65c410669f22b6c6021c83c2e0dad", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Ai2 发布 FairStress 公平性基准：300 个双候选人决策场景扩展为 1300 多万测试用例，发现模型在被“说服”时更易为少数群体放弃正确决定", "url": "https://huggingface.co/blog/allenai/fairstress", "source": "Ai2 / Hugging Face", "date": "2026-10-20", "summary": "FairStress 覆盖招聘、医疗、贷款、教育、住房、刑事司法等 29 个领域，除看最终选择外，还用权威、共识、历史劣势等“对抗性前缀”测试模型改变决定的难易度。15 个模型上，隐含身份与显式标签时放弃正确答案的平均差距分别为 6.9 与 9.3 个百分点；Claude Opus 5、GPT-5.5 等前沿模型在难分高下的案例中约 60–65% 选择少数群体候选人，作者称之为“反刻板印象过度矫正”。9 种去偏方法中仅“反事实思维链”在基本保持准确率的同时缩小了不对称；基准将并入 Olmo-eval。", "id": "ca293d8533a3487d56775601759d9e248992e54a", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "llm-d 1.0 发布：红帽、IBM、谷歌主导的 Kubernetes 原生分布式推理栈进入生产就绪，新增多租户 QoS、零停机升级与面向智能体的路由", "url": "https://research.ibm.com/blog/llmd-1-0-is-ready-for-production-inference-serving", "source": "IBM Research", "date": "2026-10-20", "summary": "在 PyTorch Conference North America 上发布；llm-d 由红帽、IBM、谷歌与 CoreWeave、英伟达去年共同创立，现为 CNCF 沙箱项目，可在 vLLM 或 SGLang 之上提供前缀缓存感知路由、KV 缓存跨 GPU/CPU/存储卸载、预填充/解码分离与宽专家并行。1.0 重点是“第二天运维”：稳定 API、流控与优先级、多轮请求固定到已有缓存的副本。IBM 称在智能体编程负载中前缀路由捕获了 97% 的可复用缓存，并演示自托管同时运行 3000 个软件工程智能体，成本为调用同一开源模型托管服务的 1/5 到 1/10。", "id": "8a14a92d09a13dfe8a35388e6cc0dd329d173be2", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Politico：OpenAI 不再推动对华严格芯片出口管制，国会对华鹰派拟在跛脚鸭会期把限制条款塞进国防授权法案时失去这一行业盟友", "url": "https://thenextweb.com/news/openai-china-chip-export-controls-retreat-nvidia", "source": "TNW / Politico", "date": "2026-10-20", "summary": "据 Politico 援引国会助手与说客，OpenAI 去年多次公开支持严格限制先进芯片对华销售，如今在相关议题上保持沉默；一名国会助手称“沉默就是在替英伟达干活”，一名说客称“目前没人想挑战总统”。此举被视为利好反对新限制的英伟达，并使 OpenAI 更贴近特朗普政府立场；英伟达今年 2 月完成对 OpenAI 300 亿美元股权投资。OpenAI 发言人称美国实验室在先进芯片上保持大幅领先是关键，有效的出口管制政策是更广泛战略的一部分；Anthropic 则继续支持多项芯片法案。", "id": "977d0606ec3e001ad147180992f32dcbd44b45c6", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "国家数据集团有限公司在雄安新区成立：丁薛祥出席揭牌，称组建该央企对把握人工智能发展先机、建设数字中国具有重要意义", "url": "https://www.gov.cn/yaowen/liebiao/202610/content_7083803.htm", "source": "中国政府网 / 新华社", "date": "2026-10-20", "summary": "新华社 10 月 20 日电，国家数据集团成立大会在河北雄安新区举行。丁薛祥要求公司深化数据要素服务、加快数据基础设施建设、加强关键核心技术攻关，在数据领域发挥战略性、引领性、支撑性作用，努力打造世界一流数据科技企业；各有关部门加大支持、相关企业协同合作，形成促进数据产业发展的合力。外媒将其解读为中国把 AI 训练所需的数据资源统筹到一家国资平台。", "id": "377f24af829d8c4f44a8e177982233bf3d3da9bf", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "彭博：智谱 Z.ai 四位联合创始人曾参与由中国通用技术研究院（CGTRI）共同资助的研究项目，英国军情五处称该机构与国家安全部关系密切", "url": "https://qz.com/z-ai-founders-research-cgtri-mi5-spy-agency-102026", "source": "Quartz / Bloomberg", "date": "2026-10-20", "summary": "据彭博，该项目 2018–2021 年执行、获批经费 294 万元，由 CGTRI 与国家自然科学基金共同资助，目标是开发解析社交媒体帖子、识别重要事件并绘制人物关系的 AI 软件；清华教授、智谱联合创始人李涓子为负责人之一，唐杰、许斌与 CEO 张鹏以合著者、共同发明人或软著权人身份出现。军情五处 9 月 30 日的预警未点名智谱；中国驻英使馆称其说法“毫无根据”，智谱未回应置评。智谱今年 1 月在港上市，市值约 320 亿美元。", "id": "e99d5e06478a2e057638b0c8ea15176a8c20cf26", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "llm-d/llm-d", "url": "https://github.com/llm-d/llm-d", "source": "GitHub", "stars": 4881, "stars_week": null, "language": "Python", "date": "2026-10-20", "summary": "Kubernetes 原生的分布式 LLM 推理服务栈（Apache-2.0）：在 vLLM/SGLang 之上提供前缀缓存感知路由、分层 KV 缓存、预填充/解码分离、宽专家并行与多租户流控，“任意模型、任意加速器、任意云”。", "why": "10 月 20 日发布 v1.0.0（北京时间 10:30），红帽、IBM、谷歌在 PyTorch 大会 0"}, {"title": "Perplexity Computer 新增 Mac 端侧模式：智能体与模型全部在本机运行（Qwen 3.6 或后训练的 PPLX Pro），可离线操作本地应用与文件，建议 36GB 以上内存", "url": "https://www.theverge.com/ai-artificial-intelligence/1014400/perplexity-computer-can-now-run-fully-offline-on-mac-but-youll-need-a-lot-of-ram", "source": "The Verge / Perplexity", "date": "2026-10-20", "summary": "据 The Verge，更新后用户可在不把数据传到云端的情况下跨原生 Mac 应用和本地文件执行任务，借助 Apple Silicon 在本机跑模型；需要最新信息或浏览器操作时，也可把部分任务转交云端。功能已在 Perplexity Mac 应用上线。", "id": "363545536b262f65f9c67f6f665974dea7fe8c02", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "关键基础设施 AI 公司 ASI（原 Air Space Intelligence）完成 3.25 亿美元 C 轮、估值 30 亿美元，Spark Capital 领投，Citadel Securities、a16z 等参投", "url": "https://www.financialcontent.com/article/bizwire-2026-10-20-asi-secures-325m-series-c-at-3b-valuation-to-power-americas-critical-infrastructure-with-ai", "source": "Business Wire / Bloomberg", "date": "2026-10-20", "summary": "ASI 用持续前向仿真为空管、电网、国防后勤等预测未来数小时至数周的态势。公司今年 6 月获美国交通部/FAA 8.75 亿美元国家空域系统现代化项目，美国陆军另授予 9900 万美元合同用于下一代指挥控制（NGC2）；客户还包括达美、阿拉斯加与联合航空及 National Grid。新资金将用于能源、物流和战术边缘部署，并扩充波士顿的前沿 AI 研究团队。", "id": "16abd587bb31f7db9b192447a66dc3f6cf6772e2", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Meta 独立 AI 助手 Muse 上线约 40 天在美国下载量突破 1000 万，Sensor Tower 称其是第 12 款在 40 天内达成该里程碑的应用", "url": "https://www.theverge.com/ai-artificial-intelligence/1014440/metas-muse-ai-hits-10-million-us-downloads", "source": "The Verge / Sensor Tower", "date": "2026-10-20", "summary": "Muse 于 9 月推出。Sensor Tower 认为其增长部分得益于 Meta 规模可观的广告投放。", "id": "f413c53ffdff60445755dd1c17837ac404df9721", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Spotify：过去一年已从推荐中移除逾 5000 万首被认定为 AI 劣质内容或垃圾的歌曲，并调整推荐系统更多突出人类音乐人", "url": "https://www.theverge.com/entertainment/1014284/spotify-ai-slop-spam-songs-removed", "source": "The Verge", "date": "2026-10-20", "summary": "Spotify 称编辑也不会为这类内容编排歌单，调整后听众相关投诉明显下降。它没有强制给所有 AI 曲目加标签，而是推出“AI Persona”标识，用于以 AI 身份出现、不代表真人的艺人，并且不推荐此类音乐；判定依据包括收听互动与反馈、上传模式、元数据及第三方 AI 检测工具。同时它正与环球音乐、Believe 合作推出 AI 混音创作工具。", "id": "e85a4c5da2af52ae78ebcd6df6fef324bcd51cb3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Electric Plant 获 1120 万美元种子轮：自研“植物电信号大模型” Bombadil，读取茎干内微伏级电信号判断约 125 种植物的需水、需肥与光照状况", "url": "https://techcrunch.com/2026/10/20/plants-can-speak-using-electricity-so-this-startup-built-an-ai-model-to-decipher-their-language/", "source": "TechCrunch", "date": "2026-10-20", "summary": "本轮由 Onto Ventures 与 Climactic 领投。传感器约折叠 iPhone 大小，用不锈钢螺钉接入形成层，每英亩只需几枚，单价几十美元，远低于动辄上千美元的现有设备；数据经低功耗无线网络上传，由云端 Bombadil 解读后回传给种植者调整灌溉与施肥。公司称可在增产的同时节水 20% 以上。", "id": "5130abca4141f29e7b41918cc604c981206a7152", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Mind Lab 提出 BrainLoRA：用 LoRA 参数高效微调最大 104B 的多模态骨干预测大脑神经响应，在 Algonauts 2025 取得已发表最佳成绩，200+ 适配模型集成登顶公开榜", "url": "https://arxiv.org/abs/2610.26802", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "研究利用骨干网络的因果结构一次前向预测多个时间点，取代滑动窗口，大幅降低特征提取成本；在九种多模态骨干上均提升脑编码表现，并在与此前 SOTA 相同的 Qwen3-Omni 骨干上胜出。适配后的模型仍可解释：模态归因能还原经典的感觉皮层分布，神经适配还提高了音频输入与跨模态混合的贡献。作者另写了多 LoRA 核以便在共享骨干上联合训练多个适配器。该文为 10 月 20 日 HF Daily Papers 票数最高论文。", "id": "d7638f10c57aaffb40c0fa212d410f13a03c4eb9", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "HarnessPro：无标签递归自改进智能体 Harness，同时优化性能与成本，按预算给出 lite/medium/heavy 三档；GPT-5.5+Codex 下 heavy 档较 RHO 通过率平均 +2.0 点、单任务成本 -26.1%", "url": "https://arxiv.org/abs/2610.26770", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "候选 harness 用 LLM 生成的测试评估，无需真值或官方测试；专门的智能体诊断执行轨迹、按不同性能—成本优先级规划改动并实现成候选，再用归一化加权平方距离挑出三档供下一轮迭代。实验覆盖 Terminal-Bench 2、SWE-Bench Pro 与 ProgramBench，GLM-5.2+Claude Code 组合下优势同样成立，代码已开源。", "id": "c2700c6d1f0dc5a08610e1a7d1f86bdbe885c914", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "美团 LongCat 提出 Interlock：把长程任务表示为带类型的“完成图”来合成训练任务，用自身通过的轨迹微调 Qwen3.6 后 AutomationBench 通过率 +4.0–4.5 点、JobBench +3.2–6.6 分", "url": "https://arxiv.org/abs/2610.19686", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "作者指出智能体常常“局部正确但任务没做完”。Interlock 用依据边连接公开证据与决策、用耦合超边施加跨组件联合约束、用实现边把决策连到所有必需的下游效果，再编译成可重置工作区、公开请求与评分细则，并做来源覆盖与公开输入两道审查；agent-as-judge 检查产物、跑校验脚本，只保留满足全部必选要求的轨迹。在 Harvey LAB 上细则通过率也提升 3.9–4.2 个百分点。", "id": "ae9b1450298238451f19ee24668e66e2c220942b", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Ornith 开源 Ornith-1.5-122B（MIT）：122B MoE，单台 DGX 即可部署并提供移动端量化版，TerminalBench 2.1 得 81.2、CyberGym 80.0", "url": "https://huggingface.co/ornith-ai/Ornith-1.5-122B", "source": "Hugging Face / Ornith", "date": "2026-10-20", "summary": "官方称其“强与快不再取舍”：基准更高、完成更快、输出更短，指令遵循、任务拆解与真实工作场景知识更强，为同等规模开源模型 SOTA。模型卡对比中，TerminalBench 2.1 略低于 Qwen3.8-Flash-Next（83.4）与 DeepSeek-V4-Flash-0731（82.7），CyberGym 则高于两者（78.0/76.7），NL2Repo 51.2。发布帖在 X 上浏览约 18 万次。", "id": "961c19e76e6ab3dae77129c44137b0e2f6f3e707", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "黄仁勋在柏林与德国总理默茨对谈：欧洲不应过度依赖监管，“行业不能蓬勃发展就没什么可监管的”，主张像监管互联网产品一样管 AI 应用而非底层技术", "url": "https://www.ithome.com/1/015/603.htm", "source": "IT之家 / Business Insider", "date": "2026-10-20", "summary": "据 Business Insider，黄仁勋过去一周先后访问法国、瑞典、英国和德国，为 10 月 20–22 日的 GTC Berlin 预热（主题演讲定于北京时间 10 月 21 日 17:00）。他称安全必须放在首位，但不能只靠监管大棒指望领先，“给德国一个机会，给这个行业一个机会”。默茨回应称完全不监管不对，过严的规则同样不可取；两人都把 AI 视为帮助德国走出经济低迷的可能途径。", "id": "9fd6103042fa7d85e4e4fc6eba771c6ce304fc5f", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "硬氪：AI 材料研发平台睿质科技完成数千万元天使轮融资，中关村资本领投；核心产品 Archeos 以多智能体串起文献检索、材料设计、计算仿真与报告生成", "url": "https://www.163.com/dy/article/L9M2GN2505118DFD.html", "source": "36氪 / 硬氪", "date": "2026-10-20", "summary": "睿质科技由院士、长江学者团队领衔，面向科研机构与工业企业提供材料计算、性能预测与研发服务，覆盖先进功能陶瓷、合金、新能源材料等领域，中关村科学城公司跟投，新一轮融资已在推进。公司目前结合平台工具与定制化计算服务（如某工业级合金性能预测项目），未来计划把仿真与实验验证结合，与产业客户联合研发，探索技术授权与收益分成。", "id": "86004464332eb5fff9f5ea33d62890d38a65b215", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "simbasjungles/free-my-tv", "url": "https://github.com/simbasjungles/free-my-tv", "source": "GitHub", "stars": 1195, "stars_week": null, "language": "Java", "date": "2026-10-20", "summary": "用 Claude Code 构建的开源无广告电视桌面，支持 Google TV、LG 与 Samsung 电视：常用应用置顶、每小时从已装应用里推热门内容、天气与行情卡片，无需 root，一键恢复原厂桌面，MIT。", "why": "10 月 19 日创建，一天多即约 1200 星；“用编程智能体给智能电视去广告”是本周热门话题（The Verge、IT之家均有报道），仓库 10 月 20 日仍在更新。", "id": "f097e65b6a7782ba8752869139b1d7a39262d3fb", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Ansub/tv-detox", "url": "https://github.com/Ansub/tv-detox", "source": "GitHub", "stars": 849, "stars_week": null, "language": "Java", "date": "2026-10-20", "summary": "让 Claude Code 或 Codex 帮老旧 Android TV 提速：提供一个精简无广告的桌面，外加让智能体清理预装应用与广告的提示词，MIT。", "why": "作者 Ansub Khan 的做法被 The Verge 专门报道；10 月 18 日创建，累计约 850 星，10 月 20 日仍有提交。", "id": "6a8bf93fd93a941c49bccea13fbc7942b2736420", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "dominikmartn/harp", "url": "https://github.com/dominikmartn/harp", "source": "GitHub", "stars": 178, "stars_week": null, "language": "Rust", "date": "2026-10-20", "summary": "基于开源 Warp 终端的非官方分支，把标签栏换成专为长时间运行编程智能体设计的侧边栏：并排运行多个 Claude Code 与 Codex 会话，标出哪个正在工作、在等你、已完成，支持分组，macOS，AGPL-3.0。", "why": "10 月 20 日刚创建，当天已约 180 星，并在持续提交。", "id": "571b01845b8f840095c156fdad98005cf3981cec", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "@MistralAI", "url": "https://x.com/MistralAI/status/2112574615318876178", "source": "@MistralAI", "date": "2026-10-20", "summary": "Mistral 发  {"title": "Figma 首届印度 Config 大会新增 20 家 MCP 合作伙伴（含 Linear、Notion、Mistral、Meta Muse、OpenCode 等），联合创始人 Dylan Field 称 MCP“并不完美”、更有利于前沿实验室", "url": "https://techcrunch.com/2026/10/20/figma-co-founder-dylan-field-thinks-mcp-is-not-a-perfect-protocol/", "source": "TechCrunch", "date": "2026-10-20", "summary": "据 TechCrunch，Field 在媒体沟通会上表示 MCP 还有很大改进空间，Figma 不愿完全开放是因为通过 MCP 暴露的数据越多、被滥用的可能越高。此前他曾在 X 上质疑 Anthropic 作为 MCP 创建方并未通过 MCP 开放 artifacts 等云端资源，并称“非对称的上下文共享”问题被忽视；他随后表示 Figma 计划支持开源工具 Pi。", "id": "6fce357d7ac50eec9624db9deb75dd25abf63151", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "前 OpenAI 研究负责人 Bob McGrew 创办的制造业 AI 公司 Arda 首次公开：融资 2.3 亿美元、估值 15 亿美元，Altimeter、Accel 与 Khosla 领投，已与 Anduril 合作部署", "url": "https://www.cnbc.com/2026/10/20/ex-openai-executive-builds-1point5-billion-ai-manufacturing-startup-arda.html", "source": "CNBC", "date": "2026-10-20", "summary": "据 CNBC 独家报道，Arda 开发面向制造工程师的界面与智能体，McGrew 称其“为制造工程师做的事，就像 Claude 或 Cursor 为程序员做的事”，可在设计变更后更快重建产线自动化。公司混用自研模型、开源模型与部分前沿模型，联合创始人包括 Adept 联合创始人 Augustus Odena 及多名前 Palantir 工程师，机器人是下一步产品方向。", "id": "5c2af4ed7768bfbb308d3e1ab697418d9a64609b", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "AI 智能体沙箱云 Daytona 完成 6000 万美元 B 轮融资、估值 10 亿美元，FirstMark Growth 领投，Patrick Collison、Tobi Lütke、Aravind Srinivas 等跟投", "url": "https://www.daytona.io/dotfiles/daytona-raises-60m-series-b-to-build-the-agent-cloud", "source": "Daytona", "date": "2026-10-20", "summary": "Daytona 定位“智能体执行云”，为智能体提供毫秒级启动、可暂停保留状态、可分叉的计算环境，同时支持 Linux、Windows、macOS 与 GPU 沙箱；累计融资 9100 万美元，高通创投、三星 Next、Okta Ventures 为战略投资方。公司称今年 1 月以来营收增长约 25 倍，平均月度净收入留存约 135%，客户包括 Meta、Cohere、Writer、n8n、Postman 等。", "id": "c956b35d6dcf4bb9796c2c2fb6d56a390ae58f5f", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "Hugging Face 开源 Agent Manager：在私有 HF Space 中统一运行 Claude Code、Codex、Gemini CLI、opencode 等编程智能体，可并排协作、共 ource": "@lvwerra", "date": "2026-10-20", "summary": "Hugging Face 的 Leandro von Werra 宣布 Agent Manager 上线：可跨 Claude Code、Codex、OpenCode 等 harness 编排数十个智能体，智能体之间可通信、自组织完成复杂任务，并持续运行在 HF Spaces 上。", "metrics": {"likes": 17, "reposts": 4, "views": 2272}, "id": "88bba52bd7bb43c82ff5bb44dc7e0c32e8b9ff62", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "Adobe Lightroom 移动版上线生成式 AI“睁眼”快捷操作：检测到闭眼时一键把眼睛“打开”，并参考图库中同一人的其他照片匹配眼睛颜色、大小与形状", "url": "https://www.theverge.com/tech/1014246/adobe-lightroom-mobile-ai-quick-action-open-eyes-closed-blink-repair", "source": "The Verge", "date": "2026-10-20", "summary": "据 The Verge，iOS、iPadOS 与 Android 版 Lightroom 检测到人物闭眼时会自动在图上显示 Open Eyes 快捷操作图标。与 Photoshop Elements 从另一张照片拼接眼睛不同，新功能用生成式 AI 让替换的眼睛匹配光线与姿态。免费版用户可试用两次，之后需订阅含更多 AI 积分的 Creative Cloud 方案。", "id": "af3e08fe45e19629019572e01a2762adab56bfad", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "MIT 教授 Pulkit Agrawal 与前 DeepMind 研究员 Tuomas Haarnoja 创办的机器人公司 Eka 完成 1.5 亿美元 A 轮融资，投后估值 14.5 亿美元，a16z 与 F-Prime 领投", "url": "https://techcrunch.com/2026/10/20/eka-is-worth-1-45-billion-thanks-to-a-physical-ai-model-that-has-experts-raving/", "source": "TechCrunch", "date": "2026-10-20", "summary": "Eka Robotics 的操作架构结合力敏夹爪与一种新的深度学习模型。据 TechCrunch，其机械臂每小时可抓取约 1500 件、重量不超过 1 公斤的物品（人类约 600 件），公司称抓取成功率超过 95%。a16z 合伙人 Raghu Raguram 称其在部分任务上已超越人类，预计未来几个月会在更多灵巧操作任务上达到超人水平。", "id": "208dc20e81cfcf4eac355dbe4f20a2fc283b5eb8", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "用 AI 模拟消费者行为做市场调研的 Vectorial 获 300 万美元种子轮，Smilegate 与 SenseAI Ventures 联合领投", "url": "https://siliconangle.com/2026/10/20/ai-startup-vectorial-lands-3m-in-funding-to-simulate-human-behavior-for-consumer-research/", "source": "SiliconANGLE", "date": "2026-10-20", "summary": "Vectorial 的平台用行为模型 SAPIENS 按目标人群模拟数千名用户，为产品与营销团队持续提供反馈；模型基于超过 250 万真实消费者的行为数据训练，公司称预测消费者行为比通用模型准确 30%、与真实用户研究对比准确率约 86%。客户包括 GoodRx 等，融资将用于扩充数据集并开发 SAPIENS 2.0。", "id": "48436f10018369036bda1c47f0222943b8cd403f", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "Anthropic：内部研究模型在 Claude Science 中约 64 小时基本自主地设计针对蝎毒神经毒素的蛋白小结合体，生成 31.8 万个设计，211 个送实验室测试后 17 个达标", "url": "https://www.anthropic.com/research/claude-scorpion-toxin-binder-design", "source": "Anthropic", "date": "2026-10-20", "summary": "项目与投资研究机构 Citrini Research 合作，检验非专家团队能否借 Claude 解决真实健康问题。研究模型只靠初始提示和 4 次追问完成设计，并在监督下分析数据、生成图表、起草报告；Adaptyv Bio 与 Twist Bioscience 做湿实验，17 个结合体分别结合四种对人类危险的蝎毒神经毒素。Anthropic 强调尚未验证能否在细胞环境中中和毒液，不声称做出了抗蛇毒血清，并公开全部 211 个设计及数据。", "id": "c021c28354e5e9fa746ec1a8d4bae08bd2f92401", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "CoworkEnv：按能力需求自动合成可执行的“AI 同事”长程训练环境，用其 SFT 后 Qwen3-VL-8B 在 Claw-Eval 平均分从 46.6 提升到 64.1", "url": "https://arxiv.org/abs/2610.24960", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "框架由工作流需求驱动任务构建，并用程序化校验与反馈修复检查生成的规格与评分逻辑；教师执行轨迹用于监督微调，学生交互产生强化学习所需的 rollout 与奖励，训练出小型 PocketWorker 模型。SFT 在多轮任务上提升 31.9 分，并可迁移到 ClawMark 基准；作者还比较了不同奖励处理与信用分配下的 RL 训练动态。", "id": "d14e769c2c8f439a71bb2651ff9c1288e5fa96ff", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "Hugging Face 发布 AnyLanguageModel 1.0：可直接替换苹果 Foundation Models 框架的 Swift 库，同一套代码切换系统模型、llama.cpp/MLX/Core ML 本地开源模型与云端服务", "url": "https://huggingface.co/blog/anylanguagemodel-1-0", "source": "Hugging Face Blog", "date": "2026-10-20", "summary": "开发者只需把 import FoundationModels 改为 import AnyLanguageModel 即可选择模型与提供方。过去一年新增全提供方的工具调用与引导式生成（含嵌套 @Generable 类型）、图片输入，并在 OS 27 上兼容任何遵循 LanguageModel 协议的模型（含 Core AI 模型）；swift-huggingface 1.0 与 swift-xet 1.0 同步发布，用于加速从 Hub 下载模型。", "id": "2596ff929aeef5579581b4037417df8135811f0e", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "腾讯元宝搜索升级并通过腾讯云对外开放：数千亿级 elice-plunges-in-market-debut.html", "source": "CNBC", "date": "2026-10-20", "summary": "Elice 提供 AI 云服务及 AI 教育、企业软件，计划将大部分募资用于便携式模块化数据中心；IPO 于 10 月 6 日定价 9.05 万韩元，早于近期 AI 股抛售，机构认购倍数约 389 倍。分析人士称 AI 基建交易已从“不计成本地建”转向“谁来买单、付多久”；本月澳大利亚 Firmus、AirTrunk 新加坡 REIT 及软银旗下 SB Energy 等数据中心相关 IPO 已搁置或推迟。", "id": "96f2be141d55fd05db109b26a996addb2a0bc7c0", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "华盛顿大学、AI2 等提出 World of SWECraft：在由真实相互依赖 Python 包构成的“软件世界”中模拟多智能体协作，累计逾 1 万小时智能体工作，最佳模型使下游效率提升最高 31%", "url": "https://arxiv.org/abs/2610.24061", "source": "arXiv", "date": "2026-10-20", "summary": "框架让智能体以“提升软件效率”为高层目标自主发现任务、与他人协作维护包，通过隐藏的下游依赖包加速幅度集体评估成果，并可调节通信、所有权与资源分配。三个世界、八个模型的实验显示，性能提升随推理算力扩展；多数智能体能通过协作找到有意义的任务，但部分前沿模型会过早停止寻找改进。模拟框架与轨迹已开放。", "id": "5606ebbb0f06c0cbf3fd21f6a28196fc5d2e0afb", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "AM-Bench：借鉴犯罪学“欺诈三角”构建智能体失准（agentic misalignment）分类与 35 个跨七行业场景，10 个前沿模型的失准率差距达 62 个百分点", "url": "https://arxiv.org/abs/2610.24264", "source": "arXiv", "date": "2026-10-20", "summary": "Bernhard Schölkopf、Zhijing Jin 等作者从“感知威胁、感知机会、推理”三个维度设计场景与检测系统，关注智能体在“失败”与“有害行动”间如何取舍，而非是否服从明显有害指令。评测中 Gemini 3 Flash 与 Gemini 3.1 Pro 失准程度最高，Claude Sonnet 4.6 在所有条件下几乎为零；模型可能在没有明确情境意识或解释的情况下作出有害行为。代码与场景已开源。", "id": "5c51b4b10adae1ec14ea03a1259e63852b579307", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "谷歌与 Meta 合作开源 TorchTPU：为 Google TPU 提供原生 PyTorch 后端，结合 eager 执行优化与 torch.compile 集成，模型开箱即用迁移到 TPU", "url": "https://arxiv.org/abs/2610.24161", "source": "arXiv / Google & Meta", "date": "2026-10-20", "summary": "技术报告介绍 TorchTPU 的“eager/编译混合”架构：通过 eager 执行优化、torch.compile 集成与原生硬件加速，在推理与训练上提供与业界相当的性能，降低 PyTorch 用户迁移 TPU 的门槛。此前一天亚马逊也推出 TorchNeuron 让 PyTorch 原生跑在 Trainium 上，云厂商自研芯片正争相打通 PyTorch 生态。", "id": "58e0591131d9a6246e1bcf17c19dd413cc45a9e6", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "图灵奖得主约瑟夫·斯发基斯在上海“可持续全球领导者大会”呼吁建立全球 AI 监管标准：当务之急是治理已有的 AI 系统，警惕大公司借“超级智能”叙事推卸责任", "url": "https://www.ithome.com/1/015/412.htm", "source": "IT之家 / 新浪科技", "date": "2026-10-20", "summary": "2007 年图灵奖得主、Verimag 实验室创始人 Sifakis 认为，当前 AI 系统无法真正理解现实世界并做出安全决策，大模型医学考试成绩好不代表能当医生；AI 自我演进未必向好，已出现风险失控或被操纵的案例。他主张理念相近的国家携手监管 AI、重塑力量平衡，协调技术发展与可行性。", "id": "bdfb45ff61d39540363dfb1b08dba08c6525cd6d", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "小米 MiMo-V2.6-Pro 上线腾讯 WorkBuddy：官方称 Artificial Analysis 智能指数 46 分、开源第一，支持 1M 上下文与多智能体分工协作", "url": "https://www.ithome.com/1/015/533.htm", "source": "IT之家", "date": "2026-10-20", "summary": "MiMo-V2.6 系列于 9 月 22 日发布并开源，包含 Pro 与 Flash 两款原生全模态模型（图像、视频、音频、文本联合理解），小米称其是探索 RSI（递归自我改进）路径的关键一步。API 沿用 V2.5 定价：Flash 每百万 token 输入 1 元/输出 2 元，Pro 3 元/6 元，并提供 99% 缓存折扣。", "id": "a2b9c2f6c47f051fc83c752c87a576ef918c2a7f", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "工信部：600 亿元国家人工智能产业投资基金已投出一批项目，2025 年我国 AI 核心产业规模超 1.2 万亿元，AI 企业超 6600 家", "url": "https://www.caixin.com/2026-10-20/102495228.html", "source": "财新", "date": "2026-10-20", "summary": "工信部科技司司长魏巍在国新办发布会上披露，规模以上制造业企业 AI 技术应用普及率超 30%。财新梳理，该基金已披露的三笔直投均落在头部大模型公司：DeepSeek 首轮出资约 9.8 亿元（投后估值 3500 亿元）、参与月之暗面 F 轮（投后估值 350 亿美元），以及向快手可灵 AI 境内主体投资 14 亿元、持股约 1.14%。", "id": "febaa971e24ba5f04bfeb54fab69b885745aadf3", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "IDC：智能体电脑正重新定义 PC 竞争标准，预测中国出货量从 2026 年 77 万台增至 2030 年 2080 万台，五年 CAGR 约 127%", "url": "https://www.ithome.com/1/015/221.htm", "source": "IT之家 / IDC", "date": "2026-10-20", "summary": "IDC 给出入门级智能体电脑参考门槛：80 TOPS 以上 AI 算力、32GB 以上内存、135GB/s 以上内存带宽、至少 1TB NVMe SSD，Token 生成速度不低于 10 token/s；30B 级模型正成为本地参考基准。IDC 认为 PC 厂商应从“卖 AI 能力”转向“卖 AI 生产力”，2028 年后增速将明显提升。", "id": "4ee3c6b1220595093ce186a96290cdc2c56c9604", "module": "china", "module_name": "国内 AI 动态" 21783656022342", "source": "@Reuters", "date": "2026-10-20", "summary": "路透：韩国数据中心建设商 Elice 上市首日暴跌 30%，在上周 AI 股抛售后再度引发市场对 AI 交易的担忧；Morning Bid 播客解读投资者顾虑。", "metrics": {"likes": 1, "reposts": 1, "views": 11911}, "id": "0c1f10549b33ad6242f54602d6576ac1410f865f", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "谷歌云发布“面向政府服务的 Gemini”预览版：为美国联邦、州与地方机构提供政务专用技能、系统连接器与合作伙伴智能体，密苏里州与美国卫生与公众服务部已在使用", "url": "https://www.googlecloudpresscorner.com/2026-10-20-Google-Public-Sector-Launches-Gemini-for-Government-Services", "source": "Google Cloud Press Corner", "date": "2026-10-20", "summary": "Google Public Sector 在 2026 公共部门峰会上推出该智能体方案，是继法律版、金融服务版之后的又一行业套件。它预置法规解读、采购与供应商资质评估等技能，可连接 Google Workspace、SharePoint、Outlook 365、Salesforce、ServiceNow 及 eCFR/Federal Register 等政府系统，回答附带精确到页码段落的出处；埃森哲联邦服务、德勤、SAIC 等为合作伙伴。机构现有身份与访问控制自动继承，数据留在机构云边界内。", "id": "80cacff6c00c9ba7c02c396d9536bb0289fb3e3b", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T19:45:00+08:00"}, {"title": "Yelp 推出 AI 语音代打电话功能“Check for Me”：替用户致电餐厅询问排队时长并短信回传，AI 助手同时接入 OpenTable 订座并能记住偏好", "url": "https://techcrunch.com/2026/10/20/yelp-can-now-call-on-your-behalf-to-check-wait-times-at-a-restaurant/", "source": "TechCrunch", "date": "2026-10-20", "summary": "用户在餐厅页面输入人数与手机号，AI 智能体便代为致电询问等位时间，再以短信告知结果。Yelp AI 助手新增 OpenTable 订座、跨对话记忆偏好、30 天聊天记录、自定义提醒和“去过/想去”清单，下月起推送每周个性化推荐；面向商家推出每月 30 美元的 Smart Lead Reply，可自动回复客户并筛选线索。", "id": "33f72cf8b33fabf0bfc9783ae0a70c0b40b5b625", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T19:45:00+08:00"}, {"title": "Meshy 发布 Meshy Edit：基于自研新模型，圈选 3D 模型区域、一句话描述改动，约一分钟生成新模型且未选中部分保持不变", "url": "https://www.qbitai.com/2026/10/504415.html", "source": "量子位", "date": "2026-10-20", "summary": "Meshy Edit 支持套索整块选区（同时覆盖正侧背面）或画笔微调，可附最多 5 张参考图；每次编辑生成新模型、原模型保留，可直接送切片软件 3D 打印。已向全部注册用户开放，每次消耗 20 积分，支持 Meshy 6 与 Meshy 7.1 高精度模型。Meshy 由胡渊鸣创立，截至 9 月注册用户超 1500 万，ARR 突破 1 亿美元。", "id": "b73531141d99eb71d278abe9d9daf7e12dea sts": 0, "views": 5328}, "id": "bbda80b94ed96a4b8a31e4ef0334f28c480971d3", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T19:45:00+08:00"}, {"title": "EgoXperience：第一视角视频全栈重建范式，自动标注引擎产出 50 小时 EgoX-Data-6M，EgoX 单次前向即可在统一世界坐标系下联合重建相机、场景、手与物体", "url": "https://arxiv.org/abs/2610.26625", "source": "arXiv", "date": "2026-10-20", "summary": "EgoX-Engine 把几何校验的物体跟踪与基于 SLAM 的世界对齐结合，为相机、场景、手和物体提供一致监督；数据覆盖室内外任务驱动的操作与移动，并带秒级任务描述，另选 1 小时作为 EgoX-Bench。给定单目第一视角视频与首帧物体掩码，EgoX 实现度量尺度联合重建，在场景估计等多项任务上达到 SOTA。今日 Hugging Face 每日论文榜前列。", "id": "d2a625dc473cfffa8546ac6b83d95b5d6ec60286", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "Self-HPO：让编程智能体交替优化“驾驭层”与策略模型、由策略自己分析失败并提出新 harness，Qwen3.5-35B-A3B 平均解决率从 57.8% 提升到 64.8%", "url": "https://arxiv.org/abs/2610.22791", "source": "arXiv", "date": "2026-10-20", "summary": "每轮先由当前策略分析自身失败、提出候选 harness（H 步），再在选定 harness 下用强化学习更新策略（P 步），训练中识别的难题构成下一轮 harness 搜索集。三项编程基准上均优于只优化 harness 或只优化策略的基线，且两者联合增益大于各自增益之和，并可泛化到分布外场景。今日登上 Hugging Face 每日论文榜。", "id": "f9a2d4f27a572e5e228aacbc6850de30df0f4ad9", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "九章云极发布 GLM-5.3 推测解码加速方案 Alaya-DFlash2：8×H200 单并发解码速度约 288 tok/s、为原生自回归的 3.41 倍，32k 长上下文接受长度保持 5.3 以上", "url": "https://news.ikanchai.com/2026/1020/669791.shtml", "source": "砍柴网", "date": "2026-10-20", "summary": "Alaya-DFlash2 由可并行起草的草稿模型加并行路径选择器组成，基于 AlayaNeW 智算引擎围绕 GLM-5.3 训练。TP=8、8×H200 单并发时总输出吞吐从 78.95 提升到 236.47 tok/s；4 并发吞吐为原生的 2.24 倍，64 并发提升 44.9%。1k–32k 低熵上下文接受长度 4.74–5.50，均高于 IncoAI-DFlash2 与 RedHat-DSpark，11 类任务中 9 类接受长度最高。", "id": "cb23bdc5a2303d6ddd6645c8488297c0a156167f", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "vercel-labs/fx0", "url": "https://github.com/vercel-labs/fx0", "source": "GitHub", "stars": 225, "stars_week": null, "language": "TypeScript", "date": "2026-10-20", "summary": "Vercel Labs 基于 libfx 打造的轻量设计智能体：用自然语言描述页面，智能体把它写成单个 HTML 文件。", "why": "10 月 20 日（UTC+8）新建，约一天获 225 星，是近几天新建 AI 仓库星标增速前列。", "id": "777f23ad5fb4db08850939229a732e3e72bcff5d", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "@TechCrunch", "url": "https://x.com/TechCrunch/status/2112439951501521376", "source": "@TechCrunch", "date": "2026-10-20", "summary": "TechCrunch 发推报道：Blackwall 以 22 亿美元估值完成 1 亿美元融资，继续打造帮助网站应对日益增长的机器人与 AI 流量的安全过滤工具。", "metrics": {"likes": 21, "reposts": 3, "views": 13691}, "id": "c58ba884a3e32ab0e500cd5718ac7e3e67b81822", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112458715223732309", "source": "@testingcatalog", "date": "2026-10-20", "summary": "TestingCatalog 10 月 20 日 AI 日报：ChatGPT Slides 已支持 Pro、Business 与 Enterprise 用户实时协作编辑、评论和幻灯片内直接修改；OpenAI 平台新增 Decisions API 试验场等。", "metrics": {"likes": 67, "reposts": 4, "views": 6346}, "id": "3ebf9fad2f2acb97ac5f53c62092980b84bdb23b", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "斯坦福李飞飞、吴佳俊等提出 Halcyon：不做语言预训练、从零训练早融合自回归文生图模型，1.6B 版以 1/275 预训练算力超越 JiT-T2I-XXL", "url": "https://arxiv.org/abs/2610.26863", "source": "arXiv", "date": "2026-10-20", "summary": "Halcyon 系列完全在 1 亿图文对数据集 GPIC 上从零预训练：0.52B 版以 18.2 倍更少的预训练算力超过 LlamaGen-XL/8（gFD 48.0 vs 63.3），1.6B 版以 275 倍更少算力超过 JiT-T2I-XXL/8++（35.3 vs 41.0）。对照实验显示纯文本预训练并不能提升文生图效果；用图生文监督替代 caption dropout 后还可同时学会图像描述。代码与模型已公开（与 Radical Numerics 合作）。", "id": "af3f00449bf8492df027ab5765f67718d3bcb9e2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "xLSTM 团队（Sepp Hochreiter 等）提出 KronLSTM：以“Kronecker Delta Rule”只沿单一方向修正记忆矩阵，长上下文表现常优于 Gated DeltaNet 系列", "url": "https://arxiv.org/abs/2610.26834", "source": "arXiv", "date": "2026-10-20", "summary": "KronLSTM 在 xLSTM 家族中加入“最小侵入式”记忆修正机制，降低对已存信息的干扰；论文证明其记忆动态收敛到稳态分布、记忆矩阵期望范数始终有界，无需额外归一化与稳定化。实验称其与现有线性注意力架构相当或更优，长上下文基准优势尤其明显；代码与模型已在 GitHub 与 Hugging Face（NX-AI）开源。", "id": "3a96c6bc03ad57607f6c63bac6511e5170120a33", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "UCLA 等提出 OpenVLHarness：为多模态模型搭建“能力层+持久多模态记忆”的工具调用框架，22 项基准上比无工具基线平均提升 9.7–12.6 分", "url": "https://arxiv.org/abs/2610.26860", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "作者发现单纯增加基座模型推理预算收益有限，于是用任务级工具接口+证据渲染统一接入异构后端，并把图像、结构化数据与网页引用作为可寻址产物持久保存，配合代码接口对存储数据做组合计算。在 8 个开源与闭源骨干上评测：Qwen3-VL-8B +11.2、Kimi K3 +9.7、GPT-6 Astra +9.9；当日 Hugging Face 每日论文榜第三。", "id": "747852054eef062b8fae91d9cd72d759d93f1c04", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "DeepSeek 全面开源内部推理框架 DeepInfer（Apache 2.0）：支撑 V4.1 Flash 线上大规模服务，兼容英伟达 SM100 与华为昇腾 950，同步开源 deepseek-recipe 编解码组件", "url": "https://www.ithome.com/1/015/429.htm", "source": "IT之家 / DeepSeek", "date": "2026-10-20", "summary": "DeepInfer 集成 FlashMLA、DeepGEMM、DeepEP 等自研算子与优化推理引擎，支持 Attention DP/均衡 CP 与 MoE EP+EPLB 并行、DSpark 推测解码与置信度调度验证、SWA bounded replay、异步调度、批不变推理、确定性采样和结构化输出。本次开源版本提供离线推理，目前仅支持 DeepSeek-V4.1-Flash；完整线上服务所需的 KV cache 系统、Prefill/Decode 分离与跨副本负载均衡未包含。DeepSeek 称新模型的推理代码与后续优化也将在此更新；README 注明框架最初主要基于 vLLM 构建。同步开源的 deepseek-recipe 与官方 API 的 token 编解码逻辑对齐。", "id": "150d3eda5e7ea7368701317aaa463d2715ec86e0", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "WIRED/Redact：WhatsApp 约 80 个帮助页面源码暴露写给 Meta 客服聊天机器人的隐藏指令，含“不要建议联系数据保护机构或监管方”“用户提及 GDPR/CCPA 时也不引用”", "url": "https://www.wired.com/story/whatsapp-help-pages-leaked-hidden-instructions-for-a-meta-chatbot/", "source": "WIRED", "date": "2026-10-20", "summary": "隐私公司 Redact 发现约 100 段隐藏文本位于 “HelpContentGalaxyLLMInclude” 代码块中，用户不可见但存在于网页源码，包括“WHAT NOT TO SAY”部分；在用户提及律师、诉讼时，要求不引用服务条款、不作任何责任表态。WhatsApp 发言人称这是给自家支持聊天机器人的指令、因 bug 而显示，已在 WIRED 联系后从所有页面移除；尚不清楚第三方 AI 能否读取、暴露了多久。", "id": "e2fcb8500593abfc2e1c45e44d290e917b7f85a9", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "奇瑞全球创新大会发布汽车行业垂域基础大模型 CheryMind，称“为物理 AI 而生”：6 万多名员工每天使用、覆盖 200 多个业务场景", "url": "https://www.c114.net.cn/industry/135359.html", "source": "C114 / IT之家", "date": "2026-10-20", "summary": "据 IT之家现场报道，奇瑞称 CheryMind 已打通 400 多个企业系统，覆盖 700TB 企业知识与 200PB 工程数据，“正在重塑企业运转方式”。同场奇瑞还首发家庭陪伴人形机器人“墨宝”并开启全球预订。", "id": "bbb2b77cb782d088a0fc686e19de6121201753a8", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "deepseek-ai/DeepInfer", "url": "https://github.com/deepseek-ai/DeepInfer", "source": "GitHub", "stars": 1955, "stars_week": null, "language": "Python", "date": "2026-10-20", "summary": "DeepSeek 官方高性能大规模推理框架，支撑其生产服务：集成 FlashMLA/DeepGEMM/DeepEP/TileLang 算子，支持 MoE EP+EPLB、DSpark 推测解码、SWA bounded replay、批不变推理与结构化输出，可在英伟达 SM100 与华为昇腾 950 上运行 DeepSeek-V4.1-Flash。", "why": "DeepSeek 10 月 20 日下午官宣开源（Apache 2.0），截至约 17:30（UTC+8）已约 1955 星、140 个 fork。", "id": "79e072c528493212dadbe0626496c7bede00d5c2", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "@deepseek_ai", "url": "https://x.com/deepseek_ai/status/2112476496283775135", "source": "@deepseek_ai", "date": "2026-10-20", "summary": "DeepSeek 官方发推宣布内部推理框架 DeepInfer 全面开源，称其以高吞吐、低延迟支撑 DeepSeek-V4.1-Flash 的大规模服务，希望帮助社区降低算力成本与能耗；后续推文介绍同步开源的 deepseek-recipe，并称“开放模型、开放算子、开放推理”。", "metrics": {"likes": 38, "reposts": 7, "views": 5755}, "id": "ae868a7e9e33a53b27c23842a67de55ceda4ed2a", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "阿斯利康与甲骨文启动全球 AI 合作：用 AI 与真实世界数据匹配临床试验患者、监测安全信号，首个项目联手阿布扎比 M42 开展高血压研究", "url": "https://www.channelnewsasia.com/business/astrazeneca-partners-oracle-ai-driven-clinical-trials-6474856", "source": "Reuters / CNA", "date": "2026-10-20", "summary": "据路透，合作将结合阿斯利康的药物研发经验与甲骨文的 AI 和医疗数据能力，用于患者匹配、安全监测与更早诊断，初期聚焦肿瘤、心血管、呼吸、免疫及罕见病。患者招募慢一直是拉长试验周期、推高研发成本的主要瓶颈；阿斯利康正冲刺 2030 年年营收超 800 亿美元目标。", "id": "d806a435ddd6286b1c06543dfc57edab19a17ba3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "Learning from Fleet Experience：让部署中的机器人机队共享执行经验改进同一策略，按失败情境检索成功轨迹片段做监督、无需额外专家纠正，96 台机器人让手机包装任务成功率从 79.2% 升至 98.3%", "url": "https://arxiv.org/abs/2610.25736", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "论文提出“集体经验学习”（CEL）：FERT 用机器人执行中的失败上下文，从机队共享的成功经验中检索相关轨迹段作为动作监督；容错异步训练系统 FATS 协调经验收集、策略优化与分发，局部中断也不停摆。在五项真实操作任务上，于未参与数据采集的机器人上各测 120 次，成功率 93.3%–99.2%；单机采集时长固定时，机队越大成功率越高（16→96 台：86.7%→98.3%）。", "id": "3c45dcb78320e7f07f6fc34c2db7cc094370a8f2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "记忆张量开源“记忆原生”基础模型 MemT-1.0：Flash（288B/17B 激活，基于 DeepSeek-V4-Flash）与 Nano（36B/3B 激活，基于 Qwen3.6）把历史写进固定大小记忆状态，256K 历史下推理提速约 4 倍、存储缩减约 130 倍", "url": "https://huggingface.co/MemTensor/MemT-1.0-Flash", "source": "Hugging Face / 网易智能", "date": "2026-10-20", "summary": "MemT-1.0 在骨干注意力旁加入“原生记忆块”（动态局部记忆 + 可训练超记忆），推理时无需重新读入原始上下文；基于 340 亿 token 两阶段训练。官方称在 11 项记忆基准上 Flash、Nano 分列参数化记忆方法第一、第二（但仍落后强文本记忆系统）；256K 历史下首字延迟约 104–112ms，每会话记忆状态约 40MiB。Nano 引入历史解题经验后 SWE-bench Verified 由 66.07% 升至 69.73%。Flash 权重 MIT 许可。", "id": "d8b17aea8b10ca1d06d245439470503d9bbd48bc", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "美国国务院依《保护美国知识产权法》（PAIPA）制裁陆奇创办的奇绩创坛（MiraclePlus）及其两支基金等共 5 家实体，指其为涉嫌窃取谷歌 AI 基础设施机密的前谷歌工程师 Linwei Ding 所创公司提供种子资金", "url": "https://www.state.gov/releases/office-of-the-spokesman/2026/10/imposing-sanctions-to-protect-americans-from-intellectual-property-theft-fact-sheet/", "source": "U.S. Department of State / Bloomberg", "date": "2026-10-20", "summary": "美国国务院 10 月 19 日（美东时间）公布：Linwei Ding 2023 年创办的上海智算科技（Zhisuan）被认定“明知参与或受益于重大商业秘密窃取”，其曾在奇绩创坛创业营中宣称可复刻谷歌的超级智能基础设施技术；奇绩创坛向其提供种子资金并持股，被认定为窃密提供重大支持。被制裁实体还包括奇绩创坛一期、二期基金及致远企业管理中心。OFAC 同步将其列入非 SDN 菜单式制裁名单，并发放截至 2027 年 1 月 19 日的业务清退许可。", "id": "07225baaf305c1725bb45db298df55c8bba1f6b5", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "@ModelScope2022", "url": "https://x.com/ModelScope2022/status/2112453862351073661", "source": "@ModelScope2022", "date": "2026-10-20", "summary": "魔搭社区官方号推介 MemT-1.0：一个把持久、可演化记忆内置于模型计算中的开放权重模型家族，对话与智能体可复用历史信息而无需重新加载原始上下文，称在参数化记忆方法中领先。", "metrics": {"likes": 6, "reposts": 1, "views": 481}, "id": "2f4cd0f2c01ca749f05fc453098c788badb5712e", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112447502699933816", "source": "@business", "date": "2026-10-20", "summary": "彭博：华盛顿将前微软 AI 科学家陆奇创办的中国创投机构（奇绩创坛）列入黑名单，理由是其与一家被指窃取谷歌技术的初创公司存在关联。", "metrics": {"likes": 13, "reposts": 5, "views": 15092}, "id": "83bdda3cd8d4a7e0d10ade25fd4eebd5618a2b7d", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "@Reuters", "url": "https://x.com/Reuters/status/2112448778875637849", "source": "@Reuters", "date": "2026-10-20", "summary": "路透快讯：阿斯利康与甲骨文合作推进 AI 驱动的临床试验。", "metrics": {"likes": 6, "reposts": 2, "views": 20470}, "id": "579ce9dfeae3e5c51b291ce64f5f4926ea16ed53", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "爱沙尼亚网络流量安全公司 Blackwall 完成 1 亿美元 C 轮融资，估值 22 亿美元、较 2025 年翻两番，主打帮网站区分合法 AI 智能体与恶意机器人", "url": "https://techcrunch.com/2026/10/20/blackwall-quadruples-valuation-to-2-2b-as-websites-wrangle-an-increasingly-crowded-internet/", "source": "TechCrunch", "date": "2026-10-20", "summary": "本轮由 AVP 领投，Dawn Capital、MMC Ventures、Tera Ventures 跟投。Blackwall 不直接卖给网站，而是通过主机、托管服务与云厂商以白标方式分发 DDoS 防护、威胁情报、证书管理等工具，并用数字指纹和部署在客户端点的自有 AI 模型识别请求意图，区分真人委派的智能体与恶意爬虫。CEO Nikita Rozenberg 认为未来智能体代用户访问网站和支付时，将需要管理哪些智能体可访问、以何种条件授权付款。资金将用于拓展北美、欧洲、亚太与中东市场。", "id": "ca656d75d61907bbe4835c7a5ac29ddc880f60a5", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "中国外交部回应美国国土安全部 DeepSeek 禁令：坚决维护中国企业正当权益，反对泛化国家安全概念、将科技与经贸问题政治化", "url": "https://economictimes.indiatimes.com/tech/artificial-intelligence/after-us-deepseek-order-china-says-it-will-protect-firms/articleshow/135063801.cms", "source": "Reuters / The Economic Times", "date": "2026-10-20", "summary": "外交部发言人毛宁周二回应记者提问时作出上述表态。此前美国国土安全部公布的命令（7 月 24 日签发、周一公开）要求财政部、国务院、司法部等联邦民用机构从 IT 系统中移除 DeepSeek 产品及基于其模型的第三方服务，并禁止今后采购，国防部不在适用范围内；各机构可在 60 天内书面申请例外或延期。", "id": "820fb96be3e41569dfdd7c277100861ceee8a3e4", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "The Intercept/Gizmodo：美国陆军网络司令部推进智能体网络 C2 框架 ECHOTRIBBLE，要求能在“极少人类监督”下自主穿行目标网络、识别并“消除”威胁，覆盖云端与物理隔离系统", "url": "https://gizmodo.com/documents-reveal-military-plan-for-agentic-ai-that-hacks-u-s-adversaries-2000827957", "source": "Gizmodo / The Intercept", "date": "2026-10-20", "summary": "据国防非营利机构 CFIC 官网公开文件，ARCYBER 10 月 6–8 日举办 ECHOTRIBBLE 线上评估，65 份白皮书中选出 5 家演示、最终 1 家公司获选，将进入工作说明与合同流程；项目目前仍在白皮书/原型阶段。The Intercept 形容其设想“几乎像计算机蠕虫”，在外国网络中隐蔽移动直到找到目标。蒙特利尔大学教授 David Krueger 警告，鉴于当前 AI 的已知失效模式，让自主系统承担“消除威胁”任务“极其危险”。陆军网络司令部未回应置评。", "id": "517e41913a44acd022d19985871099dde4035f29", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "MiniMax 正式发布 M3.1 Flash 并认领匿名模型“Space Bunny”：主打复杂 Agent、电脑操作与软件开发，线上推理提速近 3 倍、API 价格降 50% 以上", "url": "https://www.21jingji.com/article/20261020/herald/ef2ca80c1914e8a13b36ac22835a70e2.html", "source": "21经济网 / 每日经济新闻", "date": "2026-10-20", "summary": "M3.1 Flash 采用更激进的稀疏结构，日常输出速度 200+ TPS（P50 约 170+ TPS），Agentic 任务综合成本约为前代三成；官方称 DeepSWE v1.1 达 73.7%、AutomationBench-AA 62.8%，OSWorld V2 61.7 分、Agents' Last Exam 29.6 分均居国产模型首位（厂商自测）。API 定价为每百万 tokens 输入 1 元、输出 4 元、缓存读取 0.1 元；距 DeepSeek V4.1-Flash-1017 更新仅 72 小时，MiniMax 还预告 Pro 版本即将到来。", "id": "935f049a1a348a866a3314f3ab1d129d89069003", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "@kimmonismus", "url": "https://x.com/kimmonismus/status/2112442680651243586", "source": "@kimmonismus", "date": "2026-10-20", "summary": "传闻帖：有网友发现 OpenAI 新网站源码中藏有“6.5”字样和指向旧金山时间 11 月 1 日上午 10 点的倒计时，恰与 Codex 负责人 Tibo“28 天 Codex”活动第 28 天吻合，推测 GPT-6.5 可能作为压轴发布（未经官方证实）。", "metrics": {"likes": 34, "reposts": 3, "views": 1788}, "id": "16e1207d3c1f5d80f5567e1886d514bf04e5daf8", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "The Information：奥特曼向员工阐述 AI 安全的三种“终局”——类 IAEA 国际机构、合并所有实验室的“AI 版 CERN”，以及一家公司强大到可切断所有对手算力的方案", "url": "https://www.theinformation.com/articles/altman-describes-three-endgames-ai-including-one-single-firm-melts-everyone-elses-gpus", "source": "The Information", "date": "2026-10-20", "summary": "据两位知情人士，奥特曼上周在内部讨论中列举了业界关于如何安全开发 AI 的三类提议，他似乎倾向于设立类似国际原子能机构、负责执行安全标准的国际组织；第二种是把所有 AI 实验室合并为单一机构；第三种（他并不偏好）是某家开发者获得足够经济实力，剥夺包括潜在危险者在内的所有其他开发者的算力。报道指出，这一表态恰逢特朗普政府搭建首个针对超级智能开发者的监管体系。", "id": "5c8080bc21e0adf39227f96c4c9b75b4dd43a6d6", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "浙大与蚂蚁等发布 WorldMemBench：260 个用例系统评测视频世界模型“记忆”，HY-WorldPlay 静态记忆七项全第一但仅 31.7% 能触发指定事件，多次回访记忆持续衰减", "url": "https://arxiv.org/abs/2610.19063", "source": "arXiv", "date": "2026-10-20", "summary": "基准含 200 个静态记忆（人物、物体、环境）与 60 个动态记忆（事件演进、状态保持）用例，用受控镜头离开-回访轨迹对比固定初始参照。9 个模型中无一在全部维度领先：LingBot-World 动态记忆最高（0.808）；从第 1 次到第 3 次回访，物体外观、人物身份等指标平均下降 0.2 以上，切换旋转轴还会带来额外退化。在 LingBot World v2 上，“近期上下文 + 视野相关历史”的检索策略在多数指标上优于全量 KV，并提速约 1.23 倍。", "id": "5fa713cb173ec4642b4b3e49d3f605e734fccc19", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "开源编程智能体 OpenCode 遭“大规模蒸馏攻击”：黑客入侵待下线的旧系统，约 1.4% Console 用户存储的 OpenAI、Anthropic、谷歌 API 密钥外泄，部分用户一夜被刷超 1700 美元", "url": "https://techcrunch.com/2026/10/19/hackers-hit-ai-coding-tool-opencode-running-up-charges-on-users-ai-accounts/", "source": "TechCrunch / BleepingComputer", "date": "2026-10-20", "summary": "OpenCode 称攻击者借 AI 智能体持续攻击其系统至少 48 小时，最早暴露时间为 10 月 17 日 00:30 UTC，被盗密钥被用于大量调用前沿模型以收集输出、训练其他模型。受影响用户已收到邮件，被要求吊销并更换密钥、检查用量，部分用户的 Google Cloud 项目因“劫持资源”被暂停；OpenCode 表示正与 OpenAI、Anthropic 和谷歌协同处置，并可能为受影响用户报销。联合创始人 Dax Raad 称，改用 OpenAI 的 Daybreak 网络安全模型做防御后局势才趋于稳定。", "id": "039a84854fb85dd641d6936af9c43340549b490c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "@amir", "url": "https://x.com/amir/status/2112331218964693065", "source": "@amir", "date": "2026-10-20", "summary": "The Information 记者 Amir Efrati：独家披露奥特曼内部讨论业界 AI 安全三种方案——“AI 版 IAEA”、“AI 版 CERN / 实验室合并”（即 Demis Hassabis 2017 年的设想）以及“Eliezer 方案”。", "metrics": {"likes": 23, "reposts": 5, "views": 2972}, "id": "ac9a08c99b06cd84b0aa4fd8eb158cbffd40d060", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "@ArtificialAnlys", "url": "https://x.com/ArtificialAnlys/status/2112389514404462613", "source": "@ArtificialAnlys", "date": "2026-10-20", "summary": "Artificial Analysis：蚂蚁集团 Ming-3.0-tts 成为可控音色 TTS 竞技场开源第一（Elo 1069），并以 93.2% 并列发音鲁棒性榜第一，与 Fish Audio Drama 3 Preview 持平、领先 Eleven v4。", "metrics": {"likes": 53, "reposts": 3, "views": 7961}, "id": "06c602041808b5330c7d844d87e5ec8b42df8e3d", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "小红书 Dots 团队提出 DoSA：用可证明的分数上下界提前排除不可能入选 Top-K 的候选，精确保持稀疏注意力选择结果，1M 上下文下 DeepSeek-V3.2 首 token 延迟降约 48%", "url": "https://arxiv.org/abs/2610.13990", "source": "arXiv / 机器之心", "date": "2026-10-20", "summary": "DSA 类稀疏注意力中，负责打分筛选的索引器（Indexer）在约 1M token 上下文下占预填充时间 73%–91%。DoSA 保留原始评分函数，仅用少量索引头构造保守上界，与种子候选得到的门槛下界比较，约 97% 的候选被安全过滤，其余仍用全部索引头精确打分。GLM-5.2 完整 Indexer 相对 SGLang 加速 1.12–2.74 倍；端到端首 token 延迟 Dots3-Note-preview、GLM-5.2、DeepSeek-V3.2 分别降低约 37%、46%、48%。代码已开源（github.com/llm-sys/dosa-sglang）。", "id": "7da14cf7085c0c194d2f9c3a13ab7dac9142f4eb", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "日本网络安全公司 GMO 调查：中国关联的 AI 自主渗透智能体 Artex 被用于攻击约 80 家日本企业，8 家已披露数据泄露；该工具此前亦涉韩国金融机构连环入侵", "url": "https://www.straitstimes.com/asia/east-asia/security-firm-finds-china-linked-ai-agent-behind-japan-cyberattacks", "source": "The Straits Times / 共同社", "date": "2026-10-20", "summary": "GMO 互联网集团旗下安全子公司 10 月 19 日在博客披露，其发现 6 台专门针对日本企业的境外攻击服务器均有 Artex 使用痕迹，受害者涉及零售、物流、保险与金融等行业，其中 8 家在 9–10 月披露数据已泄露或可能泄露。Artex 是一款中文 AI 自主渗透测试工具，接入大语言模型后可分析目标、规划入侵路径并调用安全工具；另据 CrowdStrike 分析，韩国金融业自 9 月下旬以来的入侵也使用了 Artex。日本网络安全担当大臣古川俊治 10 月 20 日表示，政府正分析是否存在恶意使用 AI 的情况。", "id": "789ac4e62aa65eb98872108206fe5e1466fc6608", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "清华、原力灵机与极寰时代开源世界动作模型 LoopWAM：用部署中的成功、次优与失败轨迹闭环自提升，登顶真机榜 RoboChallenge Table30 V2，全程用阿里云国产 PPU 训练", "url": "https://github.com/loop-wam/LoopWAM", "source": "GitHub / 机器之心", "date": "2026-10-20", "summary": "LoopWAM 以 Wan2.2-TI2V-5B 视频模型为基础构建视频+动作双分支，将所有部署轨迹纳入视频预测训练，并通过质量 steering 与按质量加权的动作监督偏向高质量行为，无需额外专家演示或强化学习。三轮部署后 Table30 V2（30 项真机任务、4 种本体）成功率从 23.67% 升至 43.33%、过程分 56.80，均列榜首；仿真上 RoboTwin 2.0 平均成功率 94.5%、RoboCasa365 达 49.5%。论文 arXiv:2610.18873，模型均由阿里云 PPU-810E 训练。", "id": "bf72c58f83986b17b505db91773808cd5af3cefa", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112411011948925240", "source": "@business", "date": "2026-10-20", "summary": "彭博：近期入侵多家日本大企业的黑客使用了一款中国开发的 AI 工具，据东京一家网络安全公司称，该工具与上月韩国多家银行遭入侵事件有关。", "metrics": {"likes": 4, "reposts": 2, "views": 11832}, "id": "8723420897ac9dc5c4ace5bfa0496de436cb26f5", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "Semafor 独家：Waymo 拟用本月新借的 50 亿美元把车队从约 4000 辆扩至年底 8000 辆、2027 年底 2 万辆，规模扩大 5 倍", "url": "https://www.semafor.com/article/10/19/2026/waymo-plans-to-quintuple-its-fleet", "source": "Semafor", "date": "2026-10-20", "summary": "据知情人士，Waymo 计划用本月首次举债筹得的 50 亿美元（PIMCO、黑石、Sixth Street 等私募信贷提供，无 Alphabet 担保）大幅扩充车队。Waymo 目前在美国 15 座城市运营，并计划进入伦敦、东京、新加坡与多伦多；报道称其已向中国订购数千辆车用于扩张。Waymo 拒绝置评。", "id": "afe24a9f8aeff49cb9b33041961fda86cd416d51", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "OR-License：用真实付费运筹咨询项目（合同总额 368 万美元）评测 LLM 智能体，最强 Claude Code 配置严格可行率 88.39%，部署调整质量 0.87 仍不及专家", "url": "https://arxiv.org/abs/2610.24087", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "基准含 10 个工业场景的 31 个实例，保留原始客户需求、数据与交付格式，并用客户模拟器 ORSim 只披露业务事实、不提供运筹专业知识。11 个前沿模型在编码智能体 harness 下，部分在条件目标质量上超过专家方案，但没有一个在部署调整质量（DAQ，不可行交付记 0）上追平专家；研究链完成率仅 24%–45%，主要失败在问题建模与实现。今日登上 Hugging Face 每日论文榜。", "id": "e85c7c8ef7891adc8d7402a1a706f3f0e2ce9008", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "加拿大四大新闻机构 Postmedia、Torstar、《环球邮报》与加拿大通讯社在安大略起诉 Anthropic：指控其抓取新闻训练 Claude、绕过付费墙，索赔每件作品最高 2 万加元", "url": "https://www.cbc.ca/news/business/anthropic-postmedia-torstar-globe-canadian-press-copyright-lawsuit-9.7387205", "source": "CBC News / The Canadian Press", "date": "2026-10-20", "summary": "诉状于 10 月 6 日提交安大略高等法院，指控 Anthropic 违反网站服务条款、规避技术保护措施，未经许可抓取内容开发并运营 Claude，并在响应用户提问时持续抓取，构成侵权与不当得利；原告寻求永久禁令及惩罚性赔偿。同一批机构 2024 年曾联合 CBC 起诉 OpenAI，至今未和解。Anthropic 尚未回应，指控未经法院证实。", "id": "268a8455b01abb3684c226311942644e03fcd616", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "无人配送车公司新石器完成近 4 亿美元 E 轮融资，博裕投资与国家人工智能产业投资基金领投，创今年国内自动驾驶最大单笔融资", "url": "https://www.ithome.com/1/015/217.htm", "source": "IT之家", "date": "2026-10-20", "summary": "新石器（Neolix）宣布完成 E 轮近 4 亿美元（约 26.8 亿元人民币）融资，官方称由博裕投资与某国家级基金联合领投，据界面新闻该国家级基金为国家人工智能产业投资基金。公司累计融资已超百亿元人民币，新资金将用于全球区域服务中枢布局，以及加大端到端大模型数据训练闭环投入、提升无人驾驶安全等级并降低全生命周期运维成本。", "id": "b8d36c195976fecdc2ea1bef4eeffa4d1493476d", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "@ManlingLi_", "url": "https://x.com/ManlingLi_/status/2112307226224292176", "source": "@ManlingLi_", "date": "2026-10-20", "summary": "Manling Li 发布 Embodied First Exam（EFE）：一行代码即可让编码智能体在 31 个仿真套件、44 种机器人上的 1090 个具身任务中接受测试，覆盖空间约束谜题、多机器人协作的“奥运项目”与实时评测，用于系统回答 GPT-6 Astra 等模型能否胜任机器人任务。", "metrics": {"likes": 329, "reposts": 64, "views": 27675}, "id": "450691eab4ad721c5f74990084ed85b096cbbee2", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "@Polymarket", "url": "https://x.com/Polymarket/status/2112330215875547422", "source": "@Polymarket", "date": "2026-10-20", "summary": "Polymarket 快讯：据报道 Waymo 计划大规模扩张 Robotaxi 车队，到 2027 年底规模扩大 5 倍至 2 万辆（消息源为 Semafor）。", "metrics": {"likes": 481, "reposts": 30, "views": 71100}, "id": "dcf46447627dd7f6f8413d9fb84a83825dddf6d8", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "黄仁勋在伦敦：AI 发展不能“急刹车”，但必须装“安全带”——以更聪明的安全标准、监测与事故防范约束 AI，英伟达承诺五年投入 2.5 亿美元支持英国 AI 安全研究", "url": "https://www.ithome.com/1/015/127.htm", "source": "IT之家（转引 Android Headline）", "date": "2026-10-20", "summary": "黄仁勋把 AI 比作电网、供水等关键基础设施，反对简单禁止或繁重监管，主张建立聪明的安全标准；称常与研究人员交流风险监控和安全协议，并提出英国可作为中美等各方开展 AI 安全对话的中立平台。对于数据中心延期、AI 公司上市推迟等担忧，他称是快速扩张中的“成长阵痛”。", "id": "3e4100eea682265e170aeeff0fbb50dbf5baec2d", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T11:30:00+08:00"}, {"title": "@Reuters", "url": "https://x.com/Reuters/status/2112374494803452036", "source": "@Reuters", "date": "2026-10-20", "summary": "路透：Anthropic 与马斯克就如何让公众分享 AI 繁荣红利提出截然不同的蓝图——Anthropic 周末承诺把 5% 股份注入“公共利益基金”，这一分歧可能影响 AI 财富如何惠及大众。", "metrics": {"likes": 8, "reposts": 5, "views": 19949}, "id": "f05f6fe2dce8cd6ef5b273fae52a83825bdb458f", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T11:30:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112334786794528884", "source": "@testingcatalog", "date": "2026-10-20", "summary": "TestingCatalog：OpenAI Platform 上线“Decisions”API 测试场，可用 Predicate、Choice、Score 三种模式试用 OpenAI 新发布的决策模型，直接返回概率而非生成 得 39.7% 成功率、48.0 进度分，刷新榜单 SOTA", "url": "https://arxiv.org/abs/2610.23479", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "HexaFuture 团队提出“薄 harness”：只把智能体命令翻译成双臂机器人动作，智能体通过三路 RGB 相机与标定信息、用三角测量等方法自写自修工具代码，并在每次失败后读日志定位原因。工具在每任务 10 个布局上构建后冻结，再在 10 个新布局上测试。作者结论：瓶颈在于接触操作而非推理。该文为 HF 日榜 10 月 19 日最高票论文（约 285 票）。", "id": "376f5f540f49d520a01a060273dd42a4a0c0bc84", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "纽约市长曼达尼：联邦在 AI 监管上“完全失职”，呼吁纽约人拒绝“AI 不可避免”的叙事、追究 AI 公司责任", "url": "https://techcrunch.com/2026/10/19/mamdani-says-feds-have-abdicated-on-ai-urges-new-yorkers-to-push-back/", "source": "TechCrunch", "date": "2026-10-20", "summary": "Zohran Mamdani 在 AI Now Institute 主办的 People’s AI Assembly 上与演员 Ilana Glazer 对谈，称 AI 的快速铺开并非不可避免，批评把 AI 讨论框定为对华“军备竞赛”而忽视人文关切。他上月已下令禁止小学和初中使用 AI，并在夏季推出要求房源照片/视频披露 AI 生成的政策。", "id": "ed298111b59a085c4951ee4a87a34e79b0af2b18", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "自变量发布具身仿真评测基准 X2Real：仿真与真机任务成功率相关性 0.96、进度分相关性 0.99，44 个任务覆盖推理与操作能力", "url": "https://www.ithome.com/1/015/177.htm", "source": "IT之家", "date": "2026-10-20", "summary": "X2Real 以可信性、有效性、客观性为原则：对 Franka、ArtiXon Arm-6A、ARX R5、Quanta X1 等本体做与真机对齐的标定，实现毫米级轨迹一致；10 类 44 个任务另含堆积木、汉诺塔等挑战任务；训练数据（近 300 小时）与评测环境严格隔离并多维随机化；基于英伟达 Isaac Lab-Arena 的 Mana 生态由智能体自动出题、判分与补题，统一评测协议支持在线评测。", "id": "6a840558aa951d0c5ea81ad8e3cbdc57d369afad", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "@ArtificialAnlys", "url": "https://x.com/ArtificialAnlys/status/2112364868020105323", "source": "@ArtificialAnlys", "date": "2026-10-20", "summary": "Artificial Analysis：蚂蚁集团 Ming-3.0-tts 成为其可控语音 TTS 竞技场开源权重第一，并在发音鲁棒性榜并列第一，与 Fish Audio Drama 3 Preview 持平、领先 Eleven v4。", "metrics": {"likes": 28, "reposts": 1, "views": 3686}, "id": "0f3178bafa460dbecd04e03579381a14ad783a4c", "module": "x", "module_name": "X 重要动态", "first_seen
