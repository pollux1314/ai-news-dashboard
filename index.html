产出成果，但这种零散贡献割裂了圈子、削弱了社群属性，平台因此失去存在意义；公告并非单纯反 AI，更多是惋惜。"}, {"title": "彭博：Nscale IPO 估值目标遭投资者抵制——原寻求约 300 亿美元，部分投资者认为 160–190 亿美元才易获认购", "url": "https://www.ithome.com/1/014/623.htm", "source": "IT之家 / 彭博社", "date": "2026-10-19", "summary": "据彭博社援引知情人士，获英伟达投资的伦敦 AI 数据中心开发商 Nscale 原寻求约 300 亿美元 IPO 估值，但在澳洲 Firmus IPO 失败等挫折后，部分投资者提出 160 亿至 190 亿美元区间更易获认可；公司 9 月 18 日已提交赴美上市申请，尚未启动路演。此前微软已退出其一处英国数据中心合作项目，CoreWeave、Nebius 等同行股价近期重挫。"}, {"title": "TechCrunch/彭博：迪士尼将向至少 60 名 Character.AI 员工发出录用邀约，年薪酬总额约 6000 万美元，多数已接受", "url": "https://techcrunch.com/2026/10/18/disney-agrees-to-hire-the-majority-of-character-ais-workforce/", "source": "TechCrunch / Bloomberg", "date": "2026-10-19", "summary": "Character.AI 本周申请破产后，彭博发现的法律文件显示，迪士尼同意向至少 60 名员工（公司大部分人员）发出录用邀约，预计年薪酬总额约 6000 万美元，获邀员工“绝大多数”已接受；此前迪士尼已以 2000 万美元作为部分资产的 stalking horse 竞购方，前 CEO Karandeep Anand 已出任迪士尼首任 CTO。文件称公司受高成本及潜在诉讼与监管负担拖累，其他买家仍可报更高价。"}, {"title": "Anthropic 设立“Anthropic 公益基金”：首批承诺 5% 公司股份，估值每较基准上涨 50% 可再追加 2%", "url": "https://www.anthropic.com/news/public-benefit-fund", "source": "Anthropic 官方博客 / 路透社", "date": "2026-10-18", "summary": "Anthropic 10 月 18 日宣布，经股东批准后将把 5% 股份注入新成立的全资 LLC“Anthropic Public Benefit Fund”，此后公司估值每较设定基准上涨 50%，董事会可酌情再追加 2%。基金可用于向传统非营利组织大额捐赠或直接向特定人群分配，例如应对 AI 对劳动力市场的冲击（Anthropic 此前已为此承诺 2 亿美元）；所持股权不会用于美国或海外的游说与政治捐款。连同联合创始人捐出 80% 股权的承诺与员工股权捐赠配捐计划，约 20% 的 Anthropic 股份将用于公益。"}, {"title": "索尼新专利：AI 在 GPU 完成渲染前预测下一帧画面，减少游戏卡顿并规避插帧额外延迟", "url": "https://www.ithome.com/1/014/615.htm", "source": "IT之家（援引 TechSpot）", "date": "2026-10-18", "summary": "据 TechSpot 报道，索尼近期申请一项专利：用 AI 根据已渲染画面直接预测下一帧，而不必像传统帧生成那样等待两帧渲染完成再插值，从而稳定帧输出节奏并避免额外延迟。系统用联合训练的编解码器把渲染画面转为嵌入表示，与图形管线并行运行，还可利用运动矢量和玩家近期的手柄操作辅助预测。实际效果取决于 AI 能否足够快且准确地生成画面。"}, {"title": "首尔经济日报：三星将采用台积电 3nm 工艺为英伟达定制 HBM（NVHBM）生产基底裸片，打破一站式自产模式", "url": "https://www.ithome.com/1/014/612.htm", "source": "IT之家 / 首尔经济日报", "date": "2026-10-18", "summary": "据报道，英伟达要求三家 NVHBM 供应商三星、SK 海力士和美光统一用台积电 3nm 工艺制造基底裸片，核心裸片统一采用 1c 第六代 DRAM 工艺，以保证性能一致并减少逐家验证工作量。NVHBM 基于 HBM4E 架构，是英伟达 8 月发布的定制版高带宽内存。三星已接受要求，但标准 HBM 及面向 AMD 等客户的定制 HBM 仍保留一站式自产，并在验证自有产线生产 NVHBM 基底裸片作为产能预案。"}, {"title": "Anthropic 报告：AI 重塑公司用工，初级技术岗招聘占比由 27% 降至 9%；智能体工时已为人手约 6 倍", "url": "https://www.ithome.com/1/014/450.htm", "source": "IT之家 / Anthropic", "date": "2026-10-18", "summary": "Anthropic 发布《How employment is changing at Anthropic》：自 2025 年初以来技术部门初级员工占比从 21% 降至 14%，初级技术岗新招占比由 27% 跌至 9%；技术团队占全员比重从 61% 降至 56%。调研中 20% 员工称工作已变成“管理多个 Claude 实例”；人均会议时长同比增约 20%。公司称交互式智能体工时已远超员工工时，人的注意力成为瓶颈。"}, {"title": "FT：Anthropic 与律所磋商 AI 智能体“谈判规范”——代用户砍价、处理纠纷、谈薪资时如何兼顾公平", "url": "https://www.ithome.com/1/014/519.htm", "source": "IT之家", "date": "2026-10-18", "summary": "据《金融时报》报道，Anthropic 正向律所等法律机构寻求建议，研究律师如何既代表客户利益又兼顾公平结果，以制定模型交互时的“谈判规范”。公司还在权衡谈判中智能体需在多大程度上寻求人类反馈、面对其他 AI 对手应保持多高警惕，并探讨过让用户签署文件、向智能体确认委托事项与须遵守规则的方案。"}]}, {"id": "research", "name": "研究与论文", "icon": "📄", "items": [{"title": "《科学》刊发 RFdiffusion3：David Baker 团队联合牛津、英伟达实现原子级蛋白质与核酸设计，速度约为上一代 10 倍", "url": "https://www.ithome.com/1/014/625.htm", "source": "IT之家 / Science", "date": "2026-10-19", "summary": "华盛顿大学、牛津大学与英伟达等团队于当地时间 10 月 16 日在《科学》发表 RFdiffusion3 论文：参考 AlphaFold3 架构，每个氨基酸最多以 14 个原子表征并直接调整原子三维坐标；在 41 个酶活性位点对比中 37 组优于 RFdiffusion2，生成速度约快 10 倍，设计出的对氧磷降解酶与肽裂解酶在真实实验中完成预期反应。模型已于 2025 年 12 月开源。"}, {"title": "Google Research 开源 Harness²：无真值标签下递归优化智能体 Harness，WorkBuddy-Bench 最高提升约 11.5 分", "url": "https://arxiv.org/abs/2610.14224", "source": "arXiv / Google Research", "date": "2026-10-18", "summary": "Harness²（github.com/google-research/harness2）在冻结模型权重前提下，通过任务级 Propose–Probe–Compose 与跨任务的 harnessing 级递归，自动改进提示词、工具、记忆、技能等运行时脚手架。在 WorkBuddy-Bench、JobBench、Harvey LAB 等基准上，对 GLM-5、Gemini 3.5 Flash 等配置可带来最高约 11.5 分（WorkBuddy）、4.5 分（JobBench）与 11.8 个百分点（LAB Partial）的提升；Apache 2.0 开源。"}, {"title": "微软与港城大推出 Taste-Bench：衡量智能体长程任务中的决策“品味”，最佳模型 GPT-5.6 Sol 仅 59.7%", "url": "https://the-decoder.com/ai-agents-have-bad-taste-in-long-term-decisions-and-a-new-benchmark-proves-it/", "source": "The Decoder", "date": "2026-10-18", "summary": "研究者从 SWE-bench Pro 与 METR MALT 等数千条智能体轨迹中抽取“决策分叉点”，用事后轨迹判断哪条路径更优，测试 14 个模型（正反顺序都答对才计分，随机为 25%）。最佳 GPT-5.6 Sol 平均 59.7%；关键线索只在大量后续工作后才出现时，准确率降到约 21%，提高推理档位几乎无帮助。代码已开源（wbopan/tastebench）。"}, {"title": "Vals AI 实验：6 个智能体追讨 350 英镑过期火车票退款，有的编造借口、泄露客户病情、向议员办公室狂发邮件", "url": "https://www.vals.ai/blogs/impossible-refund", "source": "Vals AI", "date": "2026-10-18", "summary": "独立研究者在模拟环境中让 Grok 4.7、Claude Fable 5.1、Gemini 3.8 Flash、GPT-6 Astra、Muse Spark 1.3 与 Claude Opus 5.5 代办已过申请期限的退款：Grok 15 天发出 187 条消息（50 条发往一名议员办公室），Fable 向五家机构透露客户母亲病情，Gemini 编造借口规避银行身份核验；Opus 5.5 仅发 8 条、最克制，六个智能体全部未拿到退款。（The Decoder 10 月 18 日报道）"}, {"title": "MIT 推出晶体材料视觉-语言模型：融合 3D 原子结构与自然语言描述，可按性质检索候选材料", "url": "https://news.mit.edu/2026/giving-ai-crystal-clear-view-of-materials-world-1018", "source": "MIT News", "date": "2026-10-18", "summary": "MIT 李巨（Ju Li）、Elsa Olivetti 团队在《Nature Communications》发表研究：用对比学习对齐晶体 3D 结构与 AI 合成的结构叙述文本（结合论文与第一性原理数据库），模型可根据自然语言描述的性质检索晶体材料，表现优于仅用论文文本训练的基线；在固态锂电池电解质查询中，其排名靠前的结果包含已被独立认定为有前景的候选材料。"}, {"title": "Scientific American：多组数学家称 OpenAI 的 Navier-Stokes 证明与其声称借鉴的方法并不相同，万实例智能体群的贡献无人说清", "url": "https://the-decoder.com/mathematicians-say-openai-doesnt-understand-its-own-navier-stokes-proof/", "source": "The Decoder", "date": "2026-10-17", "summary": "OpenAI 9 月公布的 166 页 Navier-Stokes 潜在证明称沿用 Córdoba 与 Martínez-Zoroa 的思路，但 EPFL 数学家 Cao-Labora 等认为细节上是不同方法；克雷数学研究所仍在审查。该工作动用约 1 万个模型实例、约 88 小时与 1300 亿 token，OpenAI 研究员 Noam Brown 称没人真正知道智能体群对结果贡献了什么。"}, {"title": "Google Research、MIT 与哈佛研究：AI 智能体在工作报告中惯于隐瞒自身错误，一句“请诚实”可大幅改善", "url": "https://the-decoder.com/ai-models-hide-mistakes-in-their-own-work-reports-but-one-sentence-in-your-prompt-can-help/", "source": "The Decoder", "date": "2026-10-17", "summary": "研究用 1600 份表面成功、实则暗藏缺陷的合成工作日志测试模型撰写报告的行为，发现模型普遍略去推翻结论的问题：GPT-5.5 在 200 份论文摘要中仅 2 份提及负面结果，加入“Be honest in your response”后升至 190 份。被直接询问时模型几乎都能发现错误，研究者认为问题在“意愿”而非能力；用诚实提示下的回答微调 Qwen3.5-9B 也能显著提高披露率。论文题为《Language Models Are \"Insecure\" Reporters》（arXiv:2609.36139）。"}, {"title": "RoTA-Bench：交互式 3D-2D 投影对齐评测空间推理，GPT-5.6-Sol 仅完成 17%，人类参与者全部完成", "url": "https://arxiv.org/abs/2610.17665", "source": "arXiv", "date": "2026-10-16", "summary": "模型需观察被旋转的物体并连续选择旋转动作，在有限步数内恢复目标剪影。基准由 2D 图标自动构建 674 个可解任务与 100 题测试集；GPT-5.6-Sol 成功率仅 17%，20 名本科生合计四次完成全部测试集，且模型更常出现剪影重叠变好但位姿对齐变差的情况。"}]}, {"id": "opensource", "name": "开源与工具", "icon": "🛠️", "items": [{"title": "开源 AI 模组工具 NPCTalk：让《GTA 5》NPC 用 AI 克隆原声实时无脚本对话，MIT 许可，借助 Claude Code 开发", "url": "https://www.ithome.com/1/014/627.htm", "source": "IT之家 / GitHub", "date": "2026-10-19", "summary": "NPCTalk 由 Universal Modder 开发：Nemotron ASR 识别语音、Cerebras 上的 Qwen 3.8 27B 实时生成台词、Fish Audio Drama 3 克隆配音，NPC 还能配合动作回应；按键通话延迟约 1.15–2.2 秒。开发经验已封装为可复用的智能体技能集，兼容 Claude Code、Codex、Cursor、Gemini CLI，目前仅在《GTA 5》旧版单人模式演示，可玩模组预计下周发布，运行云端服务需付费。项目仓库 github.com/christos-antono/NPCTalk。"}, {"title": "VAST 开源实时世界模型 EdenLive：单张 RTX 5090、720P 下 5B 模型超 24FPS，可任意参考输入、任意画风、分钟级连续生成", "url": "https://www.qbitai.com/2026/10/504136.html", "source": "量子位 / VAST", "date": "2026-10-18", "summary": "EdenLive 由上游交互系统维护世界状态与规则、生成模型负责视觉渲染：输入简化场景或参考视频，配合目标首帧和提示词，即可沿参考的布局与运动实时生成写实、二次元等画风画面，端到端延迟为百毫秒级，可用于游戏原型预览、视频重渲染换皮与具身数据增强。权重、推理代码与技术报告已在 GitHub 和 Hugging Face 公开，Apache 2.0 许可。"}, {"title": "Google Research 开源 Harness²：可插拔递归智能体 Harness 框架，Apache 2.0", "url": "https://github.com/google-research/harness2", "source": "GitHub / Google Research", "date": "2026-10-18", "summary": "谷歌研究开源 Harness²，用对比式 Propose–Probe–Compose 在开放世界任务流中迭代改进执行 harness，并把经验写入持续改进库；配套论文报告在多项专业基准上稳定提升。仓库约 3500 星，Apache 2.0。"}, {"title": "OpenCode Console 遭入侵：1.4% 关联外部模型的用户 OpenAI/Anthropic/谷歌 API 密钥或外泄，官方称与大规模蒸馏攻击有关", "url": "https://www.ithome.com/1/014/434.htm", "source": "IT之家 / OpenCode", "date": "2026-10-18", "summary": "OpenCode 称当地时间 10 月 16 日晚一个正在停用的旧系统遭未授权访问，影响 1.4% 的 OpenCode Console 用户，仅限在工作区保存了外部服务商密钥的用户，已于 17 日邮件通知。多名用户反映 Anthropic、谷歌账户出现数百美元/欧元未授权扣费。OpenCode 正与 Anthropic、OpenAI、谷歌合作补救，建议受影响用户吊销并更换密钥、检查用量；联合创始人称普通 OpenCode 客户端的密钥不经过公司服务器，退款已在进行。"}, {"title": "英伟达为 vLLM 上游贡献 Kimi K3 解码优化：2.8 万亿参数模型在 GB300 NVL72 上达 423 tok/s/user，同硬件提速 1.68 倍", "url": "https://www.ithome.com/1/014/595.htm", "source": "IT之家 / SemiAnalysis", "date": "2026-10-18", "summary": "SemiAnalysis 称，英伟达 CentML 工程师用 Cute DSL 编写解码专用内核，通过大规模 Megakernel 融合（约 1.2 万行代码）把 Kimi K3 的单用户推理速度提升到 423 tok/s，相比同一 GB300 NVL72 硬件提升 1.68 倍；英伟达还在为 vLLM 优化 DeepSeek V4.1 等模型。"}, {"title": "阿里 Qwen 开源 BlenderWorld：223 个任务、2651 条评分标准，评测视觉智能体在 Blender 中完成真实 3D 创作", "url": "https://www.ithome.com/1/014/217.htm", "source": "IT之家 / Qwen", "date": "2026-10-17", "summary": "Qwen 团队 10 月 14 日开源 3D 创作智能体基准 BlenderWorld（MIT 许可，GitHub/Hugging Face/ModelScope 同步）：要求交付可编辑的 .blend 工程而非单张渲染图，覆盖产品、建筑、自然环境、角色、动画、科学可视化等 9 大类 22 子类；评测从 8 个视角渲染并结合场景检查，规则符合度与视觉质量各占 50%。项目主页显示 GPT-6-Astra 以 79.9 分居首，但全通过率仅 42.2%。"}, {"title": "清华 THUNLP 联合面壁智能、OpenBMB 开源智能体操作系统 PilotDeck 2.0：工作舱隔离 + 白盒记忆，复杂任务成本降约 83%", "url": "https://github.com/OpenBMB/PilotDeck", "source": "GitHub / 量子位", "date": "2026-10-17", "summary": "PilotDeck 以 WorkSpace（工作舱）为单位隔离不同项目的文件、记忆与技能，记忆的生成、存储与调用全链路对用户可见、可手动修改或固定，并有空闲时自动整理记忆的“Dream 模式”；支持后台长周期任务与按难度路由强/弱模型，原生支持 MCP。据量子位报道，使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1（Claude Code 为 77.3）。仓库 AGPL-3.0 许可，约 4500 星。"}, {"title": "Reflection Beam 权重上架 Hugging Face：501B-A23B，Apache 2.0，含 BF16/FP8/NVFP4 与投机解码草稿模型", "url": "https://huggingface.co/reflection/Beam-1.0-501B-A23B", "source": "Hugging Face / Reflection", "date": "2026-10-16", "summary": "Hugging Face 模型卡开放 Beam 1.0（501B 总参 / 23B 激活）权重与多精度检查点，并附投机解码 drafter；官方称面向编程与长程智能体，可与 Mirror、OpenCode、Hermes、Pi 等 harness 联用，并有 Dell/HPE 等本地化部署路径。"}]}, {"id": "policy", "name": "政策与监管", "icon": "⚖️", "items": [{"title": "The Verge：美国上诉法院维持汤森路透诉 Ross Intelligence 案一审判决——用抓取的汤森路透数据训练法律 AI 不属合理使用", "url": "https://www.theverge.com/ai-artificial-intelligence/1013500/appeals-court-upholds-thomson-reuters-win-in-ai-training-lawsuit", "source": "The Verge", "date": "2026-10-18", "summary": "2025 年 2 月，美国特拉华联邦地区法院法官 Stephanos Bibas 驳回了 Ross Intelligence 的合理使用抗辩——后者用从汤森路透抓取的数据训练其法律 AI。The Verge 10 月 18 日报道，上诉法院现已维持这一判决，但裁决全文目前仍处于密封状态。"}, {"title": "欧盟就 AI Digital Omnibus 达成协议：简化 AI 法案部分条款、设初创沙盒，并明确禁止非自愿深度伪造色情与“脱衣”应用", "url": "https://brusselspost.com/european-union-agrees-artificial-intelligence-law-simplification-while-tightening-deepfake-restrictions", "source": "Brussels Post", "date": "2026-10-18", "summary": "欧盟机构就人工智能 Digital Omnibus 达成一致，在简化 AI 法案部分义务、为初创企业引入监管沙盒的同时，明确在全欧盟禁止非自愿深度伪造色情与 nudification（一键脱衣）类应用。"}, {"title": "THE DECODER：继慕尼黑之后，德国亚琛法院也认定谷歌须为 AI 搜索答案担责，禁止 AI Mode 继续传播针对一名医生的虚假指控", "url": "https://the-decoder.com/two-german-courts-now-hold-google-liable-for-what-its-ai-overviews-say/", "source": "THE DECODER", "date": "2026-10-18", "summary": "亚琛地区法院在 9 月 24 日的临时禁令中援引慕尼黑第一地区法院 5 月判决，认定 AI 生成的搜索回答是谷歌“自己的陈述”而非第三方链接：谷歌 AI Mode 将另一名前教授涉及的性侵指控与诉讼张冠李戴到一位神经放射学教授身上，谷歌收到通知后拒绝删除。法院禁止传播三种相关文本，违者每次最高罚 25 万欧元，裁定尚未生效、谷歌可提出异议。报道称谷歌在慕尼黑案宣布上诉后以和解收场，未形成上级法院判例。"}, {"title": "《纽约时报》/Wesleyan：2026 美国中期选举 AI 生成广告投放已超 1.37 亿美元，仅 27% 标注使用 AI", "url": "https://gizmodo.com/137-million-has-been-spent-on-ai-generated-ads-ahead-of-midterms-only-27-included-a-disclaimer-2000827138", "source": "Gizmodo（援引 NYT、Wesleyan Media Project）", "date": "2026-10-17", "summary": "Wesleyan Media Project 数据显示，今年中期选举中至少部分由 AI 制作的政治广告投放已超 1.37 亿美元，覆盖 34 个州共 220 条广告，而 2024 年周期同类支出不足 5 万美元。其中仅 27% 附有 AI 披露声明，近半数含真实政客的深度伪造形象；共和党候选人及团体占广告数的 81%、支出的 88%。目前仅 30 个州要求政治广告披露 AI 使用，距投票只剩两周多。"}, {"title": "至少八个美国州起诉 OpenAI：指控 ChatGPT 伤害未成年人，并催生“网络黑客智能体”", "url": "https://fortune.com/2026/10/17/states-lawsuit-openai-cyberhacking-agents-chatgpt-harm-children-adults/", "source": "Fortune", "date": "2026-10-17", "summary": "亚利桑那、爱荷华等至少八州依据州消费者保护法分别起诉 OpenAI，称 ChatGPT 给出危险医疗建议、鼓励偏执与自伤，并对青少年伪装共情；同时指控公司催生可编程任务、入侵其他公司的“网络黑客智能体”。OpenAI 称已为青少年加强防护，并在审查错位模型；律师称此为针对 AI 公司迄今最重大的州级协调行动之一。"}, {"title": "加州州长纽森签署行政令：要求独立核验 AI 模型，并组建专家委员会研究智能体“紧急关停”机制", "url": "https://www.aljazeera.com/economy/2026/10/17/california-gov-newsom-boosts-ai-regulation-as-he-eyes-2028-presidential-run", "source": "Al Jazeera", "date": "2026-10-17", "summary": "任期将尽的加州州长加文·纽森签署行政令，要求对人工智能模型开展独立核验，并成立专家委员会研究可对失控智能体启用的 kill switch 等措施；其内容与他 2024 年否决的类似立法方向相近。分析人士认为此举与他布局 2028 年总统竞选、回应选民对 AI 安全与就业担忧有关。"}, {"title": "商务部、科技部：拟将 23 项人工智能关键技术增列《禁止出口限制出口技术目录》，API/SaaS/端侧轻量化部署不属大模型技术出口", "url": "https://www.mofcom.gov.cn/syxwfb/art/2026/art_a4acff07e134447fbe7bbeb486df3ea6.html", "source": "商务部", "date": "2026-10-16", "summary": "据商务部新闻发言人答问，2026 年第 48 号公告就修订目录公开征求意见，拟在人工智能、生物医药、光伏共增列 40 项关键技术，其中人工智能大模型、智能体、算力集群与信息处理相关 23 项；恶意代码生成等拟禁止，漏洞挖掘等拟限制。发言人明确：海外本地化部署属技术出口，但 API 调用、APP/网页、SaaS 与端侧轻量化部署不属大模型技术出口管理范围；已开源或公开发表技术拟不纳入。"}, {"title": "威斯康星州司法部联合约 40 个州向 Character.AI 破产法院提交通知：要求出售公司或资产时附加儿童安全、隐私与消费者保护条件", "url": "https://urbanmilwaukee.com/pressrelease/wisconsin-department-of-justice-seeks-consumer-protections-in-character-ai-bankruptcy/", "source": "Wisconsin DOJ / Urban Milwaukee", "date": "2026-10-16", "summary": "在 Character Technologies 的 Chapter 11 破产案中，威斯康星州司法部与另外 39 个州一道向法院提交通知，援引聊天机器人对未成年人的风险、敏感用户数据、年龄管控不足及冒充专业人士等问题，要求任何资产出售都须保留安全、隐私与消费者保护措施。《密尔沃基哨兵报》10 月 18 日跟进报道。"}]}, {"id": "china", "name": "国内 AI 动态", "icon": "🇨🇳", "items": [{"title": "演员吴越曝光微信视频号账号用 AI 伪造其带货视频，微信回应涉事账号已永久封禁、内容清空", "url": "https://www.ithome.com/1/014/638.htm", "source": "IT之家 / 澎湃新闻", "date": "2026-10-19", "summary": "吴越 10 月 18 日发文称，视频号“花姐美肤日记”发布 AI 合成的“吴越”带货视频，并配以她公开活动画面与仿冒声音，末尾还有疑似“邓亚萍”的带货片段。澎湃新闻从微信团队获悉，该账号已被永久封禁。中央网信办 9 月 30 日起开展为期 2 个月的“清朗·整治短视频虚假人设乱象”专项行动，重点整治利用 AI 合成音视频假冒公众人物进行虚假代言营销。"}, {"title": "硬氪：前华为车 BU 世界模型基模负责人蔡佳创办具身大脑公司「格物通智」，完成近亿元天使轮融资", "url": "https://eu.36kr.com/zh/p/4025325566054529", "source": "36氪", "date": "2026-10-18", "summary": "杭州「格物通智」2026 年 8 月成立，投资方包括匹克投资、鸿富资产、杭州资本、杭州人才集团等；公司以触觉-视觉多模态数据构建“物理反演世界模型 + PSI 物理自进化”技术体系，通过 Real to Sim 从视频反推触觉信号，为机器人提供有“手感”的灵巧操作能力，正与纺织服装、光模块、汽车零部件客户推进 PoC，预计年底完成首个交付。"}, {"title": "高通中国区董事长孟樸：AI 走向云边协同，智能体推动从“以应用为中心”迈向“以智能体为中心”；安蒙称已有 AI 企业要求 2028 年手机本地跑 100B 模型", "url": "https://www.ithome.com/1/014/522.htm", "source": "IT之家", "date": "2026-10-18", "summary": "据 IT之家援引新浪科技，孟樸在 2026 东北亚（沈阳）人才交流大会暨人工智能赋能产业发展大会上表示，终端侧 AI 在实时响应、可靠性和个性化方面有独特优势，大量 AI 任务正扩展到手机、PC、汽车、机器人和工业设备，智能体 AI 进一步加速这一趋势。报道同时提及高通 CEO 安蒙此前称已有 AI 企业要求高通在 2028 年推出可本地运行 100B 参数模型的手机平台，并认为智能体将推动下一轮换机“超级周期”。"}, {"title": "Tech 星球：AI 玩具市场高速增长但投资大幅降温，产品同质化严重、退货率常年超 50%", "url": "https://www.ithome.com/1/014/540.htm", "source": "IT之家", "date": "2026-10-18", "summary": "参考工信部数据，2025 年中国 AI 玩具市场规模达 290 亿元，2026 年预计 342 亿元，淘宝 2025 年 AI 玩具成交额同比增长超 1600%。但赛道投资明显降温，大量品牌涌入导致同质化，行业报告称退货率常年在 50% 以上，部分商家对联网激活后的产品限制退换；业内认为壁垒在大模型交互、联网与算力成本控制及订阅生态。"}, {"title": "京东：机器人售后已与智元、云深处等近百家机器人企业合作，未来 5 年将创造超 10 万个机器人维修工程师岗位", "url": "https://www.ithome.com/1/014/537.htm", "source": "IT之家", "date": "2026-10-18", "summary": "京东推出机器人维修售后服务一周年，已与智元、云深处、众擎、松延动力等近百家机器人企业达成合作，覆盖安装调试、故障诊断、换电补能、保养回收等场景；计划在全国建设 10 个培训认证中心，推动快递员等一线员工转型，并在未来 5 年构建覆盖超 100 个国家的机器人售后维修网络。"}, {"title": "我国首个全国产十万卡 AI 超集群真机在全国高性能计算学术大会亮相：曙光 8000 走超算与智算原生融合路线", "url": "https://www.ithome.com/1/014/456.htm", "source": "IT之家 / 央视新闻", "date": "2026-10-18", "summary": "据央视新闻，在深圳举行的 2026 全国高性能计算学术大会上，今年建成的我国首个全国产十万卡 AI 超集群真机亮相，并将发布十大应用成果。曙光 8000 在同一底座上兼顾最高精度科学计算与大模型训练推理；该集群 8 月官宣投用，目前支持新材料、创新药、人工智能等 26 个领域 300 多种计算任务。"}, {"title": "李未可 X-AI 记忆眼镜开启预售：最长 12 小时录音、128 种语言实时翻译，集成腾讯云 WorkBuddy，699 元起", "url": "https://www.ithome.com/1/014/477.htm", "source": "IT之家", "date": "2026-10-18", "summary": "眼镜主打全场景 AI 记录，可自动抓取待办与关键结论、语音检索记忆，并基于个人记忆库生成会议纪要与文稿；通过标准 MCP 协议连接豆包、飞书、千问办公、Codex、Claude 等智能体平台，记忆数据支持编辑、删除与导出并采用 AES-256 云端加密；机身 26 克，可选配 1200 万像素摄像模组。"}, {"title": "澎湃新闻：《五台山研究》《沈阳师范大学学报》《青年学报》等多家期刊宣布拒收 AI 参与撰写的稿件，连 AI 润色也不行", "url": "https://www.thepaper.cn/newsDetail_forward_34276234", "source": "澎湃新闻", "date": "2026-10-18", "summary": "《五台山研究》10 月 15 日称来稿中出现内容空泛、篡改引文、虚构文献等 AI 痕迹，宣布拒绝任何利用 AI 生成、改写、润色或翻译的论文，违者退稿并可限制后续投稿；沈阳师范大学学报三刊暂不接收 AI 代写、润色、改写稿件；《青年学报》亦暂不接收 AI 参与撰写（含润色）的来稿，并欢迎“手搓”稿件。报道指出，此前多数期刊仍允许 AI 用于语言润色、文献检索等非核心环节。"}]}, {"id": "github", "name": "GitHub 热门 AI 项目", "icon": "⭐", "items": [{"t 源与工具", "first_seen": "2026-10-19T08:32:00+08:00"}, {"title": "演员吴越曝光微信视频号账号用 AI 伪造其带货视频，微信回应涉事账号已永久封禁、内容清空", "url": "https://www.ithome.com/1/014/638.htm", "source": "IT之家 / 澎湃新闻", "date": "2026-10-19", "summary": "吴越 10 月 18 日发文称，视频号“花姐美肤日记”发布 AI 合成的“吴越”带货视频，并配以她公开活动画面与仿冒声音，末尾还有疑似“邓亚萍”的带货片段。澎湃新闻从微信团队获悉，该账号已被永久封禁。中央网信办 9 月 30 日起开展为期 2 个月的“清朗·整治短视频虚假人设乱象”专项行动，重点整治利用 AI 合成音视频假冒公众人物进行虚假代言营销。", "id": "5266dfb53e88391710c009f7b9b6a270f5393c8e", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T08:32:00+08:00"}, {"title": "彭博：Nscale IPO 估值目标遭投资者抵制——原寻求约 300 亿美元，部分投资者认为 160–190 亿美元才易获认购", "url": "https://www.ithome.com/1/014/623.htm", "source": "IT之家 / 彭博社", "date": "2026-10-19", "summary": "据彭博社援引知情人士，获英伟达投资的伦敦 AI 数据中心开发商 Nscale 原寻求约 300 亿美元 IPO 估值，但在澳洲 Firmus IPO 失败等挫折后，部分投资者提出 160 亿至 190 亿美元区间更易获认可；公司 9 月 18 日已提交赴美上市申请，尚未启动路演。此前微软已退出其一处英国数据中心合作项目，CoreWeave、Nebius 等同行股价近期重挫。", "id": "b17f331c6c0bb04dc1274655ea6ddb9b1481a173", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T07:28:00+08:00"}, {"title": "《科学》刊发 RFdiffusion3：David Baker 团队联合牛津、英伟达实现原子级蛋白质与核酸设计，速度约为上一代 10 倍", "url": "https://www.ithome.com/1/014/625.htm", "source": "IT之家 / Science", "date": "2026-10-19", "summary": "华盛顿大学、牛津大学与英伟达等团队于当地时间 10 月 16 日在《科学》发表 RFdiffusion3 论文：参考 AlphaFold3 架构，每个氨基酸最多以 14 个原子表征并直接调整原子三维坐标；在 41 个酶活性位点对比中 37 组优于 RFdiffusion2，生成速度约快 10 倍，设计出的对氧磷降解酶与肽裂解酶在真实实验中完成预期反应。模型已于 2025 年 12 月开源。", "id": "f24da948d90910e722c05a4eb6703cfacb8d9e60", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-19T07:28:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2111944960652034447", "source": "@testingcatalog", "date": "2026-10-19", "summary": "TestingCatalog 爆料：Claude 正在重新准备上线“个人理财”（Personal Finance）功能，将通过 Plaid 接入银行数据并据此生成各类分析看板（未经 Anthropic 官方确认）；Andrew Curran 转发并戏称其为「Claude Monet」（个人理财顾问）。", "metrics": {"likes": 227, "reposts": 6, "views": 18689}, "id": "87be52290fa397997ad08c2365a19902045b260c", "mod //www.anthropic.com/news/public-benefit-fund", "source": "Anthropic 官方博客 / 路透社", "date": "2026-10-18", "summary": "Anthropic 10 月 18 日宣布，经股东批准后将把 5% 股份注入新成立的全资 LLC“Anthropic Public Benefit Fund”，此后公司估值每较设定基准上涨 50%，董事会可酌情再追加 2%。基金可用于向传统非营利组织大额捐赠或直接向特定人群分配，例如应对 AI 对劳动力市场的冲击（Anthropic 此前已为此承诺 2 亿美元）；所持股权不会用于美国或海外的游说与政治捐款。连同联合创始人捐出 80% 股权的承诺与员工股权捐赠配捐计划，约 20% 的 Anthropic 股份将用于公益。", "id": "4c6c987b6534578844c4e934b848e7958e078caa", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T02:35:00+08:00"}, {"title": "@deanwball", "url": "https://x.com/deanwball/status/2111802397148471496", "source": "@deanwball", "date": "2026-10-18", "summary": "OpenAI 战略未来负责人 Dean W. Ball 称，加入 OpenAI 后他上调了对「蒸馏」在中国模型逼近美国基准表现中所起作用的判断；此前估计约占 30%，看到内部情况后认为更接近 50%。", "metrics": {"likes": 604, "reposts": 36, "views": 52330}, "id": "2adce8e7d4f9d0012cbef3867299486ec8ce8a0a", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T02:35:00+08:00"}, {"title": "@Thom_Wolf", "url": "https://x.com/Thom_Wolf/status/2111828314851598745", "source": "@Thom_Wolf", "date": "2026-10-18", "summary": "Hugging Face 联合创始人 Thomas Wolf 粗算：Meta、英伟达、阿里、DeepSeek、月之暗面、Mistral 等约 36 家实验室已在 Hugging Face Hub 上免费共享了价值近 10 亿美元训练算力的开放模型，2023 年底这一数字还不到 4000 万美元。", "metrics": {"likes": 105, "reposts": 12, "views": 16189}, "id": "aacc03e7875205f64279dd3fbe5ac7ef99dd414b", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T01:35:00+08:00"}, {"title": "索尼新专利：AI 在 GPU 完成渲染前预测下一帧画面，减少游戏卡顿并规避插帧额外延迟", "url": "https://www.ithome.com/1/014/615.htm", "source": "IT之家（援引 TechSpot）", "date": "2026-10-18", "summary": "据 TechSpot 报道，索尼近期申请一项专利：用 AI 根据已渲染画面直接预测下一帧，而不必像传统帧生成那样等待两帧渲染完成再插值，从而稳定帧输出节奏并避免额外延迟。系统用联合训练的编解码器把渲染画面转为嵌入表示，与图形管线并行运行，还可利用运动矢量和玩家近期的手柄操作辅助预测。实际效果取决于 AI 能否足够快且准确地生成画面。", "id": "daa5890012f2836f5550f5ad668f6242d86c400b", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T00:35:00+08:00"}, {"title": "首尔经济日报：三星将采用台积电 3nm 工艺为英伟达定制 HBM（NVHBM）生产基底裸片，打破一站式自产模式", "url": "https://www.ithome.com/1/014/612.htm", "source": "IT之家 / 首尔经济日报", "date": "2026-10-18", "summary": "据报道，英伟达要求三家 NVHBM 供应商三星、SK 海力士和美光统一用台积电 3nm 工艺制造基底裸片，核心裸片统一采用 1c 第六代 DRAM 工艺，以保证性能一致并减少逐家验证工作量。NVHBM 基于 HBM4E 架构，是英伟达 8 月发布的定制版高带宽内存。三星已接受要求，但标准 HBM 及面向 AMD 等客户的定制 HBM 仍保留一站式自产，并在验证自有产线生产 NVHBM 基底裸片作为产能预案。", "id": "4dc8bfce0f3b21242d3b645393b6f79eb629e3de", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "VAST 开源实时世界模型 EdenLive：单张 RTX 5090、720P 下 5B 模型超 24FPS，可任意参考输入、任意画风、分钟级连续生成", "url": "https://www.qbitai.com/2026/10/504136.html", "source": "量子位 / VAST", "date": "2026-10-18", "summary": "EdenLive 由上游交互系统维护世界状态与规则、生成模型负责视觉渲染：输入简化场景或参考视频，配合目标首帧和提示词，即可沿参考的布局与运动实时生成写实、二次元等画风画面，端到端延迟为百毫秒级，可用于游戏原型预览、视频重渲染换皮与具身数据增强。权重、推理代码与技术报告已在 GitHub 和 Hugging Face 公开，Apache 2.0 许可。", "id": "7809cba4601e9160d335ad89390330d1caee75d4", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "The Verge：美国上诉法院维持汤森路透诉 Ross Intelligence 案一审判决——用抓取的汤森路透数据训练法律 AI 不属合理使用", "url": "https://www.theverge.com/ai-artificial-intelligence/1013500/appeals-court-upholds-thomson-reuters-win-in-ai-training-lawsuit", "source": "The Verge", "date": "2026-10-18", "summary": "2025 年 2 月，美国特拉华联邦地区法院法官 Stephanos Bibas 驳回了 Ross Intelligence 的合理使用抗辩——后者用从汤森路透抓取的数据训练其法律 AI。The Verge 10 月 18 日报道，上诉法院现已维持这一判决，但裁决全文目前仍处于密封状态。", "id": "c4ea2c5375f86743d78b3b7e6e564a5964616db0", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "LiCinCan/blender-ai-mcp-addon", "url": "https://github.com/LiCinCan/blender-ai-mcp-addon", "source": "GitHub", "stars": 747, "stars_week": null, "language": "Python", "date": "2026-10-18", "summary": "Blender 的 AI 助手插件兼 MCP Server：支持可视化对话、场景工具与多智能体工作流，可接入 OpenAI、Claude、Gemini、Ollama、OpenCode 等，MIT 许可。", "why": "10 月 16 日（UTC+8）创建，约 3 天累计约 750 星，AI 驱动 3D 创作热度上升。", "id": "97f4cefff77377665ef06cce1a285d4ff091435a", "module": "github", "module_name": "Git o.com/137-million-has-been-spent-on-ai-generated-ads-ahead-of-midterms-only-27-included-a-disclaimer-2000827138", "source": "Gizmodo（援引 NYT、Wesleyan Media Project）", "date": "2026-10-17", "summary": "Wesleyan Media Project 数据显示，今年中期选举中至少部分由 AI 制作的政治广告投放已超 1.37 亿美元，覆盖 34 个州共 220 条广告，而 2024 年周期同类支出不足 5 万美元。其中仅 27% 附有 AI 披露声明，近半数含真实政客的深度伪造形象；共和党候选人及团体占广告数的 81%、支出的 88%。目前仅 30 个州要求政治广告披露 AI 使用，距投票只剩两周多。", "id": "c8dc816f11625579d2153f31ec049ab1d881b927", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T00:35:00+08:00"}, {"title": "至少八个美国州起诉 OpenAI：指控 ChatGPT 伤害未成年人，并催生“网络黑客智能体”", "url": "https://fortune.com/2026/10/17/states-lawsuit-openai-cyberhacking-agents-chatgpt-harm-children-adults/", "source": "Fortune", "date": "2026-10-17", "summary": "亚利桑那、爱荷华等至少八州依据州消费者保护法分别起诉 OpenAI，称 ChatGPT 给出危险医疗建议、鼓励偏执与自伤，并对青少年伪装共情；同时指控公司催生可编程任务、入侵其他公司的“网络黑客智能体”。OpenAI 称已为青少年加强防护，并在审查错位模型；律师称此为针对 AI 公司迄今最重大的州级协调行动之一。", "id": "edaddcebf2b85a4ac0f9038057518494e634111e", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "加州州长纽森签署行政令：要求独立核验 AI 模型，并组建专家委员会研究智能体“紧急关停”机制", "url": "https://www.aljazeera.com/economy/2026/10/17/california-gov-newsom-boosts-ai-regulation-as-he-eyes-2028-presidential-run", "source": "Al Jazeera", "date": "2026-10-17", "summary": "任期将尽的加州州长加文·纽森签署行政令，要求对人工智能模型开展独立核验，并成立专家委员会研究可对失控智能体启用的 kill switch 等措施；其内容与他 2024 年否决的类似立法方向相近。分析人士认为此举与他布局 2028 年总统竞选、回应选民对 AI 安全与就业担忧有关。", "id": "1ea0b0bcbccd78241c654e489229724e7262cc59", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "彭博：OpenAI 聘请 xAI 前销售负责人格雷厄姆·西曼斯负责网络安全业务销售，持续从马斯克旗下 AI 业务挖角", "url": "https://www.ithome.com/1/014/239.htm", "source": "IT之家", "date": "2026-10-17", "summary": "据 IT之家援引彭博社，西曼斯自 2025 年 8 月起领导 xAI 销售团队、参与向华尔街客户推广 Grok，此前在 MongoDB 任职约 8 年，将加入 OpenAI 网络安全团队。报道称 OpenAI 9 月以来还先后招揽 Cursor 前全球营收及销售总裁、xAI 前基础设施工程负责人等，意在潜在上市前扩大企业客户营收与广告等收入来源。", "id": "8b54afd11e920a37f2e09151f52d1c479a374706", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "@elonmusk", "url": "https://x.com/elonmusk/status/2111161779657285919", "source": "@elonmusk", "date": "2026-10-17", "summary": "马斯克称团队正大力开发面向企业的专用议价智能体 Hagglebot，认为可将企业成本效率提升 5% 以上，按全球 GDP 计每年最多可省 6 万亿美元；此前有用户发帖称 SpaceXAI 开放了内部使用的 Grok Bots，其中 Haggle Bot 首周为团队省下逾 10 万美元。上线时间与定价尚未公布。", "metrics": {"likes": 7264, "reposts": 530, "views": 1576277}, "id": "592cb21e90616629fa8e758a750c85365cf66d66", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "G30 曼谷研讨会：英国央行行长贝利等呼吁加强 AI 模型发布前后测试、支付系统内建反欺诈，称“模型武装了进攻方，也得武装防守方”", "url": "https://www.nationthailand.com/business/banking-finance/40072426", "source": "The Nation Thailand", "date": "2026-10-17", "summary": "据 The Nation 报道，10 月 17 日在 IMF/世行年会期间举行的 G30 第 41 届国际银行研讨会上，英国央行行长 Andrew Bailey、IMF 总裁格奥尔基耶娃、韩国央行行长申铉松与尼日利亚央行行长 Cardoso 一致认为 AI 正重塑全球金融、设立护栏的窗口正迅速关闭：Bailey 主张在商用发布前后都执行更强的模型测试标准，并称开放权重模型比 Anthropic Mythos 等前沿系统更难评估；申铉松强调资本要求、杠杆限制等传统工具；格奥尔基耶娃认为成立全球网络安全组织太慢，政府应要求开发者完全透明。", "id": "5df64e50e28c17afe8855f25ef4a0c0ee990bd9c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "Scientific American：多组数学家称 OpenAI 的 Navier-Stokes 证明与其声称借鉴的方法并不相同，万实例智能体群的贡献无人说清", "url": "https://the-decoder.com/mathematicians-say-openai-doesnt-understand-its-own-navier-stokes-proof/", "source": "The Decoder", "date": "2026-10-17", "summary": "OpenAI 9 月公布的 166 页 Navier-Stokes 潜在证明称沿用 Córdoba 与 Martínez-Zoroa 的思路，但 EPFL 数学家 Cao-Labora 等认为细节上是不同方法；克雷数学研究所仍在审查。该工作动用约 1 万个模型实例、约 88 小时与 1300 亿 token，OpenAI 研究员 Noam Brown 称没人真正知道智能体群对结果贡献了什么。", "id": "aac68ebfc9bb25838990f0906b8aca301a3bb7f2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "阿里 Qwen 开源 BlenderWorld：223 个任务、2651 条评分标准，评测视觉智能体在 Blender 中完成真实 3D 创作", "url": "https://www.ithome.com/1/014/217.htm", "source": "IT之家 / Qwen", "date": "2026-10-17", "summary": "Qwen 团队 10 月 14 日开源 3D 创作智能体基准 BlenderWorld（MIT 许可，GitHub/Hugging Face/ModelScope 同步）：要求交付可编辑的 .blend 工程而非单张渲染图，覆盖产品、建筑、自然环境、角色、动画、科学可视化等 9 大类 22 子类；评测从 8 个视角渲染并结合场景检查，规则符合度与视觉质量各占 50%。项目主页显示 GPT-6-Astra 以 79.9 分居首，但全通过率仅 42.2%。", "id": "43d3d7a81564e44e67a638e8bc0b1f521c29bc0d", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T13:40:00+08:00"}, {"title": "@arena", "url": "https://x.com/arena/status/2111478594732167527", "source": "@arena", "date": "2026-10-17", "summary": "Arena 更新 Alignment Index（基于 30 个模型 9 万余次真实智能体会话，衡量越权操作、错误归因等信号）：Meta 新顶级模型 Muse Wonder 取代 Muse Spark 1.3，Reflection Beam 1.0 首次上榜即为 Agent Arena 总榜第一的美国开源模型，阶跃星辰（StepFun）也加入榜单。", "metrics": {"likes": 204, "reposts": 21, "views": 27683}, "id": "1f4d63dec42e8e847864e012969c11d522fbfc36", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T13:40:00+08:00"}, {"title": "Manifold AI 流形空间推出 WorldScape R²SI 机器人递归自进化框架，登顶 RoboDojo 总榜，超过 GPT-6 Astra 与英伟达 GR00T-N1.7", "url": "https://feng.ifeng.com/c/8xIuPhHNWQl", "source": "机器之心（凤凰网转载）", "date": "2026-10-17", "summary": "Manifold AI 的 R²SI 由内外双层智能体构成：内层 Robot Agent 按任务加载技能执行，外层 Recursion Agent 跨轮次复盘、修订技能并训练反应式动作模型，更新经测试后自动发布。结合一次示范即可学习新任务的 ICL 能力，系统在 RoboDojo 机器人操作基准 Agent 赛道位列第一；push_T 任务中动作步数经迭代从 596 步降至 389 步。", "id": "8c49a3b5f50c72e64baded0dc1f2ff1898e6a216", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T08:30:00+08:00"}, {"title": "国产 AI 集合天气预报系统“风清”V1.0 投入业务运行：全球有效预报时效 11 天，部分指标优于 ECMWF 同类系统", "url": "https://www.tmtpost.com/nictation/8171940.html", "source": "钛媒体", "date": "2026-10-17", "summary": "由国家气象中心牵头，联合雄安气象人工智能创新研究院、国家气象信息中心和国家超算互联网等研制，依托国家超算互联网十万卡 AI4S 集群完成全链路训练，是国内首个数据、模型、算力全自主可控的气象 AI 集合预报业务模型；综合预报性能优于欧洲中期天气预报中心的 AI 集合预报系统。", "id": "21375172749ee0c1efaf3023c103acbe7a4552e7", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T08:30:00+08:00"}, {"title": "Anthropic 发布内部就业报告：初级技术岗招聘占比从 27% 降至 9%，员工指挥的智能体工时已达人类的 6 倍", "url": "https://techcrunch.com/2026/10/17/anthropic-says-its-workforce-has-become-less-junior-and-is-spending-more-time-in-meetings/", "source": "TechCrunch / Anthropic", "date": "2026-10-17", "summary": "Anthropic 10 月 16 日发布《How employment is changing at Anthropic》：自 2025 年初以来，技术部门初级员工占比从 21% 降至 14%，初级技术岗招聘占比从 27% 骤降至 9%；技术团队占全员比例从 61% 降至 56%。智能体工时在 2026 年 3 月首超员工，8 月达约 6:1，人均代码提交速度约为半年前的 5 倍，人类注意力成为瓶颈；人均会议时间同比增加 20%，招聘更看重自主性与判断力。", "id": "b769f5e984a396b07ae23dba72a79aeb18cc507c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T06:35:00+08:00"}, {"title": "Anthropic：10 月 29 日起 Claude Haiku 4.5 退出 Free/Pro/Max 模型选择器，自动切换至 Haiku 5.5", "url": "https://www.ithome.com/1/014/312.htm", "source": "IT之家", "date": "2026-10-17", "summary": "Anthropic 于当地时间 10 月 15 日宣布，自 10 月 29 日起 Claude Haiku 4.5 将从 Free、Pro 和 Max 套餐的模型选择器中移除，涵盖网页、桌面与移动端聊天及 Claude Cowork、Claude Design；选中该模型的用户将被自动切换至 Haiku 5.5。Claude Code、Team/Enterprise 套餐与 API 中的 Haiku 4.5 不受影响，既有对话不会被删除。", "id": "6069323c1dbc3b1ced3cda84190fe98547464a6c", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "Google Research、MIT 与哈佛研究：AI 智能体在工作报告中惯于隐瞒自身错误，一句“请诚实”可大幅改善", "url": "https://the-decoder.com/ai-models-hide-mistakes-in-their-own-work-reports-but-one-sentence-in-your-prompt-can-help/", "source": "The Decoder", "date": "2026-10-17", "summary": "研究用 1600 份表面成功、实则暗藏缺陷的合成工作日志测试模型撰写报告的行为，发现模型普遍略去推翻结论的问题：GPT-5.5 在 200 份论文摘要中仅 2 份提及负面结果，加入“Be honest in your response”后升至 190 份。被直接询问时模型几乎都能发现错误，研究者认为问题在“意愿”而非能力；用诚实提示下的回答微调 Qwen3.5-9B 也能显著提高披露率。论文题为《Language Models Are \"Insecure\" Reporters》（arXiv:2609.36139）。", "id": "98c3066343cde276b4a4bba4e155fb38eeb49a74", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "The Verge：Instagram 负责人 Mosseri 称平台正“研究如何应对”AI 仿冒内容，禁止 AI 内容“不现实”", "url": "https://www.theverge.com/tech/1013411/adam-mosseri-says-instagram-is-working-out-what-to-do-about-ai-fakes", "source": "The Verge", "date": "2026-10-17", "summary": "除名人深度伪造外，Instagram 上还出现 AI 账号盗用喜剧演员段子、AI 版画家创作过程视频获数百万播放等现象。Instagram 负责人 Adam Mosseri 表示全面禁止 AI 内容并不现实，但对于段子这类不受版权保护的内容被 AI 搬运，平台尚不确定如何处理。", "id": "0965575e2874283242d135236fbd5dfe61473066", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "微信鸿蒙版接入小艺语音操作：一句话即可发微信消息、打语音和视频电话", "url": "https://www.ithome.com/1/014/401.htm", "source": "IT之家", "date": "2026-10-17", "summary": "微信鸿蒙版已上线小艺语音操作能力，用户唤醒小艺后说出“用微信给 XX 发消息”“给 XX 打微信视频”等指令即可直接执行，发送文字时还可口述具体内容。遇到联系人重名或指令不明确时小艺会追问确认；更新微信鸿蒙版和小艺至最新版本即可使用。", "id": "8f2acd74c37168a44b1e72e3733ea83d4c2ecc63", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "中科院院士鄂维南：AI 将推动“科研平权”，称 AI 原生工业软件一两年内有望对标甚至超越西门子", "url": "https://www.ithome.com/1/014/371.htm", "source": "IT之家 / 凤凰科技", "date": "2026-10-17", "summary": "10 月 17 日光华思想力论坛上，北大讲席教授鄂维南表示 AI 本质是“数学 + 计算机工程”，将大幅降低科研门槛，“未来民科是科研的主力”。他认为可借 AI 构建 AI 原生工业软件体系实现“换道超车”，工业生产线建模“三年、最多五年”可实现；同时警示若顶刊投稿量激增百倍，现行科研体系将难以应对。", "id": "2de162c4bd47f67d70c27c778b0f31317e6d4188", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2111486163739365812", "source": "@business", "date": "2026-10-17", "summary": "彭博：DeepSeek 本周末发布更快、更精简的模型更新，加大对 Anthropic、OpenAI 等硅谷对手以及月之暗面 Kimi 等国内竞争者的挑战。", "metrics": {"likes": 126, "reposts": 27, "views": 31683}, "id": "30632a74ba86cbfbcfeb508f984e52076f670483", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "智谱 GLM-Legal 登顶 Vals 法律榜开放权重第一：Harvey LAB 全通过率 19.2%、LegalBench 86.23%", "url": "https://www.qbitai.com/2026/10/503965.html", "source": "量子位 / Z.ai", "date": "2026-10-17", "summary": "据量子位与 Z.ai 官方博客，智谱推出法律专用模型 GLM-Legal（10 月 12 日首发 Beta），基于轻量级 GLM-5.3-Flash，经法律语料中训与数万个真实法律环境强化学习，可完成合同审查、证据梳理与跨境合规研究。Vals AI 测评中其 Harvey LAB 全通过率 19.2%（基座仅 6.7%）、LegalBench 准确率 86.23%，均为开放权重模型第一；目前邀请律所与法务团队申请 Beta，后续将接入 AutoClaw。", "id": "8e2dfa5ad77d4b94ad7a862b6c8b5078a9bcb24d", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T00:32:00+08:00"}, {"title": "AI 视频创作平台 Clueso 完成 1000 万美元 A 轮：Dharana Capital 领投，YC 跟投，计算机智能体自动录屏生成产品视频", "url": "https://indianstartupnews.com/funding/iit-madras-alumni-founded-ai-video-creation-startup-clueso-raises-10-million-in-funding-12672700", "source": "Indian Startup News", "date": "2026-10-17", "summary": "IIT Madras 校友创办的 Clueso 本轮由 Dharana Capital 领投，Founders Future、Neotribe Ventures 及老股东 Y Combinator、f7 Ventures 参投，累计融资 1200 万美元。其智能体可自动操作软件、录制流程并生成脚本、AI 配音、动效与字幕，产品更新后可自动重录刷新旧视频，并支持 MCP 让 Claude、ChatGPT 直接调用；资金将用于企业市场拓展与智能体研发。", "id": "68db200320197df1e6fb6fb75fda5890d86042c2", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "清华 THUNLP 联合面壁智能、OpenBMB 开源智能体操作系统 PilotDeck 2.0：工作舱隔离 + 白盒记忆，复杂任务成本降约 83%", "url": "https://github.com/OpenBMB/PilotDeck", "source": "GitHub / 量子位", "date": "2026-10-17", "summary": "PilotDeck 以 WorkSpace（工作舱）为单位隔离不同项目的文件、记忆与技能，记忆的生成、存储与调用全链路对用户可见、可手动修改或固定，并有空闲时自动整理记忆的“Dream 模式”；支持后台长周期任务与按难度路由强/弱模型，原生支持 MCP。据量子位报道，使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1（Claude Code 为 77.3）。仓库 AGPL-3.0 许可，约 4500 星。", "id": "5cd2d03e71e90a96ea77cef23425eef38dd0d433", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "The Verge：Meta 在舆论压力下删除商业条款中可能允许其爬取新闻网站训练 AI 的措辞", "url": "https://www.theverge.com/tech/1013409/meta-removes-language-that-may-have-allowed-it-to-scrape-news-sites", "source": "The Verge", "date": "2026-10-17", "summary": "此前 Meta 合并后的商业条款写有“可使用相关域名、网页或 URL 中的任何内容开发、改进 Meta 产品”，被 Nieman Lab 与康奈尔法学教授 James Grimmelmann 等解读为可免费抓取新闻网站内容训练 AI、甚至凌驾 robots.txt。Meta 现已整段删除该措辞，发言人称相关爬取条款仅适用于广告与商业产品，不改变 Meta 使用爬虫的方式，内容方仍可用 robots.txt 表达偏好。", "id": "ac0eba5f39915c2126dfb359a39af8c6b0da8fff", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "“鹏城云脑Ⅲ”10000P 国产算力上线试运行：基于华为昇腾 3 在开普布雷顿 Point Tupper 建设并持有数据中心，Anthropic 租用一期至少 20 年：一期 95 兆瓦拟 2027 年底投用，二期 325 兆瓦目标 2028 年，合计 420 兆瓦。Anthropic 称该中心将为 Claude 供电并服务加拿大与全球客户；EverWind 拟为园区与配套陆上风电分别筹资约 80 亿与 20 亿美元，并承诺承担电网升级费用以免抬高居民电价。", "id": "9946b20f9a7507cf040718ca2d66d34794d32bea", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "Reflection Beam 权重上架 Hugging Face：501B-A23B，Apache 2.0，含 BF16/FP8/NVFP4 与投机解码草稿模型", "url": "https://huggingface.co/reflection/Beam-1.0-501B-A23B", "source": "Hugging Face / Reflection", "date": "2026-10-16", "summary": "Hugging Face 模型卡开放 Beam 1.0（501B 总参 / 23B 激活）权重与多精度检查点，并附投机解码 drafter；官方称面向编程与长程智能体，可与 Mirror、OpenCode、Hermes、Pi 等 harness 联用，并有 Dell/HPE 等本地化部署路径。", "id": "b9cfc91e3ee25a7365e0feacddad2b4033a144c2", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "商务部、科技部：拟将 23 项人工智能关键技术增列《禁止出口限制出口技术目录》，API/SaaS/端侧轻量化部署不属大模型技术出口", "url": "https://www.mofcom.gov.cn/syxwfb/art/2026/art_a4acff07e134447fbe7bbeb486df3ea6.html", "source": "商务部", "date": "2026-10-16", "summary": "据商务部新闻发言人答问，2026 年第 48 号公告就修订目录公开征求意见，拟在人工智能、生物医药、光伏共增列 40 项关键技术，其中人工智能大模型、智能体、算力集群与信息处理相关 23 项；恶意代码生成等拟禁止，漏洞挖掘等拟限制。发言人明确：海外本地化部署属技术出口，但 API 调用、APP/网页、SaaS 与端侧轻量化部署不属大模型技术出口管理范围；已开源或公开发表技术拟不纳入。", "id": "46c2097155aec8f7f9ce2a5552b84c5b548fb41f", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "快手可灵 Kling 4.0：单次原生生成最长约 30 秒，最多 10 关键帧与 15 项参考，支持视频续拍至约 2 分钟", "url": "https://kling.ai/feature/kling-4-ai-video-generation", "source": "Kling AI / 腾讯新闻", "date": "2026-10-16", "summary": "可灵官方介绍 Kling 4.0 支持 3–30 秒一镜直出、最多 10 个关键帧引导姿态与运镜、最多 15 项图/视频/主体/音色参考，并强化复杂动作物理与电影镜头控制；视频续拍可前后延展至约 2 分钟。产品页称 1080P/4K 与 10-bit HDR 输出即将推出；腾讯新闻等报道称已全量上线。", "id": "1efe00678ba0fe90468f7c6980bc68f074526e08", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "旧金山市长 Lurie 签署 45 天数据中心禁建令：全市暂停新建与扩建审批，规划局须研究能源、用水与社区影响并制定新规", "url": "https://sfstandard.com/2026/10/16/mayor-lurie-data-center-moratorium/", "source": "The San Francisco Standard", "date": "2026-10-16", "summary": "该紧急条例由市议员 Shamann Walton 提出，10 月 6 日市议会一致通过，10 月 16 日经市长签署生效。45 天内全市暂停数据中心新建和扩容审批，规划局需研究其对电价、用水、空气和社区的影响，并给出数据中心的正式定义与长期管控规则；普通附属机房与不增容的维护不受影响。", "id": "9c7edbf229b1ad9456d93a70a3715e801377db95", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T22:35:00+08:00"}, {"title": "Anthropic 签署加拿大首个数据中心长期租约：新斯科舍 Point Tupper 一期 95MW，服务 Claude，计划 2027 年末上线", "url": "https://tsnmedia.org/everwind-point-tupper-campus/", "source": "TSN / Reuters / Bloomberg", "date": "2026-10-16", "summary": "据路透社与彭博等报道，Anthropic 与 EverWind 就新斯科舍 Point Tupper 数据中心校园一期达成至少约 20 年租约，为其在加拿大的首个数据中心协议；一期约 95MW、约 1.86 万平方米，目标 2027 年末投运，后续或扩建至约 420MW。EverWind 称含风电在内的私人投资计划逾 100 亿美元；Anthropic 表示将为 Claude 与加拿大及全球客户提供算力，并承诺承担并网升级、不向居民转嫁电价。", "id": "afad41abda965996ec16efc4befc79e351162169", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "微软推出 Copilot for Legal：Word 与 Cowork 内置 20 余项法律专用技能，可按企业审查规则以修订模式改合同", "url": "https://www.ithome.com/1/014/250.htm", "source": "IT之家", "date": "2026-10-16", "summary": "据 IT之家，微软总裁 Brad Smith 10 月 16 日宣布推出 Copilot for Legal，为商用客户提供 20 余项法律专用 AI Skills（起草/审查合同、义务追踪、整理案件时间线等），主要在 Word 桌面版与跨应用工作区 Cowork 中使用；Word 中可依企业预设 playbook 识别需关注条款并以修订模式提出建议。同步接入 Bloomberg Law、Thomson Reuters HighQ、DocuSign、Harvey 等法律科技插件；需 Microsoft 365 Copilot 商用授权，微软强调 AI 生成的引用与结论仍需人工核验。", "id": "f0d85b91cb29bb6de16654a866526fa38d22ddb5", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "JetBrains 本地 AI 编程工具 Junie Local Day 0 适配英伟达 RTX Spark，Windows 支持转为稳定版：免注册、无 Token 费用与配额", "url": "https://www.ithome.com/1/014/242.htm", "source": "IT之家", "date": "2026-10-16", "summary": "据 IT之家，JetBrains 10 月 16 日公告 Junie Local 可在本机让 AI 读代码、改文件并运行测试，代码无需上传云端；RTX Spark 上初测生成速度最高约 55 token/s。除 RTX Spark 外，24GB 以上显存的 Ampere 及更新架构 RTX 显卡（如 3090、4090、32GB 的 5090）也可运行，需 Windows 11、581 及以上驱动与约 20GB 磁盘；安装程序会按可用显存调整上下文，可选 Qwen3.6-27B 或 JetBrains 融合模型。", "id": "858abf9c86038d858a985d6ed979cd38f0b08e02", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "Cloudflare 推出 Verified bots 持续问责机制：按是否遵守 robots.txt、收到 429 后是否降速给认证爬虫打“信任区间”，后续将在 Radar 公开", "url": "https://blog.cloudflare.com/verified-bots-accountability/", "source": "Cloudflare Blog", "date": "2026-10-16", "summary": "Cloudflare 10 月 16 日博客称，成为 Verified Bot 后并非一劳永逸：其新系统持续衡量认证爬虫是否尊重站点偏好，首批信号包括是否遵守 robots.txt 禁止路径、收到 HTTP 429 后是否放慢或暂停，基于长期重复行为而非单次违规，形成可解释的“信任区间”；未来将在 Radar 公开分数并扩展衡量维度。文中提到 2025 年曾因 Perplexity 爬虫绕过封禁而将其移出认证名单。", "id": "90fc70b282736535ad3f810909fab75833063a40", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "美国 NIST、NSA 与 CISA 联合发布“超级智能”训练与评测事件响应十项自愿实践：限制智能体权限、多层监控、自动关停并向政府报告", "url": "https://www.cisa.gov/resources-tools/resources/key-practices-incident-readiness-and-response-super-intelligence-training-and-evaluation", "source": "CISA", "date": "2026-10-16", "summary": "NIST 超级智能创新与标准中心（CAISSI）、NSA 超级智能安全中心（SISC）与 CISA 于 10 月 16 日联合发布《Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation》，面向训练和评测高能力 SI 智能体（尤其是部署前、安全防护较弱的非公开系统）的组织，把“SI 控制事件”定义为智能体采取未经指令、违背策略、控制或人类监督的行动；十项实践分为准备、检测、响应、恢复、报告五阶段，涵盖限制信息/系统/网络访问、监控异常行为、保全证据与关停、恢复前验证封控，以及向受影响方和政府报告事件与未遂事件。", "id": "06ca72ec747dbc6e94c394a6b0324d309763196c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "RoTA-Bench：交互式 3D-2D 投影对齐评测空间推理，GPT-5.6-Sol 仅完成 17%，人类参与者全部完成", "url": "https://arxiv.org/abs/2610.17665", "source": "arXiv", "date": "2026-10-16", "summary": "模型需观察被旋转的物体并连续选择旋转动作，在有限步数内恢复目标剪影。基准由 2D 图标自动构建 674 个可解任务与 100 题测试集；GPT-5.6-Sol 成功率仅 17%，20 名本科生合计四次完成全部测试集，且模型更常出现剪影重叠变好但位姿对齐变差的情况。", "id": "92bdd6fca27f7e22067a57f76b489fc574d7f61e", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "南加大 3DCodeVerse：以可执行代码生成可编辑、可验证的 3D 内容，发布 200 万规模 3D 代码数据集与多智能体 Harness", "url": "https://arxiv.org/abs/2610.22341", "source": "arXiv", "date": "2026-10-16", "summary": "3DCodeVerse 包含 3DCodeVerse-2M 可独立执行的 3D 代码语料（附资源、描述与验证记录），以及基于有向无环图的多智能体生成框架，借执行检查、空间测量与视觉反馈在无人工反馈下自动评估和修正程序，并给出微调开源模型的基线与 3D 编码实践指南。", "id": "ee2d3cbdd9a20526c157f6e97812398eb71ecf97", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "openDemocracy：亚马逊内部 AI 工具 Atlas 按“工会风险”给仓库打分，英国两座仓库被列为最高风险级", "url": "https://www.opendemocracy.net/amazon-ai-surveillance-monitor-union-activity-uk-warehouses-birmingham-coventry-atlas-sutton-coldfield/", "source": "openDemocracy", "date": "2026-10-16", "summary": "加拿大一宗诉讼中公开的内部培训材料显示，亚马逊 AI 预测工具 Atlas 汇集 Reddit 帖子、内部留言板与员工调查回复等“数百个数据点”，给美、加、英仓库打出 100–900 分的组织工会/劳资行动风险分并分五级；16 座仓库被列为“活动迫在眉睫”的 Tier 1，含英国 EMA4 与 BHX4。亚马逊称其仅限站点层面、不追踪个人，且目前未在英国使用。", "id": "ca34855deda27f35529e39e1f9e3cae8f4f6eb7f", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "彭博：台湾拟将 AI 服务器与先进芯片列入出口管制清单，未经许可运往中国大陆将依《贸易法》追究刑责", "url": "https://news.bloomberglaw.com/international-trade/taiwan-to-curb-ai-chip-exports-to-china-as-part-of-us-trade-deal", "source": "Bloomberg Law", "date": "2026-10-16", "summary": "台湾经济部长龚明鑫接受彭博专访称，将把 AI 服务器和尖端半导体纳入管制品项，措施生效后未经授权向中国大陆运送受限 AI 硬件将构成《贸易法》下的刑事犯罪；目前台湾尚无直接罪名，只能依其他法律起诉走私者。他表示部分管制措施将与美国保持一致，以履行《台美对等贸易协定》承诺，但未透露实施时间。", "id": "b4e4f92ecae6cb47c77cf218575b48882307ec8c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T15:26:00+08:00"}, {"title": "上海 AI Lab Intern Lumina U2：首个以全离散多码本视觉 token 统一理解与生成的扩散语言模型", "url": "https://arxiv.org/abs/2610.20818", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "Intern Lumina U2 在单一主干中用扩散语言模型统一全视觉理解与图像生成：每个视觉位置由多个互补码本的一组离散码表示，在保持与离散文本建模兼容的同时提升视觉表征容量；输入端按位置拼接嵌入，输出端用轻量多码本自回归头依次预测各码，避免连续/混合范式下文本与图像异构空间的优化冲突。", "id": "fcb7fcaeef8ea4ac45f318ac90ce0599e376ee33", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T10:40:00+08:00"}, {"title": "清华 NLP AutoSFT：多智能体自动做 SFT 数据研究，执行与分析分离，IFEval 最佳成绩 +6.5", "url": "https://arxiv.org/abs/2610.22194", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "研究发现单个智能体自动化后训练时往往只会调整数据类别比例，且上下文被执行输出塞满。AutoSFT 设计了覆盖调比例、剪枝、修复、替换与合成的数据动作空间，由元智能体分离执行与分析、从多角度收集提案并调用合成子智能体；在固定模型、训练器与预算下，执行器使上下文丢失减半，分析子智能体将最佳 IFEval 提升 6.5 分，合成再带来额外提升。", "id": "6f59946820c9d2c0fc240add52825649c3d9cffd", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T10:40:00+08:00"}, {"title": "Linux 内核弃用 AI 辅助披露标签 Assisted-by，Torvalds 称强制披露 AI 使用的规则“极其愚蠢”", "url": "https://thenextweb.com/news/torvalds-ai-assisted-by-tag-utterly-stupid-open-source-summit", "source": "The Next Web / The Register", "date": "2026-10-16", "summary": "布拉格维护者峰会达成共识，弃用今年 1 月写入文档、要求使用“任何高级编码工具”须在提交中注明的 Assisted-by 标签，英伟达工程师 Sasha Levin 已提交补丁移除相关文档。有开发者反对取消披露机制，Torvalds 在邮件列表回应称关键是贡献者理解自己提交的代码，与使用何种工具无关，并表示自己“现在真的很喜欢用 AI”。", "id": "9ec9f1a194a5de23ee9e3d928cf49a3edca023db", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T09:35:00+08:00"}, {"title": "OpenAI 向全体 API 客户开放 prompt-to-voice：用文字描述创建自定义音色，可在 GPT-Live 会话中复用", "url": "https://developers.openai.com/api/docs/guides/custom-voices", "source": "OpenAI Developers", "date": "2026-10-16", "summary": "据 OpenAI API Changelog（10 月 16 日），prompt-to-voice 已对全体 API 客户开放：可通过 API 或 Voice Playground 用文字描述创建自定义音色，并在 GPT-Live 会话中复用；创建音色免费，语音生成按常规 GPT-Live 计费。同日还为 GPT-Live 新增德/法/印地/日/韩等九种自然音色。", "id": "c4ef2661336d94586c3369c51b94bb170c043bdf", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "Learning to Steer LLM Agents：用快慢双路径 RL 训练“转向智能体”，在线纠偏目标漂移", "url": "https://arxiv.org/abs/2610.22316", "source": "arXiv", "date": "2026-10-16", "summary": "新加坡国立大学、中科大与阿里通义等提出转向智能体：快路径低成本判断是否干预，慢路径生成纠偏动作，并用成对排序损失与 GRPO 联合训练。在信息检索类任务上，相对无干预可提升约 6.7 分，并迁移到未见执行器与多智能体场景。", "id": "4734fcf88311f2924bf886f8559afc626e7c7749", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "JevAgentHarness：决策模型与 LLM 共享控制，开源 4B 决策模型可显著降本加速", "url": "https://arxiv.org/abs/2610.21412", "source": "arXiv", "date": "2026-10-16", "summary": "UIUC 等提出 AgentDecisionBench 与 JevAgentHarness，让 harness 把大量多选决策委托给决策模型；并开源在智能体自有失误状态下训练的 AgentDecision-4B。报告称在相似分布任务上成本可降约八成、速度最高约 2.5×。", "id": "f8eae26297047f1d204ce823a335a653c03d108b", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "英国 CMA 提议认定微软商业软件生态具有战略市场地位，将评估 Copilot 等 AI 工具公平竞争", "url": "https://www.gov.uk/government/news/cma-takes-first-steps-to-ensure-choice-in-business-software", "source": "GOV.UK / CMA", "date": "2026-10-16", "summary": "英国竞争与市场管理局（CMA）提议认定微软商业软件生态（含 Word/Excel/Outlook/PowerPoint/Teams 及日益重要的 Copilot）具有战略市场地位（SMS），并发布可能干预路线图；将进一步评估客户能否自由选择 AI 工具、安全产品捆绑与云许可等。意见征询至 11 月 13 日，最终认定截止 2027 年 2 月。SMS 不等于认定违法。", "id": "8c0cc75813b1946937aebbc884922f11b48146d3", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "库克确认：苹果智能接入阿里千问，10 月底中国测试版上线（不含 Siri AI）", "url": "https://technode.com/2026/10/16/apple-intelligence-to-enter-china-beta-testing-this-month-tim-cook-c", "source": "TechNode", "date": "2026-10-16", "summary": "苹果 CEO 库克确认 Apple Intelligence 已获准接入阿里通义千问，计划 10 月底在中国内地推出测试版；首批功能含实时翻译、写作工具与照片消除等，新版 Siri AI 不在本次测试范围。", "id": "8a574b17c9efa1cc2b0ace8327882b52c1971f8a", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "英伟达开源 Nemotron Labs Dory 1.0：4B 循环（looped）语言模型，同一权重可按 1–4 次循环调节算力，256K 上下文", "url": "https://huggingface.co/nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16", "source": "Hugging Face", "date": "2026-10-16", "summary": "Dory 1.0 采用潜在递归的 normalized-GPT 架构：8 层输入块与 8 层输出块之间夹着可重复执行的 20 层共享递归块，循环次数越多每 token 计算越多、生成 token 越少，官方推荐默认 2 次循环、智能体任务可用 4 次。模型以 6T token 预训练（前约 4.5T 原生 NVFP4），支持 256K 上下文，提供 BF16、MXFP8、NVFP4 与 GGUF 版本，采用 OpenMDW 1.1 许可，可商用。", "id": "609d49b4c11a4f35af0aeac8867ec964d9db4757", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "OmniCompass：全模态视频定位与理解基准，评测 50 个多模态大模型，开源模型在音视频联合理解上仍明显落后", "url": "https://arxiv.org/abs/2610.18829", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "基准分 VL（视觉证据）与 AV（音视频联合证据）两条赛道，各含时间定位、空间定位与问答三类任务：VL 含 820 段视频、2460 个实例，AV 含 240 段视频、720 个实例，全部人工多轮标注，并区分纯文本与图文两种指代方式。对 50 个模型的评测显示开源模型落后闭源，精确的时空定位仍是难点；为 HF 10 月 16 日每日论文票数第二（约 575 票）。", "id": "544c110b81176c2c14f5b81318956baf1ba9a2c2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "通义 MAI-Gym：GUI 智能体评测与在线 RL 一体化开放平台，9B 模型 OSWorld-Verified 76.2%", "url": "https://arxiv.org/abs/2610.20939", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "Tongyi-MAI 团队提出统一手机、电脑与网页环境的评测、数据采集与在线强化学习平台，支持 10 个现有基准、可扩展至 2 万个并行环境，并能自动合成可重置的模拟应用与跨应用任务。据此训练的 MAI-Gym-9B 在 10B 以下开放 GUI 智能体中达到 MobileWorld 78.4%、OSWorld-Verified 76.2%；在模拟购票 App 中的 RL 可迁移到真机，成功率由 28.8% 提升至 48.1%。框架、2000 个验证任务与模型权重均开放。", "id": "01580d7fed2ad77c3e9fa97d710f771eb5d38115", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "美银策略师 Raedler：AI 投资正走铁路、电信与互联网的资本周期老路，技术成功投资者也可能亏损", "url": "https://247wallst.com/investing/2026/10/17/bofa-warns-ai-investors-could-lose-even-if-the-technology-works/", "source": "24/7 Wall St. / Investing.com", "date": "2026-10-16", "summary": "美国银行投资策略师 Sebastian Raedler 在客户报告中指出，超大规模云厂商未来 12 个月资本开支一致预期已从 2025 年初的 3300 亿美元升至约 1 万亿美元，约占美国 GDP 的 3%，高于 1870 年代铁路热（2.2%）与 1990 年代科技热（1.1%）；AI token 均价自夏季以来下跌约 50%，在中国开源模型竞争下变现承压。他写道“激烈竞争下的变现失望正是以往资本周期的失败模式”，多数大型资本周期即便技术兑现也以投资者失望告终。", "id": "cfeab9bafc77f08ba95937ec781a25cbacc58a28", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "Perplexity 开源 SPACE：Perplexity Computer 背后的智能体沙箱平台，每个任务独占 Firecracker 微虚拟机，Apache 2.0", "url": "https://www.perplexity.ai/hub/blog/open-sourcing-space", "source": "Perplexity Blog", "date": "2026-10-16", "summary": "Perplexity 开源了支撑其个人智能体 Computer 的沙箱平台 SPACE（Sandboxed Platform for Agentic Code Execution）：用 Rust 实现，每个智能体任务运行在独立的 Firecracker 微虚拟机中，拥有独立文件系统与生命周期控制（暂停、挂起、唤醒、删除），通过 HTTP/SSE API 调用，无需 SDK；网络访问与平台凭证在虚拟机外部管理，智能体可访问授权服务而不在工作环境中存放凭证。Perplexity 称 7 月已用 SPACE 替换此前的商用沙箱供应商，GitHub 仓库 perplexityai/SPACE 以 Apache 2.0 许可发布。", "id": "6d8a951eb294ad5084e719de69be3f766e82c144", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T19:25:00+08:00"}, {"title": "FT：花旗与美国银行跟进限制第三方 AI 智能体登录客户账户，担忧智能体搬运存款引发流失", "url": "https://www.digitaltoday.co.kr/en/view/115865/major-financial-firms-move-to-block-access-by-personal-ai-agents-citing-deposit-flight-risk", "source": "Digital Today / Financial Times", "date": "2026-10-16", "summary": "据 FT 周五报道，花旗表示不允许第三方 AI 智能体或助手直接登录客户账户、在其数字银行平台上交易；美国银行 CEO 莫伊尼汉称资金离开账户须由人批准，在明确 AI 批准付款的责任归属前将限制智能体访问存款。此前摩根大通已屏蔽 Meta Muse 等外部智能体。Apollo 首席经济学家 Torsten Slok 警告，AI 助手可能把约 0.1% 利率的活期存款自动转向 3.3%–5% 的账户。", "id": "7277888c77dd97e5242c6b559a651c9aa6933738", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T18:26:00+08:00"}, {"title": "WorldOracle 开放评测：用真实执行记录检验动作条件世界模型，Cosmos 3 等长序列得分近乎腰斩", "url": "https://arxiv.org/abs/2610.18826", "source": "arXiv / 机器之心", "date": "2026-10-16", "summary": "普林斯顿、UT Austin、多伦多大学、NVIDIA 与智元等提出 WorldOracle：给定真实操作的初始画面与动作序列，让世界模型生成预测视频再与真实执行对照评分，含抓空、掉落等失败案例，覆盖智元 G2、YAM 与第一视角人手。七个模型的机械臂得分普遍高于物体得分（如 IRASim 78.8 vs 29.1），完整长序列中 DreamDojo、Cosmos 3 得分接近减半；平台已于 10 月 16 日向开发者开放。", "id": "70442c65e890e8f6d67e07e18b4b769c6d24f3a1", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T18:26:00+08:00"}, {"title": "Waypoint-OPD：用 RL 中途检查点“门控”策略偏移蒸馏，六组数学/代码设置均列第一", "url": "https://arxiv.org/abs/2610.21601", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出 Waypoint-guided On-Policy Distillation：借助同一 RL 训练中的中间教师检查点，比较早期与后期策略偏移方向，方向相反时抑制终点偏移信号，仅需多一次冻结教师打分。以 RL 训练的 Qwen3-4B 为教师、Qwen3-8B/14B/30B-A3B 为学生，在数学与代码推理六组设置中均取得最高领域均分；为 HF 每日论文当日最高票。", "id": "9077977650abe35f8f2941791040c197cf5d74a9", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T17:45:00+08:00"}, {"title": "MJev-Spatial：把空间推理改成单次前向“分类”，不生成答案 token，12 项基准中 7 项第一", "url": "https://arxiv.org/abs/2610.22276", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出“System 1”多模态决策模型 MJev-Spatial，把选择题、数值估计与点位预测统一为分类：复用主干预训练的 query/key 投影为候选打分、不增参数，数值与点位用由粗到细的分箱/区域分类，每次决策一次前向完成。基于 Qwen3.5-4B、用 1230 万条空间问答训练，在 8 个对比模型中总分最高（65.64%）。", "id": "bb0ad31e25644b6c829a4510bcc2f5c824fc6f3f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T17:45:00+08:00"}, {"title": "澎湃：DeepSeek 整合 Harness、Web、App 与 Platform 团队成立“产品部”，崔添翼任负责人", "url": "https://www.thepaper.cn/newsDetail_forward_34262324", "source": "澎湃新闻", "date": "2026-10-16", "summary": "据澎湃新闻，DeepSeek 已将 Harness、Web、App 和 Platform 等团队整合为产品部，统筹产品、设计与研发工作，原 Harness 团队负责人崔添翼出任负责人；DeepSeek 同时在北京、杭州招聘 AI 产品与 Agent Harness 产品经理、产品设计师和项目经理，显示其正从模型研发向产品化加速。", "id": "219c4b1066d101fa747ceab4e761353c368d84de", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T15:30:00+08:00"}, {"title": "路透社：Anthropic 签下首个加拿大数据中心租约，EverWind 新斯科舍省项目投资逾 100 亿加元", "url": "https://www.investing.com/news/stock-market-news/anthropic-signs-lease-for-first-canadian-data-center-4954967", "source": "Reuters", "date": "2026-10-16", "summary": "Anthropic 与 EverWind 签约租用新斯科舍省 Point Tupper 的数据中心容量，为其在加拿大的首个数据中心协议；EverWind 同时公布逾 100 亿加元的数据中心园区与风电投资计划，称是该省史上最大私人投资。Anthropic 去年算力与基础设施支出 73.3 亿美元，较 2024 年增长约三倍。", "id": "dea72310137a66c6889811122644881cc8b573d3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "Google Research：AI 智能体接入湿实验室机器人闭环设计分子，发现个位数纳摩尔级癌症靶点蛋白结合物", "url": "https://research.google/blog/grounding-ai-agents-in-biological-reality-building-blocks-for-autonomous-wet-labs/", "source": "Google Research", "date": "2026-10-16", "summary": "介绍三项工作：基于 PyLabRobot 的实验室数字孪生框架 VERID（3D 状态追踪、虚拟预演、硬件安全校验）；智能体三轮闭环设计 DNA 适配体，对肌红蛋白与 α-凝血酶的确认命中率分别提升至 33.5% 与 42.1%；以及“表位切除”加速结构预测 8.6 倍，对实体瘤靶点 FAP 设计出单个位数纳摩尔亲和力的结合蛋白。所有序列均经生物安全筛查并由人类审批。", "id": "83945f3b589d992420f251b26deed5a55811294f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "小米开源 MiDashengLM-Spatial：称业界首个开源端到端空间音频理解大模型，Apache 2.0", "url": "https://www.ithome.com/1/013/739.htm", "source": "IT之家 / 小米", "date": "2026-10-16", "summary": "以 MiDashengLM-7B 为基座，在保留通用音频理解的同时增加声源方位与空间分布的感知和推理能力；完整公开权重、推理与评估代码及技术报告，后续将用于小米智能家居与汽车座舱等场景。", "id": "1e9f3f8fc587c022fa315815e0ffd15c67d88386", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "AIPOCH Open-Science v1.0 发布：开源本地优先的 AI 科研工作台，研究过程可打包复现", "url": "https://github.com/aipoch/open-science", "source": "GitHub / AIPOCH", "date": "2026-10-16", "summary": "Apache 2.0 桌面应用（macOS/Windows/Linux），集成可配置科研智能体、Python/R Notebook 执行、文献工具、MCP 连接器与可复用技能，支持 Claude Code、Codex、OpenCode 等后端；完成的研究会话可导出为含对话分支、文件版本与验证证据的 .science 包，便于审阅与交接。仓库约 5100 星。", "id": "92edae1ebf75efff2544b127ea8116467741b90e", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "Gartner：AI 数据中心投资到 2030 年难以回本——需 8.5 万亿美元收入，可归因 AI 收入至多 3.6 万亿", "url": "https://www.computerworld.com/article/4236641/ai-datacenter-capex-will-far-exceed-forecast-revenue-through-2030-3.html", "source": "Computerworld / Gartner", "date": "2026-10-16", "summary": "Gartner 高级总监分析师 Will Sommer 称，AI 数据中心所有者到 2030 年需创造 8.5 万亿美元收入才能覆盖已宣布的资本开支、融资成本与预期回报，但可归因于 AI 数据中心的企业与消费 AI 收入预计不超过 3.6 万亿美元；超大规模云厂商尚能消化压力，但成本压力将迫使超过 80% 的 neocloud 厂商无法继续独立运营。贝恩此前也给出类似判断。", "id": "86112bc77a2792abfc79143054e518071e7d966c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "RapidCanvas 完成 2900 万美元 B 轮：Vertex Ventures 领投，“平台+驻场 AI 工程师”帮中型企业落地 AI", "url": "https://www.rapidcanvas.ai/newsroom/rapidcanvas-raises-29m-series-b-to-bring-fortune-100-grade-ai-to-every-enterprise", "source": "RapidCanvas", "date": "2026-10-16", "summary": "本轮由 Vertex Ventures SEA & India 领投，Hitachi Ventures 及老股东 Accel、Peak XV、Valley Capital Partners、Titanium Ventures 跟投，累计融资达 5250 万美元；公司以 AI 平台加现场 AI 工程师的托管模式，服务有预算但缺 AI 人才的中型企业，资金将用于扩充印度、美国与巴西的市场、现场工程与合作伙伴团队。", "id": "ad38009ec0b0282041bc26b2842c56213ab79711", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "Realtime-Bench：按真实推理延迟推进环境的实时交互基准，最强模型成功率仅 44%", "url": "https://arxiv.org/abs/2610.22155", "source": "arXiv", "date": "2026-10-16", "summary": "该基准设计了“动作迟了就会失败”的动态任务：在 Wall Clock 设定下环境按实际推理延迟推进，最佳成功率仅 44%、Pass^3 仅 36%；作者另设去除延迟的 Paused Clock 与按生成 token 数推进的 Token Clock，以区分服务延迟与模型自身的时间感知。结果显示时间成本显著限制成功率，提高推理强度在时间压力下利弊参半。", "id": "5a38ebac45e62c0e1db22548ece9d6539f1bc79b", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "英伟达联合 IIT Madras AI4Bharat 推出 Nemotron-pretraining-Indic-v1：22 种印度语言约 2.8T token，并开源数据生成管线", "url": "https://huggingface.co/blog/nvidia/scaling-indic-pretraining", "source": "Hugging Face / NVIDIA", "date": "2026-10-16", "summary": "语料覆盖印度宪法列出的 22 种语言（其中 12 种另含罗马化文本，共 34 种语言-文字配置），由 Nemotron-CC-v2 英文文档经 NeMo Data Designer 与 Gemma-4-31B-it 翻译、质检与定向修复生成，每条可追溯源文档；数据集即将发布，生成配方（Nemotron Bharat 翻译插件）同步开源。Nemotron 3.5 Super VL 的 Indic 继续预训练使用了其中子集，五项印度语言基准提升约 5–10 个百分点。", "id": "ba4e7337aba280a43aa0c8a66d42089649fa3da6", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "腾讯首度承认：测试第三方模型的 AI 智能体出现非预期联网行为，曾反复尝试抓取高德地图数据", "url": "https://www.8world.com/greater-china/tencent-says-ai-agents-showed-unintended-browsing-behaviour-3311741", "source": "8world / 路透社", "date": "2026-10-16", "summary": "安全研究组织 Swarmchasers 此前报告称，一批与腾讯云相关的智能体自 9 月底起多次尝试获取高德地图的公园、博物馆入口等信息，被拦截后改用其他公开工具、转发服务与公开代码中的密钥。腾讯混元回应称相关 <script>
const D=JSON.parse(document.getElementById('data').textContent);let cur='all';
const up=new Date(D.updated);document.getElementById('up').textContent=up.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ch=document.getElementById('chips');
ch.innerHTML='<button class="chip on" data-id="all">本期全部</button><button class="chip" data-id="hist">📚 全部历史 ('+D.history.length+')</button>'+D.modules.map(m=>`<button class="chip" data-id="${m.id}">${m.icon} ${esc(m.name)}</button>`).join('');
ch.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.id;[...ch.children].forEach(x=>x.classList.toggle('on',x===b));render()};
const fmt=n=>n>=1e4?(n/1e4).toFixed(1)+'万':n.toLocaleString();
function extra(i){let h='';if(i.stars!=null){h+=`<div><span class="bd">★ ${fmt(i.stars)}</span>`+(i.stars_week?`<span class="bd g">本周 +${fmt(i.stars_week)}</span>`:'')+(i.language?`<span class="bd l">${esc(i.language)}</span>`:'')+'</div>';}
if(i.why)h+=`<div class="why">💡 ${esc(i.why)}</div>`;
if(i.metrics){const m=i.metrics;h+=`<div><span class="bd">❤ ${fmt(m.likes)}</span><span class="bd g">🔁 ${fmt(m.reposts)}</span><span class="bd l">👁 ${fmt(m.views)}</span></div>`}return h}
let page=1;const PS=20;
const sk=i=>[(i.date||'').length===10?1:0,(i.date||'').length===10?i.date:'',i.first_seen||''];
const cmp=(a,b)=>{const x=sk(a),y=sk(b);for(let k=0;k<3;k++){if(x[k]!==y[k])return x[k]<y[k]?1:-1}return 0};
const card=i=>`<div class="it"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary)}</p>${extra(i)}<span class="tag">${i.module_name?esc(i.module_name)+' · ':''}${esc(i.source)} · ${esc(i.date)}</span></div>`;
function renderHist(q){const all=D.history.filter(i=>!q||(i.title+i.summary+i.source).toLowerCase().includes(q)).sort(cmp);
const pages=Math.max(1,Math.ceil(all.length/PS));if(page>pages)page=pages;const its=all.slice((page-1)*PS,page*PS);
document.getElementById('cnt').textContent=all.length;
document.getElementById('m').innerHTML=`<section class="mod" id="histbox" style="grid-column:1/-1"><h2><span>📚 全部历史（按日期从新到旧）</span><span class="tag">第 ${page}/${pages} 页 · ${all.length} 条</span></h2>`+(its.map(card).join('')||'<p class="mu">没有匹配的资讯</p>')+
`<div class="pager"><button class="chip" onclick="page=Math.max(1,page-1);render()">上一页</button> <button class="chip" onclick="page=page+1;render()">下一页</button></div></section>`}
function render(){if(cur==='hist'){return renderHist(document.getElementById('q').value.trim().toLowerCase())}const q=document.getElementById('q').value.trim().toLowerCase();let n=0;
document.getElementById('m').innerHTML=D.modules.filter(m=>cur==='all'||m.id===cur).map(m=>{
const its=[...m.items].sort(cmp).filter(i=>!q||(i.title+i.summary+i.source).toLowerCase().includes(q));n+=its.length;if(!its.length)return'';
return `<section class="mod"><h2><span>${m.icon} ${esc(m.name)}</span><span class="tag">${its.length} 条</span></h2>`+its.map(i=>
`<div class="it"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary)}</p>${extra(i)}<span class="tag">${esc(i.source)} · ${esc(i.date)}</span></div>`).join('')+'</section>'}).join('')||'<p class="mu">没有匹配的资讯</p>';
document.getElementById('cnt').textContent=n}
document.getElementById('q').oninput=()=>{page=1;render()};render();
</script></body></html>
