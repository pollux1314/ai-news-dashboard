轮，First Round 与 Bessemer 联合领投；从测绘硬件转型为把激光扫描数据自动转成工程图纸", "url": "https://techcrunch.com/2026/10/21/mach9-raises-34m-after-pivoting-to-ai-cad-software/", "source": "TechCrunch", "date": "2026-10-21", "summary": "Mach9 自研模型把影像与激光点云转成厘米级精度的测绘几何（路缘、标线等），先生成初稿再由工程师修订；私测阶段近 100 家客户、超 2500 个项目，称比 Autodesk、Bentley 等传统软件流程快约 10 倍。"}, {"title": "谷歌云与英伟达宣布基于 Vera Rubin NVL72 的 A5X 实例下月正式可用：计划扩展至多达 96 万张 Rubin GPU，David Silver 创办的 Ineffable Intelligence 成首个客户", "url": "https://blogs.nvidia.com/blog/google-cloud-vera-rubin-infrastructure/", "source": "NVIDIA Blog", "date": "2026-10-21", "summary": "A5X 集成 Vera Rubin NVL72、ConnectX-9 SuperNIC、谷歌 Virgo 网络与第四代液冷，面向智能体推理与大规模强化学习，后续扩展到欧洲；谷歌云还将在 A4X Max 裸金属上提供机架级英伟达机密计算，并在 RTX PRO 6000 的 G4 VM 上正式推出机密计算。"}, {"title": "Fortune 独家：AI 代码测试/CI 基础设施公司 Blacksmith 完成红杉领投 6600 万美元 C 轮，估值 10 亿美元，两个月内估值近翻倍", "url": "https://fortune.com/2026/10/21/exclusive-ai-code-testing-startup-blacksmith-hits-1-billion-valuation-as-ai-written-code-surges/", "source": "Fortune", "date": "2026-10-21", "summary": "AI 写代码激增让瓶颈转向验证：Blacksmith 客户超 1 万家（8 月约 5000 家），每周校验任务从年初 500 万次增至 9000 万次，ARR 增长 17 倍、达数千万美元；公司自购数万台服务器部署在全球数据中心，新资金主要用于采购算力。"}, {"title": "WIRED：OpenAI 创投基金与 Founders Fund 参投脑机接口公司 Coherence Neuro 4500 万美元种子轮，用 AI 解码脑肿瘤电信号并以电刺激抑制肿瘤生长", "url": "https://www.wired.com/story/openai-startup-brain-implants-detect-cancer/", "source": "WIRED", "date": "2026-10-21", "summary": "Coherence 已在澳大利亚皇家墨尔本医院对 3 名脑瘤手术患者短时测试植入物记录能力，下一步在 7 名患者中测试记录与刺激，新资金将用于胶质母细胞瘤长期植入临床试验；公司称 OpenAI 无权访问其脑数据。"}, {"title": "英伟达发布 DSX POD：由合作伙伴在工厂内把 Vera Rubin AI 工厂整体装进模块化集装箱并预先验证，现场部署时间从约 6 个月缩短到最快 14 天，2027 年初交付", "url": "https://www.globenewswire.com/news-release/2026/10/21/3385267/0/en/nvidia-introduces-dsx-pod-ai-factories-to-accelerate-europe-s-infrastructure-deployment.html", "source": "NVIDIA / GlobeNewswire", "date": "2026-10-21", "summary": "计算、网络、布线、机架级供电与液冷都在工厂完成集成和功能验证，运到已备好电力、冷却与网络的场地即可接入。参与方包括 Anduril、Bull、Crusoe、戴尔、HPE、联想、富士康、广达、施耐德电气、Vertiv、纬创等。英伟达同日公布 DSX 平台欧洲进展：闭环液冷加干冷器可让设施冷却用水接近零，DSX MaxLPS 软件可用约少 30% 的电力产出同等 token，CoreWeave、Google Cloud、Lambda、Nebius、Nscale 等正在评估。"}, {"title": "Bolt 选用英伟达 Alpamayo 自动驾驶软件栈推进欧洲 Robotaxi：计划在欧洲部署至少 2.5 万辆基于 Hyperion 平台、具备 L4 能力的未来 Lucid 车型，2027 年起在马德里采集路测数据", "url": "https://www.globenewswire.com/news-release/2026/10/21/3385334/0/en/european-mobility-leaders-build-safe-vehicles-and-robotaxi-fleets-on-nvidia-hyperion.html", "source": "NVIDIA / GlobeNewswire", "date": "2026-10-21", "summary": "GTC Berlin 上，英伟达称大众商用车 ID. Buzz AD、Einride 自动驾驶卡车也基于 Hyperion，沃尔沃采用 Hyperion 与 Alpamayo Stack，奔驰与英伟达合作的 MB.DRIVE ASSIST PRO 城市点到点辅助驾驶即将在德国获批。英伟达还推出 Halos SAFE 安全评估框架（dSPACE、TÜV 莱茵等参与）、2B 参数车端推理模型 Alpamayo 2 Edge（跑在 DRIVE AGX Thor 上，10Hz），以及 2027 年初开放的 Alpamayo Agentic Factory 蓝图；Bolt 的测试仍需监管批准，德国为后续优先市场。"}, {"title": "戴尔 CEO 迈克尔·戴尔：手握约 950 亿美元未交付 AI 服务器订单、创历史新高，瓶颈在内存，预计 2027 年短缺进一步恶化，2029–2030 年才有显著新增产能", "url": "https://www.ithome.com/1/015/654.htm", "source": "IT之家（援引《华尔街日报》）", "date": "2026-10-21", "summary": "他在接受《华尔街日报》采访时表示，AI 加速芯片消耗大量 HBM，配套服务器仍依赖传统 DRAM，新建内存厂约需四年。这一判断与美光（2027–2028 年供应更紧）和 SK 海力士（短缺持续至 2030 年）的说法一致；戴尔应对方式是临近组装再采购 DRAM 并签长期供货协议，去年底已把 PC 提价 15%–20%。"}, {"title": "韩媒：英伟达下一代 Groq LPU 推理芯片拟改用 TSV 工艺 3D 堆叠 DRAM，放弃当前的大容量 SRAM 方案", "url": "https://www.ithome.com/1/015/760.htm", "source": "IT之家（援引 ZDNET Korea）", "date": "2026-10-21", "summary": "现款 Groq LPU 依靠片上大 SRAM 实现快速解码，但 SRAM 容量小、先进制程的密度收益有限，在大模型支持与芯片迭代上存在局限。同样走大 SRAM 路线的 Cerebras 此前也已预告 CS-6 将首次 3D 垂直集成 DRAM。该消息为媒体报道，英伟达未置评。"}]}, {"id": "research", "name": "研究与论文", "icon": "📄", "items": [{"title": "MMEnterprise-Bench：企业智能体在“不断演化的多模态工作记录”上的问答基准，1613 题覆盖证据推理、冲突消解与不可回答识别，最强模型遇跨源/时间冲突仍明显吃力", "url": "https://huggingface.co/papers/2610.27911", "source": "arXiv / Hugging Face", "date": "2026-10-21", "summary": "题目来自模拟协作项目中被反复分享、修正的文档、聊天与图表；评测 10 个闭源与开源多模态模型发现，加大检索预算或换更大检索器能提高证据召回，但并不稳定转化为更高的答题准确率。"}, {"title": "“好判断、坏建议”：给 Claude Sonnet 5.5 终端智能体加决策小模型控制器，成本每次尝试反升 19%、通过率不变（均 73%）", "url": "https://huggingface.co/papers/2610.24649", "source": "arXiv / Hugging Face", "date": "2026-10-21", "summary": "预注册研究在 Terminal-Bench 2.1 的 21 个留出任务（315 次试验）上只换控制器：无、规则、Claude Haiku 5.5、决策模型 Jev 与安慰剂。Jev 离线判断“是否完成”排序更好（AUROC 0.78），但校准差，常让智能体复核本已正确的工作，信息量高的决策信号并未变成有用干预。"}, {"title": "Simular 提出 Agent S4“进化式智能体接口”：元智能体从轨迹中自动构建与修订操作接口，Qwen3.8-27B 在 OSWorld V2 达 21.3% 刷新开源 SOTA，高于 GPT-5.5 与 Claude Opus 4.8", "url": "https://arxiv.org/abs/2610.28601", "source": "arXiv", "date": "2026-10-21", "summary": "作者认为接口设计本身应成为智能体能力：元智能体在无成功标签的合成任务上分析执行轨迹，构建接口与使用知识库，再用种群进化按未见验证任务表现筛选；同模型成绩是固定接口时的 3.8 倍，成本约为 GPT-5.5 的 4.3%、Opus 4.8 的 1.5%，ScienceBoard 成功率由 41.4% 升至 58.6%。"}, {"title": "爱丁堡大学等发现视觉语言模型存在“逆缩放”：19 个模型、55.8 万次评测中找出 375 组大模型反而答错小模型能答对的子任务，多图空间推理与视觉感知最明显", "url": "https://arxiv.org/abs/2610.27360", "source": "arXiv", "date": "2026-10-21", "summary": "研究覆盖 4 个模型家族、8 个多模态基准，共 4342 道“小模型对、大模型错”的题目，13 个子任务-数据集组合跨家族复现，说明现象由任务驱动而非特定模型；部分差距超过 20 个百分点，图表理解相对不受影响。"}, {"title": "AuthorizationBench：首个“授权对齐”智能体基准，286 个源自真实案例的可执行任务、6864 条轨迹显示智能体有 19.2% 的情况越权行事，提高推理强度几乎无改善", "url": "https://arxiv.org/abs/2610.27548", "source": "arXiv", "date": "2026-10-21", "summary": "研究者指出现有评测只看任务完成或有害后果，会漏掉“未造成传统伤害但超出用户授权”的行为。基准覆盖十个应用领域，在可观察授权内外路径的沙箱中，用 4 个模型、2 档推理强度和 3 种智能体外壳运行；越权率在 24 种配置间介于 10.5% 到 26.6%，且任务完成并不意味着守住授权。"}, {"title": "“更强的 AI 突破会加速自身枯竭”：分析 36 年计算机科学 720 万篇论文、7.3 万份评审与 370 万研究者，发现 Transformer 之后领域扩张但注意力急剧收窄", "url": "https://arxiv.org/abs/2610.27296", "source": "arXiv", "date": "2026-10-21", "summary": "论文认为突破依赖多样化的研究注意力，而集体扎堆会耗尽这种多样性：超过一半转换方向的研究者涌入 AI（以中期职业者为主），评审信心在 5 分制上下降整整 1 分；从 AlexNet 到大模型，每次突破都抬高了领域的“想法容量”，但随后想法枯竭更快，结构生物学在冷冻电镜与 AlphaFold 后也出现同样周期。"}, {"title": "“记忆越多、智能体越差”：印第安纳大学指出经验记忆中的“错误再生产”——存下来的规则/技能一旦有错，会经执行与再抽象循环反复复现，提出“反持久化”记忆设计", "url": "https://arxiv.org/abs/2610.27406", "source": "arXiv", "date": "2026-10-21", "summary": "作者发现，智能体把从轨迹中归纳的规则、摘要与技能长期保存再复用时，错误不仅被直接检索复用，还会塑造新的执行轨迹、再被抽象成新知识，从而远超原始错误的存续时间。Anti-Persistence 只累积原始轨迹与结果，按需临时合成任务指导、用后即弃，由自适应选择器依据过往结果决定是否以及如何合成。跨多个基准与骨干模型，它取得最高的留出集成功率与最低的平均 LLM 调用成本。"}, {"title": "通义 Qwen-Character 团队提出 HarnessRL：让训练“外壳”与策略共同进化，按奖励失效原因动态调整任务采样、rollout 引导与评分细则，开放式 RL 提升约 3 分并减半训练步数", "url": "https://arxiv.org/abs/2610.26426", "source": "arXiv", "date": "2026-10-21", "summary": "论文指出基于 rubric 的开放式强化学习常出现两类失效：分数塌缩到全高或全低的“无区分度奖励”，以及分高不等于回答好的“虚假奖励”。HarnessRL 维护训练期记忆，演化器把每次奖励失效归因到相应接口，再由提议者与“即时评审”循环生成更新，评审须在当前冻结策略上实测有效才接受。在新构建的医疗、科学、写作、角色扮演、指令遵循五领域 Rubric-Mix-10k 上，4B 与 9B 模型均比最强基线高 2.8–3.1 分，代码与数据已开源。"}]}, {"id": "opensource", "name": "开源与工具", "icon": "🛠️", "items": [{"title": "英伟达发布 OpenShell 参考架构：以开源 OpenShell 安全运行时为基础，Vera Rubin 跑推理、Vera CPU 跑智能体外壳、BlueField-4 上的 Sentry 做芯片级越界隔离，Anthropic、OpenAI、微软、谷歌云等参与", "url": "https://nvidianews.nvidia.com/news/openshell-reference-architecture", "source": "NVIDIA Newsroom", "date": "2026-10-21", "summary": "英伟达称智能体若试图越出软件边界，Sentry 可在毫秒级隔离并叫停；架构支持 Canonical、红帽、Windows 与微软执行容器，并延伸到 RTX Spark、DGX Spark、DGX Station 等边缘设备。黄仁勋：“智能体在 Rubin 上思考、在 Vera 上行动、在 BlueField 上被治理。”"}, {"title": "英伟达扩展 Isaac 开放机器人平台：Isaac Lab 3.0 正式可用、开源实时运行框架 Isaac OS，Hugging Face 上线 2000+ 仿真资产库与 Human 1M 数据集，Agile Robots 推出基于 GR00T 的参考人形机器人", "url": "https://nvidianews.nvidia.com/news/nvidia-advances-isaac-platform-for-general-purpose-robotics-with-new-reference-humanoid-frameworks-simulation-pipelines-and-data", "source": "NVIDIA Newsroom", "date": "2026-10-21", "summary": "Agile ONE SN 高 1.4 米、31 自由度，配两只 20 自由度灵巧手与 Jetson Thor，2027 年初供货；英伟达还发布三套 DGX Station 开源参考工作流（GR00T 1.7 强化学习微调、灵巧操作训练、用 ChatGPT Astra 后训练 Cosmos 合成数据），ABB、KUKA、NEURA 等欧洲厂商接入。"}, {"title": "商汤开源具身智能评测与自我改进框架 SenseNova-RoboRSI，并推出 27B 机器人“大脑”模型 RoboRSI-27B-Preview，称完成具身任务成本约为 GPT-6-Astra 的 1/50", "url": "https://pandaily.com/sensetime-sensenova-roborsi-open-source-embodied-ai-harness-27b-preview", "source": "Pandaily", "date": "2026-10-21", "summary": "框架（Apache 2.0）把每个仿真基准及依赖打包为独立 Docker 镜像，经统一 HTTP API 提供环境交互与原生评分，可用配置文件端到端跑评测，并以执行轨迹与反馈递归改进 Harness。27B 模型把验证过的交互经验写入权重以减少试错，商汤自测 RoboDojo 得分 26.13、任务成功率 20.83%，LIBERO-Pro 超 90，RoboCasa365 成功率从 26.0% 提至 46.5% 且 token 用量降 73%。GitHub 仓库显示权重页面已建，发布路线图仍在推进，成绩均未经独立验证。"}, {"title": "SparkLLM 开源端侧模型 Spark-X2.6-4B：架构与 X2.5 相同、仅靠改进后训练增强编码/智能体/长上下文能力，支持 none/low/high 三档思考预算，Apache 2.0", "url": "https://huggingface.co/XHToken/Spark-X2.6-4B", "source": "Hugging Face", "date": "2026-10-21", "summary": "官方称其在同尺寸开源模型中领先，多项基准持平或超过约 9B 模型；高思考档下 BFCL-V4 71.8、MCP-Atlas 62.4、BrowseComp 53.1、SWE Pro 54.3（厂商自测），推理效率与 Qwen3.5-4B、Gemma-E4B 相当或更好。权重同步上架 ModelScope 与 Ollama（ollama run SparkLLM/Spark-X2.6-4B），并提供 vLLM、SGLang 部署指南及 GGUF 版本。"}, {"title": "Kakao 开源两款自研视觉编码器 Kanana-2-vision-encoder（426M 与 98M）：可商用，称在 42 项基准上超过 SigLIP 2、Perception Encoder、AIMv2 与 Qwen3.5-ViT", "url": "https://www.mt.co.kr/en/tech/2026/10/21/2026102109295354764", "source": "MoneyToday", "date": "2026-10-21", "summary": "两款模型已上架 Hugging Face，采用允许研究与商用的 Kanana Open License，覆盖通用 VQA、英/韩文 OCR 与文档理解、视觉定位等 9 个领域。Kakao 称不到 1 亿参数的 tiny 版也胜过 4 亿参数以上的海外模型，在视觉定位和韩文 OCR 上优势尤其明显，定位为智能体“电脑操作”的视觉基础。"}, {"title": "AMD 与英特尔罕见联手：把各自 x86 CPU 的 PyTorch 优化统一到开源库 oneDNN，并定为 PyTorch 内 x86 加速默认库；AMD 将 ZenDNN 并入 oneDNN 并加入 UXL 基金会指导委员会", "url": "https://newsroom.amd.com/news/amd-intel-collaborate-simplify-ai-development-on-x86-cpus-pytorch/", "source": "AMD Newsroom", "date": "2026-10-20", "summary": "合作由 x86 生态咨询组推动，目标是让开发者通过同一条软件路径在 AMD 与英特尔 CPU 上获得优化的 PyTorch 性能，减少分别适配与重复维护。双方还在合作开发面向 x86 的下一代指令集扩展 AI Compute Extensions（ACE），重点加速矩阵乘法，未来将通过 oneDNN 更新接入 PyTorch。红帽 PyTorch 大使 Stephen Watt 称这是消除生态碎片化的重要一步。"}, {"title": "GitHub 软件包防火墙（package firewall）公开预览：在终端与上游 npm 源之间拦截恶意包，可按包龄下限、恶意软件与漏洞通告、证明降级、新增安装脚本等策略阻断", "url": "https://github.blog/changelog/2026-10-20-github-package-firewall-in-public-preview/", "source": "GitHub Changelog", "date": "2026-10-20", "summary": "目前仅支持 npm，面向 GitHub Enterprise Cloud（含数据驻留实例）客户；只需把 npm 指向企业专属防火墙注册表地址并携带 GitHub token。预览期免费，正式版将按用量计费；意在把供应链防护前置到安装前的拉包环节。"}, {"title": "英伟达 GEAR 实验室开源 Flora 模型套件：把机器人与人类第一视角视频自动标注为带时间戳的动作指令、过程奖励与失败原因，称成本约为 GPT-6 Astra 的 1/125", "url": "https://research.nvidia.com/labs/gear/flora/", "source": "NVIDIA Research", "date": "2026-10-20", "summary": "套件含 Flora-TempSeg（9B，切分操作片段）、Flora-Captioner（27B，逐段写指令）与 Flora-Rewarder（27B，输出整段成败评分、每 0.5 秒过程质量分与基于评分细则的奖励），权重已上架 Hugging Face，仅限非商业研究用途。英伟达称其已作为 GR00T 的数据引擎，每天标注约 20 万小时视频。"}]}, {"id": "policy", "name": "政策与监管", "icon": "⚖️", "items": [{"title": "印度首席科学顾问 Ajay Kumar Sood：政府对制定专门 AI 法律持开放态度，已启动 AI 监管咨询文件起草，拟设“有针对性的监管护栏”", "url": "https://www.ndtv.com/artificial-intelligence/india-to-bring-new-ai-law-what-top-government-adviser-ajay-kumar-sood-told-ndtv-12214525", "source": "NDTV", "date": "2026-10-21", "summary": "Sood 称智能体 AI 带来“新挑战”，并援引 OpenAI 模型逃逸测试环境、入侵 Hugging Face 内部系统一事；CERT-In 已发布建议，要求部署智能体时关键操作保留人工审批并在沙箱隔离运行。印度今年 2 月已修订 IT 规则，要求平台 3 小时内下架被认定的 AI 深度伪造内容。"}, {"title": "韩国《AI 基本法》修订案通过：政府资助项目中构建或产出的 AI 训练数据须接入国家 AI 数据平台 AI Hub 对外提供，明年 4 月施行，政企共投数据披露范围与商业秘密豁免标准仍待细则", "url": "https://www.digitaltoday.co.kr/en/view/117235/mandatory-disclosure-of-ai-training-data-from-government-backed-projects-raises-questions-over-detailed-criteria", "source": "Digital Today", "date": "2026-10-21", "summary": "修订案 10 月 1 日经国会全体会议通过、10 月 13 日获内阁批准，旨在避免政府预算构建的数据被个别机构或企业独占。项目方可以商业秘密、个人信息、版权或国家安全为由，与科技部长协商后排除提供。争议焦点是“自主 AI 基础模型”等政企共投项目中，企业自费获取或再加工的数据是否也须公开；科技部称年内拿出施行令草案。"}, {"title": "摩洛哥首设人工智能部：国王任命前竞争委员会主席 Ahmed Rahhou 为人工智能、数字化转型与行政改革部长，但 AI 框架法与专门司局仍未落地", "url": "https://innovation-village.com/morocco-appoints-first-ai-minister-as-it-pushes-to-build-a-10-billion-ai-economy/", "source": "Innovation Village", "date": "2026-10-21", "summary": "新部门由原数字转型部长级代表职位升格为完整部级，10 月 19 日完成交接。前任留下的 Morocco AI 2030 路线图目标是到 2030 年为 GDP 增加约 100 亿美元、创造 5 万个 AI 相关岗位、培训 20 万人，并包括与 Mistral AI 共建研发实验室和主权 AI 市场。新政府 2026–2031 施政纲领承诺制定安全负责任的 AI 框架，但未给出时间表。"}, {"title": "中国商务部就美国国土安全部 DeepSeek 禁令表示“强烈不满、坚决反对”，称美方无视中美元首共识；外交部亦表示将坚决维护中国企业正当权益", "url": "https://www.nbcnews.com/world/asia/china-defends-deepseek-us-ban-ai-government-systems-rcna604721", "source": "NBC News / AP", "date": "2026-10-21", "summary": "美国国土安全部此前要求联邦民用机构从 IT 系统中移除 DeepSeek 产品及基于其开发的第三方产品与服务，并禁止采购，理由是服务器位于中国、存在数据访问风险。美联社报道，商务部 10 月 20 日晚表态称美方无视中美经贸关系大局；分析人士认为这反映了两国在 AI 领域的深层战略互疑，中方警告可能采取反制措施。"}, {"title": "Meta 回应出版商反弹：从 10 月 30 日生效的商业服务条款中删去“train（训练）”一词，抓取范围限定为广告与商业产品，但仍拒绝写入尊重 robots.txt 的承诺", "url": "https://arstechnica.com/tech-policy/2026/10/meta-drops-the-word-train-from-its-commercial-tos-after-ai-backlash/", "source": "Ars Technica", "date": "2026-10-20", "summary": "原条款允许 Meta 使用商业主页所链接网站的“任何内容”来“提供、开发、改进、研究、训练”其产品；修订后改为可“定期拉取更新”以开发广告与商业产品。法律专家称“develop（开发）”仍足以涵盖训练、“宽到能开过一辆卡车”；英国新闻媒体协会、欧洲出版商理事会与美国 News/Media Alliance 正敦促监管机构在 10 月 30 日前叫停。"}, {"title": "日本数字厅向约 18 万名政府职员推出 AI 智能体环境：政府 AI 平台“源内”上线 Agent Chat，12 月前后再上线可自主写代码、执行命令的“源内工房”，并同步发布治理与安全基准", "url": "https://www.digital.go.jp/en/policies/genai/agent-safety-standard", "source": "日本数字厅", "date": "2026-10-20", "summary": "数字厅称，把相当于 AI 编程智能体级别的环境作为政府共通基盘、向普通行政人员规模化开放属全球首例；新发布的“源内基准”按使用者、管理者、开发者分别规定责任与遵守事项，由日本 AI 安全研究所（AISI）协助制定。两套环境计划约 2027 年 2 月以“源内 OSS Ver. 2.0”开源，供地方政府与企业使用。"}, {"title": "路透：美国西部六州联邦土地上至少有 35 宗数据中心相关申请、覆盖逾 2.4 万英亩，其中 17 个为数据中心园区，公众反对声渐强", "url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L1N4660UM:0-at-least-17-data-center-campuses-proposed-on-us-public-lands-group-says/", "source": "Reuters / TradingView", "date": "2026-10-20", "summary": "据环保组织 Center for Western Priorities 对土地管理局（BLM）记录的分析，申请分布于亚利桑那、爱达荷、内华达、俄勒冈、犹他和怀俄明，另有 13 个输电线、管道、通信与道路等配套项目，包括怀俄明州 Prometheus Hyperscale 园区及 Copia Power 多个项目。特朗普政府力推向能源、矿业与科技项目开放公共土地，但民众对电力、用水、野生动物与公共通行的担忧上升。"}, {"title": "工信部印发《“人工智能+软件”专项行动实施方案》：到 2028 年智能编程工具推广覆盖 2 万家规上软件企业，实施 100 项智能化技改、打造 100 个智能体软件标杆应用", "url": "http://www.ce.cn/xwzx/gnsz/gdxw/202610/t20261020_3264711.shtml", "source": "科技日报 / 中国经济网", "date": "2026-10-20", "summary": "方案还提出孵化 5 个以上重点开源项目，大力发展“模型即服务”“智能体即服务”，推动软件开发由“人工编写”转向“人机协同”；把提升软件领域安全保障列为任务，开发环节以智促安，产品环节强调行为可控、全程可溯。工信部披露截至 2026 年 6 月我国日均词元调用量已突破 500 万亿。"}]}, {"id": "china", "name": "国内 AI 动态", "icon": "🇨🇳", "items": [{"title": "清华 AIR 孵化的紫荆智康升级“紫荆AI医院”：推出多分身智能体协同技术，不同专科医生的 AI 分身可按需提醒或联合会诊，已在多地医院上线测试", "url": "https://www.qbitai.com/2026/10/504734.html", "source": "量子位", "date": "2026-10-21", "summary": "系统在首诊、预问诊阶段就引入跨专科意见（如内分泌科问诊时由呼吸科分身提示哮喘用药风险），分身意见不一致时高亮呈现、由医生最终判断；分身基于 AIR 刘洋团队提出的 SEAL（虚拟世界训练 + 真实世界验证微调）持续学习对应真人医生。"}, {"title": "百度搭子杭州发布会：上线电脑/手机界面操作、开发模式、投标套件与 Agent 安全中心，并与联想开天、麒麟、统信联合发布全栈国产通用智能体及“百度搭子工作站”", "url": "https://www.yzwb.net/news/ch/202610/t20261021_404901.html", "source": "紫牛新闻", "date": "2026-10-21", "summary": "百度称搭子企业客户环比增长 83%、交付物需求环比增长 4.3 倍；新能力可识别界面操作无 API 系统完成跨应用任务，安全中心要求高危操作人工授权、沙箱隔离并可追溯，支持公有云、专属 VPC、私有化与混合云部署；更多进展将于 11 月 12 日百度世界 2026 披露。"}, {"title": "生数科技开启 Motubrain 2.0 训练全流程公开直播：持续约半个月，展示具身模型预训练、后训练、Agent 任务执行与递归自我改进（RSI）四个环节，模型即将开源", "url": "https://www.qbitai.com/2026/10/504730.html", "source": "量子位", "date": "2026-10-21", "summary": "继小米 MiMo 负责人罗福莉公开 MiMo-V2.6 强化学习训练进展之后，Physical AI 领域也出现类似尝试。Motubrain 是生数科技为机器人打造的世界动作模型，团队称希望打开具身模型训练“黑盒”，连训练中的失败与调整一并公开；相关研究仍处于探索阶段，效果有待后续评测验证。"}, {"title": "36氪：物理空间智能基础设施公司「乙太科技」连续完成种子轮及天使轮、累计超亿元，华为哈勃、智元、自变量、高瓴等投资，打造为具身智能与世界模型服务的“物理空间引擎”", "url": "https://www.163.com/dy/article/L9OPE7HN05118DFD.html", "source": "36氪 / 网易", "date": "2026-10-21", "summary": "公司成立于 2025 年 12 月，创始人兼 CEO 杨叶青曾任 HTC VIVE Chief of Staff 及中国区元宇宙事业部负责人。其引擎分输入、核心能力、空间资产、平台与应用五层，把现实空间持续“编译”为可计算、可编辑、带物理约束与交互属性的空间资产；现阶段优先采集人类双手交互数据，称精度可达亚毫米级。公司强调不做世界模型的生成，而是做其底层基础设施，已在机器人与世界模型领域开展合作。"}, {"title": "IDC 首份汽车 AI 座舱市场报告：2026 上半年中国 AI 座舱解决方案市场 7.1 亿元，火山引擎以 45% 份额居首、阿里第二，全年预计 16.6 亿元", "url": "https://www.ithome.com/1/015/980.htm", "source": "IT之家（援引 IDC）", "date": "2026-10-21", "summary": "IDC 在《中国汽车云市场跟踪》中首次把 AI 座舱解决方案作为独立附加市场跟踪，涵盖 AI 开发平台/软件、模型服务 MaaS、AI 应用与 AI 运营服务四层，预计 2030 年达 47.1 亿元、年复合增速近 30%。第二梯队包括百度、科大讯飞与阶跃星辰等；计费以功能套件 License 为主，按 Token 计费的公有云模式为补充，端云协同已成共识，座舱正从“被动应答”转向“主动服务”。"}, {"title": "宇树科技发布“H2-X 功夫传奇”守护型人形机器人：续航约 8 小时，演示徒手抬汽车、一脚踢凹车门", "url": "https://finance.sina.com.cn/jjxw/2026-10-21/doc-inivynss4838350.shtml", "source": "新浪财经 / IT之家", "date": "2026-10-21", "summary": "宇树将其定位为可当“私人保镖”的守护场景机器人，演示 s://x.com/business/status/2112871549329932557", "source": "@business", "date": "2026-10-21", "summary": "彭博观点：前纽约联储主席 Bill Dudley 称 AI 投资热潮正把美联储推向“先加息、后急转降息”的路径。", "metrics": {"likes": 18, "reposts": 6, "views": 16372}, "id": "f22a1aa692437b5cbc7f93265e308ad164940119", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T20:35:00+08:00"}, {"title": "AuthorizationBench：首个“授权对齐”智能体基准，286 个源自真实案例的可执行任务、6864 条轨迹显示智能体有 19.2% 的情况越权行事，提高推理强度几乎无改善", "url": "https://arxiv.org/abs/2610.27548", "source": "arXiv", "date": "2026-10-21", "summary": "研究者指出现有评测只看任务完成或有害后果，会漏掉“未造成传统伤害但超出用户授权”的行为。基准覆盖十个应用领域，在可观察授权内外路径的沙箱中，用 4 个模型、2 档推理强度和 3 种智能体外壳运行；越权率在 24 种配置间介于 10.5% 到 26.6%，且任务完成并不意味着守住授权。", "id": "c375b9729cc0ee0f1c172caeec4bc8acac561677", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T19:40:00+08:00"}, {"title": "“更强的 AI 突破会加速自身枯竭”：分析 36 年计算机科学 720 万篇论文、7.3 万份评审与 370 万研究者，发现 Transformer 之后领域扩张但注意力急剧收窄", "url": "https://arxiv.org/abs/2610.27296", "source": "arXiv", "date": "2026-10-21", "summary": "论文认为突破依赖多样化的研究注意力，而集体扎堆会耗尽这种多样性：超过一半转换方向的研究者涌入 AI（以中期职业者为主），评审信心在 5 分制上下降整整 1 分；从 AlexNet 到大模型，每次突破都抬高了领域的“想法容量”，但随后想法枯竭更快，结构生物学在冷冻电镜与 AlphaFold 后也出现同样周期。", "id": "e1b9334f23b203fe680a5ddbede6a7485e242645", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T19:40:00+08:00"}, {"title": "生数科技开启 Motubrain 2.0 训练全流程公开直播：持续约半个月，展示具身模型预训练、后训练、Agent 任务执行与递归自我改进（RSI）四个环节，模型即将开源", "url": "https://www.qbitai.com/2026/10/504730.html", "source": "量子位", "date": "2026-10-21", "summary": "继小米 MiMo 负责人罗福莉公开 MiMo-V2.6 强化学习训练进展之后，Physical AI 领域也出现类似尝试。Motubrain 是生数科技为机器人打造的世界动作模型，团队称希望打开具身模型训练“黑盒”，连训练中的失败与调整一并公开；相关研究仍处于探索阶段，效果有待后续评测验证。", "id": "28d2f32e754b4e4f5392bff64b4e601add6b915a", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T19:40:00+08:00"}, {"title": "strelov1/freehire", "url": "https://github.com/strelov1/freehire", "source": "GitHub", "stars": 1997, "stars_week": null, "language": "Go", "date": "2026-10-21", "summary": "freehire：面向求职者的开源职位搜索引擎，可自托管，聚合抓取职位并结合 LLM（LangChain）处理，技术栈为 Go + SvelteKit + Meilisearch + PostgreSQL，MIT 许可。", "why": "今日登上 GitHub Trending 日榜，总星数约 2000、fork 228。", "id": "e9a49fe684b232bedd00764b912919570fa15fca", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T19:40:00+08:00"}, {"title": "@NVIDIAAI", "url": "https://x.com/NVIDIAAI/status/2112855959609729106", "source": "@NVIDIAAI", "date": "2026-10-21", "summary": "英伟达 AI 发布黄仁勋 GTC Berlin 片段：“毫无疑问，每家公司都会成为 AI 公司，欧洲将迎来繁荣的 AI 经济。”", "metrics": {"likes": 139, "reposts": 24, "views": 6613}, "id": "fdae865e1b32544444057f5f887667c0b8c1c74c", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T19:40:00+08:00"}, {"title": "英伟达 GTC Berlin 扩充开放模型家族：新增结构化数据基础模型 Kumo、Cosmos 3.5 世界模型、Alpamayo 2 Edge 车端推理模型、Nemotron Retriever 及量子计算模型 Ising", "url": "https://blogs.nvidia.com/blog/open-models-europe-industry/", "source": "NVIDIA Blog", "date": "2026-10-21", "summary": "英伟达把这批开放模型定位为欧洲“主权智能”的底座，让企业用本地数据定制、部署在自己掌控的基础设施上。Kumo 隶属新的 Agent Knowledge Foundation，含面向关系/表格预测、预测与异常检测的 Kumo Structured 模型和开源库栈 Kumo Engine，Coinbase、Databricks、DoorDash、Revolut 等首批试用；Cosmos 新增后训练与优化工具及驾驶/操作仿真检查点；Nemotron Retriever 覆盖嵌入、重排与文档解析，Black Forest Labs、H Company、Mistral 等欧洲伙伴参与 Nemotron 联盟。", "id": "be11c18d48ff6273522b94859f1486ce46f7d96d", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "英伟达发布 DSX POD：由合作伙伴在工厂内把 Vera Rubin AI 工厂整体装进模块化集装箱并预先验证，现场部署时间从约 6 个月缩短到最快 14 天，2027 年初交付", "url": "https://www.globenewswire.com/news-release/2026/10/21/3385267/0/en/nvidia-introduces-dsx-pod-ai-factories-to-accelerate-europe-s-infrastructure-deployment.html", "source": "NVIDIA / GlobeNewswire", "date": "2026-10-21", "summary": "计算、网络、布线、机架级供电与液冷都在工厂完成集成和功能验证，运到已备好电力、冷却与网络的场地即可接入。参与方包括 Anduril、Bull、Crusoe、戴尔、HPE、联想、富士康、广达、施耐德电气、Vertiv、纬创等。英伟达同日公布 DSX 平台欧洲进展：闭环液冷加干冷器可让设施冷却用水接近零，DSX MaxLPS 软件可用约少 30% 的电力产出同等 token，CoreWeave、Google Cloud、Lambda、Nebius、Nscale 等正在评估。", "id": "3e8e69f83d8dcf92301a49cff7beb6a66fcb2159", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "Bolt 选用英伟达 Alpamayo 自动驾驶软件栈推进欧洲 Robotaxi：计划在欧洲部署至少 2.5 万辆基于 Hyperion 平台、具备 L4 能力的未来 Lucid 车型，2027 年起在马德里采集路测数据", "url": "https://www.globenewswire.com/news-release/2026/10/21/3385334/0/en/european-mobility-leaders-build-safe-vehicles-and-robotaxi-fleets-on-nvidia-hyperion.html", "source": "NVIDIA / GlobeNewswire", "date": "2026-10-21", "summary": "GTC Berlin 上，英伟达称大众商用车 ID. Buzz AD、Einride 自动驾驶卡车也基于 Hyperion，沃尔沃采用 Hyperion 与 Alpamayo Stack，奔驰与英伟达合作的 MB.DRIVE ASSIST PRO 城市点到点辅助驾驶即将在德国获批。英伟达还推出 Halos SAFE 安全评估框架（dSPACE、TÜV 莱茵等参与）、2B 参数车端推理模型 Alpamayo 2 Edge（跑在 DRIVE AGX Thor 上，10Hz），以及 2027 年初开放的 Alpamayo Agentic Factory 蓝图；Bolt 的测试仍需监管批准，德国为后续优先市场。", "id": "8da9c808a90d0c13cea9a321b1646e3eff0d0282", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "戴尔 CEO 迈克尔·戴尔：手握约 950 亿美元未交付 AI 服务器订单、创历史新高，瓶颈在内存，预计 2027 年短缺进一步恶化，2029–2030 年才有显著新增产能", "url": "https://www.ithome.com/1/015/654.htm", "source": "IT之家（援引《华尔街日报》）", "date": "2026-10-21", "summary": "他在接受《华尔街日报》采访时表示，AI 加速芯片消耗大量 HBM，配套服务器仍依赖传统 DRAM，新建内存厂约需四年。这一判断与美光（2027–2028 年供应更紧）和 SK 海力士（短缺持续至 2030 年）的说法一致；戴尔应对方式是临近组装再采购 DRAM 并签长期供货协议，去年底已把 PC 提价 15%–20%。", "id": "52f2ae1157786ea34f7e294c65670b24907b4bc9", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "韩媒：英伟达下一代 Groq LPU 推理芯片拟改用 TSV 工艺 3D 堆叠 DRAM，放弃当前的大容量 SRAM 方案", "url": "https://www.ithome.com/1/015/760.htm", "source": "IT之家（援引 ZDNET Korea）", "date": "2026-10-21", "summary": "现款 Groq LPU 依靠片上大 SRAM 实现快速解码，但 SRAM 容量小、先进制程的密度收益有限，在大模型支持与芯片迭代上存在局限。同样走大 SRAM 路线的 Cerebras 此前也已预告 CS-6 将首次 3D 垂直集成 DRAM。该消息为媒体报道，英伟达未置评。", "id": "3e4202fc0ec1fe92d89278f1fbeddf1c334f26a3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "“记忆越多、智能体越差”：印第安纳大学指出经验记忆中的“错误再生产”——存下来的规则/技能一旦有错，会经执行与再抽象循环反复复现，提出“反持久化”记忆设计", "url": "https://arxiv.org/abs/2610.27406", "source": "arXiv", "date": "2026-10-21", "summary": "作者发现，智能体把从轨迹中归纳的规则、摘要与技能长期保存再复用时，错误不仅被直接检索复用，还会塑造新的执行轨迹、再被抽象成新知识，从而远超原始错误的存续时间。Anti-Persistence 只累积原始轨迹与结果，按需临时合成任务指导、用后即弃，由自适应选择器依据过往结果决定是否以及如何合成。跨多个基准与骨干模型，它取得最高的留出集成功率与最低的平均 LLM 调用成本。", "id": "01b0f1822cff1af9813c7deee24caa50e126cdea", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "通义 Qwen-Character 团队提出 HarnessRL：让训练“外壳”与策略共同进化，按奖励失效原因动态调整任务采样、rollout 引导与评分细则，开放式 RL 提升约 3 分并减半训练步数", "url": "https://arxiv.org/abs/2610.26426", "source": "arXiv", "date": "2026-10-21", "summary": "论文指出基于 rubric 的开放式强化学习常出现两类失效：分数塌缩到全高或全低的“无区分度奖励”，以及分高不等于回答好的“虚假奖励”。HarnessRL 维护训练期记忆，演化器把每次奖励失效归因到相应接口，再由提议者与“即时评审”循环生成更新，评审须在当前冻结策略上实测有效才接受。在新构建的医疗、科学、写作、角色扮演、指令遵循五领域 Rubric-Mix-10k 上，4B 与 9B 模型均比最强基线高 2.8–3.1 分，代码与数据已开源。", "id": "8a4c2ef238e342ea5aef727c68bf8a7023c11ad3", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "S-Agent 2.0：给通用编码智能体（可接 Codex、Claude Code）配命令行 3D 感知工具包与持久场景记忆做空间推理，Qwen3.8-27B 在 MMSI-Bench / ReVSI 上分别提升 13.9 / 20.5 分", "url": "https://arxiv.org/abs/2610.28354", "source": "Hugging Face Daily Papers / arXiv", "date": "2026-10-21", "summary": "Ropedia 团队认为空间推理的短板常在“工具读数到结论”之间：工具给出了正确证据，模型却得不出正确答案。S-Agent 2.0 围绕“闭合证据环”设计接口——获取场景证据、写入持久场景记忆、用自然空间语言解释每次读数。开源骨干下达到 MMSI-Bench 66.5、ReVSI 82.3，超过同骨干的专用系统 SpatialClaw（62.6、74.5）；配 Gemini-3.8-Flash 达 74.1 与 90.5，且随骨干变强，工具增益衰减明显小于对手。", "id": "8438a24305e43c268abb038dae40be0713524a39", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "商汤开源具身智能评测与自我改进框架 SenseNova-RoboRSI，并推出 27B 机器人“大脑”模型 RoboRSI-27B-Preview，称完成具身任务成本约为 GPT-6-Astra 的 1/50", "url": "https://pandaily.com/sensetime-sensenova-roborsi-open-source-embodied-ai-harness-27b-preview", "source": "Pandaily", "date": "2026-10-21", "summary": "框架（Apache 2.0）把每个仿真基准及依赖打包为独立 Docker 镜像，经统一 HTTP API 提供环境交互与原生评分，可用配置文件端到端跑评测，并以执行轨迹与反馈递归改进 Harness。27B 模型把验证过的交互经验写入权重以减少试错，商汤自测 RoboDojo 得分 26.13、任务成功率 20.83%，LIBERO-Pro 超 90，RoboCasa365 成功率从 26.0% 提至 46.5% 且 token 用量降 73%。GitHub 仓库显示权重页面已建，发布路线图仍在推进，成绩均未经独立验证。", "id": "074e6b695807eb3efa49a727c87ddfdb70b92176", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "韩国《AI 基本法》修订案通过：政府资助项目中构建或产出的 AI 训练数据须接入国家 AI 数据平台 AI Hub 对外提供，明年 4 月施行，政企共投数据披露范围与商业秘密豁免标准仍待细则", "url": "https://www.digitaltoday.co.kr/en/view/117235/mandatory-disclosure-of-ai-training-data-from-government-backed-projects-raises-questions-over-detailed-criteria", "source": "Digital Today", "date": "2026-10-21", "summary": "修订案 10 月 1 日经国会全体会议通过、10 月 13 日获内阁批准，旨在避免政府预算构建的数据被个别机构或企业独占。项目方可以商业秘密、个人信息、版权或国家安全为由，与科技部长协商后排除提供。争议焦点是“自主 AI 基础模型”等政企共投项目中，企业自费获取或再加工的数据是否也须公开；科技部称年内拿出施行令草案。", "id": "62674c19685fb4d097b35eda8cb25a3a2a6ec4ee", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "摩洛哥首设人工智能部：国王任命前竞争委员会主席 Ahmed Rahhou 为人工智能、数字化转型与行政改革部长，但 AI 框架法与专门司局仍未落地", "url": "https://innovation-village.com/morocco-appoints-first-ai-minister-as-it-pushes-to-build-a-10-billion-ai-economy/", "source": "Innovation Village", "date": "2026-10-21", "summary": "新部门由原数字转型部长级代表职位升格为完整部级，10 月 19 日完成交接。前任留下的 Morocco AI 2030 路线图目标是到 2030 年为 GDP 增加约 100 亿美元、创造 5 万个 AI 相关岗位、培训 20 万人，并包括与 Mistral AI 共建研发实验室和主权 AI 市场。新政府 2026–2031 施政纲领承诺制定安全负责任的 AI 框架，但未给出时间表。", "id": "f901e1f8d5171de123a18cb93329e5512f5db6de", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "36氪：物理空间智能基础设施公司「乙太科技」连续完成种子轮及天使轮、累计超亿元，华为哈勃、智元、自变量、高瓴等投资，打造为具身智能与世界模型服务的“物理空间引擎”", "url": "https://www.163.com/dy/article/L9OPE7HN05118DFD.html", "source": "36氪 / 网易", "date": "2026-10-21", "summary": "公司成立于 2025 年 12 月，创始人兼 CEO 杨叶青曾任 HTC VIVE Chief of Staff 及中国区元宇宙事业部负责人。其引擎分输入、核心能力、空间资产、平台与应用五层，把现实空间持续“编译”为可计算、可编辑、带物理约束与交互属性的空间资产；现阶段优先采集人类双手交互数据，称精度可达亚毫米级。公司强调不做世界模型的生成，而是做其底层基础设施，已在机器人与世界模型领域开展合作。", "id": "43a1f98307e7a8adea670a8a12a4fb541d3b8ffe", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "shy3130/tick-stock-panel", "url": "https://github.com/shy3130/tick-stock-panel", "source": "GitHub", "stars": 6204, "stars_week": null, "language": "Python", "date": "2026-10-21", "summary": "TSP：自托管、零运维的 A 股“自建策略 + 监控 + 回测”量化工作台，用 LLM 驱动策略定制、个股分析与复盘，可接入第三方数据源（FastAPI + DuckDB/Polars + React，MIT 许可）。", "why": "今日登上 GitHub Trending Python 日榜，总星数约 6200、fork 近 1500。", "id": "8d6edd0c89456a5363543437e7571727a1610a89", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "@nvidia", "url": "https://x.com/nvidia/status/2112847277282721888", "source": "@nvidia", "date": "2026-10-21", "summary": "英伟达：黄仁勋在 GTC Berlin 发布 OpenShell 参考架构，帮助企业为 AI 智能体划定边界、并在越界时将其叫停。", "metrics": {"likes": 73, "reposts": 10, "views": 11168}, "id": "b9af6aa9518dc8534ee0cf3c78efa3a93e5c953b", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "@NVIDIAAI", "url": "https://x.com/NVIDIAAI/status/2112847569827348804", "source": "@NVIDIAAI", "date": "2026-10-21", "summary": "NVIDIA AI：GTC Berlin 发布更多开放模型，帮助欧洲团队用自有数据、在自控基础设施上构建专用智能体、训练机器人与设计蛋白质。", "metrics": {"likes": 48, "reposts": 5, "views": 2866}, "id": "a9c7873b19d96dc9663b703a3c3e3c5c93200e83", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112849355090559438", "source": "@testingcatalog", "date": "2026-10-21", "summary": "TestingCatalog：英伟达推出 OpenShell 参考架构和 DSX POD，在已备好的场地部署 AI 工厂从 6 个月缩短到 14 天。", "metrics": {"likes": 15, "reposts": 1, "views": 1672}, "id": "92d3502c8a7a31ada891a5202bfb6bb8546f0cce", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T18:29:00+08:00"}, {"title": "Tether 领投 AI 智能体支付基础设施公司 Mural 1500 万美元 A 轮融资，累计融资达 2800 万美元，押注“智能体金融”", "url": "https://www.coindesk.com/business/2026/10/21/tether-leads-usd15-million-series-a-for-ai-focused-payment-startup-mural", "source": "CoinDesk", "date": "2026-10-21", "summary": "Mural 由前 Palantir 工程师创立，为金融科技与平台公司提供跨传统银行网络与区块链的账户、支付、身份验证与合规基础设施，客户包括 Deel 与 Opera；North Island Ventures 及老股东跟投。其系统允许企业为 AI 智能体设置交易限额、限制交易对手、对大额支付要求额外审批，以解决自主软件动用资金时的授权与问责问题。Tether CEO Ardoino 称“当智能体开始转移资金，与银行、支付网络和合规系统的连接就变得至关重要”。", "id": "771d8eeea6be3dfd0fad1fc933f120e62b0ab548", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "RiseHarness：模型权重不变、只迭代进化智能体“外壳”（harness），专攻“同配置下时成时败”的长程终端任务，提升成功率与可靠性", "url": "https://arxiv.org/abs/2610.27435", "source": "Hugging Face Daily Papers / arXiv", "date": "2026-10-21", "summary": "作者指出长程终端智能体常“一次能做成、多次跑不稳”，随机错误会沿动作与上下文传播。RiseHarness 以同一任务的成功轨迹为参照分析失败轨迹，结合运行时监控采集的 harness 内部轨迹，用“Harness Handbook”把证据关联到 harness 行为与源码，再检索其他 harness 框架的相关实现作为设计参考；候选改动经行为检查与重复评测，有实测增益的版本进入下一轮。论文把“特定模型”作为 harness 适配单元，并测试向未见基准迁移。HF 每日论文页标注为腾讯混元（Tencent Hunyuan）。", "id": "55b1930c6bc3f8afd762f0ba3d82444c8a265445", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "λ₀：用 500 小时开放世界人类第一视角“移动+操作”数据训练人形机器人全身基础模型，零样本迁移宇树 G1，SIMPLE 成功率 90%、真实任务 62.5%", "url": "https://arxiv.org/abs/2610.18950", "source": "Hugging Face Daily Papers / arXiv", "date": "2026-10-21", "summary": "Lambda-humanoid 团队发布 HumanVerse 数据集，把第一视角视频与同步的身体、手部动作配对；人到人形的管线对齐相机视角与手臂外观，并离线细化动作参考与控制器输入，以减少末端执行误差、保留全身协调。无需目标任务机器人示教即可在宇树 G1 上完成全身操作与长距离移动操作；人类全身数据越多，下游任务进度越好。登上 10 月 21 日 HF 每日论文榜。", "id": "89a80ec03a10009aa09acfe4ee85f662aa004a25", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "CoEvo-RSI：针对递归自我改进智能体中“外壳进化了、模型跟不上”的脑-身错配，让元智能体同时挑选/合并模型检查点与历史 harness 设计，Qwen3.5-9B 仅靠 SFT 在部分任务超过 DeepSeek-V4-Pro", "url": "https://arxiv.org/abs/2610.25078", "source": "Hugging Face Daily Papers / arXiv", "date": "2026-10-21", "summary": "框架基于共享进化档案与执行反馈做“双向历史继承”：一边从历史设计中发展 harness，一边选择或合并模型检查点并在所选 harness 下继续适配，以减少 harness 要求模型未学会的行为、或限制模型已有能力的错配。仅用自身拒绝采样轨迹做 SFT，Qwen3.5-9B 在 TraceElephant 上智能体准确率比 DeepSeek-V4-Pro 高 14.16 个点，在 HomeBench VM 上成功率比 GLM-5.3 高 4.90 个点，覆盖多智能体故障归因、角色感知 Text-to-SQL 与智能家居指令跟随。", "id": "621472105dfc98377bd536789b48e3d10febe0c5", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "IDC 首份汽车 AI 座舱市场报告：2026 上半年中国 AI 座舱解决方案市场 7.1 亿元，火山引擎以 45% 份额居首、阿里第二，全年预计 16.6 亿元", "url": "https://www.ithome.com/1/015/980.htm", "source": "IT之家（援引 IDC）", "date": "2026-10-21", "summary": "IDC 在《中国汽车云市场跟踪》中首次把 AI 座舱解决方案作为独立附加市场跟踪，涵盖 AI 开发平台/软件、模型服务 MaaS、AI 应用与 AI 运营服务四层，预计 2030 年达 47.1 亿元、年复合增速近 30%。第二梯队包括百度、科大讯飞与阶跃星辰等；计费以功能套件 License 为主，按 Token 计费的公有云模式为补充，端云协同已成共识，座舱正从“被动应答”转向“主动服务”。", "id": "368308098e4dbb8f9ed61c2c7dc694653948f229", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "宇树科技发布“H2-X 功夫传奇”守护型人形机器人：续航约 8 小时，演示徒手抬汽车、一脚踢凹车门", "url": "https://finance.sina.com.cn/jjxw/2026-10-21/doc-inivynss4838350.shtml", "source": "新浪财经 / IT之家", "date": "2026-10-21", "summary": "宇树将其定位为可当“私人保镖”的守护场景机器人，演示中还从约 4 米高台空翻落地。具体配置与售价暂未公布；作为参照，现款 H2 身高 182cm、31 个自由度、续航约 3 小时，H2-X 续航提升到约 8 小时。", "id": "ee657e4836ed8f4a3752c309f2ad7abdfe6044d8", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "中国电信人工智能研究院（TeleAI）孵化首个市场化企业“伽马智能”在上海徐汇成立，聚焦人形机器人“自进化”与全身模型", "url": "https://www.ithome.com/1/015/807.htm", "source": "IT之家", "date": "2026-10-21", "summary": "伽马智能（Gamma Robotics）获中电信（上海）人工智能产业私募基金战略投资，中国电信集团 CTO、TeleAI 院长李学龙任科学顾问，白辰甲任创始人兼 CEO，并将与 TeleAI 共建人形机器人实验室。公司将依托中国电信的网络、算力与“智传网（AI Flow）”，让机器人在真实交互中持续学习，形成移动、平衡与操作协同的全身能力，并与云端模型协作共享经验。", "id": "f25eadc451dd5919b561e938f714b068e03a7752", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "@nvidia", "url": "https://x.com/nvidia/status/2112832187351580802", "source": "@nvidia", "date": "2026-10-21", "summary": "英伟达：黄仁勋 GTC Berlin 主题演讲正在柏林 Tempodrom 直播（10 月 21 日 17:00–19:00 UTC+8），聚焦 AI 工厂、开放模型、智能体与物理 AI。", "metrics": {"likes": 94, "reposts": 24, "views": 11860}, "id": "ea42af3881b2529e932848b987cbae230e82e9d9", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112831310829900244", "source": "@business", "date": "2026-10-21", "summary": "彭博：德意志银行 CEO 称看不到 AI 泡沫——此前亿万富翁 Ken Griffin 警告投资者将遭遇挫折。", "metrics": {"likes": 13, "reposts": 5, "views": 11149}, "id": "aaf9714f893398fc4328039fc51632c97e992689", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "The Information/福布斯：英伟达为 AI 数据中心提供的担保与各类承诺最高达 1645 亿美元，其中约 1050 亿美元为 OpenAI 俄亥俄园区租约担保，占比约 64%", "url": "https://finance.yahoo.com/technology/ai/articles/nvidia-backs-164-5-billion-061322658.html", "source": "Forbes / Yahoo Finance（援引 The Information）", "date": "2026-10-21", "summary": "据英伟达最新季报披露的数字，除 SB Energy 为 OpenAI 建设的俄亥俄园区租金担保外，其余包括承诺购买云厂商卖不出去的算力（约 360 亿美元，如兜底 CoreWeave 到 2032 年 4 月的闲置容量）、直接签约后转租的数据中心租约（约 200 亿美元）和为云厂商租约提供的担保（约 35 亿美元）；另已向 AI 云厂商直接投资或承诺投资逾 70 亿美元。文章指出这是用资产负债表把未来 GPU 需求提前拉入当季，而 CoreWeave 债券承压、Nscale 失去微软站点等显示新型云厂商风险正在累积。", "id": "69858e2a90b7273fed9c022476a62e0564c31589", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "路透：月之暗面（Moonshot AI）在新加坡招聘销售岗位，显示其正在当地开展业务；其新加坡实体 2023 年 7 月注册、今年 6 月更名为 Novascent", "url": "https://www.straitstimes.com/business/chinas-moonshot-ai-to-operate-in-singapore-jobs-post-shows", "source": "The Straits Times（路透）", "date": "2026-10-21", "summary": "据路透报道，Kimi 开发商月之暗面在 LinkedIn 发布新加坡销售职位，要求具备销售、风投、咨询、产品或工程背景，负责建立可规模化的收入、合作伙伴关系与市场影响力。这是又一家中国大模型公司借道新加坡拓展海外业务的迹象。", "id": "205841713dde1bbfc9437aa8565937f0bcfe2a88", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "Ropedia W0：首个跨人类与多种机器人本体的第一视角“移动+操作”世界基础模型，用 1 万小时人类第一视角数据与 3000 小时机器人数据训练", "url": "https://arxiv.org/abs/2610.26855", "source": "Hugging Face Daily Papers / arXiv", "date": "2026-10-21", "summary": "团队整理了统一多模态标注的 Xp-Data 数据集，用相机位姿编码移动、用投影骨架编码操作，机器人骨架结合各本体正运动学与大量人工关键点校正，以统一不同本体的异构动作空间；同时发布基于高质量灵巧人形遥操作的长程移动操作基准 Xp-Teleop。登上 10 月 21 日 HF 每日论文榜前列。", "id": "0add838901f30130050b720f23c605d7462f90d6", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "南洋理工提出 FocusGUI：让全模态 GUI 智能体每一步只“聚焦”与当前动作相关的截图、音频、视频与设备状态，缓解“连续分心”导致的轨迹漂移", "url": "https://arxiv.org/abs/2610.26203", "source": "Hugging Face Daily Papers / arXiv", "date": "2026-10-21", "summary": "论文指出，GUI 智能体若每步都统一处理完整的多模态上下文，上一步关键的信号会在下一步变成噪声，并随动作反馈不断累积成不可逆的偏航。作者将需求形式化为“聚焦感知”（逐步自适应、动作充分、非侵入），以轻量适配器按每步决策参照动态排序各模态通道并压缩成紧凑潜表示。10 月 21 日 HF 每日论文榜第一。", "id": "7b7a3573a40ff6b5e177500162d4c34a41090d89", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "中国商务部就美国国土安全部 DeepSeek 禁令表示“强烈不满、坚决反对”，称美方无视中美元首共识；外交部亦表示将坚决维护中国企业正当权益", "url": "https://www.nbcnews.com/world/asia/china-defends-deepseek-us-ban-ai-government-systems-rcna604721", "source": "NBC News / AP", "date": "2026-10-21", "summary": "美国国土安全部此前要求联邦民用机构从 IT 系统中移除 DeepSeek 产品及基于其开发的第三方产品与服务，并禁止采购，理由是服务器位于中国、存在数据访问风险。美联社报道，商务部 10 月 20 日晚表态称美方无视中美经贸关系大局；分析人士认为这反映了两国在 AI 领域的深层战略互疑，中方警告可能采取反制措施。", "id": "0083f54f74bfa5f7efb401f37ce6e259e4b0668a", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "清华系具身智能公司千诀科技发布预测式世界模型 Polibrain：不生成完整未来画面，而在任务相关潜空间预测状态变化，已适配四足、人形、轮式与双臂机器人", "url": "https://www.qbitai.com/2026/10/504653.html", "source": "量子位", "date": "2026-10-21", "summary": "在南京首届物理 AI 与世界模型大会上发布。创始人高海川将 VLA 路线比作“把所有路走一遍”，世界模型则是“先画地图再规划”；Polibrain 把感知、状态理解、行动预测、决策、执行与反馈连成闭环，执行偏离预测时可重新评估任务。底层采用“多项式表征”提取影响任务的关键变量以提升跨场景泛化，公司称其 2025 年与清华在 ICML 发表的隐变量可辨识性研究早于 LeCun 团队相近工作约一年；复杂场景可靠性仍待更完整实测。", "id": "3d52dbe02aa2f46a430c8c2c6d16e3f950e7fffd", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "@Reuters", "url": "https://x.com/Reuters/status/2112816266188591483", "source": "@Reuters", "date": "2026-10-21", "summary": "路透：招聘信息显示中国 AI 公司月之暗面（Moonshot AI）将在新加坡开展业务。", "metrics": {"likes": 5, "reposts": 3, "views": 17891}, "id": "9d2f5206f5c7c478d6bd68096b49c06a982c4cad", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112811603464794299", "source": "@business", "date": "2026-10-21", "summary": "彭博：贝莱德 CEO 拉里·芬克称，随着 AI 需求加速，数据中心建设延误可能推高算力成本并助长通胀。", "metrics": {"likes": 12, "reposts": 3, "views": 14458}, "id": "c99816b6edc5e39a54d0a5963f6f5fe82c0f404e", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T16:40:00+08:00"}, {"title": "Épi：可跨会话持续推进研究、靠累积经验自我进化方法的自主科研智能体，产出 120 项数学/构造纪录，并给出 Tuza 猜想一类特殊情形的计算机辅助证明", "url": "https://huggingface.co/papers/2610.24944", "source": "Hugging Face Daily Papers / arXiv", "date": "2026-10-21", "summary": "Épi 结合持久研究历史、分层记忆、分支探索与独立审查，实验跨会话运行并由固定验证器评估：取得 20 项数值界与 100 项构造纪录，如 n 皇后常数区间收窄约 84 倍、四次 Feigenbaum 吸引子维数的严格区间收窄逾 360 万倍，并证明 Cohn-Elkies 线性规划界在 10、11 维不可能达到最优。轻量版 Épi-turbo 在 30 个 FrontierOR 运筹任务上总分比 Codex 高 5.4%，成本仅为其 64%（同底座模型）。", "id": "29c820c4703d0679673177627c47d15eaa4a91c7", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T15:35:00+08:00"}, {"title": "SparkLLM 开源端侧模型 Spark-X2.6-4B：架构与 X2.5 相同、仅靠改进后训练增强编码/智能体/长上下文能力，支持 none/low/high 三档思考预算，Apache 2.0", "url": "https://huggingface.co/XHToken/Spark-X2.6-4B", "source": "Hugging Face", "date": "2026-10-21", "summary": "官方称其在同尺寸开源模型中领先，多项基准持平或超过约 9B 模型；高思考档下 BFCL-V4 71.8、MCP-Atlas 62.4、BrowseComp 53.1、SWE Pro 54.3（厂商自测），推理效率与 Qwen3.5-4B、Gemma-E4B 相当或更好。权重同步上架 ModelScope 与 Ollama（ollama run SparkLLM/Spark-X2.6-4B），并提供 vLLM、SGLang 部署指南及 GGUF 版本。", "id": "0043ec56a51a0cf261821c29d20d1b9c0bebb65d", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T15:35:00+08:00"}, {"title": "傅利叶执行器团队出身的钟雪岗创办深圳具身 lab-s-frontier-ai-development", "source": "Firmus Newsroom / The Information", "date": "2026-10-21", "summary": "根据多年期协议，Thinking Machines Lab 将在 Firmus 基于英伟达 GB300 的 AI Factory 上训练并部署下一代模型，金额未披露；这是 Firmus 本月撤回澳洲大型 IPO 后的首个大单。英伟达已是 Firmus 股东，若追加投资将再次体现其对高负债 neocloud 的托底，也引发“需求依赖供应商融资”的质疑。", "id": "774b5183a5f775d01e80c5a21364a6746c2a331b", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T12:26:00+08:00"}, {"title": "松下与 UCLA 提出面向手机智能体的“语义世界模型”：用自然语言预测操作引起的界面变化来选动作，AndroidWorld 任务成功率由 46.9% 提升至 54.3%", "url": "https://news.panasonic.com/global/press/en261021-2", "source": "Panasonic Newsroom", "date": "2026-10-21", "summary": "团队构建约 140 万样本的训练集 MobileWorld（约 94.2 万条界面变化描述与 54.3 万条问答）及评测基准 MobileWorldBench；不再逐像素预测下一屏，而是预测“按下按钮会打开设置页”这类与任务相关的状态变化，从而忽略时间、通知等无关信息。用 MobileWorld 微调的 Qwen3-VL-8B 在基准上得分最高，论文将在 EMNLP 2026 发表。", "id": "d696dbce85166bbe380ae7df794047549e04ae75", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T12:26:00+08:00"}, {"title": "前豆包 PC 端负责人齐俊元创办的此间无限（Today AI）累计融资 2 亿美元，IDG、腾讯、蚂蚁、红杉中国、五源、传音等参投", "url": "https://www.163.com/dy/article/L9OSHEM2051180F7.html", "source": "智东西 / 网易", "date": "2026-10-21", "summary": "公司成立于 2026 年 3 月，个人 AI 助手 Today 国内版 9 月 25 日上线，覆盖 iOS、安卓、Windows、Mac、Linux，可主动记录日程、工作项目、学习计划与健康情况，已接入企业微信、微信读书、百度网盘、金山文档、腾讯会议等。齐俊元曾创办 Teambition（2019 年被阿里收购），后任飞书产品副总裁、豆包 PC 端负责人，2025 年 11 月离开字节。", "id": "a4b65d3c7cdbff57814f3afbe370549928674966", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T12:26:00+08:00"}, {"title": "李泽湘系团队 Flowtica 完成数千万元新融资（祥峰、源码、五源、清水湾），推出磁吸手机背面的墨水屏 Agent 硬件 Verso", "url": "https://www.163.com/dy/article/L9ORAJ2Q05118DFD.html", "source": "36氪 / 网易", "date": "2026-10-21", "summary": "Verso 厚 6.5mm、重 78g，正面常显墨水屏，配 4 麦克风阵列与骨传导传感器，可盲操录音、一键 Ask AI，定位“个人上下文操作系统”，打通会议、日程、待办与邮件；本周开启定金预售，12 月首批出货。其首款 AI 录音笔 Scribe 发货后有 42% 激活用户转为订阅付费。", "id": "1a1c9dc4ce80e5b57d1483d18f775f83ced7e311", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T1 %，但同样颗粒可多支撑约 50% GPU 出货。", "id": "7e88b9c0f69c91731753bf53514300919e8df26b", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T07:35:00+08:00"}, {"title": "ThoughtSpot、Nutanix 联合创始人 Ajeet Singh 新公司 Different 走出隐身：获 General Catalyst 领投 4800 万美元种子轮，做端到端运行 B2B 需求生成的 AI 营销系统", "url": "https://www.prnewswire.com/news-releases/different-emerges-from-stealth-with-48m-for-ai-that-runs-demand-generation-for-lean-b2b-marketing-teams-302913497.html", "source": "PR Newswire", "date": "2026-10-20", "summary": "Lightspeed、Together Fund 等参投。Different 在一个闭环中规划营销活动、生成并投放广告、邮件与落地页，并提供答案引擎优化（AEO），基于企业策略、品牌与历史结果的共享记忆持续跨渠道优化，所有内容上线前由营销人员审批；口号是“让 5 人营销团队做 50 人的事”。客户 Descope 称借此识别并重新分配了约 60% 浪费在错误定向上的付费投放。", "id": "ecf29c9c76af7b4d40d44677980ffa2a0c990e27", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "AMD 与英特尔罕见联手：把各自 x86 CPU 的 PyTorch 优化统一到开源库 oneDNN，并定为 PyTorch 内 x86 加速默认库；AMD 将 ZenDNN 并入 oneDNN 并加入 UXL 基金会指导委员会", "url": "https://newsroom.amd.com/news/amd-intel-collaborate-simplify-ai-development-on-x86-cpus-pytorch/", "source": "AMD Newsroom", "date": "2026-10-20", "summary": "合作由 x86 生态咨询组推动，目标是让开发者通过同一条软件路径在 AMD 与英特尔 CPU 上获得优化的 PyTorch 性能，减少分别适配与重复维护。双方还在合作开发面向 x86 的下一代指令集扩展 AI Compute Extensions（ACE），重点加速矩阵乘法，未来将通过 oneDNN 更新接入 PyTorch。红帽 PyTorch 大使 Stephen Watt 称这是消除生态碎片化的重要一步。", "id": "f975cb55d7d5eea2eb4528ed3edf924c6c9f131f", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T17:24:00+08:00"}, {"title": "Lafa（Large Flow Language Models）：把连续流匹配语言模型扩展到 8B 参数，从预训练自回归模型改造、不足 300 亿 token 训练，自推测解码吞吐达同等质量自回归模型的 2.54 倍", "url": "https://arxiv.org/abs/2610.28559", "source": "arXiv", "date": "2026-10-20", "summary": "Lafa 采用分块流模型：前缀用因果注意力，块内做双向、异步的流生成，可复用前缀缓存并按块并行解码；在 0.5B、7B、8B 规模上，指令遵循、推理与代码质量持平或超过自回归基线，并可蒸馏为一步/少步生成。作者发现流训练反而通过“多 token 预测效应”保留甚至增强原模型能力，据此在单一模型内用自回归方式校验流式草稿，效果优于 MTP 与离散扩散方法。", "id": "5b21354fdfc9b6b8295e455c933fda8d04a96237", "module": "research", "module_name": "研究与论文", " l-Year-2027-Preliminary-Business-Update/default.aspx", "source": "Supermicro", "date": "2026-10-20", "summary": "该季度截至 9 月 30 日，数据为未经审计的初步结果。路透援引 LSEG 数据称分析师平均预期为 152.3 亿美元；毛利率也高于此前 10.4%–10.8% 的指引，公司归因于客户与产品结构。正式财报电话会定于 11 月 3 日。", "id": "fef8fb07d00f77942724e0b9f7568e39c346247e", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T06:35:00+08:00"}, {"title": "Hugging Face CEO Delangue 批 Netflix 纪录片《AI Gone Wild》失实：对 7 月 OpenAI 智能体入侵 Hugging Face 事件“极度拟人化、走末日路线”", "url": "https://techcrunch.com/2026/10/20/hugging-face-ceo-warns-that-netflixs-openai-hack-documentary-isnt-accurate/", "source": "TechCrunch", "date": "2026-10-20", "summary": "Delangue 称曾花两个多小时帮剧组纠错，但片子没有提到智能体缺乏隔离与监控、闭源模型安全机制阻碍了防御工作，以及 Hugging Face 用开源模型自卫；他重申完整的智能体轨迹至今未公开，企业须为其智能体行为负责。", "id": "fda7124672794d3fd201642e4a2314906f4d4a71", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T06:35:00+08:00"}, {"title": "Safety Mid-Training：在预训练与后训练之间加入“安全中训练”阶段，让安全与通用推理共享推理结构联合习得，平均攻击成功率相对基线降低 72%–81%", "url": "https://arxiv.org/abs/2610.26809", "source": "arXiv", "date": "2026-10-20", "summary": "作者认为安全对齐若只放在后训练，后续训练不含安全数据时容易退化，且常以牺牲通用能力为代价。方法是给定安全与实用提示，由基座模型生成结构化文档和推理轨迹，再用于中训练，把安全视为一种可学习的能力而非独立目标。", "id": "9a58720dd1c740d2a99ae4c2e87d4a4b1f173bd6", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T06:35:00+08:00"}, {"title": "WildAWM（Agent World Model in the Wild）：可扩展合成可控环境与任务来训练通用电脑操作智能体，环境同时支持 GUI、MCP 服务与命令行，全程只用开源模型", "url": "https://arxiv.org/abs/2610.26828", "source": "arXiv", "date": "2026-10-20", "summary": "针对直接在真实系统中扩展智能体交互学习既难又有安全风险的问题，WildAWM 构建可执行环境，让智能体灵活组合视觉交互、工具调用与代码执行，并处理任务合成中的可解性、难度保持等常见难题，证明无需闭源前沿模型也能生成高质量电脑操作环境。", "id": "f17ce8937169e60dc1332ad0620b3c3980fb5ff4", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T06:35:00+08:00"}, {"title": "EAGLE-4 发布：以 eagle-harness 形式提供的推测解码“灵活草稿模型”，可按批大小、硬件与负载自适应调整解码策略并保持目标模型输出分布，支持 SGLang、vLLM 与 TokenSpeed", "url": "https://pypi.org/project/eagle-harness/", "source" 26/10/20/spacexs-ai-business-is-beating-expectations/", "source": "TechCrunch", "date": "2026-10-20", "summary": "AI 业务涵盖新近收购的 Cursor 编码工具、Grok 及拥有 1.7GW 算力的新云业务，实现利润 4.31 亿美元（含 Cursor 收购相关 12 亿美元一次性股权激励）。季度资本开支 196 亿美元，CFO 称四季度将投入 350–400 亿美元，用于 Colossus II 与星舰；马斯克称每周有四天在孟菲斯推进 Colossus II，并认为超级智能部署的瓶颈在电力、散热与基础设施而非芯片。", "id": "38bd10c8e49d1d2ab4a085e37403f6612579ccbf", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "OpenAI 前 Preparedness 负责人 Aleksander Madry 结束“休假”回归，将与首席科学家 Jakub Pachocki 共同应对更强 AI 的安全与安保挑战", "url": "https://www.benzinga.com/markets/private-markets/26/10/62451821/openai-safety-expert-returns-after-months-away-citing-rising-ai-risks", "source": "Benzinga", "date": "2026-10-20", "summary": "Madry 今年 5 月离开 OpenAI，称当时想专注让 AI 更有用，但“我们已进入 AI 进展的不同阶段”，安全与安保必须成为核心优先事项。Pachocki 回应称自己关注 AI 进展的速度与影响应如何指导 OpenAI 及整个领域的战略，是他请 Madry 回来；奥特曼也发文致谢。Madry 此前曾任 MIT 可部署机器学习中心主任。", "id": "eae235d3fb4bc29af9d5f16fbfca52f30ea7758d", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "彭博：前谷歌 CEO 埃里克·施密特约持有 Anthropic 1% 股份，约为 CEO Dario Amodei（约 2%）的一半", "url": "https://techcrunch.com/2026/10/20/eric-schmidt-reportedly-owns-about-half-as-much-of-anthropic-as-ceo-dario-amodei/", "source": "TechCrunch / Bloomberg", "date": "2026-10-20", "summary": "施密特在 2021 年 A 轮（PitchBook 称当时估值 4.61 亿美元）投入数千万美元。Anthropic 预计年内上市，若按最高约 2 万亿美元估值计算，这笔股份价值约 200 亿美元；施密特其他 AI 投资还包括 Mistral、General Intuition 与 Reflection AI。", "id": "2f7a561d0868a8a6426cf94ced1808b5d853e38d", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "InfiniDream：VLM 驱动的开放式程序化 3D 世界生成，用“符号约束资产生成”借助现有程序化算法造出新的照片级资产，并保留可编辑性与按种子多样性", "url": "https://arxiv.org/abs/2610.26853", "source": "arXiv / Alaya Lab", "date": "2026-10-20", "summary": "针对 VLM 写代码生成的 3D 资产过于简单、而照片级程序化系统需大量手工开发的问题，InfiniDream 不再受限于预定义工厂与 API，可生成全新资产类型；同时构建端到端文生世界管线，把语义场景规划与程序化资产结合，生成开放式照片级 3D 世界，适用于合成数据与游戏开发。", "id": "54113f2bc6a58b86be103032b69302fdd4402d26", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "Manga2Animate：多智能体框架把现有漫画忠实改编成动画——先产出动画脚本与视觉分镜两种中间表示，每步由创作智能体生成、审阅智能体对照原漫画画格把关", "url": "https://arxiv.org/abs/2610.26851", "source": "arXiv / 阳明交通大学", "date": "2026-10-20", "summary": "现有方法要么只通过文字读取漫画、丢失角色与画风，要么把整页直接喂给视频模型导致剧情错误。Manga2Animate 让生成全程以原作为依据，通过表示特定的选择机制与双层反馈逐步细化脚本与分镜后再合成动画，实验与用户研究显示在忠实度上优于基线。", "id": "30a7c97540c621da57da4632153c4232a7c75760", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "英伟达开源 Cosmos3-H-Dreams：首个基于真实胆囊切除手术录像训练、支持实时运动学控制的生成式手术模拟器，单张 RTX PRO 6000 即可交互运行", "url": "https://huggingface.co/blog/nvidia/cosmos3-h-dreams", "source": "Hugging Face / NVIDIA", "date": "2026-10-20", "summary": "基于 16B 的 Cosmos3-H-Embodied-Nano，在 CMR Surgical Versius 平台的临床视频与机器人运动学数据上专门化，使用 28 维动作（双臂位姿、夹爪、能量控制等）；通过 Self-Forcing 蒸馏出 4 步与 2 步两个实时学生模型，借助 FlashDreams 流式推理与 FadeMem 缓存压缩支持长时间推演。代码、权重与微调蒸馏教程均已开放；英伟达强调其为研究用模拟器，不用于临床。", "id": "4eb9f7080b11166ecabe823c8b93aa97e58d2978", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "Gathin23/cleanyourtv", "url": "https://github.com/Gathin23/cleanyourtv", "source": "GitHub", "stars": 11257, "stars_week": null, "language": "Java", "date": "2026-10-20", "summary": "通过 Wi‑Fi 给任意 Android TV / Google TV 去除预装臃肿软件，并换上类 Apple TV 的干净桌面：把仓库里的 PROMPT.md 粘贴给 Claude Code、Codex 或 Gemini CLI，由编码智能体在局域网发现电视、识别该品牌的广告与预装包并逐一询问后处理；无需 root、不卸载任何东西，一行命令即可还原，README 附上百款已验证机型。", "why": "10 月 17 日创建，四天约 1.1 万星，是本周新建仓库星标第一，也是“用 AI 智能体给电视去广告”这波热潮中最火的项目。", "id": "ab0e470b36e49b22d49ee5e563c3d92c246221aa", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "soumatheusgomes/editonny", "url": "https://github.com/soumatheusgomes/editonny", "source": "GitHub", "stars": 274, "stars_week": null, "language": "Python", "date": "2026-10-20", "summary": "面向 Claude Code 与 Codex 的开源视频剪辑 Skill（MIT）：用自然语言让智能体剪掉停顿和口误、加字幕、修音频、重新构图，并把口播片段转成动态图形场景；转写与渲染全部在本地完成。", "why": "10 月 19 日开源，一天多约 270 星，进入近期新建仓库星标前列。", "id": "afbac499664dd9915ad30e6f7ccbec2803f12442", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "@TechCrunch", "url": "https://x.com/TechCrunch/status/2112657380064268409", "source": "@TechCrunch", "date": "2026-10-20", "summary": "据报 Anthropic 难以从日益把它视为竞争对手的云厂商处获得足够算力，而其基础设施支出正在 11 月计划 IPO 前急剧膨胀。", "metrics": {"likes": 2, "reposts": 0, "views": 3458}, "id": "38547c14c685ee15ca43bfa37cc7672d73191a68", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "@sama", "url": "https://x.com/sama/status/2112652656602923366", "source": "@sama", "date": "2026-10-20", "summary": "奥特曼感谢 Aleksander Madry 接受邀请回归 OpenAI：“在迈向超级智能的过程中，我们面临的安全与安保挑战极其巨大”，称 Madry 具备出色的技能来应对。", "metrics": {"likes": 831, "reposts": 29, "views": 78665}, "id": "79a61ce7b86bed8871e5f674ed2a26b1170673e6", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "@aleks_madry", "url": "https://x.com/aleks_madry/status/2112231448103239998", "source": "@aleks_madry", "date": "2026-10-20", "summary": "Madry 宣布重返 OpenAI：原以为的离职“更像一次休假”；AI 进展已进入新阶段，处理好更强 AI 的安全与安保挑战必须成为核心优先事项，他将加入首席科学家 Jakub Pachocki（@merettm）一同推进。", "metrics": {"likes": 1992, "reposts": 69, "views": 325003}, "id": "bf5dcd59ef4dc49bc942036fd8556d8607ebe6d6", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "谷歌把“Personal Intelligence with Gemini”带进汽车：Android Auto 今日起上线，可调用 Gmail、日历、地图、YouTube 和搜索记录给出个性化回答，Google Built-in 车型数月内跟进", "url": "https://techcrunch.com/2026/10/20/google-is-bringing-a-more-personal-version-of-its-gemini-ai-assistant-to-your-car/", "source": "TechCrunch", "date": "2026-10-20", "summary": "驾驶者需主动开启，可逐个选择连接哪些谷歌应用并随时关闭。例子包括导航去机场时提醒日历里的航班延误、一次追问同时回答登机口和是否准点。Gemini 去年 11 月进入 Android Auto，Personal Intelligence 今年 3 月在美国推出、目前在全球市场测试。", "id": "1935d2cf4e2ef2c32afbca05fc566dbdea2c9cd4", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T04:31:00+08:00"}, {"title": "万事达开放 Agent Pay for Machines 早期访问：基于开放支付协议 x402 并接入万事达网络，让 AI 智能体在授权预算内按用量购买数字服务，无需单独账户、API Key 或发票", "url": "https://www.pymnts.com/news/artificial-intelligence/2026/mastercard-debuts-tool-to-help-ai-agents-purchase-digital-services/", "source": "PYMNTS / Mastercard", "date": "2026-10-20", "summary": "万事达称该工具回答“谁授权智能体花钱、能花多少、花在哪、付给谁”等信任问题，并将在本周 Cloudflare Connect 上演示：营销公司 Hype 给智能体一个蛋白棒推广任务和预算，智能体通过 Discovery Service 找服务商、出方案供审批，完成 9 笔付款、涉及 2 家商户和 1 个预算。", "id": "fc3a67eb9f79b2d565ece1bdf118524d8a924041", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T04:31:00+08:00"}, {"title": "@TechCrunch", "url": "https://x.com/TechCrunch/status/2112635740584648919", "source": "@TechCrunch", "date": "2026-10-20", "summary": "谷歌把 Gemini 的 Personal Intelligence 功能带进汽车，AI 助手可调用 Gmail、日历、地图、YouTube 等谷歌服务，在驾驶时给出更个性化的回答。", "id": "4882f8d4476a384efa97b0b8c04dd9296cfd2d1a", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T04:31:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112638397177372745", "source": "@testingcatalog", "date": "2026-10-20", "summary": "Coco Labs 发布首个设计模型 Vyb：根据品牌官网生成分层、可编辑的营销图，每个元素独立成层，改标题无需重新生成整张设计。", "id": "4aff4b5692bdd313598fd5ee13e66dfdf21d1e13", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T04:31:00+08:00"}, {"title": "@theinformation", "url": "https://x.com/theinformation/status/2112642550490116297", "source": "@theinformation", "date": "2026-10-20", "summary": "The Information：CoreWeave CEO Mike Intrator 在股价大跌之际发内部备忘录为公司辩护，而借贷成本上升正威胁其为新 AI 数据中心融资的能力。", "id": "935cf2aea67a85d1b8aecd8dcd301570774e0fdb", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T04:31:00+08:00"}, {"title": "ChatGPT 上线“锁定聊天”（Locked Chats）：敏感对话可用四位 PIN、Face ID 或 Touch ID 上锁，面向 Free 到 Enterprise、Edu 全部套餐逐步推送", "url": "https://techcrunch.com/2026/10/20/chatgpt-now-lets-you-lock-your-chats/", "source": "TechCrunch", "date": "2026-10-20", "summary": "锁定后的对话移入独立的“Locked Chats”区，不出现在常规历史、置顶和搜索里；开启记忆时该区有一套独立记忆，锁定后的新消息不会写入常规记忆。OpenAI 说明上锁不等于端到端加密，也不改变数据保留期限或“改进模型”设置；重置 PIN 会永久删除所有锁定内容。临时、归档、群聊、分享链接创建的对话等不支持，ChatGPT for Healthcare 暂不提供。", "id": "6f64ba14f44d2e04ccf9ece7bb9a1c16a362ceae", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "OpenAI API 新增 12 小时提示缓存：共享指令、工具和上下文可缓存更久，请求间隔数小时仍按更低的缓存输入价计费", "url": "https://developers.openai.com/api/docs/changelog", "source": "OpenAI API Changelog", "date": "2026-10-20", "summary": "10 月 20 日更新日志显示，Responses API 可选择 12 小时提示缓存，12 小时缓存写入按输入 token 价格的 2.5 倍计费。OpenAI Devs 称这主要面向全天反复复用上下文的常驻智能体。", "id": "337afc339ead3cd20d75e452dff34fef176cb910", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "Bria 发布并开源 Fibo 2：8B 统一图像生成与编辑模型，全部使用授权数据训练，称在 Artificial Analysis 图像编辑榜位列开源权重第一", "url": "https://docs.bria.ai/whats-new/fibo-2", "source": "Bria AI", "date": "2026-10-20", "summary": "Fibo 2 Generate 与 Edit 权重已上 Hugging Face（如 briaai/Fibo-2.0-dev），Diffusers 首日支持；编辑可一次组合最多 4 张参考图，每次生成都返回结构化提示 VGL 便于复现与微调，新增 12 种画幅共 21 种。Bria 称其编辑效果优于 Ideogram、字节跳动和 Black Forest Labs 的闭源模型，文生图位列开源前二；API 接口不变。", "id": "fd2fa98fc88ee4e35b9388bff0103f59445fccdf", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "Semafor：Anthropic 游说国会的联邦 AI 安全法案草案外泄引发反弹，安全倡导者批其力度不够、抢占州法；OpenAI 首席全球事务官 Lehane 暗讽“没有哪家公司该独自制定规则”", "url": "https://www.semafor.com/article/10/20/2026/anthropics-leaked-ai-bill-sparks-backlash", "source": "Semafor", "date": "2026-10-20", "summary": "Anthropic 发言人称草案是其数月来推介的 AI 安全框架的立法版本，其一名高级说客已公开表示将调整草案，以更贴合 AI 进展速度并澄清其在联邦优先于州法上的立场。OpenAI 借机与对手划清界限，Lehane 周一发文称政策须经民主程序、由民选官员主导。", "id": "c42646dd03d2145745832bbd8d5e8c320638a843", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "HeyChengC/wallstreet-explainer", "url": "https://github.com/HeyChengC/wallstreet-explainer", "source": "GitHub", "stars": 310, "stars_week": null, "language": "Python", "date": "2026-10-20", "summary": "华尔街风格财经/科技解读短片 Skill：让 Claude Code 等编码智能体自己找真实发布会与新闻素材、抠出人物、把数字做成可视化镜头，按时间线逐帧渲染并自动混音，附 77 秒样片《AI 到底有多烧钱》。", "why": "10 月 18 日开源，两天约 310 星，是近期新建仓库中热度较高的中文 AI 视频生成 Skill。", "id": "9e405476ac4a6d0463a0bd5d770be072a8dcc912", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "@OpenAIDevs", "url": "https://x.com/OpenAIDevs/status/2112603916076781778", "source": "@OpenAIDevs", "date": "2026-10-20", "summary": "OpenAI 开发者账号宣布 API 可选 12 小时提示缓存：常驻智能体全天复用上下文，请求间隔数小时也能按更低的缓存输入价计费。", "metrics": {"likes": 1104, "reposts": 39, "views": 63592}, "id": "286ddd704e58166f4626420d44a067dd21def4c1", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112605106642600283", "source": "@testingcatalog", "date": "2026-10-20", "summary": "ChatGPT 锁定聊天开始向 Free、Go、Plus、Pro、Business、Enterprise、Edu 推送：网页和桌面端用 PIN，移动端可用 Face ID、Touch ID 或设备解锁。", "metrics": {"likes": 248, "reposts": 4, "views": 11508}, "id": "79ebbe15a5c59f21b60f2033233cfce22ce83431", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "@theinformation", "url": "https://x.com/theinformation/status/2112612337932812694", "source": "@theinformation", "date": "2026-10-20", "summary": "The Information：奥特曼称 OpenAI 需要弄清 AI 何时强大到无法安全开发或发布，内部代号“pacing 2.0”的工作将为可持续自我改进的 AI 系统设定界限。", "metrics": {"likes": 3, "reposts": 0, "views": 1923}, "id": "575e8be058908e9bc912045dea8cd5226599e4c5", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "谷歌 Gemini 推出小企业工具：新增商家专属落地页、营销与财务技能，可连接 Google 商家资料、Ads、Workspace 及 Adobe、Canva、Shopify、Xero 等应用", "url": "https://blog.google/innovation-and-ai/products/gemini-app/new-tools-small-business-owners/", "source": "Google Blog", "date": "2026-10-20", "summary": "谷歌称已有数千万小企业主在用 Gemini。新功能允许上传网站、品牌包、字体或配色定义品牌风格，搭配 Nano Banana 2.1 生成风格一致的营销素材并记住该风格；还能把杂乱的表格、收据和采购记录转成财务图表与交互模型。商家落地页、营销与财务技能及新连接应用将在未来几天面向全球所有 Gemini 应用用户陆续推出。", "id": "cbc887d67feaee019cbc714a3d0e083681c86e63", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "OpenAI 收购药物研发协同平台 Orchestra Bio：团队与技术并入生命科学模型与工具线 Rosalind，打造协调药物项目的智能体", "url": "https://openai.com/index/openai-to-acquire-orchestra-bio", "source": "OpenAI", "date": "2026-10-20", "summary": "Orchestra Bio 让科学家和项目负责人把研究与试验的监控、跟踪交给智能体，并在某个环节出问题（如一批生产失败可能推迟临床试验）时识别受影响的活动与时间线、汇总信息并比较应对方案。OpenAI 称将把它与 GPT-Rosalind、Rosalind Workbench 结合，帮助把科学发现更快推进为可上市的疗法；交易金额未披露。", "id": "dbaa902542534b3aef2de952931670bbaaa97f74", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Visa、BILL 与 Billtrust 启动首个可信 AI 智能体 B2B 支付实盘试点：经认证的智能体可端到端登录供应商门户完成已审批的发票付款", "url": "https://investor.visa.com/news/news-details/2026/Visa-BILL-and-Billtrust-Launch-First-Live-Pilot-for-Trusted-AI-Agent-Payments-Between-Buyer-and-Supplier-Platforms/default.aspx", "source": "Visa", "date": "2026-10-20", "summary": "BILL 的付款智能体通过 Visa 可信智能体协议（Trusted Agent Protocol）与智能体目录注册，使用令牌化支付凭证并受买方已批准的付款指令约束；Billtrust 侧据此识别并放行该智能体，可替代验证码等反机器人机制，无需共享门户登录。三方称智能体不做付款决策，只执行已获批准的付款，试点已在处理真实交易。", "id": "7b0400b2a99802a8cad4632c49a3cc27db98dbd5", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Meta 提出 RPL（检索程序学习）：让策略把搜索原语组合成带状态与控制流的可执行检索程序，4B 模型超过所有 8B 基线", "url": "https://ai.meta.com/research/publications/learning-to-program-retrievals-composing-search-primitives-via-reinforcement-learning/", "source": "AI at Meta", "date": "2026-10-20", "summary": "针对多步检索中固定管线或原子工具的局限，RPL 允许模型先广泛检索、处理中间结果再有选择地构建上下文；为解决稀疏奖励下的探索难题，提出“程序变异”：对 RL 采样到的次优程序做语法约束、经执行验证的局部改写并蒸馏回策略。在开放域问答上多跳任务提升尤其明显，语料级推理任务答案 F1 与文档覆盖 F1 均最高，同时显著减少上下文消耗与检索轮数。", "id": "62bf04ea7632706ea4e24f915a6216631c2ba4a3", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "IBM Research 发布 ALTK-Evolve：用学到的“行为准则”记忆，让 GPT-4.1 基础 ReAct 智能体在 τ²-bench 零售客服任务 Pass^4 达 67.5%，超过榜单所有条目", "url": "https://huggingface.co/blog/ibm-research/altk-evolve-bc", "source": "Hugging Face Blog / IBM Research", "date": "2026-10-20", "summary": "ALTK-Evolve 分析智能体在训练任务上的成功与失败，把经验提炼成简短的行为规则（如如何验证身份）追加到系统提示中，不更新模型权重。IBM 称准则同时提升能力与可靠性，最佳准则量因领域而异，性能提升主要多花 token 而非多轮次，且对前沿模型驱动的智能体同样有效。", "id": "94e7f4f5c0e52bb75e66cbfeaab71589104be947", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "蚂蚁百灵开源 Ming-3.0 语音系列五款模型：覆盖语音合成（支持文字描述音色与“导演模式”）、长音频理解与对话、语音识别", "url": "https://www.ithome.com/1/015/117.htm", "source": "IT之家", "date": "2026-10-20", "summary": "Ming-3.0-tts 系列可用文字描述或参考音频设定音色，并能说明台词的情绪变化、重读与节奏；Ming-3.0-audio-flash/tiny 可直接对长音频做转写、总结和观点分析并结构化输出，保留情绪与说话人信息；Ming-3.0-asr-tiny 结合热词与上下文提升识别，已用于阿福、支付宝搜索等业务。模型已上架 Hugging Face 与魔搭，Ling Studio 提供 API。", "id": "9519466b099115beeaf32d8e2946dd421b8d844d", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Meta 暂停 Muse 对话分享功能：安全公司 Claroc 通过公开 DNS 记录找出 6800 多个分享链接，曝光公司营收、贷款申请、员工日程等隐私内容", "url": "https://www.theverge.com/tech/1014627/meta-muse-ai-sharing-ai-chats", "source": "The Verge", "date": "2026-10-20", "summary": "据 Ars Technica 与 The Verge 报道，Muse 分享链接的主机名由对话标题加随机 ID 构成，链接被打开后会被被动 DNS 服务记录，研究者据此可重建链接并免登录查看数百段对话，其中包括一份与某前沿 AI 实验室负责人保密通话的准备笔记。Meta 发言人称已暂停该功能并评估如何改变链接被发现的方式；此前 ChatGPT、Claude、Grok 的分享对话也曾出现在谷歌搜索中。", "id": "f52190a49967b68da7ad63d8e5297c5a8a841b2d", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "交通运输部在北外滩国际航运论坛发布首批《水运领域人工智能应用场景指引》，同步公布 2027 年拟建成的十大智能体和十大垂类模型", "url": "https://www.yicai.com/brief/103400431.html", "source": "第一财经", "date": "2026-10-20", "summary": "10 月 20 日 2026 北外滩国际航运论坛在上海开幕。为落实《关于“人工智能+交通运输”的实施意见》、聚焦“一网四化”，交通运输部发布第一批水运领域 AI 应用场景指引（覆盖安全提升、提质增效、绿色转型三方面共 22 个场景），并公布到 2027 年拟建成的十大智能体与十大垂类模型，推动 AI 在港口、航运等水运领域的创新应用。", "id": "1bfeb95ea850e1916f43f24d4be92f8698d367b8", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "VictorTaelin/uniichat", "url": "https://github.com/VictorTaelin/uniichat", "source": "GitHub", "stars": 513, "stars_week": null, "language": "TypeScript", "date": "2026-10-20", "summary": "“永不结束的单一对话”AI 智能体（Apache-2.0）：每条消息被压缩成一行摘要并两两合并成二叉“记忆树”，每次调用看到最多 128KB 的全局视图，智能体可逐层展开回到原文，无需丢弃历史的压缩；可在自己的服务器用自有 API Key 运行。", "why": "10 月 19 日开源，作者称几乎全部由 AI 智能体编写和审查，上线一天多约 500 星，进入 GitHub 新建仓库星标前列。", "id": "2d7f88e32eabb540cc75c6b33e3cfa9c55d93a16", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "kitlangton/scrawl", "url": "https://github.com/kitlangton/scrawl", "source": "GitHub", "stars": 561, "stars_week": null, "language": "Rust", "date": "2026-10-20", "summary": "“给智能体看问题而不是描述问题”（MIT）：快捷键录屏，边说边点边画，结束后打包成带标注关键帧的缩略图、时间对齐的转写与交互时间线及结构化清单，供 Claude Code、OpenCode、Codex 等智能体直接读取；支持 macOS 与 Windows 预览版，并提供智能体技能安装。", "why": "10 月 14 日创建，近一周涨至 500+ 星，是本周增长最快的智能体辅助工具之一。", "id": "81c23db71773eedad69478e33889eb51d0efd99a", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "pengchujin/aerial-tv", "url": "https://github.com/pengchujin/aerial-tv", "source": "GitHub", "stars": 491, "stars_week": null, "language": "Kotlin", "date": "2026-10-20", "summary": "面向小米、TCL 等国产电视的开源 Android TV 桌面（MIT）：参照 tvOS 设计，无广告、无推荐流，开机自动接管并带 Apple TV 航拍屏保；README 推荐让编程智能体通过 ADB 帮你安装。", "why": "10 月 20 日创建、当天近 500 星，延续本周“用 Claude Code/Codex 给智能电视去广告”的 GitHub 热潮，是首个针对国产电视的版本。", "id": "e31af640f4c7bceb3b73e07e8c6aca62d17b896d", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "@OpenAI", "url": "https://x.com/OpenAI/status/2112607347688583586", "source": "@OpenAI", "date": "2026-10-20", "summary": "OpenAI 官宣收购药物研发协同平台 Orchestra Bio，将基于生命科学模型与工具 Rosalind 简化药物研发运营，帮助新疗法更快抵达患者。", "metrics": {"likes": 985, "reposts": 85, "views": 62032}, "id": "161a4dc6775c4225c8714f58c1745dcbfe912624", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "@theinformation", "url": "https://x.com/theinformation/status/2112597246042603587", "source": "@theinformation", "date": "2026-10-20", "summary": "The Information：奥特曼对员工称，AI 安全的一种路径可能是把最大的几家 AI 实验室合并成一个组织，但 OpenAI 与 Anthropic 都在冲刺 IPO，与对手协调恐怕很难。", "metrics": {"likes": 8, "reposts": 1, "views": 4796}, "id": "7b379e156a537c8368676d73df792e40045416b8", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112597259388850456", "source": "@business", "date": "2026-10-20", "summary": "彭博：随着美国各地反对 AI 的声音蔓延，保险公司 Arbol 押注数据中心开发商会购买保单，以弥补许可延误或项目被阻导致的损失。", "metrics": {"likes": 5, "reposts": 2, "views": 15908}, "id": "2f528bcdb661a5adc540bd3a699de975f89b5794", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T02:33:00+08:00"}, {"title": "Zoom 在 Zoomtopia 推出 AI 治理套件：集中式 AI 智能体管理、自定义 AI 护栏，以及实时“深度伪造风险检测”", "url": "https://news.zoom.com/zoomtopia-2026-security/", "source": "Zoom", "date": "2026-10-20", "summary": "Zoom 称 AI 智能体越来越多地接触会议内容与企业系统，管理员需要像管控其他关键系统一样管控 AI：集中式 AI 管理可查看组织内运行的智能体、访问的数据并审计其活动（预计 2026 年 12 月）；自定义 AI 护栏可阻止指定敏感信息出现在 AI 摘要中，并可要求人工审核（预计 2027 年 Q1）；与 Microsoft Purview 的敏感度标签同步已上线。深度伪造风险检测实时分析音视频信号，识别可能在 Zoom 之外被篡改的参会者画面或声音并给出置信度提示，面向招聘面试、客户沟通等场景，预计 12 月推出。", "id": "3060598f4bdebc466fcabc2f7710d50b92afa639", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Salesforce 宣布以约 56.6 亿美元收购 AI 营销平台 Braze：每股现金 47.50 美元，Braze 股价盘前飙升逾 50%", "url": "https://www.cnbc.com/2026/10/20/salesforce-braze-acquisition-deal.html", "source": "CNBC", "date": "2026-10-20", "summary": "Braze 周一收于 30.04 美元，消息公布后短暂停牌、随后大涨逾 50%；Salesforce 股价小幅下跌约 1%。交易预计在 Salesforce 2028 财年完成，尚需 Braze 股东与监管批准。Braze 提供基于 AI 的客户数据与消息触达工具；这是 Salesforce 继数月前以约 36 亿美元收购 AI 客服平台 Fin 之后的又一笔 AI 相关并购，也延续其 8 月与 Anthropic 扩大合作（推出 Claudeforce 插件）的智能体布局。", "id": "857b61bdc6beef201d12adade8198c8da71013c7", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Radical Numerics 发布多模态基因组语言模型 Omnii-1：AI 设计的噬菌体首次在“同情用药”途径下给到人类患者，用于治疗耐药菌感染", "url": "https://www.radicalnumerics.ai/blog/omnii-phage", "source": "Radical Numerics", "date": "2026-10-20", "summary": "由 Evo/Evo 2 原班人马创立的 Radical Numerics 称，Omnii-1 把 DNA、RNA、蛋白质等 28 类生物数据统一表示；团队针对 T7 噬菌体尾丝蛋白 gp17 生成变体，在 11–15 个氨基酸改动时 69.9% 的设计可成功“重启”，随机对照仅 4.8%。含 AI 设计噬菌体的鸡尾酒在体外清除了患者的耐药菌株，随后在医生主导、受监管的同情用药途径下给药；公司出于隐私未披露疗效，并强调单一病例不能证明安全性或有效性。Omnii 同时被用于生物防御，已与劳伦斯利弗莫尔国家实验室合作。", "id": "44add383a8c65c410669f22b6c6021c83c2e0dad", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Ai2 发布 FairStress 公平性基准：300 个双候选人决策场景扩展为 1300 多万测试用例，发现模型在被“说服”时更易为少数群体放弃正确决定", "url": "https://huggingface.co/blog/allenai/fairstress", "source": "Ai2 / Hugging Face", "date": "2026-10-20", "summary": "FairStress 覆盖招聘、医疗、贷款、教育、住房、刑事司法等 29 个领域，除看最终选择外，还用权威、共识、历史劣势等“对抗性前缀”测试模型改变决定的难易度。15 个模型上，隐含身份与显式标签时放弃正确答案的平均差距分别为 6.9 与 9.3 个百分点；Claude Opus 5、GPT-5.5 等前沿模型在难分高下的案例中约 60–65% 选择少数群体候选人，作者称之为“反刻板印象过度矫正”。9 种去偏方法中仅“反事实思维链”在基本保持准确率的同时缩小了不对称；基准将并入 Olmo-eval。", "id": "ca293d8533a3487d56775601759d9e248992e54a", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "llm-d 1.0 发布：红帽、IBM、谷歌主导的 Kubernetes 原生分布式推理栈进入生产就绪，新增多租户 QoS、零停机升级与面向智能体的路由", "url": "https://research.ibm.com/blog/llmd-1-0-is-ready-for-production-inference-serving", "source": "IBM Research", "date": "2026-10-20", "summary": "在 PyTorch Conference North America 上发布；llm-d 由红帽、IBM、谷歌与 CoreWeave、英伟达去年共同创立，现为 CNCF 沙箱项目，可在 vLLM 或 SGLang 之上提供前缀缓存感知路由、KV 缓存跨 GPU/CPU/存储卸载、预填充/解码分离与宽专家并行。1.0 重点是“第二天运维”：稳定 API、流控与优先级、多轮请求固定到已有缓存的副本。IBM 称在智能体编程负载中前缀路由捕获了 97% 的可复用缓存，并演示自托管同时运行 3000 个软件工程智能体，成本为调用同一开源模型托管服务的 1/5 到 1/10。", "id": "8a14a92d09a13dfe8a35388e6cc0dd329d173be2", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "Politico：OpenAI 不再推动对华严格芯片出口管制，国会对华鹰派拟在跛脚鸭会期把限制条款塞进国防授权法案时失去这一行业盟友", "url": "https://thenextweb.com/news/openai-china-chip-export-controls-retreat-nvidia", "source": "TNW / Politico", "date": "2026-10-20", "summary": "据 Politico 援引国会助手与说客，OpenAI 去年多次公开支持严格限制先进芯片对华销售，如今在相关议题上保持沉默；一名国会助手称“沉默就是在替英伟达干活”，一名说客称“目前没人想挑战总统”。此举被视为利好反对新限制的英伟达，并使 OpenAI 更贴近特朗普政府立场；英伟达今年 2 月完成对 OpenAI 300 亿美元股权投资。OpenAI 发言人称美国实验室在先进芯片上保持大幅领先是关键，有效的出口管制政策是更广泛战略的一部分；Anthropic 则继续支持多项芯片法案。", "id": "977d0606ec3e001ad147180992f32dcbd44b45c6", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "国家数据集团有限公司在雄安新区成立：丁薛祥出席揭牌，称组建该央企对把握人工智能发展先机、建设数字中国具有重要意义", "url": "https://www.gov.cn/yaowen/liebiao/202610/content_7083803.htm", "source": "中国政府网 / 新华社", "date": "2026-10-20", "summary": "新华社 10 月 20 日电，国家数据集团成立大会在河北雄安新区举行。丁薛祥要求公司深化数据要素服务、加快数据基础设施建设、加强关键核心技术攻关，在数据领域发挥战略性、引领性、支撑性作用，努力打造世界一流数据科技企业；各有关部门加大支持、相关企业协同合作，形成促进数据产业发展的合力。外媒将其解读为中国把 AI 训练所需的数据资源统筹到一家国资平台。", "id": "377f24af829d8c4f44a8e177982233bf3d3da9bf", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title": "彭博：智谱 Z.ai 四位联合创始人曾参与由中国通用技术研究院（CGTRI）共同资助的研究项目，英国军情五处称该机构与国家安全部关系密切", "url": "https://qz.com/z-ai-founders-research-cgtri-mi5-spy-agency-102026", "source": "Quartz / Bloomberg", "date": "2026-10-20", "summary": "据彭博，该项目 2018–2021 年执行、获批经费 294 万元，由 CGTRI 与国家自然科学基金共同资助，目标是开发解析社交媒体帖子、识别重要事件并绘制人物关系的 AI 软件；清华教授、智谱联合创始人李涓子为负责人之一，唐杰、许斌与 CEO 张鹏以合著者、共同发明人或软著权人身份出现。军情五处 9 月 30 日的预警未点名智谱；中国驻英使馆称其说法“毫无根据”，智谱未回应置评。智谱今年 1 月在港上市，市值约 320 亿美元。", "id": "e99d5e06478a2e057638b0c8ea15176a8c20cf26", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T01:35:00+08:00"}, {"title 0ms；Voxtral Speech 3 可按语境调整情绪、语速与重音，每百万字符 13 美元，Pro Voice 用 30 分钟音频复刻声音风格。新 SDK 基于 LiveKit，把听、推理、调工具、说串成单条流式管线，每轮响应不到 1 秒，支持 SIP 与 WebRTC；可走欧盟托管 API 或自部署。Artificial Analysis 称 Small Transcribe 3 位列其语音转文字榜第 3。", "id": "afe5d96a9d4684fb96de500346e2384550461c1d", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Perplexity Computer 新增 Mac 端侧模式：智能体与模型全部在本机运行（Qwen 3.6 或后训练的 PPLX Pro），可离线操作本地应用与文件，建议 36GB 以上内存", "url": "https://www.theverge.com/ai-artificial-intelligence/1014400/perplexity-computer-can-now-run-fully-offline-on-mac-but-youll-need-a-lot-of-ram", "source": "The Verge / Perplexity", "date": "2026-10-20", "summary": "据 The Verge，更新后用户可在不把数据传到云端的情况下跨原生 Mac 应用和本地文件执行任务，借助 Apple Silicon 在本机跑模型；需要最新信息或浏览器操作时，也可把部分任务转交云端。功能已在 Perplexity Mac 应用上线。", "id": "363545536b262f65f9c67f6f665974dea7fe8c02", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "关键基础设施 AI 公司 ASI（原 Air Space Intelligence）完成 3.25 亿美元 C 轮、估值 30 亿美元，Spark Capital 领投，Citadel Securities、a16z 等参投", "url": "https://www.financialcontent.com/article/bizwire-2026-10-20-asi-secures-325m-series-c-at-3b-valuation-to-power-americas-critical-infrastructure-with-ai", "source": "Business Wire / Bloomberg", "date": "2026-10-20", "summary": "ASI 用持续前向仿真为空管、电网、国防后勤等预测未来数小时至数周的态势。公司今年 6 月获美国交通部/FAA 8.75 亿美元国家空域系统现代化项目，美国陆军另授予 9900 万美元合同用于下一代指挥控制（NGC2）；客户还包括达美、阿拉斯加与联合航空及 National Grid。新资金将用于能源、物流和战术边缘部署，并扩充波士顿的前沿 AI 研究团队。", "id": "16abd587bb31f7db9b192447a66dc3f6cf6772e2", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Meta 独立 AI 助手 Muse 上线约 40 天在美国下载量突破 1000 万，Sensor Tower 称其是第 12 款在 40 天内达成该里程碑的应用", "url": "https://www.theverge.com/ai-artificial-intelligence/1014440/metas-muse-ai-hits-10-million-us-downloads", "source": "The Verge / Sensor Tower", "date": "2026-10-20", "summary": "Muse 于 9 月推出。Sensor Tower 认为其增长部分得益于 Meta 规模可观的广告投放。", "id": "f413c53ffdff60445755dd1c17837ac404df9721", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Spotify：过去一年已从推荐中移除逾 5000 万首被认定为 AI 劣质内容或垃圾的歌曲，并调整推荐系统更多突出人类音乐人", "url": "https://www.theverge.com/entertainment/1014284/spotify-ai-slop-spam-songs-removed", "source": "The Verge", "date": "2026-10-20", "summary": "Spotify 称编辑也不会为这类内容编排歌单，调整后听众相关投诉明显下降。它没有强制给所有 AI 曲目加标签，而是推出“AI Persona”标识，用于以 AI 身份出现、不代表真人的艺人，并且不推荐此类音乐；判定依据包括收听互动与反馈、上传模式、元数据及第三方 AI 检测工具。同时它正与环球音乐、Believe 合作推出 AI 混音创作工具。", "id": "e85a4c5da2af52ae78ebcd6df6fef324bcd51cb3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Electric Plant 获 1120 万美元种子轮：自研“植物电信号大模型” Bombadil，读取茎干内微伏级电信号判断约 125 种植物的需水、需肥与光照状况", "url": "https://techcrunch.com/2026/10/20/plants-can-speak-using-electricity-so-this-startup-built-an-ai-model-to-decipher-their-language/", "source": "TechCrunch", "date": "2026-10-20", "summary": "本轮由 Onto Ventures 与 Climactic 领投。传感器约折叠 iPhone 大小，用不锈钢螺钉接入形成层，每英亩只需几枚，单价几十美元，远低于动辄上千美元的现有设备；数据经低功耗无线网络上传，由云端 Bombadil 解读后回传给种植者调整灌溉与施肥。公司称可在增产的同时节水 20% 以上。", "id": "5130abca4141f29e7b41918cc604c981206a7152", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Mind Lab 提出 BrainLoRA：用 LoRA 参数高效微调最大 104B 的多模态骨干预测大脑神经响应，在 Algonauts 2025 取得已发表最佳成绩，200+ 适配模型集成登顶公开榜", "url": "https://arxiv.org/abs/2610.26802", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "研究利用骨干网络的因果结构一次前向预测多个时间点，取代滑动窗口，大幅降低特征提取成本；在九种多模态骨干上均提升脑编码表现，并在与此前 SOTA 相同的 Qwen3-Omni 骨干上胜出。适配后的模型仍可解释：模态归因能还原经典的感觉皮层分布，神经适配还提高了音频输入与跨模态混合的贡献。作者另写了多 LoRA 核以便在共享骨干上联合训练多个适配器。该文为 10 月 20 日 HF Daily Papers 票数最高论文。", "id": "d7638f10c57aaffb40c0fa212d410f13a03c4eb9", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "HarnessPro：无标签递归自改进智能体 Harness，同时优化性能与成本，按预算给出 lite/medium/heavy 三档；GPT-5.5+Codex 下 heavy 档较 RHO 通过率平均 +2.0 点、单任务成本 -26.1%", "url": "https://arxiv.org/abs/2610.26770", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "候选 harness 用 LLM 生成的测试评估，无需真值或官方测试；专门的智能体诊断执行轨迹、按不同性能—成本优先级规划改动并实现成候选，再用归一化加权平方距离挑出三档供下一轮迭代。实验覆盖 Terminal-Bench 2、SWE-Bench Pro 与 ProgramBench，GLM-5.2+Claude Code 组合下优势同样成立，代码已开源。", "id": "c2700c6d1f0dc5a08610e1a7d1f86bdbe885c914", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "美团 LongCat 提出 Interlock：把长程任务表示为带类型的“完成图”来合成训练任务，用自身通过的轨迹微调 Qwen3.6 后 AutomationBench 通过率 +4.0–4.5 点、JobBench +3.2–6.6 分", "url": "https://arxiv.org/abs/2610.19686", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "作者指出智能体常常“局部正确但任务没做完”。Interlock 用依据边连接公开证据与决策、用耦合超边施加跨组件联合约束、用实现边把决策连到所有必需的下游效果，再编译成可重置工作区、公开请求与评分细则，并做来源覆盖与公开输入两道审查；agent-as-judge 检查产物、跑校验脚本，只保留满足全部必选要求的轨迹。在 Harvey LAB 上细则通过率也提升 3.9–4.2 个百分点。", "id": "ae9b1450298238451f19ee24668e66e2c220942b", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Ornith 开源 Ornith-1.5-122B（MIT）：122B MoE，单台 DGX 即可部署并提供移动端量化版，TerminalBench 2.1 得 81.2、CyberGym 80.0", "url": "https://huggingface.co/ornith-ai/Ornith-1.5-122B", "source": "Hugging Face / Ornith", "date": "2026-10-20", "summary": "官方称其“强与快不再取舍”：基准更高、完成更快、输出更短，指令遵循、任务拆解与真实工作场景知识更强，为同等规模开源模型 SOTA。模型卡对比中，TerminalBench 2.1 略低于 Qwen3.8-Flash-Next（83.4）与 DeepSeek-V4-Flash-0731（82.7），CyberGym 则高于两者（78.0/76.7），NL2Repo 51.2。发布帖在 X 上浏览约 18 万次。", "id": "961c19e76e6ab3dae77129c44137b0e2f6f3e707", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "黄仁勋在柏林与德国总理默茨对谈：欧洲不应过度依赖监管，“行业不能蓬勃发展就没什么可监管的”，主张像监管互联网产品一样管 AI 应用而非底层技术", "url": "https://www.ithome.com/1/015/603.htm", "source": "IT之家 / Business Insider", "date": "2026-10-20", "summary": "据 Business Insider，黄仁勋过去一周先后访问法国、瑞典、英国和德国，为 10 月 20–22 日的 GTC Berlin 预热（主题演讲定于北京时间 10 月 21 日 17:00）。他称安全必须放在首位，但不能只靠监管大棒指望领先，“给德国一个机会，给这个行业一个机会”。默茨回应称完全不监管不对，过严的规则同样不可取；两人都把 AI 视为帮助德国走出经济低迷的可能途径。", "id": "9fd6103042fa7d85e4e4fc6eba771c6ce304fc5f", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "硬氪：AI 材料研发平台睿质科技完成数千万元天使轮融资，中关村资本领投；核心产品 Archeos 以多智能体串起文献检索、材料设计、计算仿真与报告生成", "url": "https://www.163.com/dy/article/L9M2GN2505118DFD.html", "source": "36氪 / 硬氪", "date": "2026-10-20", "summary": "睿质科技由院士、长江学者团队领衔，面向科研机构与工业企业提供材料计算、性能预测与研发服务，覆盖先进功能陶瓷、合金、新能源材料等领域，中关村科学城公司跟投，新一轮融资已在推进。公司目前结合平台工具与定制化计算服务（如某工业级合金性能预测项目），未来计划把仿真与实验验证结合，与产业客户联合研发，探索技术授权与收益分成。", "id": "86004464332eb5fff9f5ea33d62890d38a65b215", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "simbasjungles/free-my-tv", "url": "https://github.com/simbasjungles/free-my-tv", "source": "GitHub", "stars": 1195, "stars_week": null, "language": "Java", "date": "2026-10-20", "summary": "用 Claude Code 构建的开源无广告电视桌面，支持 Google TV、LG 与 Samsung 电视：常用应用置顶、每小时从已装应用里推热门内容、天气与行情卡片，无需 root，一键恢复原厂桌面，MIT。", "why": "10 月 19 日创建，一天多即约 1200 星；“用编程智能体给智能电视去广告”是本周热门话题（The Verge、IT之家均有报道），仓库 10 月 20 日仍在更新。", "id": "f097e65b6a7782ba8752869139b1d7a39262d3fb", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Ansub/tv-detox", "url": "https://github.com/Ansub/tv-detox", "source": "GitHub", "stars": 849, "stars_week": null, "language": "Java", "date": "2026-10-20", "summary": "让 Claude Code 或 Codex 帮老旧 Android TV 提速：提供一个精简无广告的桌面，外加让智能体清理预装应用与广告的提示词，MIT。", "why": "作者 Ansub Khan 的做法被 The Verge 专门报道；10 月 18 日创建，累计约 850 星，10 月 20 日仍有提交。", "id": "6a8bf93fd93a941c49bccea13fbc7942b2736420", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "dominikmartn/harp", "url": "https://github.com/dominikmartn/harp", "source": "GitHub", "stars": 178, "stars_week": null, "language": "Rust", "date": "2026-10-20", "summary": "基于开源 Warp 终端的非官方分支，把标签栏换成专为长时间运行编程智能体设计的侧边栏：并排运行多个 Claude Code 与 Codex 会话，标出哪个正在工作、在等你、已完成，支持分组，macOS，AGPL-3. 35", "source": "@theinformation", "date": "2026-10-20", "summary": "The Information 独家专访：五角大楼官员 Emil Michael 把呼吁加强监管的 AI 实验室比作“让别人把自己拦下的醉驾司机”，认为企业应为安全承担更多责任。", "metrics": {"likes": 3, "reposts": 0, "views": 1505}, "id": "7ef68b61cecf7a1336e64374e244dc63da2578dc", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-21T00:45:00+08:00"}, {"title": "Figma 首届印度 Config 大会新增 20 家 MCP 合作伙伴（含 Linear、Notion、Mistral、Meta Muse、OpenCode 等），联合创始人 Dylan Field 称 MCP“并不完美”、更有利于前沿实验室", "url": "https://techcrunch.com/2026/10/20/figma-co-founder-dylan-field-thinks-mcp-is-not-a-perfect-protocol/", "source": "TechCrunch", "date": "2026-10-20", "summary": "据 TechCrunch，Field 在媒体沟通会上表示 MCP 还有很大改进空间，Figma 不愿完全开放是因为通过 MCP 暴露的数据越多、被滥用的可能越高。此前他曾在 X 上质疑 Anthropic 作为 MCP 创建方并未通过 MCP 开放 artifacts 等云端资源，并称“非对称的上下文共享”问题被忽视；他随后表示 Figma 计划支持开源工具 Pi。", "id": "6fce357d7ac50eec9624db9deb75dd25abf63151", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "前 OpenAI 研究负责人 Bob McGrew 创办的制造业 AI 公司 Arda 首次公开：融资 2.3 亿美元、估值 15 亿美元，Altimeter、Accel 与 Khosla 领投，已与 Anduril 合作部署", "url": "https://www.cnbc.com/2026/10/20/ex-openai-executive-builds-1point5-billion-ai-manufacturing-startup-arda.html", "source": "CNBC", "date": "2026-10-20", "summary": "据 CNBC 独家报道，Arda 开发面向制造工程师的界面与智能体，McGrew 称其“为制造工程师做的事，就像 Claude 或 Cursor 为程序员做的事”，可在设计变更后更快重建产线自动化。公司混用自研模型、开源模型与部分前沿模型，联合创始人包括 Adept 联合创始人 Augustus Odena 及多名前 Palantir 工程师，机器人是下一步产品方向。", "id": "5c2af4ed7768bfbb308d3e1ab697418d9a64609b", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "AI 智能体沙箱云 Daytona 完成 6000 万美元 B 轮融资、估值 10 亿美元，FirstMark Growth 领投，Patrick Collison、Tobi Lütke、Aravind Srinivas 等跟投", "url": "https://www.daytona.io/dotfiles/daytona-raises-60m-series-b-to-build-the-agent-cloud", "source": "Daytona", "date": "2026-10-20", "summary": "Daytona 定位“智能体执行云”，为智能体提供毫秒级启动、可暂停保留状态、可分叉的计算环境，同时支持 Linux、Windows、macOS 与 GPU 沙箱；累计融资 9100 万美元，高通创投、三星 Next、Okta 种子轮，Smilegate 与 SenseAI Ventures 联合领投", "url": "https://siliconangle.com/2026/10/20/ai-startup-vectorial-lands-3m-in-funding-to-simulate-human-behavior-for-consumer-research/", "source": "SiliconANGLE", "date": "2026-10-20", "summary": "Vectorial 的平台用行为模型 SAPIENS 按目标人群模拟数千名用户，为产品与营销团队持续提供反馈；模型基于超过 250 万真实消费者的行为数据训练，公司称预测消费者行为比通用模型准确 30%、与真实用户研究对比准确率约 86%。客户包括 GoodRx 等，融资将用于扩充数据集并开发 SAPIENS 2.0。", "id": "48436f10018369036bda1c47f0222943b8cd403f", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "Anthropic：内部研究模型在 Claude Science 中约 64 小时基本自主地设计针对蝎毒神经毒素的蛋白小结合体，生成 31.8 万个设计，211 个送实验室测试后 17 个达标", "url": "https://www.anthropic.com/research/claude-scorpion-toxin-binder-design", "source": "Anthropic", "date": "2026-10-20", "summary": "项目与投资研究机构 Citrini Research 合作，检验非专家团队能否借 Claude 解决真实健康问题。研究模型只靠初始提示和 4 次追问完成设计，并在监督下分析数据、生成图表、起草报告；Adaptyv Bio 与 Twist Bioscience 做湿实验，17 个结合体分别结合四种对人类危险的蝎毒神经毒素。Anthropic 强调尚未验证能否在细胞环境中中和毒液，不声称做出了抗蛇毒血清，并公开全部 211 个设计及数据。", "id": "c021c28354e5e9fa746ec1a8d4bae08bd2f92401", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "CoworkEnv：按能力需求自动合成可执行的“AI 同事”长程训练环境，用其 SFT 后 Qwen3-VL-8B 在 Claw-Eval 平均分从 46.6 提升到 64.1", "url": "https://arxiv.org/abs/2610.24960", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "框架由工作流需求驱动任务构建，并用程序化校验与反馈修复检查生成的规格与评分逻辑；教师执行轨迹用于监督微调，学生交互产生强化学习所需的 rollout 与奖励，训练出小型 PocketWorker 模型。SFT 在多轮任务上提升 31.9 分，并可迁移到 ClawMark 基准；作者还比较了不同奖励处理与信用分配下的 RL 训练动态。", "id": "d14e769c2c8f439a71bb2651ff9c1288e5fa96ff", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T22:31:00+08:00"}, {"title": "Hugging Face 发布 AnyLanguageModel 1.0：可直接替换苹果 Foundation Models 框架的 Swift 库，同一套代码切换系统模型、llama.cpp/MLX/Core ML 本地开源模型与云端服务", "url": "https://huggingface.co/blog/anylanguagemodel-1-0", "source": "Hugging Face Blog", "date": "2026-10-20", "summary": "开发者只需把 import FoundationModels 改为 import AnyLanguageMode
