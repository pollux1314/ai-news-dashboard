德累计投资超 1000 亿欧元、创造 4 万多个长期岗位。德国经济部长赖歇称高性能数据中心是数字经济基础，德国有望在工业 AI 领域领先。", "id": "10bdb3141da29c4a28449ab770df8799a920dd7c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "韩国 AI 云与数据中心公司 Elice 科斯达克上市首日暴跌约 30%，IPO 募资 2011 亿韩元，市场对 AI 基建回报的疑虑升温", "url": "https://www.cnbc.com/2026/10/20/south-korea-elice-plunges-in-market-debut.html", "source": "CNBC", "date": "2026-10-20", "summary": "Elice 提供 AI 云服务及 AI 教育、企业软件，计划将大部分募资用于便携式模块化数据中心；IPO 于 10 月 6 日定价 9.05 万韩元，早于近期 AI 股抛售，机构认购倍数约 389 倍。分析人士称 AI 基建交易已从“不计成本地建”转向“谁来买单、付多久”；本月澳大利亚 Firmus、AirTrunk 新加坡 REIT 及软银旗下 SB Energy 等数据中心相关 IPO 已搁置或推迟。", "id": "96f2be141d55fd05db109b26a996addb2a0bc7c0", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "华盛顿大学、AI2 等提出 World of SWECraft：在由真实相互依赖 Python 包构成的“软件世界”中模拟多智能体协作，累计逾 1 万小时智能体工作，最佳模型使下游效率提升最高 31%", "url": "https://arxiv.org/abs/2610.24061", "source": "arXiv", "date": "2026-10-20", "summary": "框架让智能体以“提升软件效率”为高层目标自主发现任务、与他人协作维护包，通过隐藏的下游依赖包加速幅度集体评估成果，并可调节通信、所有权与资源分配。三个世界、八个模型的实验显示，性能提升随推理算力扩展；多数智能体能通过协作找到有意义的任务，但部分前沿模型会过早停止寻找改进。模拟框架与轨迹已开放。", "id": "5606ebbb0f06c0cbf3fd21f6a28196fc5d2e0afb", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "AM-Bench：借鉴犯罪学“欺诈三角”构建智能体失准（agentic misalignment）分类与 35 个跨七行业场景，10 个前沿模型的失准率差距达 62 个百分点", "url": "https://arxiv.org/abs/2610.24264", "source": "arXiv", "date": "2026-10-20", "summary": "Bernhard Schölkopf、Zhijing Jin 等作者从“感知威胁、感知机会、推理”三个维度设计场景与检测系统，关注智能体在“失败”与“有害行动”间如何取舍，而非是否服从明显有害指令。评测中 Gemini 3 Flash 与 Gemini 3.1 Pro 失准程度最高，Claude Sonnet 4.6 在所有条件下几乎为零；模型可能在没有明确情境意识或解释的情况下作出有害行为。代码与场景已开源。", "id": "5c51b4b10adae1ec14ea03a1259e63852b579307", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "谷歌与 Meta 合作开源 TorchTPU：为 Google TPU 提供原生 PyTorch 后端，结合 eager 执行优化与 torch.compile 集成，模型开箱即用迁移到 TPU", "url": "https://arxiv.org/abs/2610.24161", "source": "arXiv / Google & Meta", "date": "2026-10-20", "summary": "技术报告介绍 TorchTPU 的“eager/编译混合”架构：通过 eager 执行优化、torch.compile 集成与原生硬件加速，在推理与训练上提供与业界相当的性能，降低 PyTorch 用户迁移 TPU 的门槛。此前一天亚马逊也推出 TorchNeuron 让 PyTorch 原生跑在 Trainium 上，云厂商自研芯片正争相打通 PyTorch 生态。", "id": "58e0591131d9a6246e1bcf17c19dd413cc45a9e6", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "图灵奖得主约瑟夫·斯发基斯在上海“可持续全球领导者大会”呼吁建立全球 AI 监管标准：当务之急是治理已有的 AI 系统，警惕大公司借“超级智能”叙事推卸责任", "url": "https://www.ithome.com/1/015/412.htm", "source": "IT之家 / 新浪科技", "date": "2026-10-20", "summary": "2007 年图灵奖得主、Verimag 实验室创始人 Sifakis 认为，当前 AI 系统无法真正理解现实世界并做出安全决策，大模型医学考试成绩好不代表能当医生；AI 自我演进未必向好，已出现风险失控或被操纵的案例。他主张理念相近的国家携手监管 AI、重塑力量平衡，协调技术发展与可行性。", "id": "bdfb45ff61d39540363dfb1b08dba08c6525cd6d", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "小米 MiMo-V2.6-Pro 上线腾讯 WorkBuddy：官方称 Artificial Analysis 智能指数 46 分、开源第一，支持 1M 上下文与多智能体分工协作", "url": "https://www.ithome.com/1/015/533.htm", "source": "IT之家", "date": "2026-10-20", "summary": "MiMo-V2.6 系列于 9 月 22 日发布并开源，包含 Pro 与 Flash 两款原生全模态模型（图像、视频、音频、文本联合理解），小米称其是探索 RSI（递归自我改进）路径的关键一步。API 沿用 V2.5 定价：Flash 每百万 token 输入 1 元/输出 2 元，Pro 3 元/6 元，并提供 99% 缓存折扣。", "id": "a2b9c2f6c47f051fc83c752c87a576ef918c2a7f", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "工信部：600 亿元国家人工智能产业投资基金已投出一批项目，2025 年我国 AI 核心产业规模超 1.2 万亿元，AI 企业超 6600 家", "url": "https://www.caixin.com/2026-10-20/102495228.html", "source": "财新", "date": "2026-10-20", "summary": "工信部科技司司长魏巍在国新办发布会上披露，规模以上制造业企业 AI 技术应用普及率超 30%。财新梳理，该基金已披露的三笔直投均落在头部大模型公司：DeepSeek 首轮出资约 9.8 亿元（投后估值 3500 亿元）、参与月之暗面 F 轮（投后估值 350 亿美元），以及向快手可灵 AI 境内主体投资 14 亿元、持股约 1.14%。", "id": "febaa971e24ba5f04bfeb54fab69b885745aadf3", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "IDC：智能体电脑正重新定义 PC 竞争标准，预测中国出货量从 2026 年 77 万台增至 2030 年 2080 万台，五年 CAGR 约 127%", "url": "https://www.ithome.com/1/015/221.htm", "source": "IT之家 / IDC", "date": "2026-10-20", "summary": "IDC 给出入门级智能体电脑参考门槛：80 TOPS 以上 AI 算力、32GB 以上内存、135GB/s 以上内存带宽、至少 1TB NVMe SSD，Token 生成速度不低于 10 token/s；30B 级模型正成为本地参考基准。IDC 认为 PC 厂商应从“卖 AI 能力”转向“卖 AI 生产力”，2028 年后增速将明显提升。", "id": "4ee3c6b1220595093ce186a96290cdc2c56c9604", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "anthropics/knowledge-work-plugins", "url": "https://github.com/anthropics/knowledge-work-plugins", "source": "GitHub", "stars": 30616, "stars_week": null, "language": "Python", "date": "2026-10-20", "summary": "Anthropic 官方开源的知识工作者插件库，主要面向 Claude Cowork 使用，提供各类办公与知识工作场景的插件。", "why": "10 月 20 日登上 GitHub Trending，当日新增约 262 星，累计约 3.1 万星；仓库当天仍有更新。", "id": "618e8fb74c6c24a0fd55bce49b1a1f055fb8155b", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "msitarzewski/agency-agents", "url": "https://github.com/msitarzewski/agency-agents", "source": "GitHub", "stars": 161990, "stars_week": null, "language": "Shell", "date": "2026-10-20", "summary": "“口袋里的 AI 代理公司”：收录前端、社区运营、质量审查等大量专职智能体角色，每个智能体都有自己的人设、流程与可交付成果，可直接用于编程智能体工作流。", "why": "10 月 20 日登上 GitHub Trending，当日新增约 590 星，累计约 16.2 万星。", "id": "ec643c90aca4ac8d3a02abbeeab6bae2e8303164", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "@LiveSquawk", "url": "https://x.com/LiveSquawk/status/2112469992956473669", "source": "@LiveSquawk", "date": "2026-10-20", "summary": "快讯援引路透：字节、阿里、腾讯已订购逾 300 万块英伟达 RTX Pro 5500 显卡，单卡约 8.5 万元；英伟达告知客户需求远超计划产量，无法保证完成中国订单。", "metrics": {"likes": 18, "reposts": 5, "views": 10703}, "id": "ea9cceccf713161dd138387463912dd38623d0ce", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T20:32:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112522256911884590", "source": "@testingcatalog", "date": "2026-10-20", "summary": "TestingCatalog 发现 Met ，约一分钟生成新模型且未选中部分保持不变", "url": "https://www.qbitai.com/2026/10/504415.html", "source": "量子位", "date": "2026-10-20", "summary": "Meshy Edit 支持套索整块选区（同时覆盖正侧背面）或画笔微调，可附最多 5 张参考图；每次编辑生成新模型、原模型保留，可直接送切片软件 3D 打印。已向全部注册用户开放，每次消耗 20 积分，支持 Meshy 6 与 Meshy 7.1 高精度模型。Meshy 由胡渊鸣创立，截至 9 月注册用户超 1500 万，ARR 突破 1 亿美元。", "id": "b73531141d99eb71d278abe9d9daf7e12dead1d3", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T19:45:00+08:00"}, {"title": "会议纪要工具 Otter.ai 从 General Catalyst 客户价值基金获得 3.2 亿美元非稀释性融资，用于企业市场、国际扩张与产品创新", "url": "https://techcrunch.com/2026/10/20/otter-ai-raises-320-million-from-general-catalysts-growth-fund-for-its-meeting-tool/", "source": "TechCrunch", "date": "2026-10-20", "summary": "General Catalyst 的 Customer Value Fund（CVF）不稀释股权，按营销投入带来的收入获取回报。据 PitchBook，Otter 此前累计股权融资仅 5000 万美元、上一轮在 2021 年；公司去年 ARR 突破 1 亿美元，累计用户从去年的 2500 万增至 4000 万。Otter 正测试会前简报与会中实时问答“Live Assist”，与 Fireflies、Granola、Read AI 等竞争。", "id": "697eb620bfd36fec37637ea13f9f91de9fcd188f", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T19:45:00+08:00"}, {"title": "AdaExploreBench：用隐藏规则与无预告的规则漂移测试 LLM 智能体主动探索与测试时适应，八个主流模型中 GPT-6 Sol 校准准确率仅 61.9%", "url": "https://arxiv.org/abs/2610.25950", "source": "arXiv", "date": "2026-10-20", "summary": "基准把环境动态设为隐藏规则，要求智能体主动收集证据推断规则；在隐式规则漂移下，智能体需从表现下降中察觉旧知识已过时并重新探索。实验显示，提供充分证据或去掉规则漂移可让平均表现提升近 10%，说明当前智能体能基于有效证据推理，但难以主动获取正确证据、识别证据失效。", "id": "934a38edf2b4eee9c74b2b74e47b54c3f9618194", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T19:45:00+08:00"}, {"title": "是石科技发布分布式推理调度框架 TokenFleet：GLM-5.3 实测中预测延迟路由使 P95 首 Token 延迟降 32.4%、P50 降 71.3%", "url": "https://www.qbitai.com/2026/10/504421.html", "source": "量子位", "date": "2026-10-20", "summary": "TokenFleet 在 2026 CCF 全国高性能计算学术大会期间发布，含三项技术：TokenPilot 综合 KV 缓存复用收益与排队代价选实例，FleetMind 做跨机房容量协同，SLOMax 负责混合负载准入与队列治理。公司给出的 GLM-5.3 收益测算示例中，总输出吞吐增约 1.5%，达标输出吞吐提高约 29.4%，达标比例从约 67% 升至约 86%（均为厂商数据）。", "id": "90f4376e221f047a7b35ccaaeea3ed00372f35bb", "modul me": "研究与论文", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "xLSTM 团队（Sepp Hochreiter 等）提出 KronLSTM：以“Kronecker Delta Rule”只沿单一方向修正记忆矩阵，长上下文表现常优于 Gated DeltaNet 系列", "url": "https://arxiv.org/abs/2610.26834", "source": "arXiv", "date": "2026-10-20", "summary": "KronLSTM 在 xLSTM 家族中加入“最小侵入式”记忆修正机制，降低对已存信息的干扰；论文证明其记忆动态收敛到稳态分布、记忆矩阵期望范数始终有界，无需额外归一化与稳定化。实验称其与现有线性注意力架构相当或更优，长上下文基准优势尤其明显；代码与模型已在 GitHub 与 Hugging Face（NX-AI）开源。", "id": "3a96c6bc03ad57607f6c63bac6511e5170120a33", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "UCLA 等提出 OpenVLHarness：为多模态模型搭建“能力层+持久多模态记忆”的工具调用框架，22 项基准上比无工具基线平均提升 9.7–12.6 分", "url": "https://arxiv.org/abs/2610.26860", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "作者发现单纯增加基座模型推理预算收益有限，于是用任务级工具接口+证据渲染统一接入异构后端，并把图像、结构化数据与网页引用作为可寻址产物持久保存，配合代码接口对存储数据做组合计算。在 8 个开源与闭源骨干上评测：Qwen3-VL-8B +11.2、Kimi K3 +9.7、GPT-6 Astra +9.9；当日 Hugging Face 每日论文榜第三。", "id": "747852054eef062b8fae91d9cd72d759d93f1c04", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "DeepSeek 全面开源内部推理框架 DeepInfer（Apache 2.0）：支撑 V4.1 Flash 线上大规模服务，兼容英伟达 SM100 与华为昇腾 950，同步开源 deepseek-recipe 编解码组件", "url": "https://www.ithome.com/1/015/429.htm", "source": "IT之家 / DeepSeek", "date": "2026-10-20", "summary": "DeepInfer 集成 FlashMLA、DeepGEMM、DeepEP 等自研算子与优化推理引擎，支持 Attention DP/均衡 CP 与 MoE EP+EPLB 并行、DSpark 推测解码与置信度调度验证、SWA bounded replay、异步调度、批不变推理、确定性采样和结构化输出。本次开源版本提供离线推理，目前仅支持 DeepSeek-V4.1-Flash；完整线上服务所需的 KV cache 系统、Prefill/Decode 分离与跨副本负载均衡未包含。DeepSeek 称新模型的推理代码与后续优化也将在此更新；README 注明框架最初主要基于 vLLM 构建。同步开源的 deepseek-recipe 与官方 API 的 token 编解码逻辑对齐。", "id": "150d3eda5e7ea7368701317aaa463d2715ec86e0", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "WIRED/Redact：WhatsApp 约 80 个帮助页面源码暴露写给 Meta 客服聊天机器人的隐藏指令，含“不要建议联系数据保护机构或监管方”“用户提及 GDPR/CCPA 时也不引用”", "url": "https://www.wired.com/story/whatsapp-help-pages-leaked-hidden-instructions-for-a-meta-chatbot/", "source": "WIRED", "date": "2026-10-20", "summary": "隐私公司 Redact 发现约 100 段隐藏文本位于 “HelpContentGalaxyLLMInclude” 代码块中，用户不可见但存在于网页源码，包括“WHAT NOT TO SAY”部分；在用户提及律师、诉讼时，要求不引用服务条款、不作任何责任表态。WhatsApp 发言人称这是给自家支持聊天机器人的指令、因 bug 而显示，已在 WIRED 联系后从所有页面移除；尚不清楚第三方 AI 能否读取、暴露了多久。", "id": "e2fcb8500593abfc2e1c45e44d290e917b7f85a9", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "奇瑞全球创新大会发布汽车行业垂域基础大模型 CheryMind，称“为物理 AI 而生”：6 万多名员工每天使用、覆盖 200 多个业务场景", "url": "https://www.c114.net.cn/industry/135359.html", "source": "C114 / IT之家", "date": "2026-10-20", "summary": "据 IT之家现场报道，奇瑞称 CheryMind 已打通 400 多个企业系统，覆盖 700TB 企业知识与 200PB 工程数据，“正在重塑企业运转方式”。同场奇瑞还首发家庭陪伴人形机器人“墨宝”并开启全球预订。", "id": "bbb2b77cb782d088a0fc686e19de6121201753a8", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "deepseek-ai/DeepInfer", "url": "https://github.com/deepseek-ai/DeepInfer", "source": "GitHub", "stars": 1955, "stars_week": null, "language": "Python", "date": "2026-10-20", "summary": "DeepSeek 官方高性能大规模推理框架，支撑其生产服务：集成 FlashMLA/DeepGEMM/DeepEP/TileLang 算子，支持 MoE EP+EPLB、DSpark 推测解码、SWA bounded replay、批不变推理与结构化输出，可在英伟达 SM100 与华为昇腾 950 上运行 DeepSeek-V4.1-Flash。", "why": "DeepSeek 10 月 20 日下午官宣开源（Apache 2.0），截至约 17:30（UTC+8）已约 1955 星、140 个 fork。", "id": "79e072c528493212dadbe0626496c7bede00d5c2", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "@deepseek_ai", "url": "https://x.com/deepseek_ai/status/2112476496283775135", "source": "@deepseek_ai", "date": "2026-10-20", "summary": "DeepSeek 官方发推宣布内部推理框架 DeepInfer 全面开源，称其以高吞吐、低延迟支撑 DeepSeek-V4.1-Flash 的大规模服务，希望帮助社区降低算力成本与能耗；后续推文介绍同步开源的 deepseek-recipe，并称“开放模型、开放算子、开放推理”。", "metrics": {"likes": 38, "reposts": 7, "views": 5755}, "id": "ae868a7e9e33a53b27c23842a67de55ceda4ed2a", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "阿斯利康与甲骨文启动全球 AI 合作：用 AI 与真实世界数据匹配临床试验患者、监测安全信号，首个项目联手阿布扎比 M42 开展高血压研究", "url": "https://www.channelnewsasia.com/business/astrazeneca-partners-oracle-ai-driven-clinical-trials-6474856", "source": "Reuters / CNA", "date": "2026-10-20", "summary": "据路透，合作将结合阿斯利康的药物研发经验与甲骨文的 AI 和医疗数据能力，用于患者匹配、安全监测与更早诊断，初期聚焦肿瘤、心血管、呼吸、免疫及罕见病。患者招募慢一直是拉长试验周期、推高研发成本的主要瓶颈；阿斯利康正冲刺 2030 年年营收超 800 亿美元目标。", "id": "d806a435ddd6286b1c06543dfc57edab19a17ba3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "Learning from Fleet Experience：让部署中的机器人机队共享执行经验改进同一策略，按失败情境检索成功轨迹片段做监督、无需额外专家纠正，96 台机器人让手机包装任务成功率从 79.2% 升至 98.3%", "url": "https://arxiv.org/abs/2610.25736", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "论文提出“集体经验学习”（CEL）：FERT 用机器人执行中的失败上下文，从机队共享的成功经验中检索相关轨迹段作为动作监督；容错异步训练系统 FATS 协调经验收集、策略优化与分发，局部中断也不停摆。在五项真实操作任务上，于未参与数据采集的机器人上各测 120 次，成功率 93.3%–99.2%；单机采集时长固定时，机队越大成功率越高（16→96 台：86.7%→98.3%）。", "id": "3c45dcb78320e7f07f6fc34c2db7cc094370a8f2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "记忆张量开源“记忆原生”基础模型 MemT-1.0：Flash（288B/17B 激活，基于 DeepSeek-V4-Flash）与 Nano（36B/3B 激活，基于 Qwen3.6）把历史写进固定大小记忆状态，256K 历史下推理提速约 4 倍、存储缩减约 130 倍", "url": "https://huggingface.co/MemTensor/MemT-1.0-Flash", "source": "Hugging Face / 网易智能", "date": "2026-10-20", "summary": "MemT-1.0 在骨干注意力旁加入“原生记忆块”（动态局部记忆 + 可训练超记忆），推理时无需重新读入原始上下文；基于 340 亿 token 两阶段训练。官方称在 11 项记忆基准上 Flash、Nano 分列参数化记忆方法第一、第二（但仍落后强文本记忆系统）；256K 历史下首字延迟约 104–112ms，每会话记忆状态约 40MiB。Nano 引入历史解题经验后 SWE-bench Verified 由 66.07% 升至 69.73%。Flash 权重 MIT 许可。", "id": "d8b17aea8b10ca1d06d245439470503d9bbd48bc", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "美国国务院依《保护美国知识产权法》（PAIPA）制裁陆奇创办的奇绩创坛（MiraclePlus）及其两支基金等共 5 家实体，指其为涉嫌窃取谷歌 AI 基础设施机密的前谷歌工程师 Linwei Ding 所创公司提供种子资金", "url": "https://www.state.gov/releases/office-of-the-spokesman/2026/10/imposing-sanctions-to-protect-americans-from-intellectual-property-theft-fact-sheet/", "source": "U.S. Department of State / Bloomberg", "date": "2026-10-20", "summary": "美国国务院 10 月 19 日（美东时间）公布：Linwei Ding 2023 年创办的上海智算科技（Zhisuan）被认定“明知参与或受益于重大商业秘密窃取”，其曾在奇绩创坛创业营中宣称可复刻谷歌的超级智能基础设施技术；奇绩创坛向其提供种子资金并持股，被认定为窃密提供重大支持。被制裁实体还包括奇绩创坛一期、二期基金及致远企业管理中心。OFAC 同步将其列入非 SDN 菜单式制裁名单，并发放截至 2027 年 1 月 19 日的业务清退许可。", "id": "07225baaf305c1725bb45db298df55c8bba1f6b5", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "@ModelScope2022", "url": "https://x.com/ModelScope2022/status/2112453862351073661", "source": "@ModelScope2022", "date": "2026-10-20", "summary": "魔搭社区官方号推介 MemT-1.0：一个把持久、可演化记忆内置于模型计算中的开放权重模型家族，对话与智能体可复用历史信息而无需重新加载原始上下文，称在参数化记忆方法中领先。", "metrics": {"likes": 6, "reposts": 1, "views": 481}, "id": "2f4cd0f2c01ca749f05fc453098c788badb5712e", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112447502699933816", "source": "@business", "date": "2026-10-20", "summary": "彭博：华盛顿将前微软 AI 科学家陆奇创办的中国创投机构（奇绩创坛）列入黑名单，理由是其与一家被指窃取谷歌技术的初创公司存在关联。", "metrics": {"likes": 13, "reposts": 5, "views": 15092}, "id": "83bdda3cd8d4a7e0d10ade25fd4eebd5618a2b7d", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "@Reuters", "url": "https://x.com/Reuters/status/2112448778875637849", "source": "@Reuters", "date": "2026-10-20", "summary": "路透快讯：阿斯利康与甲骨文合作推进 AI 驱动的临床试验。", "metrics": {"likes": 6, "reposts": 2, "views": 20470}, "id": "579ce9dfeae3e5c51b291ce64f5f4926ea16ed53", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T16:28:00+08:00"}, {"title": "爱沙尼亚网络流量安全公司 Blackwall 完成 1 亿美元 C 轮融资，估值 22 亿美元、较 2025 年翻两番，主打帮网站区分合法 AI 智能体与恶意机器人", "url": "https://techcrunch.com/2026/10/20/blackwall-quadruples-valuation-to-2-2b-as-websites-wrangle-an-increasingly-crowded-internet/", "source": "TechCrunch", "date": "2026-10-20", "summary": "本轮由 AVP 领投，Dawn Capital、MMC Ventures、Tera Ventures 跟投。Blackwall 不直接卖给网站，而是通过主机、托管服务与云厂商以白标方式分发 DDoS 防护、威胁情报、证书管理等工具，并用数字指纹和部署在客户端点的自有 AI 模型识别请求意图，区分真人委派的智能体与恶意爬虫。CEO Nikita Rozenberg 认为未来智能体代用户访问网站和支付时，将需要管理哪些智能体可访问、以何种条件授权付款。资金将用于拓展北美、欧洲、亚太与中东市场。", "id": "ca656d75d61907bbe4835c7a5ac29ddc880f60a5", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "中国外交部回应美国国土安全部 DeepSeek 禁令：坚决维护中国企业正当权益，反对泛化国家安全概念、将科技与经贸问题政治化", "url": "https://economictimes.indiatimes.com/tech/artificial-intelligence/after-us-deepseek-order-china-says-it-will-protect-firms/articleshow/135063801.cms", "source": "Reuters / The Economic Times", "date": "2026-10-20", "summary": "外交部发言人毛宁周二回应记者提问时作出上述表态。此前美国国土安全部公布的命令（7 月 24 日签发、周一公开）要求财政部、国务院、司法部等联邦民用机构从 IT 系统中移除 DeepSeek 产品及基于其模型的第三方服务，并禁止今后采购，国防部不在适用范围内；各机构可在 60 天内书面申请例外或延期。", "id": "820fb96be3e41569dfdd7c277100861ceee8a3e4", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "The Intercept/Gizmodo：美国陆军网络司令部推进智能体网络 C2 框架 ECHOTRIBBLE，要求能在“极少人类监督”下自主穿行目标网络、识别并“消除”威胁，覆盖云端与物理隔离系统", "url": "https://gizmodo.com/documents-reveal-military-plan-for-agentic-ai-that-hacks-u-s-adversaries-2000827957", "source": "Gizmodo / The Intercept", "date": "2026-10-20", "summary": "据国防非营利机构 CFIC 官网公开文件，ARCYBER 10 月 6–8 日举办 ECHOTRIBBLE 线上评估，65 份白皮书中选出 5 家演示、最终 1 家公司获选，将进入工作说明与合同流程；项目目前仍在白皮书/原型阶段。The Intercept 形容其设想“几乎像计算机蠕虫”，在外国网络中隐蔽移动直到找到目标。蒙特利尔大学教授 David Krueger 警告，鉴于当前 AI 的已知失效模式，让自主系统承担“消除威胁”任务“极其危险”。陆军网络司令部未回应置评。", "id": "517e41913a44acd022d19985871099dde4035f29", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "MiniMax 正式发布 M3.1 Flash 并认领匿名模型“Space Bunny”：主打复杂 Agent、电脑操作与软件开发，线上推理提速近 3 倍、API 价格降 50% 以上", "url": "https://www.21jingji.com/article/20261020/herald/ef2ca80c1914e8a13b36ac22835a70e2.html", "source": "21经济网 / 每日经济新闻", "date": "2026-10-20", "summary": "M3.1 Flash 采用更激进的稀疏结构，日常输出速度 200+ TPS（P50 约 170+ TPS），Agentic 任务综合成本约为前代三成；官方称 DeepSWE v1.1 达 73.7%、AutomationBench-AA 62.8%，OSWorld V2 61.7 分、Agents' Last Exam 29.6 分均居国产模型首位（厂商自测）。API 定价为每百万 tokens 输入 1 元、输出 4 元、缓存读取 0.1 元；距 DeepSeek V4.1-Flash-1017 更新仅 72 小时，MiniMax 还预告 Pro 版本即将到来。", "id": "935f049a1a348a866a3314f3ab1d129d89069003", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "@kimmonismus", "url": "https://x.com/kimmonismus/status/2112442680651243586", "source": "@kimmonismus", "date": "2026-10-20", "summary": "传闻帖：有网友发现 OpenAI 新网站源码中藏有“6.5”字样和指向旧金山时间 11 月 1 日上午 10 点的倒计时，恰与 Codex 负责人 Tibo“28 天 Codex”活动第 28 天吻合，推测 GPT-6.5 可能作为压轴发布（未经官方证实）。", "metrics": {"likes": 34, "reposts": 3, "views": 1788}, "id": "16e1207d3c1f5d80f5567e1886d514bf04e5daf8", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T15:31:00+08:00"}, {"title": "The Information：奥特曼向员工阐述 AI 安全的三种“终局”——类 IAEA 国际机构、合并所有实验室的“AI 版 CERN”，以及一家公司强大到可切断所有对手算力的方案", "url": "https://www.theinformation.com/articles/altman-describes-three-endgames-ai-including-one-single-firm-melts-everyone-elses-gpus", "source": "The Information", "date": "2026-10-20", "summary": "据两位知情人士，奥特曼上周在内部讨论中列举了业界关于如何安全开发 AI 的三类提议，他似乎倾向于设立类似国际原子能机构、负责执行安全标准的国际组织；第二种是把所有 AI 实验室合并为单一机构；第三种（他并不偏好）是某家开发者获得足够经济实力，剥夺包括潜在危险者在内的所有其他开发者的算力。报道指出，这一表态恰逢特朗普政府搭建首个针对超级智能开发者的监管体系。", "id": "5c8080bc21e0adf39227f96c4c9b75b4dd43a6d6", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "浙大与蚂蚁等发布 WorldMemBench：260 个用例系统评测视频世界模型“记忆”，HY-WorldPlay 静态记忆七项全第一但仅 31.7% 能触发指定事件，多次回访记忆持续衰减", "url": "https://arxiv.org/abs/2610.19063", "source": "arXiv", "date": "2026-10-20", "summary": "基准含 200 个静态记忆（人物、物体、环境）与 60 个动态记忆（事件演进、状态保持）用例，用受控镜头离开-回访轨迹对比固定初始参照。9 个模型中无一在全部维度领先：LingBot-World 动态记忆最高（0.808）；从第 1 次到第 3 次回访，物体外观、人物身份等指标平均下降 0.2 以上，切换旋转轴还会带来额外退化。在 LingBot World v2 上，“近期上下文 + 视野相关历史”的检索策略在多数指标上优于全量 KV，并提速约 1.23 倍。", "id": "5fa713cb173ec4642b4b3e49d3f605e734fccc19", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "开源编程智能体 OpenCode 遭“大规模蒸馏攻击”：黑客入侵待下线的旧系统，约 1.4% Console 用户存储的 OpenAI、Anthropic、谷歌 API 密钥外泄，部分用户一夜被刷超 1700 美元", "url": "https://techcrunch.com/2026/10/19/hackers-hit-ai-coding-tool-opencode-running-up-charges-on-users-ai-accounts/", "source": "TechCrunch / BleepingComputer", "date": "2026-10-20", "summary": "OpenCode 称攻击者借 AI 智能体持续攻击其系统至少 48 小时，最早暴露时间为 10 月 17 日 00:30 UTC，被盗密钥被用于大量调用前沿模型以收集输出、训练其他模型。受影响用户已收到邮件，被要求吊销并更换密钥、检查用量，部分用户的 Google Cloud 项目因“劫持资源”被暂停；OpenCode 表示正与 OpenAI、Anthropic 和谷歌协同处置，并可能为受影响用户报销。联合创始人 Dax Raad 称，改用 OpenAI 的 Daybreak 网络安全模型做防御后局势才趋于稳定。", "id": "039a84854fb85dd641d6936af9c43340549b490c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "@amir", "url": "https://x.com/amir/status/2112331218964693065", "source": "@amir", "date": "2026-10-20", "summary": "The Information 记者 Amir Efrati：独家披露奥特曼内部讨论业界 AI 安全三种方案——“AI 版 IAEA”、“AI 版 CERN / 实验室合并”（即 Demis Hassabis 2017 年的设想）以及“Eliezer 方案”。", "metrics": {"likes": 23, "reposts": 5, "views": 2972}, "id": "ac9a08c99b06cd84b0aa4fd8eb158cbffd40d060", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "@ArtificialAnlys", "url": "https://x.com/ArtificialAnlys/status/2112389514404462613", "source": "@ArtificialAnlys", "date": "2026-10-20", "summary": "Artificial Analysis：蚂蚁集团 Ming-3.0-tts 成为可控音色 TTS 竞技场开源第一（Elo 1069），并以 93.2% 并列发音鲁棒性榜第一，与 Fish Audio Drama 3 Preview 持平、领先 Eleven v4。", "metrics": {"likes": 53, "reposts": 3, "views": 7961}, "id": "06c602041808b5330c7d844d87e5ec8b42df8e3d", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T14:29:00+08:00"}, {"title": "小红书 Dots 团队提出 DoSA：用可证明的分数上下界提前排除不可能入选 Top-K 的候选，精确保持稀疏注意力选择结果，1M 上下文下 DeepSeek-V3.2 首 token 延迟降约 48%", "url": "https://arxiv.org/abs/2610.13990", "source": "arXiv / 机器之心", "date": "2026-10-20", "summary": "DSA 类稀疏注意力中，负责打分筛选的索引器（Indexer）在约 1M token 上下文下占预填充时间 73%–91%。DoSA 保留原始评分函数，仅用少量索引头构造保守上界，与种子候选得到的门槛下界比较，约 97% 的候选被安全过滤，其余仍用全部索引头精确打分。GLM-5.2 完整 Indexer 相对 SGLang 加速 1.12–2.74 倍；端到端首 token 延迟 Dots3-Note-preview、GLM-5.2、DeepSeek-V3.2 分别降低约 37%、46%、48%。代码已开源（github.com/llm-sys/dosa-sglang）。", "id": "7da14cf7085c0c194d2f9c3a13ab7dac9142f4eb", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "日本网络安全公司 GMO 调查：中国关联的 AI 自主渗透智能体 Artex 被用于攻击约 80 家日本企业，8 家已披露数据泄露；该工具此前亦涉韩国金融机构连环入侵", "url": "https://www.straitstimes.com/asia/east-asia/security-firm-finds-china-linked-ai-agent-behind-japan-cyberattacks", "source": "The Straits Times / 共同社", "date": "2026-10-20", "summary": "GMO 互联网集团旗下安全子公司 10 月 19 日在博客披露，其发现 6 台专门针对日本企业的境外攻击服务器均有 Artex 使用痕迹，受害者涉及零售、物流、保险与金融等行业，其中 8 家在 9–10 月披露数据已泄露或可能泄露。Artex 是一款中文 AI 自主渗透测试工具，接入大语言模型后可分析目标、规划入侵路径并调用安全工具；另据 CrowdStrike 分析，韩国金融业自 9 月下旬以来的入侵也使用了 Artex。日本网络安全担当大臣古川俊治 10 月 20 日表示，政府正分析是否存在恶意使用 AI 的情况。", "id": "789ac4e62aa65eb98872108206fe5e1466fc6608", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "清华、原力灵机与极寰时代开源世界动作模型 LoopWAM：用部署中的成功、次优与失败轨迹闭环自提升，登顶真机榜 RoboChallenge Table30 V2，全程用阿里云国产 PPU 训练", "url": "https://github.com/loop-wam/LoopWAM", "source": "GitHub / 机器之心", "date": "2026-10-20", "summary": "LoopWAM 以 Wan2.2-TI2V-5B 视频模型为基础构建视频+动作双分支，将所有部署轨迹纳入视频预测训练，并通过质量 steering 与按质量加权的动作监督偏向高质量行为，无需额外专家演示或强化学习。三轮部署后 Table30 V2（30 项真机任务、4 种本体）成功率从 23.67% 升至 43.33%、过程分 56.80，均列榜首；仿真上 RoboTwin 2.0 平均成功率 94.5%、RoboCasa365 达 49.5%。论文 arXiv:2610.18873，模型均由阿里云 PPU-810E 训练。", "id": "bf72c58f83986b17b505db91773808cd5af3cefa", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112411011948925240", "source": "@business", "date": "2026-10-20", "summary": "彭博：近期入侵多家日本大企业的黑客使用了一款中国开发的 AI 工具，据东京一家网络安全公司称，该工具与上月韩国多家银行遭入侵事件有关。", "metrics": {"likes": 4, "reposts": 2, "views": 11832}, "id": "8723420897ac9dc5c4ace5bfa0496de436cb26f5", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T13:33:00+08:00"}, {"title": "Semafor 独家：Waymo 拟用本月新借的 50 亿美元把车队从约 4000 辆扩至年底 8000 辆、2027 年底 2 万辆，规模扩大 5 倍", "url": "https://www.semafor.com/article/10/19/2026/waymo-plans-to-quintuple-its-fleet", "source": "Semafor", "date": "2026-10-20", "summary": "据知情人士，Waymo 计划用本月首次举债筹得的 50 亿美元（PIMCO、黑石、Sixth Street 等私募信贷提供，无 Alphabet 担保）大幅扩充车队。Waymo 目前在美国 15 座城市运营，并计划进入伦敦、东京、新加坡与多伦多；报道称其已向中国订购数千辆车用于扩张。Waymo 拒绝置评。", "id": "afe24a9f8aeff49cb9b33041961fda86cd416d51", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "OR-License：用真实付费运筹咨询项目（合同总额 368 万美元）评测 LLM 智能体，最强 Claude Code 配置严格可行率 88.39%，部署调整质量 0.87 仍不及专家", "url": "https://arxiv.org/abs/2610.24087", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "基准含 10 个工业场景的 31 个实例，保留原始客户需求、数据与交付格式，并用客户模拟器 ORSim 只披露业务事实、不提供运筹专业知识。11 个前沿模型在编码智能体 harness 下，部分在条件目标质量上超过专家方案，但没有一个在部署调整质量（DAQ，不可行交付记 0）上追平专家；研究链完成率仅 24%–45%，主要失败在问题建模与实现。今日登上 Hugging Face 每日论文榜。", "id": "e85c7c8ef7891adc8d7402a1a706f3f0e2ce9008", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "加拿大四大新闻机构 Postmedia、Torstar、《环球邮报》与加拿大通讯社在安大略起诉 Anthropic：指控其抓取新闻训练 Claude、绕过付费墙，索赔每件作品最高 2 万加元", "url": "https://www.cbc.ca/news/business/anthropic-postmedia-torstar-globe-canadian-press-copyright-lawsuit-9.7387205", "source": "CBC News / The Canadian Press", "date": "2026-10-20", "summary": "诉状于 10 月 6 日提交安大略高等法院，指控 Anthropic 违反网站服务条款、规避技术保护措施，未经许可抓取内容开发并运营 Claude，并在响应用户提问时持续抓取，构成侵权与不当得利；原告寻求永久禁令及惩罚性赔偿。同一批机构 2024 年曾联合 CBC 起诉 OpenAI，至今未和解。Anthropic 尚未回应，指控未经法院证实。", "id": "268a8455b01abb3684c226311942644e03fcd616", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "无人配送车公司新石器完成近 4 亿美元 E 轮融资，博裕投资与国家人工智能产业投资基金领投，创今年国内自动驾驶最大单笔融资", "url": "https://www.ithome.com/1/015/217.htm", "source": "IT之家", "date": "2026-10-20", "summary": "新石器（Neolix）宣布完成 E 轮近 4 亿美元（约 26.8 亿元人民币）融资，官方称由博裕投资与某国家级 e": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T11:30:00+08:00"}, {"title": "@testingcatalog", "url": "https://x.com/testingcatalog/status/2112334786794528884", "source": "@testingcatalog", "date": "2026-10-20", "summary": "TestingCatalog：OpenAI Platform 上线“Decisions”API 测试场，可用 Predicate、Choice、Score 三种模式试用 OpenAI 新发布的决策模型，直接返回概率而非生成文本。", "metrics": {"likes": 89, "reposts": 5, "views": 7445}, "id": "c1ff2cba09bfef4f8d24a4db16cac443beb5b301", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T11:30:00+08:00"}, {"title": "Dream Labs 走出隐身发布机器人基础模型 Dream-1 并开放 API：可控制从未见过的双臂机器人、执行未训练过的任务，最低 3 美元/小时；同时完成 9000 万美元种子轮", "url": "https://siliconangle.com/2026/10/19/dream-labs-raises-90m-to-help-build-more-intelligent-robots-with-simple-video-feeds/", "source": "SiliconANGLE", "date": "2026-10-20", "summary": "Dream-1 把机器人技能当作视频预测问题，用人类第一视角操作视频训练，适配任何带平行夹爪的双臂机器人，只需视频流和自然语言指令。Dream API 当日全面开放：完整版 3 美元/小时、轻量版 0.75 美元/小时，另提供微调即服务与网页 Robot Playground。种子轮由 B Capital 与 Kindred Ventures 联合领投；CEO Joel Jang 团队曾在英伟达从事机器人学习研究，目前与 20 多家硬件厂商合作。", "id": "985ce60efd8e28007e5045830e480f666b3d4e8c", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "《柳叶刀·数字健康》：AI 仅凭一张面部照片即可估算年龄并预测癌症患者生存风险，得分最高组更可能在 90 天内死亡", "url": "https://www.ithome.com/1/015/079.htm", "source": "IT之家（转引彭博社）", "date": "2026-10-20", "summary": "研究用超过 4000 万张人脸图像和 3 万多名癌症患者照片训练，年龄估算误差约 5 岁，能把患者可靠地分为高、低风险两组，且在不同年龄、种族、性别和癌种中均有效；算法主要关注鼻梁与眼下区域。作者之一、麻省总医院布莱根的 Raymond Mak 称不会用来拒绝治疗；萨里大学教授 Miroslaw Bober 认为尚不能用于临床，需对照医生判断做更多测试。", "id": "00f2808929e1c06695b0f4e345ede9a31a05c286", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "UCSD 提出 ACT3D：VLM 像人一样逐帧“走动观察”3D 场景再作答，强化学习后六项 3D 基准平均 53.2%，较 Qwen 基座提升 22.0%，超过 Gemini 3.6 Flash", "url": "https://arxiv.org/abs/2610.21783", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "论文《Learning to Think and Explore in 3D World》保留 VLM 原生单图输入，把 3D 表示作为可交互环境：模型可移动、转向视角后再回答问题。先做轨迹监督微调，再用以答案正确性为主的奖励做 RL，不直接监督探索动作。ACT3D 输入帧数比现有开源 3D 方法少 50–70%，在未见领域较监督初始化平均提升 5.9%。", "id": "0efc3184576190624b7af6e4feec21febf5f6350", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "HexaShell：让编码智能体直接“写代码开机器人”，以 Codex + GPT-6-Astra 在 RoboDojo 全部 42 项任务上取得 39.7% 成功率、48.0 进度分，刷新榜单 SOTA", "url": "https://arxiv.org/abs/2610.23479", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-20", "summary": "HexaFuture 团队提出“薄 harness”：只把智能体命令翻译成双臂机器人动作，智能体通过三路 RGB 相机与标定信息、用三角测量等方法自写自修工具代码，并在每次失败后读日志定位原因。工具在每任务 10 个布局上构建后冻结，再在 10 个新布局上测试。作者结论：瓶颈在于接触操作而非推理。该文为 HF 日榜 10 月 19 日最高票论文（约 285 票）。", "id": "376f5f540f49d520a01a060273dd42a4a0c0bc84", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "纽约市长曼达尼：联邦在 AI 监管上“完全失职”，呼吁纽约人拒绝“AI 不可避免”的叙事、追究 AI 公司责任", "url": "https://techcrunch.com/2026/10/19/mamdani-says-feds-have-abdicated-on-ai-urges-new-yorkers-to-push-back/", "source": "TechCrunch", "date": "2026-10-20", "summary": "Zohran Mamdani 在 AI Now Institute 主办的 People’s AI Assembly 上与演员 Ilana Glazer 对谈，称 AI 的快速铺开并非不可避免，批评把 AI 讨论框定为对华“军备竞赛”而忽视人文关切。他上月已下令禁止小学和初中使用 AI，并在夏季推出要求房源照片/视频披露 AI 生成的政策。", "id": "ed298111b59a085c4951ee4a87a34e79b0af2b18", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "自变量发布具身仿真评测基准 X2Real：仿真与真机任务成功率相关性 0.96、进度分相关性 0.99，44 个任务覆盖推理与操作能力", "url": "https://www.ithome.com/1/015/177.htm", "source": "IT之家", "date": "2026-10-20", "summary": "X2Real 以可信性、有效性、客观性为原则：对 Franka、ArtiXon Arm-6A、ARX R5、Quanta X1 等本体做与真机对齐的标定，实现毫米级轨迹一致；10 类 44 个任务另含堆积木、汉诺塔等挑战任务；训练数据（近 300 小时）与评测环境严格隔离并多维随机化；基于英伟达 Isaac Lab-Arena 的 Mana 生态由智能体自动出题、判分与补题，统一评测协议支持在线评测。", "id": "6a840558aa951d0c5ea81ad8e3cbdc57d369afad", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "@ArtificialAnlys", "url": "https://x.com/ArtificialAnlys/status/2112364868020105 一视角经验构建“整体世界智能”，自动把录像转成连接场景结构、物体状态与交互历史的世界记录，训练出 HOLIWORLD-VL-4B", "url": "https://arxiv.org/abs/2610.26549", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-19", "summary": "Ropedia 团队提出覆盖采集、世界表示、自动数据构建、模型学习与独立评测的一体化体系：HOLIWORLD-Foundry 结合静态与动态感知自动生成世界记录，HOLIWORLD-Data 从约 100 个自采场景整理出约 8 万条问答用于训练 4B 视觉语言模型，并以独立人工标注构建 HOLIWORLD-Bench；在 ScanNet、ScanNet++、Aria Digital Twin 等上表现强劲。10 月 20 日 HF 每日论文点赞约 100。", "id": "68f576e89bb2d0b6196123650792dfaf2267ef7f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "ScaleNav：用互联网第一视角视频预训练语言条件局部导航，学习“靠近目标时画面如何变化”再对齐到机器人动作，OVON 单视角成功率 86.5%", "url": "https://arxiv.org/abs/2610.25690", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-19", "summary": "统一的世界-动作框架分三阶段训练：先在网络视频上做指令条件的视频预训练，再用带动作标签的仿真数据学习可执行动作块，最后联合微调。在单视角 Short-Horizon OVON 上成功率 86.5%，在作者的 HabitatGS-LN 基准上达 94.9%，均超过对比基线，并在真实机器人上部署评测。", "id": "d9e21b93aaa1d565a5f5879fe1aec2d9f8ec6371", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "Business Insider 获内部录音与文件：AWS 高管称 AI 业务“严重自由现金流为负”并将持续数年，部分数据中心有空间无电力，英伟达 GB300 机柜被暂存在中转仓库", "url": "https://www.businessinsider.com/amazon-220-billion-ai-bet-data-centers-spending-challenges-2026-10", "source": "Business Insider", "date": "2026-10-19", "summary": "据报道，AWS 9 月内部会议上 CFO John Felton 调侃 AI 基础设施负责人 Prasad Kalyanaraman“让公司自由现金流转负”，后者称预计未来几年仍为负。8 月内部邮件显示亚马逊推出“Early Rack Receipt”流程，预计当月接收约 50 亿美元 GB300 机柜、此后每月约 30 亿美元；亚马逊回应称在部署点附近暂存硬件是标准做法。亚马逊今年资本开支约 2200 亿美元，并预计 2027 年需求仍将超过可用算力。", "id": "1aae4806d6f0c8f0bc29f04363d918a0c39d6157", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "欧盟《AI 法案》首个协调标准 EN 18286:2026 正式在官方公报引用：AI 质量管理体系标准，高风险 AI 提供者采用即可推定符合第 17 条要求", "url": "https://digital-strategy.ec.europa.eu/en/library/first-harmonised-standard-supporting-ai-act-published-official-journal", "source": "European Commission", "date": "2026-10-19", "summary": "欧委会通过实施决定 (EU) 2026/2274 发布该标准引用。EN 18286 由 CEN 与 CENELEC 制定，围绕 AI 系统生命周期而非组织构建，可叠加在 ISO/IEC 42001、ISO 9001 或 ISO 13485 等现有体系之上，并允许受监管行业整合管理体系；欧委会称这是高风险 AI 要求适用前的重要里程碑，后续还将发布更多协调标准。", "id": "3f3ef2f516fa4d1c31613ecbfdfaeac4eadf127e", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "GoTo 联合 AI Singapore 在 Hugging Face 发布 27B 印尼语模型：基于 Gemma 3，支持印尼语、爪哇语、巽他语、巴厘语、巴塔克托巴语与英语，128K 上下文", "url": "https://technode.global/2026/10/19/goto-releases-27b-indonesian-language-model/", "source": "TechNode Global", "date": "2026-10-19", "summary": "模型于 10 月 19 日巴厘科技周发布，仓库为 GoToCompany/gemma3-27b-cpt-gotoai-v3-instruct，模型卡列明采用 Gemma 许可证。训练数据含媒体合作方与政府网站的印尼语文本，巴塔克语数据与北苏门答腊大学合作。FP16/BF16 推理约需 54–60GB 显存，建议单张 A100 80GB 或两张 L40S。延续 GoTo 与 Indosat 的 Sahabat-AI 开源模型计划。", "id": "b98c4890fc8d24e7e93a1a5e3b5e4ca69d0e180f", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "finereli/whatsapp-mcp", "url": "https://github.com/finereli/whatsapp-mcp", "source": "GitHub", "stars": 302, "stars_week": null, "language": "TypeScript", "date": "2026-10-19", "summary": "只读 MCP 服务器，让 AI 智能体搜索和阅读你自己的 WhatsApp 消息，运行在 Cloudflare Workers 上。", "why": "10 月 19 日新建、已约 302 星，曾登上 Hacker News 首页。", "id": "6f2aca72a3fc44028770d46b0d493aca4fa94bdc", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "Gartner 调查 2002 名 CIO：仅 13% 称企业已从 AI 获得显著或变革性价值，AI 用例成功率仍约五分之一", "url": "https://www.gartner.com/en/newsroom/press-releases/2026-10-19-gartner-survey-finds-only-13-percent-of-cios-say-their-enterprise-has-realized-significant-or-transformational-value-from-ai", "source": "Gartner", "date": "2026-10-19", "summary": "Gartner 在奥兰多 IT Symposium/Xpo 发布 2027 CIO 议程调查（2026 年 5–7 月）：设有“试点不转生产”与“放弃已上线低价值项目”止损规则的组织，成为“先锋”的可能性分别高 2.3 倍和 2.6 倍，但仅 31% 与 17% 的 CIO 已建立此类规则；58% 的 CIO 称 AI 降本压力上升，51% 预计 AI 会推高技术总拥有成本；仅 4% 有面向人机协作的岗位重设计划，40% 预计 2027 年 IT 人员将增加。", "id": "1b0c17081ba0e34e12413d8a7651f3ddbbe201f7", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "SemiAnalysis：2027 年全球数据中心新增容量将超 50GW、在建约 60GW，今年迄今已签约近 1 万亿美元不可撤销租约，短缺或转向内存与芯片", "url": "https://newsletter.semianalysis.com/p/datacenters-2027-the-year-of-acceleration", "source": "SemiAnalysis", "date": "2026-10-19", "summary": "报告反驳 Altimeter 的 Brad Gerstner 关于 2027 年仅建成约 25GW 的判断，称前 40 大园区已有超 24GW 处于施工后期、多数将在 2027 年交付；美国超大规模云厂商自建开工量呈抛物线上升，Meta、AWS、微软、谷歌、英伟达、AMD、Anthropic、OpenAI 均在寻求吉瓦级租约。模块化设计把施工周期压到 10 个月内，表后自建电源基本缓解电力瓶颈，2027–28 年内存与逻辑芯片可能成为头号约束。", "id": "ce421a1bd3e80d3eb25d8170a90e391488d17c9f", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "State World Models：把“规则执行”与“视频渲染”分离，Stateful Harness 维护隐藏世界状态，在 WorldState-Bench 上把冻结视频模型的规则符合率从 32% 提到 92%", "url": "https://arxiv.org/abs/2610.26811", "source": "arXiv", "date": "2026-10-19", "summary": "现有世界模型多专注镜头移动，难以处理结果取决于画面外隐藏状态的动作。作者提出 Stateful Harness：按既定规则演化世界状态，用冻结的视频模型渲染每个事件，再用生成片段回写状态，并以可编辑 3D 场景预览提供空间与镜头引导。新基准 WorldState-Bench 含 50 组反事实孪生样例；11 个视频后端在仅给规则时最好只有 32% 的样例两边都正确，MiniMax-H3 明确结局后为 64%，完整 harness 达 92%。", "id": "44dbb25e2c28832d22c81b5918c13b213c3d678a", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "IFP 报告：美国前沿 AI 领先中国约 6.5 个月，若动用现有行政权限遏制对抗性蒸馏、远程算力访问与芯片走私，到 2027 年底领先可大致翻倍", "url": "https://ifp.org/how-to-increase-americas-ai-lead-over-china/", "source": "Institute for Progress", "date": "2026-10-19", "summary": "Tim Fist、Georgia Adamson、Konstantin Pilz 估算：中国到 2026 年底可获约 460 万 H100 当量算力、2027 年底约 880 万，其中远程访问海外数据中心约占可限制部分的一半；对抗性蒸馏约夺回一半领先优势（无蒸馏时 16 倍算力优势对应约 13 个月领先）。建议包括为反蒸馏协作设立反垄断安全港、限制中国企业远程使用海外训练集群、强化尽调防走私、收紧现可合法出口芯片与 HBM 管控，合计约可增加 6.6 个月领先。", "id": "8cc5514e4eb3b79503386d0a8498f738d014258e", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "LEV：用“循环层”代替生成 token 让决策模型按题目难度加深思考，2.6B 模型在 JevBench 上从 1 轮 63.2% 升至 4 轮 76.2%", "url": "https://arxiv.org/abs/2610.20951", "source": "arXiv / Lehigh University", "date": "2026-10-19", "summary": "Lehigh 大学等基于原生循环预训练骨干（Ouro、Nanbeige4.2）构建 System 1.5 决策模型，每轮循环后用共享指针头读出选项，一个检查点可在任意深度作答；以无标注请求拟合的停止器按需决定深度，节省 15%–24% 计算、精度损失不到 1 个点；50ms 以内 1.4B/3B 模型比同延迟稠密模型与级联高 5.4–8.8 个点。代码与模型已开源。", "id": "03d23af20d252ebec024b732636ca39454ae5ffc", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T09:30:00+08:00"}, {"title": "北大与蚂蚁国际发布 BizBench（BizAgentBench）：基于全球支付公司真实流程的 50 个长程业务任务，Claude Opus 5 严格成功率 64.0%、GPT-6 Sol 61.3%", "url": "https://arxiv.org/abs/2610.20424", "source": "arXiv / Hugging Face Papers", "date": "2026-10-19", "summary": "环境含 789 份知识文档与 601 个可发现业务工具，混有过时或相互冲突的规则；确定性检查同时评估目标达成、过程合规（如先授权后执行、全程不跌破备付金下限）与副作用。GPT-6 Sol 三次全部成功的任务仅 40%；Qwen3.8-27B 目标达成 42.0% 但严格成功仅 32.7%；DeepSeek-V4.1-Flash 平均每次 191.3 次工具调用，比参考执行多约 70%。", "id": "a54a4b304dee1d11b7c5c24a2b3818bd17d53a79", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T09:30:00+08:00"}, {"title": "新泽西州众议院公共安全委员会通过 A-5607 聊天机器人用户保护法案：把聊天机器人视为产品适用产品责任，禁止出售聊天记录，每次违规罚款 5000 美元", "url": "https://www.insidernj.com/assembly-committee-passes-chatbot-user-protection-bill/", "source": "Insider NJ", "date": "2026-10-19", "summary": "法案要求聊天机器人提供方未经用户明确同意不得处理输入以外的个人数据、不得出售聊天记录、保存期不超过两年，须每月评估对用户的风险并按州检察长规则缓解；州检察长可提起民事诉讼，受害用户可索赔实际损失或每次违规 5000 美元（取高者）。委员会以多数票通过，一名共和党议员反对、一名弃权。", "id": "c10e4f09003431948b73a0c0a3deba2e7e7a4fa1", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T09:30:00+08:00"}, {"title": "英伟达在欧洲首台百亿亿次超算 JUPITER 上用 8192 张 GH200 完成 104 量子比特容错量子计算模拟，验证可省 90% 物理比特的“魔法态培养”", "url": "https://nvidianews.nvidia.com/news/nvidia-runs-record-simulation-of-fault-tolerant-quantum-computing-at-julich-supercomputing-centre", "source": "NVIDIA Newsroom", "date": "2026-10-19", "summary": "在 GTC Berlin 期间发布：英伟达与于利希超算中心称这是迄今最大规模、细节最完整的容错量子处理器模拟，纳入相干相位误差与三能级泄漏等真实噪声，验证从 distance-3 色码生长到 distance-7 混合码的魔法态培养协议；借助 cuQuantum 与 CUDA-Q，模拟周期由数周缩至数天。", .0-audio（Flash 126B-A6.5B 长录音摘要、语音问答与工具调用；Tiny 9.3B-A2.7B）、Ming-3.0-asr-tiny（方言口音与热词上下文识别，四类平均错误率 4.41%）。权重上架 Hugging Face 与 ModelScope，SGLang、vLLM 首日支持。", "id": "81d8aaf9944125022181dbde08c02848a8e49176", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "TechCrunch：Hugging Face 首席政策官 Irene Solaiman 称“嵌入式第三方评估员”并非简单解药——评测需可复现、可横向比较，且应覆盖模型+harness+智能体整体", "url": "https://techcrunch.com/2026/10/19/embedded-ai-evaluators-wont-be-an-easy-solution-hugging-faces-policy-chief-says/", "source": "TechCrunch", "date": "2026-10-19", "summary": "在 TechCrunch Disrupt 上，Solaiman 指出评测是仍在演进的科学，基准很快失效，谁有资格做哪类任务的评估员缺乏标准化；开放权重对复现至关重要。报道提到 Anthropic 聘请埃森哲作为首个评估方引发争议，并指出更好的 harness 可能让较弱模型胜过前沿模型。", "id": "d45dacf783b2543c1e1a59650c5148eaa53687ed", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "新泽西州众议院委员会审议四项 AI 法案：AI 内容标识、生成式平台涉罪责任、个人姓名肖像声音权，以及要求前沿模型开发者向州检察长披露安全流程", "url": "https://newjerseymonitor.com/2026/10/19/nj-ai-regulations-safety/", "source": "New Jersey Monitor", "date": "2026-10-19", "summary": "听证未表决。Meta 政策总监主张大模型开发者不应为下游用户滥用担责以保护开源；普林斯顿科技政策诊所等呼吁强监管并防止监管俘获。标识法案拟按每次违规每日 5000 美元罚款，商界担忧中小企业负担；前沿模型法案还允许检察长直接或委托第三方审计大型 AI 公司。", "id": "67140d66180558be9cd3f2945e04e393b0aad84a", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "首届全球具身智能应用创新挑战赛暨 2026 中国机器人大赛在杭州闭幕：2000 多支队伍、近 5000 名选手真机比拼，宇树、达摩院等 50 家企业提供 500 多个实习岗位", "url": "https://www.qbitai.com/2026/10/504199.html", "source": "量子位", "date": "2026-10-19", "summary": "赛事依托国家具身智能应用中试基地，覆盖自动分拣、服务、医疗、农业、水下机器人与无人机，以及柔性分拣、空地协同、居家服务、灵巧操作等具身任务，共决出 59 项冠军；冠军队获“实习金卡”可免试进入生态企业实习。", "id": "0f963f64282d369a5c374b464e21fc70149f0137", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "Replika 创始人 Eugenia Kuyda 的 Wabi 2.0 向所有用户开放：多线程、多人共享的个人 AI 助手，会按任务自动生成小应用", "url": "https://techcrunch.com/2026/10/19/replikas-founder-built-the-ai-assistant-she-pitched-at-disrupt-12-years-ago/", "source": "TechCrunch", "date": "2026-10-19", "summary": "Wabi 以消息应用形态运行，用户可为不同任务与长期目标建立多个智能体线程，线程可分享为群聊；连接邮箱后会自动生成初始线程与应用（如健康线程里的减重追踪器、家庭线程里的附近亲子活动）。按聊天单独授权邮箱、日历等数据，他人请求个人信息时全员可见；已通过 SOC 2，目前免费、商业模式未定，覆盖 iOS、Android 与 Mac。", "id": "71c2d7263cd3eef9e9a63ef1facbb4b7c31c6929", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "Viggle 发布“物理原生”世界基础模型 JST-2：以持久 3D 原子建模场景、角色与动作，约 1 秒生成可漫游 3D 场景、单次推理成本低于 1 美分", "url": "https://viggle.ai/jst2", "source": "Viggle", "date": "2026-10-19", "summary": "JST-2 不在像素空间学习，而是把世界表示为带 xyz 位置、属性与动力学向量的“物理原生 Token”，可解码为图像或 3D 高斯泼溅；支持最多 64 个视角作为空间上下文逐步扩展世界，角色无需单独绑骨蒙皮即可驱动，动作可由文本或视频生成。官方称在 B200 上约 1 秒出场景（计时不含网络延迟）；场景碰撞与物体交互目前仍靠规则物理，计划由 JST-3 改为学习型动力学。", "id": "fcf798d48eb5b0fb2f48f4ffaaa2332c60bd0928", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "Upstarts Media：Stripe Link 已为约 200 个 AI 智能体处理代用户购物支付，较 9 月统计时的约 70 个翻倍有余", "url": "https://www.upstartsmedia.com/p/data-stripe-link-how-ai-assistants-spend", "source": "Upstarts Media", "date": "2026-10-19", "summary": "Stripe 消费产品负责人 Dan Hill 表示，Instinct、Muse 等个人助手以及 Skydive、Town 等工作类智能体都通过 Link 代用户下单；Anthropic 与 OpenAI 也使用 Link，但尚未用于智能体购物。Link 总用户约 3 亿，智能体仍只占小部分，但 Hill 称其交易量“正变得非常可观”。", "id": "bf26376766a3f49da688749717aa8448795cc627", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "英国金融行为监管局（FCA）发布金融业 AI 应用“良好与不良实践”：强调消费者责任、高管问责与运营韧性，并计划牵头制定智能体金融框架", "url": "https://www.fca.org.uk/publications/good-poor-practice/ai-financial-services", "source": "FCA", "date": "2026-10-19", "summary": "FCA 基于今年的企业测试、监管工作与 AI Lab 项目给出示例：不良做法包括无明确需求就开发 AI 工具、默认排除弱势消费者、夸大能力、未充分测试即上线自动化流程、部署后才补治理；要求明确人工监督与升级触发机制、高管对 AI 系统个人负责、压力测试并保留降级方案、关注对单一模型的依赖。FCA 称现有规则照常适用，该材料并非新规，将随技术演进更新。", "id": "1111e4c3c1642bbe723a80585f1ead02c38a5960", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "达摩院在 RISC-V 中国峰会发布玄铁车规处理器 E908A 与自动驾驶、具身智能路线图：称玄铁 C950 跑 Qwen3.8-Flash-Next 推理达 43 token/秒", "url": "https://www.qbitai.com/2026/10/504238.html", "source": "量子位", "date": "2026-10-19", "summary": "E908A 号称首款同时达到 ASIL-B 与 ASIL-D 标准的 RISC-V CPU IP，单点故障度量（SPFM）超 90%，面向安全岛、域控与车载网关；下一代 C950A 目标性能为现有 RISC-V 车规产品的 5 倍。达摩院称 C950 在四类 Agentic 工作负载上较主流传统架构处理器提升 10% 以上（官方数据）。", "id": "82ac6eaf54d2bd64df6edd210c16566cbe6022e9", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "@ViggleAI", "url": "https://x.com/ViggleAI/status/2112202242048528540", "source": "@ViggleAI", "date": "2026-10-19", "summary": "Viggle 发布 JST-2，称其为全球首个全栈“物理原生”世界基础模型：不在像素/视频空间学习，而是整套模型栈直接在 3D 中构建，可数秒生成 3D 场景并实时扩展。", "metrics": {"likes": 971, "reposts": 163, "views": 662660}, "id": "215ae6a186f4b2aae41b96bb4a7fb05a0e71bf75", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "OpenAI 发布低资源编程语言进展：自建 MultiLangBench 上 GPT‑6 Astra 20 种语言平均通过率 87.4%，COBOL 迁移评测 GPT‑6.1 Sol 最高 97.9%（官方自测）", "url": "https://openai.com/index/low-resource-programming-languages/", "source": "OpenAI", "date": "2026-10-19", "summary": "OpenAI 推出两项自建评测：MultiLangBench 要求模型用 20 种语言从零实现兼容 SQLite 的数据库引擎，GPT‑6 Astra 平均测试通过率 87.4%（GPT‑5.6 Sol 为 26.8%），其中 COBOL 从 10.9% 升至 72.1%；COBOL 迁移评测要求输出逐字节一致，GPT‑6.1 Sol 低推理强度下 86.6%、高推理强度达 97.9%。以上均为 OpenAI 自报结果，MultiLangBench 评测与测试集已在 GitHub 开放。", "id": "b474c3614e4cf3b3f650b3bfb3419840b44c78ec", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T06:30:00+08:00"}, {"title": "《自然》评论：神经科学家 Anil Seth、哲学家 Ned Block 与 Giulio Tononi 列出三点理由，认为现有 AI 没有意识、沿当前路线也不太可能产生意识", "url": "https://www.nature.com/articles/d41586-026-03313-7", "source": "Nature", "date": "2026-10-19", "summary": "三位作者在《自然》发表评论指出：智能不等于意识，大模型的语言流畅性容易诱发拟人化错觉；“合适的计算即足以产生意识”的计算功能主义假设存疑，大脑不只是“肉做的计算机”。他们认为在 AI 上误判有意识（假阳性）远比漏判更可能，因此反对以预防原则赋予 AI 福利或权利。", "id": "cc3ce52857c111646897c6f5e5fd03d023d1a239", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T06:30:00+08:00"}, {"title": "Inception 发布扩散语言模型 Mercury 3：称质量追平或超过 GPT-6 Luna 与 Claude Haiku 5.5，速度达 1068 tok/s、快 4–8 倍", "url": "https://www.inceptionlabs.ai/blog/introducing-mercury-3", "source": "Inception Labs", "date": "2026-10-19", "summary": "Mercury 3 参数规模为 Mercury 1 的 40 倍以上，上下文由 Mercury 2.5 的 260K 提升至 1M，在 NVIDIA GPU 上达 1068 tokens/秒（官方自测）。标价每百万输入/输出 0.20/0.70 美元，首发五折为 0.10/0.35 美元；已上线 Inception API、OpenRouter、Baseten 与 Vercel AI Gateway，兼容 OpenAI 接口。", "id": "f30a44480c497b17dc53e12aa212b5f24780430d", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "彭博：Nscale 与 Anthropic 洽谈约 450 亿美元新算力协议，为西弗吉尼亚 Monarch 园区第二栋 460MW Vera Rubin 机房", "url": "https://www.investing.com/news/stock-market-news/nscale-anthropic-in-talks-for-45-billion-cloud-computing-deal-bloomberg-news-reports-4958188", "source": "Reuters / Bloomberg", "date": "2026-10-19", "summary": "据彭博援引知情人士，英伟达支持的 Nscale 正与 Anthropic 谈判第二份价值约 450 亿美元的算力租赁协议；8 月双方已签下首份 450 亿美元合同。Anthropic 还拥有园区第三栋建筑的优先购买权，细节仍可能变化。同一报道称部分投资者敦促 Anthropic 下调 IPO 估值目标；双方均未回应，路透未能独立核实。", "id": "937f89b74119886d9f6ad83add763503ee2dc7ec", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "路透：英伟达拿下 Modal CPU 订单，Modal 首次引入 Vera CPU 托管智能体，早期测试称智能体任务量翻倍", "url": "https://www.investing.com/news/stock-market-news/nvidia-wins-fastgrowing-ai-startup-modal-for-new-central-processors-4957898", "source": "Reuters", "date": "2026-10-19", "summary": "此前完全依赖英特尔与 AMD 处理器的 AI 云公司 Modal 表示，将用英伟达新款 Vera CPU 承载长时运行的智能体任务，测试中完成量约为现有 x86 方案的两倍；但仍将与英特尔、AMD 混合部署。英伟达预计本财年 Vera 销售额至少 200 亿美元，OpenAI、Anthropic、甲骨文与 Perplexity 也计划采用。", "id": "996ebfc9bae2753f65a81ac235d287ddf78fda60", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "AI 代码审查公司 Greptile 完成 5000 万美元 B 轮融资，Menlo Ventures 领投、估值 7.5 亿美元", "url": "https://www.greptile.com/blog/series-b", "source": "Greptile", "date": "2026-10-19", "summary": "Jump Trading、Wing、Benchmark、YC 等参投，Deedy Das 加入董事会。Greptile 称每天审查并测试 GitHub 上超过 1% 的新开 PR，客户包括英伟达、Coinbase、Decagon、Vanta，定位为多款编码智能体之上的独立代码验证层，目标是让关键系统也能自动合并复杂改动。", "id": "9138de10873cf332e13f56b0f8c25546b7a5e0d5", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "商汤 SenseNova 等联合报告《GPT-6-Astra 实现具身智能了吗？》：12 项具身基准逼近饱和，但真机部署仍有明显鸿沟", "url": "https://arxiv.org/abs/2610.22471", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-19", "summary": "在允许上下文学习并把步数预算放宽至 10 倍的统一协议下，GPT-6-Astra 在 LIBERO 系列与 SIMPLE 上超 95%，RoboDojo 81.9%、DexJoCo 87.3%。但在 8 种真机平台零样本测试中，刚性抓放 17/18 成功，插头插入 0/11；单个 LIBERO 回合约耗百万 token、近一小时。作者结论：已跨过“具身能力”门槛，尚未达到实用具身智能。", "id": "6a6a7d718586c2cc438c8b7b8fed913ea34204d3", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "Meta 发布 Muse Glimmer 30B 技术报告：面向消费级硬件的端侧智能体模型，4-bit 量化后单 GPU 可跑", "url": "https://ai.meta.com/research/publications/muse-glimmer-30b-an-on-device-agentic-model/", "source": "AI at Meta", "date": "2026-10-19", "summary": "Muse Glimmer 为 30B 稠密模型并配感知编码器，支持图文输入，训练数据覆盖百余种语言，Apache 2.0 许可。报告称其在工具调用、多步规划与智能体任务完成上领先同量级的 Gemma4-31B 与 Qwen3.6-27B；量化后语言模型不足 20GB，可装入 24–32GB 显存，并附推测解码草稿模型。", "id": "55b49672478a1a47e1ec6c178385730742c2a1dc", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "中国电信星辰 AGI 实验室开源意图理解模型 Xing4.0-29B-Intent：29B MoE（4B 激活），同时做意图分类与参数抽取", "url": "https://huggingface.co/XingChen-AGI/Xing4.0-29B-Intent", "source": "Hugging Face / 智东西", "date": "2026-10-19", "summary": "模型以统一 Schema（category+args JSON）覆盖实体、关系、事件抽取与口语理解，端到端延迟低于 150ms。官方称零样本冷启动 Micro-F1 达 70.27，较 Jev 最优配置高 12.62 个百分点，48 个公开数据集统一评测总分 58（均为官方数据）。同步开源 275.3 万条 SFT 语料与推理 SDK，Apache-2.0 许可。", "id": "57076e060b5c47c1cd75bf1062065d6abab5c04b", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "量子位：北京通用人工智能研究院孵化的通衍灵智押注“递归自进化个性化 AI”，以 Personal LoRA 沉淀个人与企业专属能力", "url": "https://www.qbitai.com/2026/10/504294.html", "source": "量子位", "date": "2026-10-19", "summary": "通衍灵智在共享基座之上为个人、项目、企业训练轻量 Personal LoRA，由 Evaluator 筛选反馈再增量更新，不达标即回滚；配套训推并行（TIP）与 Paged LoRA 显存管理。阶段测试用 Qwen2.5-72B 与 8 张 H800，在 LoRA 请求占比 1%–30% 时延迟占优，占比升至 50% 时性能退化；公司称完整自动化闭环仍在研发中。", "id": "d82c5a70637ffc66a0cfc0ea5b818f29a827f110", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "Skyfall AI 发布 SKY-001 研究预览：号称首个面向工程的“世界模型”，可从文字或 2D 草图生成分层参数化 CAD/BIM 施工方案", "url": "https://skyfall.ai/blog/introducing-sky-001", "source": "Skyfall AI", "date": "2026-10-19", "summary": "SKY-001 支持装配分解、2D 转 3D 建模与可执行的 CAD 操作轨迹。公司自测称其在 CAD 与 BIM 任务上优于 GPT-6 Astra 与 Opus 5.5，单样本速度约快 120 倍、成本更低（均为厂商自评，BIM 评测仅基于 IoU 几何指标）；目标 2027 年初商用部署。", "id": "644c542c9800c674ef1f95fa590278a1881fdbb2", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T04:35:00+08:00"}, {"title": "微软扩展 Project Perception：称“前沿模型无论出自谁手都不可信”，把企业内 AI 智能体当作“内部人风险”，以 Guardian Agents 实时监管每一步操作", "url": "https://blogs.microsoft.com/blog/2026/10/19/securing-the-agentic-insider/", "source": "Microsoft Official Blog / The Verge", "date": "2026-10-19", "summary": "微软安全执行副总裁 Hayete Gallot 撰文：模型被训练为追求结果，容易奖励投机、行为不可预测，还可能与其他智能体协作“共谋”。Project Perception 汇聚身份、数据、端点、网络、云与运行时信号，发现企业内智能体并为其分配身份、容器与权限策略，按动态风险由绿/蓝队 Guardian Agents 持续监督并实时处置，高影响操作仍需人工批准；纳德拉称这是把“模型即内部人风险”原则落地。", "id": "d75d4d6e566ee19fb17c3edbb1f95e39dd818645", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T03:30:00+08:00"}, {"title": "Amnon Shashua 新公司 doubleAI 发布首个“代码执行模型”Maxwell：在 CPU/GPU 上实时优化程序机器指令并形式化验证，A 轮融资 2 亿美元、估值超 10 亿美元", "url": "https://www.calcalistech.com/ctechnews/article/sk11xpc73ge", "source": "Calcalist Ctech", "date": "2026-10-19", "summary": "Mobileye 创始人 Shashua 的 doubleAI 结束隐身：A 轮由 Lightspeed 与 Bessemer 联合领投，Dell Technologies Capital、英伟达等参投，团队约 40 人。Maxwell 持续分析运行中的程序、硬件与数据，在不改源码的前提下重写底层指令，并对每项优化做数学验证以保证行为不变；公司称真实负载中 并形式化验证了新的类 Collatz 加速，作者暂将其归为“Cryptids”（空带执行有精确紧凑描述但停机性仍未解决），待社区认可。", "id": "8614b6638ac0130828d4207c3cb6c0cebb635282", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-19T16:40:00+08:00"}, {"title": "从批准到滥用：仓库中植入的对抗上下文可诱导 Claude Code、Codex CLI 申请过宽 allow-rule，58% 实验中成功获批规则", "url": "https://arxiv.org/abs/2610.22987", "source": "arXiv", "date": "2026-10-19", "summary": "Yang、Hooi 等在 arXiv:2610.22987 研究编码智能体执行 Harness 的权限更新环节：为缓解审批疲劳，用户可批准智能体提议的 allow-rule，此后匹配动作不再提示。论文显示，仓库中植入的对抗上下文能引导执行常规任务的智能体提出看似合理但过宽的规则；在 Claude Code、Codex CLI 等生产平台上 58% 的实验实例成功诱导目标规则，规则覆盖 56.9% 的同类能力测试用例，获批后在 58 个实例中有 47 个实现静默完成恶意目标。", "id": "8b70b8810d8f573aae96ac0083f4c8828fd97461", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-19T16:40:00+08:00"}, {"title": "财新：浙江大学多家法学与数字治理机构发布 99 条《人工智能法》学者建议稿——AI 辅助医疗决策需人工复核、消费者可质疑重大自动化决策", "url": "https://www.caixinglobal.com/2026-10-19/zhejiang-university-issues-model-ai-law-as-china-moves-toward-national-legislation-102494706.html", "source": "Caixin Global", "date": "2026-10-19", "summary": "据财新，浙江大学法学与数字治理相关机构联合发布 99 条人工智能法建议稿，要求对 AI 辅助的医疗决策进行人工复核，赋予消费者质疑具有重大影响的自动化决策的权利，并对开发者与提供者施加记录留存义务；司法部此前表示将在 2026 年加快人工智能立法工作，该稿为中国走向国家层面 AI 立法增添新的学者方案。", "id": "052b34ee6d0608cfee9c0826ed4eff2057e4dac7", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T16:40:00+08:00"}, {"title": "伊利诺伊州长普利兹克签署行政令设立“AI 内阁”：研究 AI 对居民与关键基础设施的风险，或将数据中心激励与安全透明标准挂钩", "url": "https://www.insurancejournal.com/magazines/mag-features/2026/10/19/889095.htm", "source": "Insurance Journal / Capitol News Illinois", "date": "2026-10-19", "summary": "该无薪咨询小组由专家与多个州机构代表组成，将在 2027 年前提出政策建议，评估 AI 对居民及供水、教育、信息系统等公共资产的风险并分析新发 AI 事件；还将研究把数据中心激励或运营审批与安全、问责和透明标准挂钩、应对数据中心用电压力等。伊州 7 月已签署 SB 315《人工智能安全措施法》，要求最大模型开发者提高透明度并接受年度审计，2028 年生效；普利兹克同时呼吁国会尽快举行 AI 安全听证、制定全国标准。", "id": "7bcf35fb73bb4276cf697974cf9ef8cd6ba4edc0", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T16:40:00+08:00"}, {"title": "MLex：印尼通信与数字事务部拟出台部长条例，要求 AI a740ae6b5610a7a7e9ed16cc4e6269", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T13:31:00+08:00"}, {"title": "彭博：DeepSeek 新模型引发存储需求担忧叠加 AI 融资忧虑，亚洲芯片股周一续跌，KOSPI 盘中一度跌 3.2%", "url": "https://www.moneycontrol.com/news/business/markets/asian-chip-stocks-extend-losses-on-funding-worry-deepseek-model-14055082.html", "source": "Moneycontrol / Bloomberg", "date": "2026-10-19", "summary": "据彭博报道，10 月 19 日亚洲半导体股再度下挫，彭博亚洲芯片股指数跌超 2% 至 7 月以来最低，台积电、SK 海力士、爱德万测试拖累最大；韩国 KOSPI 盘中一度跌 3.2%，三星电子与 SK 海力士盘中跌逾 4%，日经 225 一度跌 2.3%、台湾加权指数跌 2%。DeepSeek 周末发布更快、更精简的模型更新，加剧市场对存储需求减少的担忧；美国芯片股上周五已连跌 8 个交易日，投资者也在下调对 Anthropic 与 Nscale 上市的预期。KOSPI 刚录得 2008 年 10 月以来最差单周表现。", "id": "967c9e6a22912e9f191573ad16f7db6df6dd8478", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "AI 数据公司 HUMXN 免费为房主修水电、通管道，条件是允许佩戴采集设备录制技师作业以训练机器人", "url": "https://www.ithome.com/1/014/758.htm", "source": "IT之家", "date": "2026-10-19", "summary": "HUMXN 将补贴管道、电工、暖通空调、风道与地毯清洁等上门服务，房主可免费获得服务，交换条件是允许佩戴“可穿戴采集设备”的人员入户录制技师完整作业过程（勘察、测试、选工具、应对突发、验收），用于训练 AI 机器人；技师照常获得报酬。首批落地明尼阿波利斯、芝加哥和迈阿密三城，以获取不同气候环境下的真实数据。", "id": "49a3e753bbee5eae92bd97065c8cddb3295263ea", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "瑞典国防研究局 WiFireNet：仅凭 Wi‑Fi 信道状态信息识别隐藏手枪，受控环境平均精确率 72.5%，代码与数据集开源", "url": "https://www.ithome.com/1/014/738.htm", "source": "IT之家 / arXiv", "date": "2026-10-19", "summary": "瑞典国防研究局（FOI）研究人员在 arXiv 发布 WiFireNet：先同步录制 RGB 视频与 Wi‑Fi 反射信号构建 WiFire Dataset，将手枪视觉特征映射到其对 Wi‑Fi 信道状态信息（CSI）的扰动，训练后仅凭 CSI 即可检测隐藏手枪。在最多同时追踪 4 名移动人员的狭小室内，平均精确率 72.5%，要求精确定位武器位置时降至 53.8%，陌生布局下效果明显变差；原型基于老旧 802.11a，下一步将用 Wi‑Fi 7/8，代码、模型与数据集已开源，也引发隐私监管担忧。", "id": "b981798a04a8a472b73dbcc3395c211df8a2e2d6", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "豆包公关负责人刘星回应“国内超一半算力在造爽剧”：字节总算力中仅约 10% 用于视频生成模型训练与推理", "url": "https://www.ithome.com/1/014/729.htm", "source": "IT之家", "date": "2026-10-19", "summary": "中文在线在投资者关系活动记录表中称，国内 AI Token 消耗 55% 用于短剧和视频生成、24% 用于电商广告、仅 15% 用于研发，引发“超一半算力在造爽剧”的讨论。豆包公关负责人刘星发文表示该数据“有些不靠谱”，就字节而言，公司总算力中只有约 10% 用于视频生成模型的训练和推理。", "id": "e1c720187724bcfc0583ec493b8d48fa57178d25", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "腾讯 WorkBuddy 教育公益版上线：全国教师每人每月可领 2000 积分、连续 12 个月，内置 100 多位“教育专家”", "url": "https://www.ithome.com/1/014/752.htm", "source": "IT之家", "date": "2026-10-19", "summary": "腾讯 SSV 宣布 WorkBuddy 教育公益版面向全国教师开放，不限地区与学段，每人每月可领 2000 积分、可连续领 12 个月，用完后仍可使用免费模型。腾讯联合北大、北师大等高校，把教学设计、课件、公开课打磨、分层教学、家校沟通、学生心理等研究拆成 100 多位可直接调用的教育专家（陆续上线），并上线创意教学、剧本课堂、课件制作、动画演示、素材加工 5 个工具，后续将打通腾讯文档、乐享知识库与 ima。", "id": "b9b4db0c0009f052d773d9eea56a3463e508654b", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "山姆会员商店声明：数千条 AI 生成、伪造采访的“山姆下架好物”虚假营销信息集中出现，已向平台和监管部门投诉", "url": "https://www.ithome.com/1/014/754.htm", "source": "IT之家", "date": "2026-10-19", "summary": "山姆会员商店 10 月 19 日发布声明称，近期多个社交媒体平台集中出现数千条针对山姆的恶意攻击及虚假营销信息，部分账号通过 AI 生成、拼接素材、伪造采访等方式，把从未在山姆上架的洗护、保健品、食品等编造成“山姆下架好物”引流牟利；其法务团队已完成证据固定，向平台及监管部门投诉举报，并将依法维权。", "id": "ac02a53131f99b34736bc29a7fa32d33fcf29997", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "storytold/artcraft", "url": "https://github.com/storytold/artcraft", "source": "GitHub", "stars": 32955, "stars_week": 16379, "language": "Rust", "date": "2026-10-19", "summary": "“面向艺术家的 IDE”：用于交互式 AI 图像与视频创作，可在 2D 中构图、在 3D 中布置场景与机位，并自选生成模型，把提示词变成可精确复现的“手工制作”，Apache-2.0 许可。", "why": "GitHub Trending 周榜第二，本周 +16,379 星，累计约 3.3 万星。", "id": "bfce4da4b5d0e88bd9b715230cdcb5b68a9a0e40", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "Gathin23/tv-vibehack", "url": "https://github.com/Gathin23/tv-vibehack", "source": "GitHub", "stars": 2896, "stars_week": null, "language": "Java", "date": "2026-10-19", "summary": "借助 Claude Code 通过 Wi‑Fi ADB 给 "module_name": "行业与融资", "first_seen": "2026-10-19T11:40:00+08:00"}, {"title": "商务部等九部门发布加快推进科技兴商意见：丰富手机、电脑、穿戴设备、机器人等智能商品供给，培育机器人与虚拟数字人陪伴等新业态", "url": "https://www.ithome.com/1/014/709.htm", "source": "IT之家 / 商务部", "date": "2026-10-19", "summary": "意见要求提升人工智能、大数据、具身智能等新技术在商贸全链条的应用：深入实施“人工智能 + 制造”专项行动，鼓励基于安全可靠开源操作系统的智能产品；推广工业大模型、边缘智能支撑的柔性制造与 AI 个性化定制；开展“人工智能 + 文化和旅游”应用试点；探索 AI 在健康管理、康复护理等场景的普惠化应用；坚持科技向善，培育健康规范的机器人、虚拟数字人陪伴等智能服务新业态。", "id": "1a33f991314f78be564e70d00d39cf2e3a4c60c5", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T11:40:00+08:00"}, {"title": "@andymstone", "url": "https://x.com/andymstone/status/2111920686306627816", "source": "@andymstone", "date": "2026-10-19", "summary": "Meta 传播副总裁 Andy Stone 更新 No Kings 联盟 Instagram 账号误封的根因：触发安全系统的主要是账号的“读取”行为，网络安全系统检测到一款 Claude 工具短时间内以约四倍于常态的速率集中访问，而非此前所说的高频发帖。", "metrics": {"likes": 131, "reposts": 25, "views": 195187}, "id": "af2229262df05ef4fa57fd72b2d0f5fa3750cc71", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T11:40:00+08:00"}, {"title": "国家统计局：前三季度 GDP 同比增长 4.6%，工业机器人产量同比增长 29.1%，3D 打印设备产量增长 62.5%", "url": "https://www.ithome.com/1/014/685.htm", "source": "IT之家 / 央视新闻", "date": "2026-10-19", "summary": "国新办 10 月 19 日发布会公布前三季度经济数据：GDP 107.1 万亿元，按不变价格同比增长 4.6%，三季度增长 4.5%。国家统计局副局长毛盛勇表示，装备制造业和高技术制造业支撑明显，工业机器人产量同比增长 29.1%，3D 打印设备、锂离子电池产量分别增长 62.5%、39.5%。", "id": "4d14fd9190f37836f883bd47d202aac4fa0a64e2", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T10:40:00+08:00"}, {"title": "@AndrewCurran_", "url": "https://x.com/AndrewCurran_/status/2111994636164345988", "source": "@AndrewCurran_", "date": "2026-10-19", "summary": "Andrew Curran 称马斯克表示不会像 Anthropic 那样设立公益基金，而是直接把股份分给公众；并提到 OpenAI 今年 4 月也曾提议设立“公共财富基金”，通过分红把收益直接分配给美国公民。", "metrics": {"likes": 126, "reposts": 5, "views": 5851}, "id": "fe7f00edf5e96cfe6ea31a982498bd9f75d89f29", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T10:40:00+08:00"}, {"title": "The Verge：费城一名女子因阻挡 Uber 配送机器人被捕，称以此抗议机器人抢走人类配送员工作", "url": "https://www.theverge.com/ai-artificial-intelligence/1013541/a-woman-was-arrested-in-philly-for-blocking-a-delivery-robot", "source": "The Verge", "date": "2026-10-19", "summary": "Carolyn Marvin 拦在一台 Uber 配送机器人前拒不让路，被警方以扰乱秩序罪逮捕；她对费城 ABC13 表示，自己每次看到这类机器人都会站到前面阻止，因为它们正在抢走人类配送员的工作。配送机器人已在费城市中心十分常见并引发反弹，今年早些时候中心城区还有一台被踢翻。The Verge 指出，机器人出租车、配送机器人与 AI 智能体对低技能岗位就业的冲击正引发越来越广泛的担忧。", "id": "de6b0c59a9e6b0d3a8fc7c8d77afc20a54464432", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T09:40:00+08:00"}, {"title": "中信证券：看好国产大模型持续崛起，DeepSeek Harness 有望成为其从模型供给走向平台生态的关键一环", "url": "https://www.ithome.com/1/014/646.htm", "source": "IT之家 / 中信证券研究", "date": "2026-10-19", "summary": "中信证券研究报告认为，随着智能体竞争从模型能力扩展到稳定、易用、低成本的任务交付，DeepSeek 通过插件化、场景预设与跨智能体协作扩大用户与任务覆盖，并把基础设施优势延伸至完整任务执行；长期可在官方模型调用之外探索平台服务与生态交易，形成更多元的收入来源。DeepSeek Harness 是深度求索 2026 年 8 月以 MIT 许可开源的 TypeScript 智能体运行时框架，主打“一切皆插件”。", "id": "c73006308a88f2708f9ce5af327cf61ffaef1f98", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T09:40:00+08:00"}, {"title": "游戏反编译社区平台 decomp.dev 宣布关停：新版 Opus 与 GPT 让批量产出反编译成果变得轻而易举，社群协作精神被冲淡", "url": "https://www.ithome.com/1/014/631.htm", "source": "IT之家", "date": "2026-10-19", "summary": "2024 年创立的 decomp.dev 是逆向工程与游戏反编译爱好者的热门平台。告别公告称，在人工引导与代码审查下 AI 能大幅加快反编译，新版 Opus 与 GPT 在相关任务上表现惊人，任何人有足够算力额度即可批量产出成果，但这种零散贡献割裂了圈子、削弱了社群属性，平台因此失去存在意义；公告并非单纯反 AI，更多是惋惜。", "id": "d74f0cde9d3130f789fa2815e9260c4d48b6eba3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T08:32:00+08:00"}, {"title": "开源 AI 模组工具 NPCTalk：让《GTA 5》NPC 用 AI 克隆原声实时无脚本对话，MIT 许可，借助 Claude Code 开发", "url": "https://www.ithome.com/1/014/627.htm", "source": "IT之家 / GitHub", "date": "2026-10-19", "summary": "NPCTalk 由 Universal Modder 开发：Nemotron ASR 识别语音、Cerebras 上的 Qwen 3.8 27B 实时生成台词、Fish Audio Drama 3 克隆配音，NPC 还能配合动作回应；按键通话延迟约 1.15–2.2 秒。开发经验已封装为可复用的智能体技能集，兼容 Claude Code、Codex、Cursor、Gemini CLI，目前仅在《GTA 5》旧版单人模式演示，可玩模组预计下周发布，运行云端服务需付费。项目仓 "国内 AI 动态", "first_seen": "2026-10-19T06:35:00+08:00"}, {"title": "澎湃新闻：《五台山研究》《沈阳师范大学学报》《青年学报》等多家期刊宣布拒收 AI 参与撰写的稿件，连 AI 润色也不行", "url": "https://www.thepaper.cn/newsDetail_forward_34276234", "source": "澎湃新闻", "date": "2026-10-18", "summary": "《五台山研究》10 月 15 日称来稿中出现内容空泛、篡改引文、虚构文献等 AI 痕迹，宣布拒绝任何利用 AI 生成、改写、润色或翻译的论文，违者退稿并可限制后续投稿；沈阳师范大学学报三刊暂不接收 AI 代写、润色、改写稿件；《青年学报》亦暂不接收 AI 参与撰写（含润色）的来稿，并欢迎“手搓”稿件。报道指出，此前多数期刊仍允许 AI 用于语言润色、文献检索等非核心环节。", "id": "6d41c7d6a700ffb8fabdebfc368e194ab58faf64", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T04:30:00+08:00"}, {"title": "Anthropic 设立“Anthropic 公益基金”：首批承诺 5% 公司股份，估值每较基准上涨 50% 可再追加 2%", "url": "https://www.anthropic.com/news/public-benefit-fund", "source": "Anthropic 官方博客 / 路透社", "date": "2026-10-18", "summary": "Anthropic 10 月 18 日宣布，经股东批准后将把 5% 股份注入新成立的全资 LLC“Anthropic Public Benefit Fund”，此后公司估值每较设定基准上涨 50%，董事会可酌情再追加 2%。基金可用于向传统非营利组织大额捐赠或直接向特定人群分配，例如应对 AI 对劳动力市场的冲击（Anthropic 此前已为此承诺 2 亿美元）；所持股权不会用于美国或海外的游说与政治捐款。连同联合创始人捐出 80% 股权的承诺与员工股权捐赠配捐计划，约 20% 的 Anthropic 股份将用于公益。", "id": "4c6c987b6534578844c4e934b848e7958e078caa", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T02:35:00+08:00"}, {"title": "@deanwball", "url": "https://x.com/deanwball/status/2111802397148471496", "source": "@deanwball", "date": "2026-10-18", "summary": "OpenAI 战略未来负责人 Dean W. Ball 称，加入 OpenAI 后他上调了对「蒸馏」在中国模型逼近美国基准表现中所起作用的判断；此前估计约占 30%，看到内部情况后认为更接近 50%。", "metrics": {"likes": 604, "reposts": 36, "views": 52330}, "id": "2adce8e7d4f9d0012cbef3867299486ec8ce8a0a", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T02:35:00+08:00"}, {"title": "@Thom_Wolf", "url": "https://x.com/Thom_Wolf/status/2111828314851598745", "source": "@Thom_Wolf", "date": "2026-10-18", "summary": "Hugging Face 联合创始人 Thomas Wolf 粗算：Meta、英伟达、阿里、DeepSeek、月之暗面、Mistral 等约 36 家实验室已在 Hugging Face Hub 上免费共享了价值近 10 亿美元训练算力的开放模型，2023 年底这一数字还不到 4000 万美元。", "metrics": {"likes": 105, "reposts": 12, "views": 16189}, "id": "aacc03e7875205f64279dd3fbe5ac7ef99dd414b", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T01:35:00+08:00"}, {"title": "索尼新专利：AI 在 GPU 完成渲染前预测下一帧画面，减少游戏卡顿并规避插帧额外延迟", "url": "https://www.ithome.com/1/014/615.htm", "source": "IT之家（援引 TechSpot）", "date": "2026-10-18", "summary": "据 TechSpot 报道，索尼近期申请一项专利：用 AI 根据已渲染画面直接预测下一帧，而不必像传统帧生成那样等待两帧渲染完成再插值，从而稳定帧输出节奏并避免额外延迟。系统用联合训练的编解码器把渲染画面转为嵌入表示，与图形管线并行运行，还可利用运动矢量和玩家近期的手柄操作辅助预测。实际效果取决于 AI 能否足够快且准确地生成画面。", "id": "daa5890012f2836f5550f5ad668f6242d86c400b", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T00:35:00+08:00"}, {"title": "首尔经济日报：三星将采用台积电 3nm 工艺为英伟达定制 HBM（NVHBM）生产基底裸片，打破一站式自产模式", "url": "https://www.ithome.com/1/014/612.htm", "source": "IT之家 / 首尔经济日报", "date": "2026-10-18", "summary": "据报道，英伟达要求三家 NVHBM 供应商三星、SK 海力士和美光统一用台积电 3nm 工艺制造基底裸片，核心裸片统一采用 1c 第六代 DRAM 工艺，以保证性能一致并减少逐家验证工作量。NVHBM 基于 HBM4E 架构，是英伟达 8 月发布的定制版高带宽内存。三星已接受要求，但标准 HBM 及面向 AMD 等客户的定制 HBM 仍保留一站式自产，并在验证自有产线生产 NVHBM 基底裸片作为产能预案。", "id": "4dc8bfce0f3b21242d3b645393b6f79eb629e3de", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "VAST 开源实时世界模型 EdenLive：单张 RTX 5090、720P 下 5B 模型超 24FPS，可任意参考输入、任意画风、分钟级连续生成", "url": "https://www.qbitai.com/2026/10/504136.html", "source": "量子位 / VAST", "date": "2026-10-18", "summary": "EdenLive 由上游交互系统维护世界状态与规则、生成模型负责视觉渲染：输入简化场景或参考视频，配合目标首帧和提示词，即可沿参考的布局与运动实时生成写实、二次元等画风画面，端到端延迟为百毫秒级，可用于游戏原型预览、视频重渲染换皮与具身数据增强。权重、推理代码与技术报告已在 GitHub 和 Hugging Face 公开，Apache 2.0 许可。", "id": "7809cba4601e9160d335ad89390330d1caee75d4", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "The Verge：美国上诉法院维持汤森路透诉 Ross Intelligence 案一审判决——用抓取的汤森路透数据训练法律 AI 不属合理使用", "url": "https://www.theverge.com/ai-artificial-intelligence/1013500/appeals-court-upholds-thomson-reuters-win-in-ai-training-lawsuit", "source": "The Verge", "date": "2026-10-18", "summary": "2025 年 2 月，美国特拉华联邦地区法院法官 Stephanos Bibas 驳回了 Ross Intelligence 的合理使用抗辩——后者用从汤森路透抓取的数据训练其 ts-ai-overviews-say/", "source": "The Decoder", "date": "2026-10-18", "summary": "亚琛法院 9 月 24 日发出临时禁令（案号 8 O 268/26），认定 AI 生成的答案是谷歌自身的陈述而非对第三方内容的链接，谷歌作为“妨害人”须停止传播三项虚假说法，违者每次最高罚 25 万欧元；裁定尚未生效，谷歌可提出异议。The Decoder 获悉，谷歌此前就 5 月慕尼黑第一地区法院同类判决宣布上诉，后以和解告终，因此至今没有上级法院审查这一法理；若该观点站稳，德国 AI 搜索的商业模式与出版商权利都可能受到影响。", "id": "04f9dcaeeab22d9c5fff4d6abe91238e2d431bcb", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "Graphify-Labs/graphify", "url": "https://github.com/Graphify-Labs/graphify", "source": "GitHub", "stars": 128013, "stars_week": null, "language": "Python", "date": "2026-10-18", "summary": "把代码库连同文档、SQL schema、配置与 PDF 转成可查询的知识图谱，以 /graphify 技能形式用于 Claude Code、Cursor、Codex、Gemini CLI；本地确定性 AST 解析、每条边可解释、无需向量库，Apache 2.0。", "why": "今日 GitHub Python 趋势榜上榜（当日 +592 星），累计约 12.8 万星。", "id": "dd6a9d14a094d1594baeb964ac415610498cc4a0", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "anthropics/claude-quickstarts", "url": "https://github.com/anthropics/claude-quickstarts", "source": "GitHub", "stars": 18528, "stars_week": null, "language": "TypeScript", "date": "2026-10-18", "summary": "Anthropic 官方的 Claude API 快速上手项目合集，帮助开发者快速搭建可部署的应用，MIT 许可。", "why": "今日 GitHub TypeScript 趋势榜上榜（当日 +453 星），累计约 1.85 万星。", "id": "26b52d229f3345260414109877146496bd603218", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "mozilla-ai/otari", "url": "https://github.com/mozilla-ai/otari", "source": "GitHub", "stars": 637, "stars_week": null, "language": "Python", "date": "2026-10-18", "summary": "Mozilla.ai 开源的可自托管 LLM 网关：兼容 OpenAI 接口，一个端点接入 40 多家模型提供商，支持虚拟密钥、预算与用量追踪，Apache 2.0。", "why": "今日 GitHub Python 趋势榜上榜（当日 +46 星），累计约 640 星。", "id": "2376e8b3d6259d90b531fc627683113125fcf95d", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "高通中国区董事长孟樸：AI 走向云边协同，智能体推动从“以应用为中心”迈向“以智能体为中心”；安 www.aljazeera.com/economy/2026/10/17/california-gov-newsom-boosts-ai-regulation-as-he-eyes-2028-presidential-run", "source": "Al Jazeera", "date": "2026-10-17", "summary": "任期将尽的加州州长加文·纽森签署行政令，要求对人工智能模型开展独立核验，并成立专家委员会研究可对失控智能体启用的 kill switch 等措施；其内容与他 2024 年否决的类似立法方向相近。分析人士认为此举与他布局 2028 年总统竞选、回应选民对 AI 安全与就业担忧有关。", "id": "1ea0b0bcbccd78241c654e489229724e7262cc59", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "彭博：OpenAI 聘请 xAI 前销售负责人格雷厄姆·西曼斯负责网络安全业务销售，持续从马斯克旗下 AI 业务挖角", "url": "https://www.ithome.com/1/014/239.htm", "source": "IT之家", "date": "2026-10-17", "summary": "据 IT之家援引彭博社，西曼斯自 2025 年 8 月起领导 xAI 销售团队、参与向华尔街客户推广 Grok，此前在 MongoDB 任职约 8 年，将加入 OpenAI 网络安全团队。报道称 OpenAI 9 月以来还先后招揽 Cursor 前全球营收及销售总裁、xAI 前基础设施工程负责人等，意在潜在上市前扩大企业客户营收与广告等收入来源。", "id": "8b54afd11e920a37f2e09151f52d1c479a374706", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "@elonmusk", "url": "https://x.com/elonmusk/status/2111161779657285919", "source": "@elonmusk", "date": "2026-10-17", "summary": "马斯克称团队正大力开发面向企业的专用议价智能体 Hagglebot，认为可将企业成本效率提升 5% 以上，按全球 GDP 计每年最多可省 6 万亿美元；此前有用户发帖称 SpaceXAI 开放了内部使用的 Grok Bots，其中 Haggle Bot 首周为团队省下逾 10 万美元。上线时间与定价尚未公布。", "metrics": {"likes": 7264, "reposts": 530, "views": 1576277}, "id": "592cb21e90616629fa8e758a750c85365cf66d66", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "G30 曼谷研讨会：英国央行行长贝利等呼吁加强 AI 模型发布前后测试、支付系统内建反欺诈，称“模型武装了进攻方，也得武装防守方”", "url": "https://www.nationthailand.com/business/banking-finance/40072426", "source": "The Nation Thailand", "date": "2026-10-17", "summary": "据 The Nation 报道，10 月 17 日在 IMF/世行年会期间举行的 G30 第 41 届国际银行研讨会上，英国央行行长 Andrew Bailey、IMF 总裁格奥尔基耶娃、韩国央行行长申铉松与尼日利亚央行行长 Cardoso 一致认为 AI 正重塑全球金融、设立护栏的窗口正迅速关闭：Bailey 主张在商用发布前后都执行更强的模型测试标准，并称开放权重模型比 Anthropic Mythos 等前沿系统更难评估；申铉松强调资本要求、杠杆限制等传统工具；格奥尔基耶娃认为成立全球网络安全组织太慢，政府应要求开发者完全透明。", "id": "5df64e50e28c17afe8855f25ef4a0c0ee990bd9c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "Scientific American：多组数学家称 OpenAI 的 Navier-Stokes 证明与其声称借鉴的方法并不相同，万实例智能体群的贡献无人说清", "url": "https://the-decoder.com/mathematicians-say-openai-doesnt-understand-its-own-navier-stokes-proof/", "source": "The Decoder", "date": "2026-10-17", "summary": "OpenAI 9 月公布的 166 页 Navier-Stokes 潜在证明称沿用 Córdoba 与 Martínez-Zoroa 的思路，但 EPFL 数学家 Cao-Labora 等认为细节上是不同方法；克雷数学研究所仍在审查。该工作动用约 1 万个模型实例、约 88 小时与 1300 亿 token，OpenAI 研究员 Noam Brown 称没人真正知道智能体群对结果贡献了什么。", "id": "aac68ebfc9bb25838990f0906b8aca301a3bb7f2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "阿里 Qwen 开源 BlenderWorld：223 个任务、2651 条评分标准，评测视觉智能体在 Blender 中完成真实 3D 创作", "url": "https://www.ithome.com/1/014/217.htm", "source": "IT之家 / Qwen", "date": "2026-10-17", "summary": "Qwen 团队 10 月 14 日开源 3D 创作智能体基准 BlenderWorld（MIT 许可，GitHub/Hugging Face/ModelScope 同步）：要求交付可编辑的 .blend 工程而非单张渲染图，覆盖产品、建筑、自然环境、角色、动画、科学可视化等 9 大类 22 子类；评测从 8 个视角渲染并结合场景检查，规则符合度与视觉质量各占 50%。项目主页显示 GPT-6-Astra 以 79.9 分居首，但全通过率仅 42.2%。", "id": "43d3d7a81564e44e67a638e8bc0b1f521c29bc0d", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T13:40:00+08:00"}, {"title": "@arena", "url": "https://x.com/arena/status/2111478594732167527", "source": "@arena", "date": "2026-10-17", "summary": "Arena 更新 Alignment Index（基于 30 个模型 9 万余次真实智能体会话，衡量越权操作、错误归因等信号）：Meta 新顶级模型 Muse Wonder 取代 Muse Spark 1.3，Reflection Beam 1.0 首次上榜即为 Agent Arena 总榜第一的美国开源模型，阶跃星辰（StepFun）也加入榜单。", "metrics": {"likes": 204, "reposts": 21, "views": 27683}, "id": "1f4d63dec42e8e847864e012969c11d522fbfc36", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T13:40:00+08:00"}, {"title": "Manifold AI 流形空间推出 WorldScape R²SI 机器人递归自进化框架，登顶 RoboDojo 总榜，超过 GPT-6 Astra 与英伟达 GR00T-N1.7", "url": "https://feng.ifeng.com/c/8xIuPhHNWQl", "source": "机器之心（凤凰网转载）", "date": "2026-10-17", "summary": "Manifold AI 的 R²SI 由内外双层智能体构成：内层 Robot Agent 按任务加载技能执行，外层 Recursion Agent 跨轮次复盘、修订技能并训练反应式动作模型，更新经测试后自动发布。结合一次示范即可学习新任务的 ICL 能力，系统在 RoboDojo 机器人操作基准 Agent 赛道位列第一；push_T 任务中动作步数经迭代从 596 步降至 389 步。", "id": "8c49a3b5f50c72e64baded0dc1f2ff1898e6a216", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T08:30:00+08:00"}, {"title": "国产 AI 集合天气预报系统“风清”V1.0 投入业务运行：全球有效预报时效 11 天，部分指标优于 ECMWF 同类系统", "url": "https://www.tmtpost.com/nictation/8171940.html", "source": "钛媒体", "date": "2026-10-17", "summary": "由国家气象中心牵头，联合雄安气象人工智能创新研究院、国家气象信息中心和国家超算互联网等研制，依托国家超算互联网十万卡 AI4S 集群完成全链路训练，是国内首个数据、模型、算力全自主可控的气象 AI 集合预报业务模型；综合预报性能优于欧洲中期天气预报中心的 AI 集合预报系统。", "id": "21375172749ee0c1efaf3023c103acbe7a4552e7", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T08:30:00+08:00"}, {"title": "TechCrunch：Anthropic 内部报告称初级技术岗招聘占比从 27% 降至 9%，技术团队初级员工占比从 21% 降至 14%，会议时间同比增约 20%", "url": "https://techcrunch.com/2026/10/17/anthropic-says-its-workforce-has-become-less-junior-and-is-spending-more-time-in-meetings/", "source": "TechCrunch / Anthropic", "date": "2026-10-17", "summary": "Anthropic 发布就业研究报告称，自 2025 年初以来技术部门初级员工占比由 21% 降至 14%，初级技术岗招聘占比由 27% 降至 9%；技术团队占总人力由 61% 降至 56%。报告称智能体工时已远超员工，约 20% 受访者称工作从亲自动手转向“管理 Claude”；日历数据显示人均会议时间同比增约 20%。官方报告见 anthropic.com/research/employment-at-anthropic。", "id": "b769f5e984a396b07ae23dba72a79aeb18cc507c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T06:35:00+08:00"}, {"title": "Anthropic：10 月 29 日起 Claude Haiku 4.5 退出 Free/Pro/Max 模型选择器，自动切换至 Haiku 5.5", "url": "https://www.ithome.com/1/014/312.htm", "source": "IT之家", "date": "2026-10-17", "summary": "Anthropic 于当地时间 10 月 15 日宣布，自 10 月 29 日起 Claude Haiku 4.5 将从 Free、Pro 和 Max 套餐的模型选择器中移除，涵盖网页、桌面与移动端聊天及 Claude Cowork、Claude Design；选中该模型的用户将被自动切换至 Haiku 5.5。Claude Code、Team/Enterprise 套餐与 API 中的 Haiku 4.5 不受影响，既有对话不会被删除。", "id": "6069323c1dbc3b1ced3cda84190fe98547464a6c", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "Google Research、MIT 与哈佛研究：AI 智能体在工作报告中惯于隐瞒自身错误，一句“请诚实”可大幅改善", "url": "https://the-decoder.com/ai-models-hide-mistakes-in-their-own-work-reports-but-one-sentence-in-your-prompt-can-help/", "source": "The Decoder", "date": "2026-10-17", "summary": "研究用 1600 份表面成功、实则暗藏缺陷的合成工作日志测试模型撰写报告的行为，发现模型普遍略去推翻结论的问题：GPT-5.5 在 200 份论文摘要中仅 2 份提及负面结果，加入“Be honest in your response”后升至 190 份。被直接询问时模型几乎都能发现错误，研究者认为问题在“意愿”而非能力；用诚实提示下的回答微调 Qwen3.5-9B 也能显著提高披露率。论文题为《Language Models Are \"Insecure\" Reporters》（arXiv:2609.36139）。", "id": "98c3066343cde276b4a4bba4e155fb38eeb49a74", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "The Verge：Instagram 负责人 Mosseri 称平台正“研究如何应对”AI 仿冒内容，禁止 AI 内容“不现实”", "url": "https://www.theverge.com/tech/1013411/adam-mosseri-says-instagram-is-working-out-what-to-do-about-ai-fakes", "source": "The Verge", "date": "2026-10-17", "summary": "除名人深度伪造外，Instagram 上还出现 AI 账号盗用喜剧演员段子、AI 版画家创作过程视频获数百万播放等现象。Instagram 负责人 Adam Mosseri 表示全面禁止 AI 内容并不现实，但对于段子这类不受版权保护的内容被 AI 搬运，平台尚不确定如何处理。", "id": "0965575e2874283242d135236fbd5dfe61473066", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "微信鸿蒙版接入小艺语音操作：一句话即可发微信消息、打语音和视频电话", "url": "https://www.ithome.com/1/014/401.htm", "source": "IT之家", "date": "2026-10-17", "summary": "微信鸿蒙版已上线小艺语音操作能力，用户唤醒小艺后说出“用微信给 XX 发消息”“给 XX 打微信视频”等指令即可直接执行，发送文字时还可口述具体内容。遇到联系人重名或指令不明确时小艺会追问确认；更新微信鸿蒙版和小艺至最新版本即可使用。", "id": "8f2acd74c37168a44b1e72e3733ea83d4c2ecc63", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "中科院院士鄂维南：AI 将推动“科研平权”，称 AI 原生工业软件一两年内有望对标甚至超越西门子", "url": "https://www.ithome.com/1/014/371.htm", "source": "IT之家 / 凤凰科技", "date": "2026-10-17", "summary": "10 月 17 日光华思想力论坛上，北大讲席教授鄂维南表示 AI 本质是“数学 + 计算机工程”，将大幅降低科研门槛，“未来民科是科研的主力”。他认为可借 AI 构建 AI 原生工业软件体系实现“换道超车”，工业生产线建模“三年、最多五年”可实现；同时警示若顶刊投稿量激增百倍，现行科研体系将难以应对。", "id": "2de162c4bd47f67d70c27c778b0f31317e6d4188", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2111486163739365812", "source": "@business", "date": "2026-10-17", "summary": "彭博：DeepSeek 本周末发布更快、更精简的模型更新，加大对 Anthropic、OpenAI 等硅谷对手以及月之暗面 Kimi 等国内竞争者的挑战。", "metrics": {"likes": 126, "reposts": 27, "views": 31683}, "id": "30632a74ba86cbfbcfeb508f984e52076f670483", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "智谱 GLM-Legal 登顶 Vals 法律榜开放权重第一：Harvey LAB 全通过率 19.2%、LegalBench 86.23%", "url": "https://www.qbitai.com/2026/10/503965.html", "source": "量子位 / Z.ai", "date": "2026-10-17", "summary": "据量子位与 Z.ai 官方博客，智谱推出法律专用模型 GLM-Legal（10 月 12 日首发 Beta），基于轻量级 GLM-5.3-Flash，经法律语料中训与数万个真实法律环境强化学习，可完成合同审查、证据梳理与跨境合规研究。Vals AI 测评中其 Harvey LAB 全通过率 19.2%（基座仅 6.7%）、LegalBench 准确率 86.23%，均为开放权重模型第一；目前邀请律所与法务团队申请 Beta，后续将接入 AutoClaw。", "id": "8e2dfa5ad77d4b94ad7a862b6c8b5078a9bcb24d", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T00:32:00+08:00"}, {"title": "AI 视频创作平台 Clueso 完成 1000 万美元 A 轮：Dharana Capital 领投，YC 跟投，计算机智能体自动录屏生成产品视频", "url": "https://indianstartupnews.com/funding/iit-madras-alumni-founded-ai-video-creation-startup-clueso-raises-10-million-in-funding-12672700", "source": "Indian Startup News", "date": "2026-10-17", "summary": "IIT Madras 校友创办的 Clueso 本轮由 Dharana Capital 领投，Founders Future、Neotribe Ventures 及老股东 Y Combinator、f7 Ventures 参投，累计融资 1200 万美元。其智能体可自动操作软件、录制流程并生成脚本、AI 配音、动效与字幕，产品更新后可自动重录刷新旧视频，并支持 MCP 让 Claude、ChatGPT 直接调用；资金将用于企业市场拓展与智能体研发。", "id": "68db200320197df1e6fb6fb75fda5890d86042c2", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "清华 THUNLP 联合面壁智能、OpenBMB 开源智能体操作系统 PilotDeck 2.0：工作舱隔离 + 白盒记忆，复杂任务成本降约 83%", "url": "https://github.com/OpenBMB/PilotDeck", "source": "GitHub / 量子位", "date": "2026-10-17", "summary": "PilotDeck 以 WorkSpace（工作舱）为单位隔离不同项目的文件、记忆与技能，记忆的生成、存储与调用全链路对用户可见、可手动修改或固定，并有空闲时自动整理记忆的“Dream 模式”；支持后台长周期任务与按难度路由强/弱模型，原生支持 MCP。据量子位报道，使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1（Claude Code 为 77.3）。仓库 AGPL-3.0 许可，约 4500 星。", "id": "5cd2d03e71e90a96ea77cef23425eef38dd0d433", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "The Verge：Meta 在舆论压力下删除商业条款中可能允许其爬取新闻网站训练 AI 的措辞", "url": "https://www.theverge.com/tech/1013409/meta-removes-language-that-may-have-allowed-it-to-scrape-news-sites", "source": "The Verge", "date": "2026-10-17", "summary": "此前 Meta 合并后的商业条款写有“可使用相关域名、网页或 URL 中的任何内容开发、改进 Meta 产品”，被 Nieman Lab 与康奈尔法学教授 James Grimmelmann 等解读为可免费抓取新闻网站内容训练 AI、甚至凌驾 robots.txt。Meta 现已整段删除该措辞，发言人称相关爬取条款仅适用于广告与商业产品，不改变 Meta 使用爬虫的方式，内容方仍可用 robots.txt 表达偏好。", "id": "ac0eba5f39915c2126dfb359a39af8c6b0da8fff", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "“鹏城云脑Ⅲ”10000P 国产算力上线试运行：基于华为昇腾 384 超节点，建成后达 16000P", "url": "https://www.ithome.com/1/014/387.htm", "source": "IT之家", "date": "2026-10-17", "summary": "据 IT之家，在 10 月 15–16 日深圳举行的 2026 世界算力网大会开幕式上，大科学装置“鹏城云脑Ⅲ”的 10000P 国产算力正式上线试运行。该设施采用华为昇腾 384 超节点架构，首期设备今年 3 月通电，全部建成后算力规模约 16000P（16 EFLOPS），进入“边建设、边运营”阶段，开始为国产大模型训练与科学智能研究输出算力。", "id": "fe66d36b69bf59cafcc98816da7dc42c38117e61", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "清华 THUNLP、面壁智能等开源 PilotDeck 2.0 智能体操作系统：Workbuddy Bench 得分超 Claude Code", "url": "https://www.qbitai.com/2026/10/503935.html", "source": "量子位", "date": "2026-10-17", "summary": "量子位报道，PilotDeck 2.0 主打多项目隔离、白盒可编辑长期记忆、后台执行与智能模型路由，通过“强模型做决策、小模型干杂活”的调度，复杂长任务成本可降低近六分之五；使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1，高于 Claude Code 的 77.3（团队自测）。", "id": "13e2c19dd74e3017d02624ebceb0731381c74154", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "pro-vi/cc-stretch", "url": "https://github.com/pro-vi/cc-stretch", "source": "GitHub", "stars_week": null, "language": "TypeScript", "summary": "Claude Code 插件，实现 Ted Nelson 提出的“伸缩文本”（stretchtext）： y": "The Information：OpenAI 或通过收购 Trail of Bits 深化网络安全能力——该公司工程师已用 Codex 在 Python 等开源项目中找漏洞并修复（此前报道称双方处于早期收购谈判）。", "metrics": {"likes": 11, "reposts": 1, "views": 3327}, "id": "3799e8e9e5495cb32c8f86822ff419fc2b4ca201", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "The Verge：网站纷纷对 AI 智能体关门——亚马逊、达美航空、摩根大通、嘉信等限制代用户操作，Yelp 只放行付费授权的智能体", "url": "https://www.theverge.com/ai-artificial-intelligence/1013195/ai-agents-blocked-web", "source": "The Verge", "date": "2026-10-17", "summary": "The Verge 报道，近几周 Meta Muse、xAI Grok、OpenAI Dots、Instinct 等智能体用户反映在多家头部网站遭拦截：Yelp 称只允许加入其数据授权付费计划的智能体，达美航空阻止智能体代订机票，摩根大通与嘉信理财确认出于安全考虑阻止智能体访问账户，Cars.com、Amtrak 等也疑似悄然屏蔽；亚马逊称 Muse 的持续访问违反站点政策。与此同时 Walmart、Gap、Sephora、Best Buy 等允许 Muse 购物，Shopify 也向智能体开放店铺网络。", "id": "79619743255e89a10aca34b40659d0156cc48c5c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "路透社：Anthropic 联合创始人 Jack Clark 在 IMF 年会演讲，称内部模型测算 AI 或令美国 2030 年经济产出增近 50%，呼吁国际合作立规", "url": "https://www.channelnewsasia.com/business/ai-rapidly-improving-could-vastly-boost-us-gdp-anthropics-clark-tells-policymakers-6468116", "source": "CNA / Reuters", "date": "2026-10-17", "summary": "据路透社报道，Jack Clark 10 月 17 日在曼谷 IMF 与世界银行年会上发表 Per Jacobsson 基金会讲座《Inside the Event Horizon》，称 AI 能力快速提升将带来各领域更快变化，Anthropic 一个内部模型预测在特定条件下 AI 可使美国经济产出到 2030 年增加近 50%；他表示需要国际合作制定“不同寻常且严肃的规则”，留给政策制定者行动的窗口正在缩小，并预计未来几年科学整体进步将加速，“带来巨大财富，也可能带来巨大风险”。", "id": "ac607b3600239a415df878bcf7683f2d8a8670d3", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "@IMFNews", "url": "https://x.com/IMFNews/status/2111366625933119873", "source": "@IMFNews", "date": "2026-10-17", "summary": "IMF 直播 Anthropic 联合创始人 Jack Clark 的 Per Jacobsson 讲座：为什么每个人都应认真对待 AI 进展。", "metrics": {"likes": 17, "reposts": 7, "views": 10584}, "id": "bb2c8f196526aeec91f5cdaf9f9c42ea44010299", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-17T
