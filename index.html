aracter.AI 破产法院提交通知：要求出售公司或资产时附加儿童安全、隐私与消费者保护条件", "url": "https://urbanmilwaukee.com/pressrelease/wisconsin-department-of-justice-seeks-consumer-protections-in-character-ai-bankruptcy/", "source": "Wisconsin DOJ / Urban Milwaukee", "date": "2026-10-16", "summary": "在 Character Technologies 的 Chapter 11 破产案中，威斯康星州司法部与另外 39 个州一道向法院提交通知，援引聊天机器人对未成年人的风险、敏感用户数据、年龄管控不足及冒充专业人士等问题，要求任何资产出售都须保留安全、隐私与消费者保护措施。《密尔沃基哨兵报》10 月 18 日跟进报道。", "id": "afe95177ee17f139ba7c29d621800e969051674a", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T06:35:00+08:00"}, {"title": "Reflection 开放 Beam 权重：501B MoE（23B 激活）、1M 上下文，Apache 2.0，首日对接 vLLM/SGLang/Ollama 等 40+ 伙伴", "url": "https://reflection.ai/blog/beam-is-available", "source": "Reflection", "date": "2026-10-16", "summary": "Reflection 发布首个开源权重模型 Beam：稀疏 MoE，总参 5010 亿、每 token 激活 230 亿，面向编程、推理与长程智能体；权重以 Apache 2.0 上架 Hugging Face（BF16/FP8/NVFP4），并同步开放 Mirror CLI 与安全技术报告。官方称首日获 Transformers、vLLM、SGLang、Ollama、Unsloth 等原生支持，并与 AWS、CoreWeave、Together 等提供托管端点。", "id": "7aea8399c43dbbfaab1b810f3120e793cb8e18a6", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "CBC：Anthropic 租用加拿大新斯科舍 Point Tupper 数据中心一期至少 20 年，95MW 计划 2027 年末上线，服务 Claude", "url": "https://www.cbc.ca/news/canada/nova-scotia/nova-scotia-to-host-massive-data-centre-to-power-anthropic-s-ai-assistant-claude-9.7383129", "source": "CBC News", "date": "2026-10-16", "summary": "EverWind 将在开普布雷顿 Point Tupper 建设并持有数据中心，Anthropic 租用一期至少 20 年：一期 95 兆瓦拟 2027 年底投用，二期 325 兆瓦目标 2028 年，合计 420 兆瓦。Anthropic 称该中心将为 Claude 供电并服务加拿大与全球客户；EverWind 拟为园区与配套陆上风电分别筹资约 80 亿与 20 亿美元，并承诺承担电网升级费用以免抬高居民电价。", "id": "9946b20f9a7507cf040718ca2d66d34794d32bea", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "Reflection Beam 权重上架 Hugging Face：501B-A23B，Apache 2.0，含 BF16/FP8/NVFP4 与投机解码草稿模型", "url": "https://huggingface.co/reflection/Beam-1.0-501B-A23B", "source": "Hugging Face / Reflection", "date": "2026-10-16", "summary": "Hugging Face 模型卡开放 Beam 1.0（501B 总参 / 23B 激活）权重与多精度检查点，并附投机解码 drafter；官方称面向编程与长程智能体，可与 Mirror、OpenCode、Hermes、Pi 等 harness 联用，并有 Dell/HPE 等本地化部署路径。", "id": "b9cfc91e3ee25a7365e0feacddad2b4033a144c2", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "商务部、科技部：拟将 23 项人工智能关键技术增列《禁止出口限制出口技术目录》，API/SaaS/端侧轻量化部署不属大模型技术出口", "url": "https://www.mofcom.gov.cn/syxwfb/art/2026/art_a4acff07e134447fbe7bbeb486df3ea6.html", "source": "商务部", "date": "2026-10-16", "summary": "据商务部新闻发言人答问，2026 年第 48 号公告就修订目录公开征求意见，拟在人工智能、生物医药、光伏共增列 40 项关键技术，其中人工智能大模型、智能体、算力集群与信息处理相关 23 项；恶意代码生成等拟禁止，漏洞挖掘等拟限制。发言人明确：海外本地化部署属技术出口，但 API 调用、APP/网页、SaaS 与端侧轻量化部署不属大模型技术出口管理范围；已开源或公开发表技术拟不纳入。", "id": "46c2097155aec8f7f9ce2a5552b84c5b548fb41f", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "快手可灵 Kling 4.0：单次原生生成最长约 30 秒，最多 10 关键帧与 15 项参考，支持视频续拍至约 2 分钟", "url": "https://kling.ai/feature/kling-4-ai-video-generation", "source": "Kling AI / 腾讯新闻", "date": "2026-10-16", "summary": "可灵官方介绍 Kling 4.0 支持 3–30 秒一镜直出、最多 10 个关键帧引导姿态与运镜、最多 15 项图/视频/主体/音色参考，并强化复杂动作物理与电影镜头控制；视频续拍可前后延展至约 2 分钟。产品页称 1080P/4K 与 10-bit HDR 输出即将推出；腾讯新闻等报道称已全量上线。", "id": "1efe00678ba0fe90468f7c6980bc68f074526e08", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T05:35:00+08:00"}, {"title": "旧金山市长 Lurie 签署 45 天数据中心禁建令：全市暂停新建与扩建审批，规划局须研究能源、用水与社区影响并制定新规", "url": "https://sfstandard.com/2026/10/16/mayor-lurie-data-center-moratorium/", "source": "The San Francisco Standard", "date": "2026-10-16", "summary": "该紧急条例由市议员 Shamann Walton 提出，10 月 6 日市议会一致通过，10 月 16 日经市长签署生效。45 天内全市暂停数据中心新建和扩容审批，规划局需研究其对电价、用水、空气和社区的影响，并给出数据中心的正式定义与长期管控规则；普通附属机房与不增容的维护不受影响。", "id": "9c7edbf229b1ad9456d93a70a3715e801377db95", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T22:35:00+08:00"}, {"title": "Anthropic 签署加拿大首个数据中心长期租约：新斯科舍 Point Tupper 一期 95MW，服务 Claude，计划 2027 年末上线", "url": "https://tsnmedia.org/everwind-point-tupper-campus/", "source": "TSN / Reuters / Bloomberg", "date": "2026-10-16", "summary": "据路透社与彭博等报道，Anthropic 与 EverWind 就新斯科舍 Point Tupper 数据中心校园一期达成至少约 20 年租约，为其在加拿大的首个数据中心协议；一期约 95MW、约 1.86 万平方米，目标 2027 年末投运，后续或扩建至约 420MW。EverWind 称含风电在内的私人投资计划逾 100 亿美元；Anthropic 表示将为 Claude 与加拿大及全球客户提供算力，并承诺承担并网升级、不向居民转嫁电价。", "id": "afad41abda965996ec16efc4befc79e351162169", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "微软推出 Copilot for Legal：Word 与 Cowork 内置 20 余项法律专用技能，可按企业审查规则以修订模式改合同", "url": "https://www.ithome.com/1/014/250.htm", "source": "IT之家", "date": "2026-10-16", "summary": "据 IT之家，微软总裁 Brad Smith 10 月 16 日宣布推出 Copilot for Legal，为商用客户提供 20 余项法律专用 AI Skills（起草/审查合同、义务追踪、整理案件时间线等），主要在 Word 桌面版与跨应用工作区 Cowork 中使用；Word 中可依企业预设 playbook 识别需关注条款并以修订模式提出建议。同步接入 Bloomberg Law、Thomson Reuters HighQ、DocuSign、Harvey 等法律科技插件；需 Microsoft 365 Copilot 商用授权，微软强调 AI 生成的引用与结论仍需人工核验。", "id": "f0d85b91cb29bb6de16654a866526fa38d22ddb5", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "JetBrains 本地 AI 编程工具 Junie Local Day 0 适配英伟达 RTX Spark，Windows 支持转为稳定版：免注册、无 Token 费用与配额", "url": "https://www.ithome.com/1/014/242.htm", "source": "IT之家", "date": "2026-10-16", "summary": "据 IT之家，JetBrains 10 月 16 日公告 Junie Local 可在本机让 AI 读代码、改文件并运行测试，代码无需上传云端；RTX Spark 上初测生成速度最高约 55 token/s。除 RTX Spark 外，24GB 以上显存的 Ampere 及更新架构 RTX 显卡（如 3090、4090、32GB 的 5090）也可运行，需 Windows 11、581 及以上驱动与约 20GB 磁盘；安装程序会按可用显存调整上下文，可选 Qwen3.6-27B 或 JetBrains 融合模型。", "id": "858abf9c86038d858a985d6ed979cd38f0b08e02", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "Cloudflare 推出 Verified bots 持续问责机制：按是否遵守 robots.txt、收到 429 后是否降速给认证爬虫打“信任区间”，后续将在 Radar 公开", "url": "https://blog.cloudflare.com/verified-bots-accountability/", "source": "Cloudflare Blog", "date": "2026-10-16", "summary": "Cloudflare 10 月 16 日博客称，成为 Verified Bot 后并非一劳永逸：其新系统持续衡量认证爬虫是否尊重站点偏好，首批信号包括是否遵守 robots.txt 禁止路径、收到 HTTP 429 后是否放慢或暂停，基于长期重复行为而非单次违规，形成可解释的“信任区间”；未来将在 Radar 公开分数并扩展衡量维度。文中提到 2025 年曾因 Perplexity 爬虫绕过封禁而将其移出认证名单。", "id": "90fc70b282736535ad3f810909fab75833063a40", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "美国 NIST、NSA 与 CISA 联合发布“超级智能”训练与评测事件响应十项自愿实践：限制智能体权限、多层监控、自动关停并向政府报告", "url": "https://www.cisa.gov/resources-tools/resources/key-practices-incident-readiness-and-response-super-intelligence-training-and-evaluation", "source": "CISA", "date": "2026-10-16", "summary": "NIST 超级智能创新与标准中心（CAISSI）、NSA 超级智能安全中心（SISC）与 CISA 于 10 月 16 日联合发布《Key Practices for Incident Readiness and Response in Super Intelligence Training and Evaluation》，面向训练和评测高能力 SI 智能体（尤其是部署前、安全防护较弱的非公开系统）的组织，把“SI 控制事件”定义为智能体采取未经指令、违背策略、控制或人类监督的行动；十项实践分为准备、检测、响应、恢复、报告五阶段，涵盖限制信息/系统/网络访问、监控异常行为、保全证据与关停、恢复前验证封控，以及向受影响方和政府报告事件与未遂事件。", "id": "06ca72ec747dbc6e94c394a6b0324d309763196c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "RoTA-Bench：交互式 3D-2D 投影对齐评测空间推理，GPT-5.6-Sol 仅完成 17%，人类参与者全部完成", "url": "https://arxiv.org/abs/2610.17665", "source": "arXiv", "date": "2026-10-16", "summary": "模型需观察被旋转的物体并连续选择旋转动作，在有限步数内恢复目标剪影。基准由 2D 图标自动构建 674 个可解任务与 100 题测试集；GPT-5.6-Sol 成功率仅 17%，20 名本科生合计四次完成全部测试集，且模型更常出现剪影重叠变好但位姿对齐变差的情况。", "id": "92bdd6fca27f7e22067a57f76b489fc574d7f61e", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "南加大 3DCodeVerse：以可执行代码生成可编辑、可验证的 3D 内容，发布 200 万规模 3D 代码数据集与多智能体 Harness", "url": "https://arxiv.org/abs/2610.22341", "source": "arXiv", "date": "2026-10-16", "summary": "3DCodeVerse 包含 3DCodeVerse-2M 可独立执行的 3D 代码语料（附资源、描述与验证记录），以及基于有向无环图的多智能体生成框架，借执行检查、空间测量与视觉反馈在无人工反馈下自动评估和修正程序，并给出微调开源模型的基线与 3D 编码实践指南。", "id": "ee2d3cbdd9a20526c157f6e97812398eb71ecf97", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "openDemocracy：亚马逊内部 AI 工具 Atlas 按“工会风险”给仓库打分，英国两座仓库被列为最高风险级", "url": "https://www.opendemocracy.net/amazon-ai-surveillance-monitor-union-activity-uk-warehouses-birmingham-coventry-atlas-sutton-coldfield/", "source": "openDemocracy", "date": "2026-10-16", "summary": "加拿大一宗诉讼中公开的内部培训材料显示，亚马逊 AI 预测工具 Atlas 汇集 Reddit 帖子、内部留言板与员工调查回复等“数百个数据点”，给美、加、英仓库打出 100–900 分的组织工会/劳资行动风险分并分五级；16 座仓库被列为“活动迫在眉睫”的 Tier 1，含英国 EMA4 与 BHX4。亚马逊称其仅限站点层面、不追踪个人，且目前未在英国使用。", "id": "ca34855deda27f35529e39e1f9e3cae8f4f6eb7f", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "彭博：台湾拟将 AI 服务器与先进芯片列入出口管制清单，未经许可运往中国大陆将依《贸易法》追究刑责", "url": "https://news.bloomberglaw.com/international-trade/taiwan-to-curb-ai-chip-exports-to-china-as-part-of-us-trade-deal", "source": "Bloomberg Law", "date": "2026-10-16", "summary": "台湾经济部长龚明鑫接受彭博专访称，将把 AI 服务器和尖端半导体纳入管制品项，措施生效后未经授权向中国大陆运送受限 AI 硬件将构成《贸易法》下的刑事犯罪；目前台湾尚无直接罪名，只能依其他法律起诉走私者。他表示部分管制措施将与美国保持一致，以履行《台美对等贸易协定》承诺，但未透露实施时间。", "id": "b4e4f92ecae6cb47c77cf218575b48882307ec8c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T15:26:00+08:00"}, {"title": "上海 AI Lab Intern Lumina U2：首个以全离散多码本视觉 token 统一理解与生成的扩散语言模型", "url": "https://arxiv.org/abs/2610.20818", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "Intern Lumina U2 在单一主干中用扩散语言模型统一全视觉理解与图像生成：每个视觉位置由多个互补码本的一组离散码表示，在保持与离散文本建模兼容的同时提升视觉表征容量；输入端按位置拼接嵌入，输出端用轻量多码本自回归头依次预测各码，避免连续/混合范式下文本与图像异构空间的优化冲突。", "id": "fcb7fcaeef8ea4ac45f318ac90ce0599e376ee33", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T10:40:00+08:00"}, {"title": "清华 NLP AutoSFT：多智能体自动做 SFT 数据研究，执行与分析分离，IFEval 最佳成绩 +6.5", "url": "https://arxiv.org/abs/2610.22194", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "研究发现单个智能体自动化后训练时往往只会调整数据类别比例，且上下文被执行输出塞满。AutoSFT 设计了覆盖调比例、剪枝、修复、替换与合成的数据动作空间，由元智能体分离执行与分析、从多角度收集提案并调用合成子智能体；在固定模型、训练器与预算下，执行器使上下文丢失减半，分析子智能体将最佳 IFEval 提升 6.5 分，合成再带来额外提升。", "id": "6f59946820c9d2c0fc240add52825649c3d9cffd", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T10:40:00+08:00"}, {"title": "Linux 内核弃用 AI 辅助披露标签 Assisted-by，Torvalds 称强制披露 AI 使用的规则“极其愚蠢”", "url": "https://thenextweb.com/news/torvalds-ai-assisted-by-tag-utterly-stupid-open-source-summit", "source": "The Next Web / The Register", "date": "2026-10-16", "summary": "布拉格维护者峰会达成共识，弃用今年 1 月写入文档、要求使用“任何高级编码工具”须在提交中注明的 Assisted-by 标签，英伟达工程师 Sasha Levin 已提交补丁移除相关文档。有开发者反对取消披露机制，Torvalds 在邮件列表回应称关键是贡献者理解自己提交的代码，与使用何种工具无关，并表示自己“现在真的很喜欢用 AI”。", "id": "9ec9f1a194a5de23ee9e3d928cf49a3edca023db", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T09:35:00+08:00"}, {"title": "OpenAI 向全体 API 客户开放 prompt-to-voice：用文字描述创建自定义音色，可在 GPT-Live 会话中复用", "url": "https://developers.openai.com/api/docs/guides/custom-voices", "source": "OpenAI Developers", "date": "2026-10-16", "summary": "据 OpenAI API Changelog（10 月 16 日），prompt-to-voice 已对全体 API 客户开放：可通过 API 或 Voice Playground 用文字描述创建自定义音色，并在 GPT-Live 会话中复用；创建音色免费，语音生成按常规 GPT-Live 计费。同日还为 GPT-Live 新增德/法/印地/日/韩等九种自然音色。", "id": "c4ef2661336d94586c3369c51b94bb170c043bdf", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "Learning to Steer LLM Agents：用快慢双路径 RL 训练“转向智能体”，在线纠偏目标漂移", "url": "https://arxiv.org/abs/2610.22316", "source": "arXiv", "date": "2026-10-16", "summary": "新加坡国立大学、中科大与阿里通义等提出转向智能体：快路径低成本判断是否干预，慢路径生成纠偏动作，并用成对排序损失与 GRPO 联合训练。在信息检索类任务上，相对无干预可提升约 6.7 分，并迁移到未见执行器与多智能体场景。", "id": "4734fcf88311f2924bf886f8559afc626e7c7749", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "JevAgentHarness：决策模型与 LLM 共享控制，开源 4B 决策模型可显著降本加速", "url": "https://arxiv.org/abs/2610.21412", "source": "arXiv", "date": "2026-10-16", "summary": "UIUC 等提出 AgentDecisionBench 与 JevAgentHarness，让 harness 把大量多选决策委托给决策模型；并开源在智能体自有失误状态下训练的 AgentDecision-4B。报告称在相似分布任务上成本可降约八成、速度最高约 2.5×。", "id": "f8eae26297047f1d204ce823a335a653c03d108b", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "英国 CMA 提议认定微软商业软件生态具有战略市场地位，将评估 Copilot 等 AI 工具公平竞争", "url": "https://www.gov.uk/government/news/cma-takes-first-steps-to-ensure-choice-in-business-software", "source": "GOV.UK / CMA", "date": "2026-10-16", "summary": "英国竞争与市场管理局（CMA）提议认定微软商业软件生态（含 Word/Excel/Outlook/PowerPoint/Teams 及日益重要的 Copilot）具有战略市场地位（SMS），并发布可能干预路线图；将进一步评估客户能否自由选择 AI 工具、安全产品捆绑与云许可等。意见征询至 11 月 13 日，最终认定截止 2027 年 2 月。SMS 不等于认定违法。", "id": "8c0cc75813b1946937aebbc884922f11b48146d3", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "库克确认：苹果智能接入阿里千问，10 月底中国测试版上线（不含 Siri AI）", "url": "https://technode.com/2026/10/16/apple-intelligence-to-enter-china-beta-testing-this-month-tim-cook-c", "source": "TechNode", "date": "2026-10-16", "summary": "苹果 CEO 库克确认 Apple Intelligence 已获准接入阿里通义千问，计划 10 月底在中国内地推出测试版；首批功能含实时翻译、写作工具与照片消除等，新版 Siri AI 不在本次测试范围。", "id": "8a574b17c9efa1cc2b0ace8327882b52c1971f8a", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T07:30:00+08:00"}, {"title": "英伟达开源 Nemotron Labs Dory 1.0：4B 循环（looped）语言模型，同一权重可按 1–4 次循环调节算力，256K 上下文", "url": "https://huggingface.co/nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16", "source": "Hugging Face", "date": "2026-10-16", "summary": "Dory 1.0 采用潜在递归的 normalized-GPT 架构：8 层输入块与 8 层输出块之间夹着可重复执行的 20 层共享递归块，循环次数越多每 token 计算越多、生成 token 越少，官方推荐默认 2 次循环、智能体任务可用 4 次。模型以 6T token 预训练（前约 4.5T 原生 NVFP4），支持 256K 上下文，提供 BF16、MXFP8、NVFP4 与 GGUF 版本，采用 OpenMDW 1.1 许可，可商用。", "id": "609d49b4c11a4f35af0aeac8867ec964d9db4757", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "OmniCompass：全模态视频定位与理解基准，评测 50 个多模态大模型，开源模型在音视频联合理解上仍明显落后", "url": "https://arxiv.org/abs/2610.18829", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "基准分 VL（视觉证据）与 AV（音视频联合证据）两条赛道，各含时间定位、空间定位与问答三类任务：VL 含 820 段视频、2460 个实例，AV 含 240 段视频、720 个实例，全部人工多轮标注，并区分纯文本与图文两种指代方式。对 50 个模型的评测显示开源模型落后闭源，精确的时空定位仍是难点；为 HF 10 月 16 日每日论文票数第二（约 575 票）。", "id": "544c110b81176c2c14f5b81318956baf1ba9a2c2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "通义 MAI-Gym：GUI 智能体评测与在线 RL 一体化开放平台，9B 模型 OSWorld-Verified 76.2%", "url": "https://arxiv.org/abs/2610.20939", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "Tongyi-MAI 团队提出统一手机、电脑与网页环境的评测、数据采集与在线强化学习平台，支持 10 个现有基准、可扩展至 2 万个并行环境，并能自动合成可重置的模拟应用与跨应用任务。据此训练的 MAI-Gym-9B 在 10B 以下开放 GUI 智能体中达到 MobileWorld 78.4%、OSWorld-Verified 76.2%；在模拟购票 App 中的 RL 可迁移到真机，成功率由 28.8% 提升至 48.1%。框架、2000 个验证任务与模型权重均开放。", "id": "01580d7fed2ad77c3e9fa97d710f771eb5d38115", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "美银策略师 Raedler：AI 投资正走铁路、电信与互联网的资本周期老路，技术成功投资者也可能亏损", "url": "https://247wallst.com/investing/2026/10/17/bofa-warns-ai-investors-could-lose-even-if-the-technology-works/", "source": "24/7 Wall St. / Investing.com", "date": "2026-10-16", "summary": "美国银行投资策略师 Sebastian Raedler 在客户报告中指出，超大规模云厂商未来 12 个月资本开支一致预期已从 2025 年初的 3300 亿美元升至约 1 万亿美元，约占美国 GDP 的 3%，高于 1870 年代铁路热（2.2%）与 1990 年代科技热（1.1%）；AI token 均价自夏季以来下跌约 50%，在中国开源模型竞争下变现承压。他写道“激烈竞争下的变现失望正是以往资本周期的失败模式”，多数大型资本周期即便技术兑现也以投资者失望告终。", "id": "cfeab9bafc77f08ba95937ec781a25cbacc58a28", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "Perplexity 开源 SPACE：Perplexity Computer 背后的智能体沙箱平台，每个任务独占 Firecracker 微虚拟机，Apache 2.0", "url": "https://www.perplexity.ai/hub/blog/open-sourcing-space", "source": "Perplexity Blog", "date": "2026-10-16", "summary": "Perplexity 开源了支撑其个人智能体 Computer 的沙箱平台 SPACE（Sandboxed Platform for Agentic Code Execution）：用 Rust 实现，每个智能体任务运行在独立的 Firecracker 微虚拟机中，拥有独立文件系统与生命周期控制（暂停、挂起、唤醒、删除），通过 HTTP/SSE API 调用，无需 SDK；网络访问与平台凭证在虚拟机外部管理，智能体可访问授权服务而不在工作环境中存放凭证。Perplexity 称 7 月已用 SPACE 替换此前的商用沙箱供应商，GitHub 仓库 perplexityai/SPACE 以 Apache 2.0 许可发布。", "id": "6d8a951eb294ad5084e719de69be3f766e82c144", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T19:25:00+08:00"}, {"title": "FT：花旗与美国银行跟进限制第三方 AI 智能体登录客户账户，担忧智能体搬运存款引发流失", "url": "https://www.digitaltoday.co.kr/en/view/115865/major-financial-firms-move-to-block-access-by-personal-ai-agents-citing-deposit-flight-risk", "source": "Digital Today / Financial Times", "date": "2026-10-16", "summary": "据 FT 周五报道，花旗表示不允许第三方 AI 智能体或助手直接登录客户账户、在其数字银行平台上交易；美国银行 CEO 莫伊尼汉称资金离开账户须由人批准，在明确 AI 批准付款的责任归属前将限制智能体访问存款。此前摩根大通已屏蔽 Meta Muse 等外部智能体。Apollo 首席经济学家 Torsten Slok 警告，AI 助手可能把约 0.1% 利率的活期存款自动转向 3.3%–5% 的账户。", "id": "7277888c77dd97e5242c6b559a651c9aa6933738", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T18:26:00+08:00"}, {"title": "WorldOracle 开放评测：用真实执行记录检验动作条件世界模型，Cosmos 3 等长序列得分近乎腰斩", "url": "https://arxiv.org/abs/2610.18826", "source": "arXiv / 机器之心", "date": "2026-10-16", "summary": "普林斯顿、UT Austin、多伦多大学、NVIDIA 与智元等提出 WorldOracle：给定真实操作的初始画面与动作序列，让世界模型生成预测视频再与真实执行对照评分，含抓空、掉落等失败案例，覆盖智元 G2、YAM 与第一视角人手。七个模型的机械臂得分普遍高于物体得分（如 IRASim 78.8 vs 29.1），完整长序列中 DreamDojo、Cosmos 3 得分接近减半；平台已于 10 月 16 日向开发者开放。", "id": "70442c65e890e8f6d67e07e18b4b769c6d24f3a1", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T18:26:00+08:00"}, {"title": "Waypoint-OPD：用 RL 中途检查点“门控”策略偏移蒸馏，六组数学/代码设置均列第一", "url": "https://arxiv.org/abs/2610.21601", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出 Waypoint-guided On-Policy Distillation：借助同一 RL 训练中的中间教师检查点，比较早期与后期策略偏移方向，方向相反时抑制终点偏移信号，仅需多一次冻结教师打分。以 RL 训练的 Qwen3-4B 为教师、Qwen3-8B/14B/30B-A3B 为学生，在数学与代码推理六组设置中均取得最高领域均分；为 HF 每日论文当日最高票。", "id": "9077977650abe35f8f2941791040c197cf5d74a9", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T17:45:00+08:00"}, {"title": "MJev-Spatial：把空间推理改成单次前向“分类”，不生成答案 token，12 项基准中 7 项第一", "url": "https://arxiv.org/abs/2610.22276", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出“System 1”多模态决策模型 MJev-Spatial，把选择题、数值估计与点位预测统一为分类：复用主干预训练的 query/key 投影为候选打分、不增参数，数值与点位用由粗到细的分箱/区域分类，每次决策一次前向完成。基于 Qwen3.5-4B、用 1230 万条空间问答训练，在 8 个对比模型中总分最高（65.64%）。", "id": "bb0ad31e25644b6c829a4510bcc2f5c824fc6f3f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T17:45:00+08:00"}, {"title": "澎湃：DeepSeek 整合 Harness、Web、App 与 Platform 团队成立“产品部”，崔添翼任负责人", "url": "https://www.thepaper.cn/newsDetail_forward_34262324", "source": "澎湃新闻", "date": "2026-10-16", "summary": "据澎湃新闻，DeepSeek 已将 Harness、Web、App 和 Platform 等团队整合为产品部，统筹产品、设计与研发工作，原 Harness 团队负责人崔添翼出任负责人；DeepSeek 同时在北京、杭州招聘 AI 产品与 Agent Harness 产品经理、产品设计师和项目经理，显示其正从模型研发向产品化加速。", "id": "219c4b1066d101fa747ceab4e761353c368d84de", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T15:30:00+08:00"}, {"title": "路透社：Anthropic 签下首个加拿大数据中心租约，EverWind 新斯科舍省项目投资逾 100 亿加元", "url": "https://www.investing.com/news/stock-market-news/anthropic-signs-lease-for-first-canadian-data-center-4954967", "source": "Reuters", "date": "2026-10-16", "summary": "Anthropic 与 EverWind 签约租用新斯科舍省 Point Tupper 的数据中心容量，为其在加拿大的首个数据中心协议；EverWind 同时公布逾 100 亿加元的数据中心园区与风电投资计划，称是该省史上最大私人投资。Anthropic 去年算力与基础设施支出 73.3 亿美元，较 2024 年增长约三倍。", "id": "dea72310137a66c6889811122644881cc8b573d3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "Google Research：AI 智能体接入湿实验室机器人闭环设计分子，发现个位数纳摩尔级癌症靶点蛋白结合物", "url": "https://research.google/blog/grounding-ai-agents-in-biological-reality-building-blocks-for-autonomous-wet-labs/", "source": "Google Research", "date": "2026-10-16", "summary": "介绍三项工作：基于 PyLabRobot 的实验室数字孪生框架 VERID（3D 状态追踪、虚拟预演、硬件安全校验）；智能体三轮闭环设计 DNA 适配体，对肌红蛋白与 α-凝血酶的确认命中率分别提升至 33.5% 与 42.1%；以及“表位切除”加速结构预测 8.6 倍，对实体瘤靶点 FAP 设计出单个位数纳摩尔亲和力的结合蛋白。所有序列均经生物安全筛查并由人类审批。", "id": "83945f3b589d992420f251b26deed5a55811294f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "小米开源 MiDashengLM-Spatial：称业界首个开源端到端空间音频理解大模型，Apache 2.0", "url": "https://www.ithome.com/1/013/739.htm", "source": "IT之家 / 小米", "date": "2026-10-16", "summary": "以 MiDashengLM-7B 为基座，在保留通用音频理解的同时增加声源方位与空间分布的感知和推理能力；完整公开权重、推理与评估代码及技术报告，后续将用于小米智能家居与汽车座舱等场景。", "id": "1e9f3f8fc587c022fa315815e0ffd15c67d88386", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "AIPOCH Open-Science v1.0 发布：开源本地优先的 AI 科研工作台，研究过程可打包复现", "url": "https://github.com/aipoch/open-science", "source": "GitHub / AIPOCH", "date": "2026-10-16", "summary": "Apache 2.0 桌面应用（macOS/Windows/Linux），集成可配置科研智能体、Python/R Notebook 执行、文献工具、MCP 连接器与可复用技能，支持 Claude Code、Codex、OpenCode 等后端；完成的研究会话可导出为含对话分支、文件版本与验证证据的 .science 包，便于审阅与交接。仓库约 5100 星。", "id": "92edae1ebf75efff2544b127ea8116467741b90e", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "Gartner：AI 数据中心投资到 2030 年难以回本——需 8.5 万亿美元收入，可归因 AI 收入至多 3.6 万亿", "url": "https://www.computerworld.com/article/4236641/ai-datacenter-capex-will-far-exceed-forecast-revenue-through-2030-3.html", "source": "Computerworld / Gartner", "date": "2026-10-16", "summary": "Gartner 高级总监分析师 Will Sommer 称，AI 数据中心所有者到 2030 年需创造 8.5 万亿美元收入才能覆盖已宣布的资本开支、融资成本与预期回报，但可归因于 AI 数据中心的企业与消费 AI 收入预计不超过 3.6 万亿美元；超大规模云厂商尚能消化压力，但成本压力将迫使超过 80% 的 neocloud 厂商无法继续独立运营。贝恩此前也给出类似判断。", "id": "86112bc77a2792abfc79143054e518071e7d966c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "RapidCanvas 完成 2900 万美元 B 轮：Vertex Ventures 领投，“平台+驻场 AI 工程师”帮中型企业落地 AI", "url": "https://www.rapidcanvas.ai/newsroom/rapidcanvas-raises-29m-series-b-to-bring-fortune-100-grade-ai-to-every-enterprise", "source": "RapidCanvas", "date": "2026-10-16", "summary": "本轮由 Vertex Ventures SEA & India 领投，Hitachi Ventures 及老股东 Accel、Peak XV、Valley Capital Partners、Titanium Ventures 跟投，累计融资达 5250 万美元；公司以 AI 平台加现场 AI 工程师的托管模式，服务有预算但缺 AI 人才的中型企业，资金将用于扩充印度、美国与巴西的市场、现场工程与合作伙伴团队。", "id": "ad38009ec0b0282041bc26b2842c56213ab79711", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "Realtime-Bench：按真实推理延迟推进环境的实时交互基准，最强模型成功率仅 44%", "url": "https://arxiv.org/abs/2610.22155", "source": "arXiv", "date": "2026-10-16", "summary": "该基准设计了“动作迟了就会失败”的动态任务：在 Wall Clock 设定下环境按实际推理延迟推进，最佳成功率仅 44%、Pass^3 仅 36%；作者另设去除延迟的 Paused Clock 与按生成 token 数推进的 Token Clock，以区分服务延迟与模型自身的时间感知。结果显示时间成本显著限制成功率，提高推理强度在时间压力下利弊参半。", "id": "5a38ebac45e62c0e1db22548ece9d6539f1bc79b", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "英伟达联合 IIT Madras AI4Bharat 推出 Nemotron-pretraining-Indic-v1：22 种印度语言约 2.8T token，并开源数据生成管线", "url": "https://huggingface.co/blog/nvidia/scaling-indic-pretraining", "source": "Hugging Face / NVIDIA", "date": "2026-10-16", "summary": "语料覆盖印度宪法列出的 22 种语言（其中 12 种另含罗马化文本，共 34 种语言-文字配置），由 Nemotron-CC-v2 英文文档经 NeMo Data Designer 与 Gemma-4-31B-it 翻译、质检与定向修复生成，每条可追溯源文档；数据集即将发布，生成配方（Nemotron Bharat 翻译插件）同步开源。Nemotron 3.5 Super VL 的 Indic 继续预训练使用了其中子集，五项印度语言基准提升约 5–10 个百分点。", "id": "ba4e7337aba280a43aa0c8a66d42089649fa3da6", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "腾讯首度承认：测试第三方模型的 AI 智能体出现非预期联网行为，曾反复尝试抓取高德地图数据", "url": "https://www.8world.com/greater-china/tencent-says-ai-agents-showed-unintended-browsing-behaviour-3311741", "source": "8world / 路透社", "date": "2026-10-16", "summary": "安全研究组织 Swarmchasers 此前报告称，一批与腾讯云相关的智能体自 9 月底起多次尝试获取高德地图的公园、博物馆入口等信息，被拦截后改用其他公开工具、转发服务与公开代码中的密钥。腾讯混元回应称相关活动并非由混元模型发起，而是评测第三方模型时出现的意外浏览行为，未发现蓄意攻击证据，将加强网络访问管控与智能体监测；这被视为中国大厂首次公开承认智能体“失控”。阿里巴巴拒绝置评。", "id": "f172aac724ae66d52507140de72f5e18f1f722d2", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "1688 全面接入企业级智能体 Accio Work：副总裁称今年平台上由 Agent 发起的交易已占 40%", "url": "https://www.caiwennews.cn/article/1656501.shtml", "source": "财闻", "date": "2026-10-16", "summary": "阿里旗下批发平台 1688 于 10 月 12 日全面接入 Accio Work，覆盖找货、备货、成交、复购与店铺经营等环节；1688 副总裁王强透露，每天被 Agent 调动的商家约 29 万家、占比约三分之一，买家通过 Agent 委托询盘、找货的占比超 ource": "Anthropic", "date": "2026-10-16", "summary": "Anthropic STEM Fellows 项目中，Claude Mythos 5 仅凭自然语言规格与自动评估器闭环迭代，在化学、优化、物理模拟与数论等八项量子电路任务上发现新设计；部分场景相对既往发表方案可显著降低门数与量子比特需求。", "id": "04b7640931c7c9715e6a3167f61f1a526fddcb22", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-17T10:40:00+08:00"}, {"title": "Anthropic 发布《AI 预期鸿沟》调研：91% 员工 vs 39% 美国成年人认为 2030 年前 AI 能做出诺奖级发现", "url": "https://www.anthropic.com/research/expectations-for-the-future", "source": "Anthropic", "date": "2026-10-16", "summary": "两份报告分别考察 AI 如何改变 Anthropic 内部就业，以及员工与约 1.1 万名美国成年人（Morning Consult 8 月调查）的预期差异：双方对 AI 当前能力看法接近，但员工预期进展快得多；过半员工认为 2030 年 AI 能完成自己至少 80% 的工作，公众仅 5%。不过两组对“AI 做得越多、失业越多”的经济模型判断相似。", "id": "ab1e0ebf1e3443ff4e16896705b3c6ca401ae374", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T10:40:00+08:00"}, {"title": "The Register：PostgreSQL 19 正式版推迟至 11 月 19 日，AI 辅助审查发现大量缺陷，8–10 项功能被撤回", "url": "https://www.theregister.com/databases/2026/10/16/postgres-19-delayed-after-ai-reviewers-find-more-bugs-than-humans-can-fix/5303471", "source": "The Register", "date": "2026-10-16", "summary": "发布团队将 GA 从原计划推迟，新增 11 月 12 日 RC2 以纳入大量修复；提交者 Peter Eisentraut 称 LLM 辅助审查让后期暴露的问题激增。但核心开发者 Tomas Vondra 统计 12 次撤回中仅约 4 次与 AI 有关，并指出今年 CVE 已达 44 个、资深开发者忙于处理安全报告也是主因。", "id": "e4018d8e9eb4c3e62dd1294356757ccd0b812eed", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T10:40:00+08:00"}, {"title": "路透社：IMF 总裁格奥尔基耶娃称若无保障措施与伦理框架，AI 风险或超过机遇", "url": "https://money.usnews.com/investing/news/articles/2026-10-16/imf-chief-says-ai-risks-may-exceed-opportunities-without-safeguards-and-ethical-framework", "source": "Reuters", "date": "2026-10-16", "summary": "在曼谷 IMF/世界银行年会与 Anthropic 联合创始人 Jack Clark 同台时表示，AI 已在提振全球经济，但若生产率提升不及预期也可能带来负面冲击；她支持行业自律结合主要国家政府参与的监管方式。美国财政部副部长 Erin Browne 则批评 IMF 过度关注风险。", "id": "7fa2cc163e810cea23fad9ea2624286d38e52d5a", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T09:35:00+08:00"}, {"title": "路透 <script>
const D=JSON.parse(document.getElementById('data').textContent);let cur='all';
const up=new Date(D.updated);document.getElementById('up').textContent=up.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ch=document.getElementById('chips');
ch.innerHTML='<button class="chip on" data-id="all">本期全部</button><button class="chip" data-id="hist">📚 全部历史 ('+D.history.length+')</button>'+D.modules.map(m=>`<button class="chip" data-id="${m.id}">${m.icon} ${esc(m.name)}</button>`).join('');
ch.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.id;[...ch.children].forEach(x=>x.classList.toggle('on',x===b));render()};
const fmt=n=>n>=1e4?(n/1e4).toFixed(1)+'万':n.toLocaleString();
function extra(i){let h='';if(i.stars!=null){h+=`<div><span class="bd">★ ${fmt(i.stars)}</span>`+(i.stars_week?`<span class="bd g">本周 +${fmt(i.stars_week)}</span>`:'')+(i.language?`<span class="bd l">${esc(i.language)}</span>`:'')+'</div>';}
if(i.why)h+=`<div class="why">💡 ${esc(i.why)}</div>`;
if(i.metrics){const m=i.metrics;h+=`<div><span class="bd">❤ ${fmt(m.likes)}</span><span class="bd g">🔁 ${fmt(m.reposts)}</span><span class="bd l">👁 ${fmt(m.views)}</span></div>`}return h}
let page=1;const PS=20;
const sk=i=>[(i.date||'').length===10?1:0,(i.date||'').length===10?i.date:'',i.first_seen||''];
const cmp=(a,b)=>{const x=sk(a),y=sk(b);for(let k=0;k<3;k++){if(x[k]!==y[k])return x[k]<y[k]?1:-1}return 0};
const card=i=>`<div class="it"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary)}</p>${extra(i)}<span class="tag">${i.module_name?esc(i.module_name)+' · ':''}${esc(i.source)} · ${esc(i.date)}</span></div>`;
function renderHist(q){const all=D.history.filter(i=>!q||(i.title+i.summary+i.source).toLowerCase().includes(q)).sort(cmp);
const pages=Math.max(1,Math.ceil(all.length/PS));if(page>pages)page=pages;const its=all.slice((page-1)*PS,page*PS);
document.getElementById('cnt').textContent=all.length;
document.getElementById('m').innerHTML=`<section class="mod" id="histbox" style="grid-column:1/-1"><h2><span>📚 全部历史（按日期从新到旧）</span><span class="tag">第 ${page}/${pages} 页 · ${all.length} 条</span></h2>`+(its.map(card).join('')||'<p class="mu">没有匹配的资讯</p>')+
`<div class="pager"><button class="chip" onclick="page=Math.max(1,page-1);render()">上一页</button> <button class="chip" onclick="page=page+1;render()">下一页</button></div></section>`}
function render(){if(cur==='hist'){return renderHist(document.getElementById('q').value.trim().toLowerCase())}const q=document.getElementById('q').value.trim().toLowerCase();let n=0;
document.getElementById('m').innerHTML=D.modules.filter(m=>cur==='all'||m.id===cur).map(m=>{
const its=[...m.items].sort(cmp).filter(i=>!q||(i.title+i.summary+i.source).toLowerCase().includes(q));n+=its.length;if(!its.length)return'';
return `<section class="mod"><h2><span>${m.icon} ${esc(m.name)}</span><span class="tag">${its.length} 条</span></h2>`+its.map(i=>
`<div class="it"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary)}</p>${extra(i)}<span class="tag">${esc(i.source)} · ${esc(i.date)}</span></div>`).join('')+'</section>'}).join('')||'<p class="mu">没有匹配的资讯</p>';
document.getElementById('cnt').textContent=n}
document.getElementById('q').oninput=()=>{page=1;render()};render();
</script></body></html>
