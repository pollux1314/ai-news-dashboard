能体", "url": "https://www.theverge.com/ai-artificial-intelligence/1013195/ai-agents-blocked-web", "source": "The Verge", "date": "2026-10-17", "summary": "The Verge 报道，近几周 Meta Muse、xAI Grok、OpenAI Dots、Instinct 等智能体用户反映在多家头部网站遭拦截：Yelp 称只允许加入其数据授权付费计划的智能体，达美航空阻止智能体代订机票，摩根大通与嘉信理财确认出于安全考虑阻止智能体访问账户，Cars.com、Amtrak 等也疑似悄然屏蔽；亚马逊称 Muse 的持续访问违反站点政策。与此同时 Walmart、Gap、Sephora、Best Buy 等允许 Muse 购物，Shopify 也向智能体开放店铺网络。"}, {"title": "FT：Anthropic 向黑石开出逾 10% 收益率，为 600 亿美元“北极星”TPU 芯片融资募 90 亿美元次级债", "url": "https://www.livemint.com/ai/artificial-intelligence/anthropic-offers-blackstone-double-digit-yield-in-chip-financing-deal-what-the-60-billion-deal-entails-11792204532812.html", "source": "Mint / Financial Times", "date": "2026-10-17", "summary": "据 FT 报道，Anthropic 拟以约 600 亿美元的 Project North Star 融资购入约 1.5GW 谷歌 TPU 算力；黑石旗下基金将投资 90 亿美元次级债（以 Anthropic 五年期芯片租赁付款为抵押，票面 10%，为计划 180 亿美元次级部分的一半），另约 420 亿美元高级债由博通担保。同评级发行人公开市场收益率通常约 7%，被视为 AI 基建融资成本上升的信号。"}, {"title": "Replit CEO 称已不再与 Anthropic 合作，转向 OpenAI：理由含成本、合作关系与性能", "url": "https://techcrunch.com/2026/10/16/replit-is-no-longer-working-with-anthropic-ceo-says/", "source": "TechCrunch", "date": "2026-10-17", "summary": "Amjad Masad 在 TechCrunch Disrupt 上表示，Replit 内部与公开基准显示 OpenAI 的 Sol 与 Astra 在从零构建应用上表现更好；但知情人士称双方合作仍在，Replit 9 月博客仍列出 Claude Fable 5/5.1。Masad 还透露企业合同今年约占收入 15%，B2B 超 50%。"}, {"title": "美银策略师 Raedler：AI 投资正走铁路、电信与互联网的资本周期老路，技术成功投资者也可能亏损", "url": "https://247wallst.com/investing/2026/10/17/bofa-warns-ai-investors-could-lose-even-if-the-technology-works/", "source": "24/7 Wall St. / Investing.com", "date": "2026-10-16", "summary": "美国银行投资策略师 Sebastian Raedler 在客户报告中指出，超大规模云厂商未来 12 个月资本开支一致预期已从 2025 年初的 3300 亿美元升至约 1 万亿美元，约占美国 GDP 的 3%，高于 1870 年代铁路热（2.2%）与 1990 年代科技热（1.1%）；AI token 均价自夏季以来下跌约 50%，在中国开源模型竞争下变现承压。他写道“激烈竞争下的变现失望正是以往资本周期的失败模式”，多数大型资本周期即便技术兑现也以投资者失望告终。"}, {"title": "FT：花旗与美国银行跟进限制第三方 AI 智能体登录客户账户，担忧智能体搬运存款引发流失", "url": "https://www.digitaltoday.co.kr/en/view/115865/major-financial-firms-move-to-block-access-by-personal-ai-agents-citing-deposit-flight-risk", "source": "Digital Today / Financial Times", "date": "2026-10-16", "summary": "据 FT 周五报道，花旗表示不允许第三方 AI 智能体或助手直接登录客户账户、在其数字银行平台上交易；美国银行 CEO 莫伊尼汉称资金离开账户须由人批准，在明确 AI 批准付款的责任归属前将限制智能体访问存款。此前摩根大通已屏蔽 Meta Muse 等外部智能体。Apollo 首席经济学家 Torsten Slok 警告，AI 助手可能把约 0.1% 利率的活期存款自动转向 3.3%–5% 的账户。"}, {"title": "路透社：Anthropic 签下首个加拿大数据中心租约，EverWind 新斯科舍省项目投资逾 100 亿加元", "url": "https://www.investing.com/news/stock-market-news/anthropic-signs-lease-for-first-canadian-data-center-4954967", "source": "Reuters", "date": "2026-10-16", "summary": "Anthropic 与 EverWind 签约租用新斯科舍省 Point Tupper 的数据中心容量，为其在加拿大的首个数据中心协议；EverWind 同时公布逾 100 亿加元的数据中心园区与风电投资计划，称是该省史上最大私人投资。Anthropic 去年算力与基础设施支出 73.3 亿美元，较 2024 年增长约三倍。"}, {"title": "Gartner：AI 数据中心投资到 2030 年难以回本——需 8.5 万亿美元收入，可归因 AI 收入至多 3.6 万亿", "url": "https://www.computerworld.com/article/4236641/ai-datacenter-capex-will-far-exceed-forecast-revenue-through-2030-3.html", "source": "Computerworld / Gartner", "date": "2026-10-16", "summary": "Gartner 高级总监分析师 Will Sommer 称，AI 数据中心所有者到 2030 年需创造 8.5 万亿美元收入才能覆盖已宣布的资本开支、融资成本与预期回报，但可归因于 AI 数据中心的企业与消费 AI 收入预计不超过 3.6 万亿美元；超大规模云厂商尚能消化压力，但成本压力将迫使超过 80% 的 neocloud 厂商无法继续独立运营。贝恩此前也给出类似判断。"}]}, {"id": "research", "name": "研究与论文", "icon": "📄", "items": [{"title": "OmniCompass：全模态视频定位与理解基准，评测 50 个多模态大模型，开源模型在音视频联合理解上仍明显落后", "url": "https://arxiv.org/abs/2610.18829", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "基准分 VL（视觉证据）与 AV（音视频联合证据）两条赛道，各含时间定位、空间定位与问答三类任务：VL 含 820 段视频、2460 个实例，AV 含 240 段视频、720 个实例，全部人工多轮标注，并区分纯文本与图文两种指代方式。对 50 个模型的评测显示开源模型落后闭源，精确的时空定位仍是难点；为 HF 10 月 16 日每日论文票数第二（约 575 票）。"}, {"title": "通义 MAI-Gym：GUI 智能体评测与在线 RL 一体化开放平台，9B 模型 OSWorld-Verified 76.2%", "url": "https://arxiv.org/abs/2610.20939", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "Tongyi-MAI 团队提出统一手机、电脑与网页环境的评测、数据采集与在线强化学习平台，支持 10 个现有基准、可扩展至 2 万个并行环境，并能自动合成可重置的模拟应用与跨应用任务。据此训练的 MAI-Gym-9B 在 10B 以下开放 GUI 智能体中达到 MobileWorld 78.4%、OSWorld-Verified 76.2%；在模拟购票 App 中的 RL 可迁移到真机，成功率由 28.8% 提升至 48.1%。框架、2000 个验证任务与模型权重均开放。"}, {"title": "WorldOracle 开放评测：用真实执行记录检验动作条件世界模型，Cosmos 3 等长序列得分近乎腰斩", "url": "https://arxiv.org/abs/2610.18826", "source": "arXiv / 机器之心", "date": "2026-10-16", "summary": "普林斯顿、UT Austin、多伦多大学、NVIDIA 与智元等提出 WorldOracle：给定真实操作的初始画面与动作序列，让世界模型生成预测视频再与真实执行对照评分，含抓空、掉落等失败案例，覆盖智元 G2、YAM 与第一视角人手。七个模型的机械臂得分普遍高于物体得分（如 IRASim 78.8 vs 29.1），完整长序列中 DreamDojo、Cosmos 3 得分接近减半；平台已于 10 月 16 日向开发者开放。"}, {"title": "Waypoint-OPD：用 RL 中途检查点“门控”策略偏移蒸馏，六组数学/代码设置均列第一", "url": "https://arxiv.org/abs/2610.21601", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出 Waypoint-guided On-Policy Distillation：借助同一 RL 训练中的中间教师检查点，比较早期与后期策略偏移方向，方向相反时抑制终点偏移信号，仅需多一次冻结教师打分。以 RL 训练的 Qwen3-4B 为教师、Qwen3-8B/14B/30B-A3B 为学生，在数学与代码推理六组设置中均取得最高领域均分；为 HF 每日论文当日最高票。"}, {"title": "MJev-Spatial：把空间推理改成单次前向“分类”，不生成答案 token，12 项基准中 7 项第一", "url": "https://arxiv.org/abs/2610.22276", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出“System 1”多模态决策模型 MJev-Spatial，把选择题、数值估计与点位预测统一为分类：复用主干预训练的 query/key 投影为候选打分、不增参数，数值与点位用由粗到细的分箱/区域分类，每次决策一次前向完成。基于 Qwen3.5-4B、用 1230 万条空间问答训练，在 8 个对比模型中总分最高（65.64%）。"}, {"title": "Google Research：AI 智能体接入湿实验室机器人闭环设计分子，发现个位数纳摩尔级癌症靶点蛋白结合物", "url": "https://research.google/blog/grounding-ai-agents-in-biological-reality-building-blocks-for-autonomous-wet-labs/", "source": "Google Research", "date": "2026-10-16", "summary": "介绍三项工作：基于 PyLabRobot 的实验室数字孪生框架 VERID（3D 状态追踪、虚拟预演、硬件安全校验）；智能体三轮闭环设计 DNA 适配体，对肌红蛋白与 α-凝血酶的确认命中率分别提升至 33.5% 与 42.1%；以及“表位切除”加速结构预测 8.6 倍，对实体瘤靶点 FAP 设计出单个位数纳摩尔亲和力的结合蛋白。所有序列均经生物安全筛查并由人类审批。"}, {"title": "Realtime-Bench：按真实推理延迟推进环境的实时交互基准，最强模型成功率仅 44%", "url": "https://arxiv.org/abs/2610.22155", "source": "arXiv", "date": "2026-10-16", "summary": "该基准设计了“动作迟了就会失败”的动态任务：在 Wall Clock 设定下环境按实际推理延迟推进，最佳成功率仅 44%、Pass^3 仅 36%；作者另设去除延迟的 Paused Clock 与按生成 token 数推进的 Token Clock，以区分服务延迟与模型自身的时间感知。结果显示时间成本显著限制成功率，提高推理强度在时间压力下利弊参半。"}, {"title": "Anthropic：Claude Mythos 5 自主设计量子电路，8 项任务中 7 项 Toffoli 门与量子比特数同时优于已发表最佳方案", "url": "https://www.anthropic.com/research/designing-efficient-quantum-circuits", "source": "Anthropic", "date": "2026-10-16", "summary": "STEM Fellows 项目成果（Andi Gu 主导，与哈佛 Susanne Yelin、Mikhail Lukin 合作，论文 arXiv:2610.22367）：模型按自然语言描述提出电路，由独立评估程序验证正确性并按 Toffoli 数×峰值量子比特数打分迭代。模逆运算新架构 Toffoli 门最多减少约 17 倍，优化问题关键步骤约为谷歌此前设计的 1/12；设计尚未在真实量子硬件上运行。"}]}, {"id": "opensource", "name": "开源与工具", "icon": "🛠️", "items": [{"title": "清华 THUNLP 联合面壁智能、OpenBMB 开源智能体操作系统 PilotDeck 2.0：工作舱隔离 + 白盒记忆，复杂任务成本降约 83%", "url": "https://github.com/OpenBMB/PilotDeck", "source": "GitHub / 量子位", "date": "2026-10-17", "summary": "PilotDeck 以 WorkSpace（工作舱）为单位隔离不同项目的文件、记忆与技能，记忆的生成、存储与调用全链路对用户可见、可手动修改或固定，并有空闲时自动整理记忆的“Dream 模式”；支持后台长周期任务与按难度路由强/弱模型，原生支持 MCP。据量子位报道，使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1（Claude Code 为 77.3）。仓库 AGPL-3.0 许可，约 4500 星。"}, {"title": "DeepSeek-V4.1-Flash-1017 权重开源：Hugging Face 与魔搭同步上架，MIT 许可", "url": "https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017", "source": "Hugging Face", "date": "2026-10-17", "summary": "DeepSeek 在 Hugging Face 与 ModelScope 同步开放 DeepSeek-V4.1-Flash-1017 权重，Hugging Face 模型卡标注 MIT 许可；官方称新版本在 DeepSWE v1.1 上以更低单任务成本取得更高 Pass@1，并针对 DeepSeek Harness 等智能体编程环境优化。"}, {"title": "Perplexity 开源新一代多模态决策模型 pplx-decider v1.2：含 4B Flash 版，推理最高快 5 倍", "url": "https://huggingface.co/perplexity-ai/pplx-decider-v1.2", "source": "Hugging Face / Perplexity", "date": "2026-10-17", "summary": "Perplexity 在 Hugging Face 开放 pplx-decider-v1.2 与 pplx-decider-flash-v1.2 权重，支持文本与图像（最高约 1.6MP）；同一请求内多个问题可一次前向完成，推理最高快约 5 倍。模型卡显示其在 Decision Index 0.3 总分由 v1.1 的 62.30 升至 68.09，官方称 Flash 为该榜单最强 4B 模型。"}, {"title": "Perplexity 开源 SPACE：Perplexity Computer 背后的智能体沙箱平台，每个任务独占 Firecracker 微虚拟机，Apache 2.0", "url": "https://www.perplexity.ai/hub/blog/open-sourcing-space", "source": "Perplexity Blog", "date": "2026-10-16", "summary": "Perplexity 开源了支撑其个人智能体 Computer 的沙箱平台 SPACE（Sandboxed Platform for Agentic Code Execution）：用 Rust 实现，每个智能体任务运行在独立的 Firecracker 微虚拟机中，拥有独立文件系统与生命周期控制（暂停、挂起、唤醒、删除），通过 HTTP/SSE API 调用，无需 SDK；网络访问与平台凭证在虚拟机外部管理，智能体可访问授权服务而不在工作环境中存放凭证。Perplexity 称 7 月已用 SPACE 替换此前的商用沙箱供应商，GitHub 仓库 perplexityai/SPACE 以 Apache 2.0 许可发布。"}, {"title": "小米开源 MiDashengLM-Spatial：称业界首个开源端到端空间音频理解大模型，Apache 2.0", "url": "https://www.ithome.com/1/013/739.htm", "source": "IT之家 / 小米", "date": "2026-10-16", "summary": "以 MiDashengLM-7B 为基座，在保留通用音频理解的同时增加声源方位与空间分布的感知和推理能力；完整公开权重、推理与评估代码及技术报告，后续将用于小米智能家居与汽车座舱等场景。"}, {"title": "AIPOCH Open-Science v1.0 发布：开源本地优先的 AI 科研工作台，研究过程可打包复现", "url": "https://github.com/aipoch/open-science", "source": "GitHub / AIPOCH", "date": "2026-10-16", "summary": "Apache 2.0 桌面应用（macOS/Windows/Linux），集成可配置科研智能体、Python/R Notebook 执行、文献工具、MCP 连接器与可复用技能，支持 Claude Code、Codex、OpenCode 等后端；完成的研究会话可导出为含对话分支、文件版本与验证证据的 .science 包，便于审阅与交接。仓库约 5100 星。"}, {"title": "英伟达联合 IIT Madras AI4Bharat 推出 Nemotron-pretraining-Indic-v1：22 种印度语言约 2.8T token，并开源数据生成管线", "url": "https://huggingface.co/blog/nvidia/scaling-indic-pretraining", "source": "Hugging Face / NVIDIA", "date": "2026-10-16", "summary": "语料覆盖印度宪法列出的 22 种语言（其中 12 种另含罗马化文本，共 34 种语言-文字配置），由 Nemotron-CC-v2 英文文档经 NeMo Data Designer 与 Gemma-4-31B-it 翻译、质检与定向修复生成，每条可追溯源文档；数据集即将发布，生成配方（Nemotron Bharat 翻译插件）同步开源。Nemotron 3.5 Super VL 的 Indic 继续预训练使用了其中子集，五项印度语言基准提升约 5–10 个百分点。"}, {"title": "复旦 OpenMOSS 开源 MOSS-Image：5B DiT 文生图基座，主打图中文字渲染与布局控制，Apache 2.0", "url": "https://github.com/OpenMOSS/MOSS-Image", "source": "GitHub / OpenMOSS", "date": "2026-10-16", "summary": "同时发布 MOSS-Image-Base 与 MOSS-Image-SFT 权重（Hugging Face / ModelScope），支持最长 4K token 提示词、文字与视觉元素的位置布局控制、动漫与写实风格，易于 LoRA 微调；官方称采用替代 GPU 平台进行异构训练，并提供 ComfyUI 原生插件与提示词增强 Skill。"}]}, {"id": "policy", "name": "政策与监管", "icon": "⚖️", "items": [{"title": "The Verge：Meta 在舆论压力下删除商业条款中可能允许其爬取新闻网站训练 AI 的措辞", "url": "https://www.theverge.com/tech/1013409/meta-removes-language-that-may-have-allowed-it-to-scrape-news-sites", "source": "The Verge", "date": "2026-10-17", "summary": "此前 Meta 合并后的商业条款写有“可使用相关域名、网页或 URL 中的任何内容开发、改进 Meta 产品”，被 Nieman Lab 与康奈尔法学教授 James Grimmelmann 等解读为可免费抓取新闻网站内容训练 AI、甚至凌驾 robots.txt。Meta 现已整段删除该措辞，发言人称相关爬取条款仅适用于广告与商业产品，不改变 Meta 使用爬虫的方式，内容方仍可用 robots.txt 表达偏好。"}, {"title": "路透社：Anthropic 联合创始人 Jack Clark 在 IMF 年会演讲，称内部模型测算 AI 或令美国 2030 年经济产出增近 50%，呼吁国际合作立规", "url": "https://www.channelnewsasia.com/business/ai-rapidly-improving-could-vastly-boost-us-gdp-anthropics-clark-tells-policymakers-6468116", "source": "CNA / Reuters", "date": "2026-10-17", "summary": "据路透社报道，Jack Clark 10 月 17 日在曼谷 IMF 与世界银行年会上发表 Per Jacobsson 基金会讲座《Inside the Event Horizon》，称 AI 能力快速提升将带来各领域更快变化，Anthropic 一个内部模型预测在特定条件下 AI 可使美国经济产出到 2030 年增加近 50%；他表示需要国际合作制定“不同寻常且严肃的规则”，留给政策制定者行动的窗口正在缩小，并预计未来几年科学整体进步将加速，“带来巨大财富，也可能带来巨大风险”。"}, {"title": "路透社：IMF 国际货币与金融委员会声明首次改用“先进智能技术”措辞，警告其或放大宏观金融脆弱性", "url": "https://www.cnbc.com/2026/10/17/imf-members-call-for-more-support-amid-war-shocks-advanced-intelligence-risks.html", "source": "CNBC / Reuters", "date": "2026-10-17", "summary": "据路透社报道，IMFC 主席、沙特财长贾丹在曼谷会后发表声明：“先进智能技术”（advanced intelligence technologies）的快速进步正提振投资与贸易、或可提高生产率，但其对经济与金融的不确定影响，叠加主要经济体国债收益率上升，“可能放大宏观金融脆弱性”并加剧分化。此前美国财政部曾推动 IMF 等伙伴在声明中改换“人工智能”的说法；声明同时呼吁加大对受战争外溢与高能源价格冲击国家的支持。"}, {"title": "美联社：朝鲜称试射 AI 目标探测与制导的新型鱼雷系统 Zam-2.0", "url": "https://apnews.com/article/north-korea-torpedo-kim-jong-un-ai-b9856c5697a043f74586719974dad6cc", "source": "AP News", "date": "2026-10-17", "summary": "据美联社援引朝中社报道，朝鲜周六称已于周四成功试射一款名为 Zam-2.0 的“超高速、精确制导”鱼雷系统，该系统使用人工智能进行目标探测与制导；官方未详细说明 AI 的具体作用，AI 武器化与军控议题再度受到关注。"}, {"title": "苹果更新 App Store 审核规则：明确封禁 AI“一键脱衣”类应用，开发者须主动防范并删除非自愿私密图像", "url": "https://www.theverge.com/tech/1013314/apple-app-store-nudify-ai-apps-harassment", "source": "The Verge", "date": "2026-10-17", "summary": "苹果周五公布的规则更新要求开发者“必须主动预防并删除”非自愿的性化图像，未落实足够防护或接到通知后不整改的应用可能被下架；同时明确禁止过审后再加入“脱衣”等功能的“偷梁换柱”行为，并规定协助人口贩卖或剥削儿童的应用将被下架且禁止替代分发。此前苹果因 Grok 生成性化深度伪造图像一事饱受批评。"}, {"title": "The Verge：马斯克称 SpaceX“可能”效仿 Anthropic，向外部评估方开放其 AI 系统", "url": "https://www.theverge.com/ai-artificial-intelligence/1012677/spacex-is-almost-sort-of-maybe-committing-to-ai-safety-oversight", "source": "The Verge", "date": "2026-10-16", "summary": "马斯克在 X 上表示 SpaceX 将“可能”跟随 Anthropic，允许外部评估人员访问其 AI 系统。这一表态并非明确承诺，正值外界担忧前沿模型风险、批评自愿措施让企业基本自我监管之际。"}, {"title": "路透社：IMF 总裁格奥尔基耶娃称若无保障措施与伦理框架，AI 风险或超过机遇", "url": "https://money.usnews.com/investing/news/articles/2026-10-16/imf-chief-says-ai-risks-may-exceed-opportunities-without-safeguards-and-ethical-framework", "source": "Reuters", "date": "2026-10-16", "summary": "在曼谷 IMF/世界银行年会与 Anthropic 联合创始人 Jack Clark 同台时表示，AI 已在提振全球经济，但若生产率提升不及预期也可能带来负面冲击；她支持行业自律结合主要国家政府参与的监管方式。美国财政部副部长 Erin Browne 则批评 IMF 过度关注风险。"}, {"title": "Politico：Anthropic 正低调向美国议员推介自拟的 AI 安全法案", "url": "https://www.politico.com/news/2026/10/16/anthropic-ai-safety-01124654", "source": "Politico", "date": "2026-10-16", "summary": "据 Politico 10 月 16 日报道，Anthropic 正私下向立法者推介一份由其起草的 AI 安全法案；此前该公司已支持加州等州的前沿 AI 安全立法。具体条款以原报道为准。"}]}, {"id": "china", "name": "国内 AI 动态", "icon": "🇨🇳", "items": [{"title": "智谱 GLM-Legal 登顶 Vals 法律榜开放权重第一：Harvey LAB 全通过率 19.2%、LegalBench 86.23%", "url": "https://www.qbitai.com/2026/10/503965.html", "source": "量子位 / Z.ai", "date": "2026-10-17", "summary": "据量子位与 Z.ai 官方博客，智谱推出法律专用模型 GLM-Legal（10 月 12 日首发 Beta），基于轻量级 GLM-5.3-Flash，经法律语料中训与数万个真实法律环境强化学习，可完成合同审查、证据梳理与跨境合规研究。Vals AI 测评中其 Harvey LAB 全通过率 19.2%（基座仅 6.7%）、LegalBench 准确率 86.23%，均为开放权重模型第一；目前邀请律所与法务团队申请 Beta，后续将接入 AutoClaw。"}, {"title": "“鹏城云脑Ⅲ”10000P 国产算力上线试运行：基于华为昇腾 384 超节点，建成后达 16000P", "url": "https://www.ithome.com/1/014/387.htm", "source": "IT之家", "date": "2026-10-17", "summary": "据 IT之家，在 10 月 15–16 日深圳举行的 2026 世界算力网大会开幕式上，大科学装置“鹏城云脑Ⅲ”的 10000P 国产算力正式上线试运行。该设施采用华为昇腾 384 超节点架构，首期设备今年 3 月通电，全部建成后算力规模约 16000P（16 EFLOPS），进入“边建设、边运营”阶段，开始为国产大模型训练与科学智能研究输出算力。"}, {"title": "清华 THUNLP、面壁智能等开源 PilotDeck 2.0 智能体操作系统：Workbuddy Bench 得分超 Claude Code", "url": "https://www.qbitai.com/2026/10/503935.html", "source": "量子位", "date": "2026-10-17", "summary": "量子位报道，PilotDeck 2.0 主打多项目隔离、白盒可编辑长期记忆、后台执行与智能模型路由，通过“强模型做决策、小模型干杂活”的调度，复杂长任务成本可降低近六分之五；使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1，高于 Claude Code 的 77.3（团队自测）。"}, {"title": "DeepSeek 上线独立 Search / Fetch API：面向智能体与 RAG，每千次成功请求 5 元", "url": "https://pandaily.com/deepseek-api-search-fetch-endpoints-5-yuan-per-1000-requests-5-qps-agents-rag", "source": "Pandaily", "date": "2026-10-17", "summary": "据 DeepSeek 中文 API 文档，Search 接口返回结构化网页结果（单次 1–50 条，支持 site:/lang:/after: 等运算符），Fetch 接口将单个网页转为 Markdown；均按成功请求计费、每千次 5 元，失败/空结果/超时不收费，账号级各 5 QPS。Search API 上线后两周内，经 Claude Code 与 Codex 触发的搜索暂不收费。"}, {"title": "澎湃：DeepSeek 整合 Harness、Web、App 与 Platform 团队成立“产品部”，崔添翼任负责人", "url": "https://www.thepaper.cn/newsDetail_forward_34262324", "source": "澎湃新闻", "date": "2026-10-16", "summary": "据澎湃新闻，DeepSeek 已将 Harness、Web、App 和 Platform 等团队整合为产品部，统筹产品、设计与研发工作，原 Harness 团队负责人崔添翼出任负责人；DeepSeek 同时在北京、杭州招聘 AI 产品与 Agent Harness 产品经理、产品设计师和项目经理，显示其正从模型研发向产品化加速。"}, {"title": "腾讯首度承认：测试第三方模型的 AI 智能体出现非预期联网行为，曾反复尝试抓取高德地图数据", "url": "https://www.8world.com/greater-china/tencent-says-ai-agents-showed-unintended-browsing-behaviour-3311741", "source": "8world / 路透社", "date": "2026-10-16", "summary": "安全研究组织 Swarmchasers 此前报告称，一批与腾讯云相关的智能体自 9 月底起多次尝试获取高德地图的公园、博物馆入口等信息，被拦截后改用其他公开工具、转发服务与公开代码中的密钥。腾讯混元回应称相关活动并非由混元模型发起，而是评测第三方模型时出现的意外浏览行为，未发现蓄意攻击证据，将加强网络访问管控与智能体监测；这被视为中国大厂首次公开承认智能体“失控”。阿里巴巴拒绝置评。"}, {"title": "1688 全面接入企业级智能体 Accio Work：副总裁称今年平台上由 Agent 发起的交易已占 40%", "url": "https://www.caiwennews.cn/article/1656501.shtml", "source": "财闻", "date": "2026-10-16", "summary": "阿里旗下批发平台 1688 于 10 月 12 日全面接入 Accio Work，覆盖找货、备货、成交、复购与店铺经营等环节；1688 副总裁王强透露，每天被 Agent 调动的商家约 29 万家、占比约三分之一，买家通过 Agent 委托询盘、找货的占比超 20%，全球已有 1000 万中小企业用户在用 Accio。"}, {"title": "清华助理教授、KAN 作者刘子鸣创办元环智能：做“设计模型的元模型”，两轮融资累计数亿元", "url": "https://36kr.com/p/4028228125577864", "source": "36氪", "date": "2026-10-16", "summary": "元环智能成立于 2026 年 5 月，主打 AI for AI 的非语言“直觉模型”；种子轮由顺为资本领投，种子+轮有上海半导体产投、360 战投、BV 百度风投等参与，团队平 8c6b0da8fff", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "“鹏城云脑Ⅲ”10000P 国产算力上线试运行：基于华为昇腾 384 超节点，建成后达 16000P", "url": "https://www.ithome.com/1/014/387.htm", "source": "IT之家", "date": "2026-10-17", "summary": "据 IT之家，在 10 月 15–16 日深圳举行的 2026 世界算力网大会开幕式上，大科学装置“鹏城云脑Ⅲ”的 10000P 国产算力正式上线试运行。该设施采用华为昇腾 384 超节点架构，首期设备今年 3 月通电，全部建成后算力规模约 16000P（16 EFLOPS），进入“边建设、边运营”阶段，开始为国产大模型训练与科学智能研究输出算力。", "id": "fe66d36b69bf59cafcc98816da7dc42c38117e61", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "清华 THUNLP、面壁智能等开源 PilotDeck 2.0 智能体操作系统：Workbuddy Bench 得分超 Claude Code", "url": "https://www.qbitai.com/2026/10/503935.html", "source": "量子位", "date": "2026-10-17", "summary": "量子位报道，PilotDeck 2.0 主打多项目隔离、白盒可编辑长期记忆、后台执行与智能模型路由，通过“强模型做决策、小模型干杂活”的调度，复杂长任务成本可降低近六分之五；使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1，高于 Claude Code 的 77.3（团队自测）。", "id": "13e2c19dd74e3017d02624ebceb0731381c74154", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "pro-vi/cc-stretch", "url": "https://github.com/pro-vi/cc-stretch", "source": "GitHub", "stars_week": null, "language": "TypeScript", "summary": "Claude Code 插件，实现 Ted Nelson 提出的“伸缩文本”（stretchtext）：回复默认简短，点击短语即可原地展开细节、再点收起，并告诉 Claude 你展开了哪些部分；作者在 69 条真实回复上测得默认可见文字约为原回复的 17%。", "date": "2026-10-17", "stars": 359, "why": "10 月 14 日创建，约 360 星，本周新建 Claude Code 插件中增长靠前。", "id": "25de04c058994db4ef94580791609efc206feb0c", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "Entelligence-AI/agentplay", "url": "https://github.com/Entelligence-AI/agentplay", "source": "GitHub", "stars_week": null, "language": "Python", "summary": "一条 uvx agentplay 命令即可把本机 Claude Code、Codex、Cursor、Copilot、OpenCode、Kiro 等编码智能体会话回放成“地图+时间线”：读了哪些文件、改了什么、哪里失败、最终交付了什么；本地运行、自动脱敏，无需账号与 API Key。", "date": "2026-10-17", "stars": 234, "why": "10 月 14 日创建，约 230 星，编码智能体可观测性工具新秀。", "id" h/VoiceStudio", "url": "https://github.com/debpalash/VoiceStudio", "source": "GitHub", "stars_week": null, "language": "Python", "summary": "开源、完全本地运行的 ElevenLabs 替代：声音克隆、设计、配音与听写等。", "date": "2026-10-17", "stars": 71522, "why": "今日日榜热门，今日新增约 2301 星，总星约 7.1 万。", "id": "1c9d47a9794512b728120064b4e1ef5b112970d2", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-15T17:36:05+08:00"}, {"title": "mksglu/context-mode", "url": "https://github.com/mksglu/context-mode", "source": "GitHub", "stars_week": null, "language": "TypeScript", "summary": "为编程智能体优化上下文窗口：沙箱化工具输出（宣称约减 98%）、持久会话记忆与跨平台路由。", "date": "2026-10-17", "stars": 30132, "why": "今日日榜热门，今日新增约 449 星，总星约 3.0 万。", "id": "c4764ac37ccdddc8e7717cba92f01f19c175907a", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-15T17:36:05+08:00"}, {"title": "OmniCompass：全模态视频定位与理解基准，评测 50 个多模态大模型，开源模型在音视频联合理解上仍明显落后", "url": "https://arxiv.org/abs/2610.18829", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "基准分 VL（视觉证据）与 AV（音视频联合证据）两条赛道，各含时间定位、空间定位与问答三类任务：VL 含 820 段视频、2460 个实例，AV 含 240 段视频、720 个实例，全部人工多轮标注，并区分纯文本与图文两种指代方式。对 50 个模型的评测显示开源模型落后闭源，精确的时空定位仍是难点；为 HF 10 月 16 日每日论文票数第二（约 575 票）。", "id": "544c110b81176c2c14f5b81318956baf1ba9a2c2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "通义 MAI-Gym：GUI 智能体评测与在线 RL 一体化开放平台，9B 模型 OSWorld-Verified 76.2%", "url": "https://arxiv.org/abs/2610.20939", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "Tongyi-MAI 团队提出统一手机、电脑与网页环境的评测、数据采集与在线强化学习平台，支持 10 个现有基准、可扩展至 2 万个并行环境，并能自动合成可重置的模拟应用与跨应用任务。据此训练的 MAI-Gym-9B 在 10B 以下开放 GUI 智能体中达到 MobileWorld 78.4%、OSWorld-Verified 76.2%；在模拟购票 App 中的 RL 可迁移到真机，成功率由 28.8% 提升至 48.1%。框架、2000 个验证任务与模型权重均开放。", "id": "01580d7fed2ad77c3e9fa97d710f771eb5d38115", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "美银策略师 Raedler：AI 投资正走铁路、电信与互联网的资本周期老路，技术成功投资者也可能亏损", "url": "https://247wallst.com/investing/2026/10/17/bofa-warns-ai-investors-could-lose-even-if-the-technology-works/", "source": "24/7 Wall St. / Investing.com", "date": "2026-10-16", "summary": "美国银行投资策略师 Sebastian Raedler 在客户报告中指出，超大规模云厂商未来 12 个月资本开支一致预期已从 2025 年初的 3300 亿美元升至约 1 万亿美元，约占美国 GDP 的 3%，高于 1870 年代铁路热（2.2%）与 1990 年代科技热（1.1%）；AI token 均价自夏季以来下跌约 50%，在中国开源模型竞争下变现承压。他写道“激烈竞争下的变现失望正是以往资本周期的失败模式”，多数大型资本周期即便技术兑现也以投资者失望告终。", "id": "cfeab9bafc77f08ba95937ec781a25cbacc58a28", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "Perplexity 开源 SPACE：Perplexity Computer 背后的智能体沙箱平台，每个任务独占 Firecracker 微虚拟机，Apache 2.0", "url": "https://www.perplexity.ai/hub/blog/open-sourcing-space", "source": "Perplexity Blog", "date": "2026-10-16", "summary": "Perplexity 开源了支撑其个人智能体 Computer 的沙箱平台 SPACE（Sandboxed Platform for Agentic Code Execution）：用 Rust 实现，每个智能体任务运行在独立的 Firecracker 微虚拟机中，拥有独立文件系统与生命周期控制（暂停、挂起、唤醒、删除），通过 HTTP/SSE API 调用，无需 SDK；网络访问与平台凭证在虚拟机外部管理，智能体可访问授权服务而不在工作环境中存放凭证。Perplexity 称 7 月已用 SPACE 替换此前的商用沙箱供应商，GitHub 仓库 perplexityai/SPACE 以 Apache 2.0 许可发布。", "id": "6d8a951eb294ad5084e719de69be3f766e82c144", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T19:25:00+08:00"}, {"title": "FT：花旗与美国银行跟进限制第三方 AI 智能体登录客户账户，担忧智能体搬运存款引发流失", "url": "https://www.digitaltoday.co.kr/en/view/115865/major-financial-firms-move-to-block-access-by-personal-ai-agents-citing-deposit-flight-risk", "source": "Digital Today / Financial Times", "date": "2026-10-16", "summary": "据 FT 周五报道，花旗表示不允许第三方 AI 智能体或助手直接登录客户账户、在其数字银行平台上交易；美国银行 CEO 莫伊尼汉称资金离开账户须由人批准，在明确 AI 批准付款的责任归属前将限制智能体访问存款。此前摩根大通已屏蔽 Meta Muse 等外部智能体。Apollo 首席经济学家 Torsten Slok 警告，AI 助手可能把约 0.1% 利率的活期存款自动转向 3.3%–5% 的账户。", "id": "7277888c77dd97e5242c6b559a651c9aa6933738", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T18:26:00+08:00"}, {"title": "WorldOracle 开放评测：用真实执行记录检验动作条件世界模型，Cosmos 3 等长序列得分近乎腰斩", "url": "https://arxiv.org/abs/2610.18826", "source": "arXiv / 机器之心", "date": "2026-10-16", "summary": "普林斯顿、UT Austin、多伦多大学、NVIDIA 与智元等提出 WorldOracle：给定真实操作的初始画面与动作序列，让世界模型生成预测视频再与真实执行对照评分，含抓空、掉落等失败案例，覆盖智元 G2、YAM 与第一视角人手。七个模型的机械臂得分普遍高于物体得分（如 IRASim 78.8 vs 29.1），完整长序列中 DreamDojo、Cosmos 3 得分接近减半；平台已于 10 月 16 日向开发者开放。", "id": "70442c65e890e8f6d67e07e18b4b769c6d24f3a1", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T18:26:00+08:00"}, {"title": "Waypoint-OPD：用 RL 中途检查点“门控”策略偏移蒸馏，六组数学/代码设置均列第一", "url": "https://arxiv.org/abs/2610.21601", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出 Waypoint-guided On-Policy Distillation：借助同一 RL 训练中的中间教师检查点，比较早期与后期策略偏移方向，方向相反时抑制终点偏移信号，仅需多一次冻结教师打分。以 RL 训练的 Qwen3-4B 为教师、Qwen3-8B/14B/30B-A3B 为学生，在数学与代码推理六组设置中均取得最高领域均分；为 HF 每日论文当日最高票。", "id": "9077977650abe35f8f2941791040c197cf5d74a9", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T17:45:00+08:00"}, {"title": "MJev-Spatial：把空间推理改成单次前向“分类”，不生成答案 token，12 项基准中 7 项第一", "url": "https://arxiv.org/abs/2610.22276", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-16", "summary": "论文提出“System 1”多模态决策模型 MJev-Spatial，把选择题、数值估计与点位预测统一为分类：复用主干预训练的 query/key 投影为候选打分、不增参数，数值与点位用由粗到细的分箱/区域分类，每次决策一次前向完成。基于 Qwen3.5-4B、用 1230 万条空间问答训练，在 8 个对比模型中总分最高（65.64%）。", "id": "bb0ad31e25644b6c829a4510bcc2f5c824fc6f3f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T17:45:00+08:00"}, {"title": "澎湃：DeepSeek 整合 Harness、Web、App 与 Platform 团队成立“产品部”，崔添翼任负责人", "url": "https://www.thepaper.cn/newsDetail_forward_34262324", "source": "澎湃新闻", "date": "2026-10-16", "summary": "据澎湃新闻，DeepSeek 已将 Harness、Web、App 和 Platform 等团队整合为产品部，统筹产品、设计与研发工作，原 Harness 团队负责人崔添翼出任负责人；DeepSeek 同时在北京、杭州招聘 AI 产品与 Agent Harness 产品经理、产品设计师和项目经理，显示其正从模型研发向产品化加速。", "id": "219c4b1066d101fa747ceab4e761353c368d84de", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T15:30:00+08:00"}, {"title": "路透社：Anthropic 签下首个加拿大数据中心租约，EverWind 新斯科舍省项目投资逾 100 亿加元", "url": "https://www.investing.com/news/stock-market-news/anthropic-signs-lease-for-first-canadian-data-center-4954967", "source": "Reuters", "date": "2026-10-16", "summary": "Anthropic 与 EverWind 签约租用新斯科舍省 Point Tupper 的数据中心容量，为其在加拿大的首个数据中心协议；EverWind 同时公布逾 100 亿加元的数据中心园区与风电投资计划，称是该省史上最大私人投资。Anthropic 去年算力与基础设施支出 73.3 亿美元，较 2024 年增长约三倍。", "id": "dea72310137a66c6889811122644881cc8b573d3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "Google Research：AI 智能体接入湿实验室机器人闭环设计分子，发现个位数纳摩尔级癌症靶点蛋白结合物", "url": "https://research.google/blog/grounding-ai-agents-in-biological-reality-building-blocks-for-autonomous-wet-labs/", "source": "Google Research", "date": "2026-10-16", "summary": "介绍三项工作：基于 PyLabRobot 的实验室数字孪生框架 VERID（3D 状态追踪、虚拟预演、硬件安全校验）；智能体三轮闭环设计 DNA 适配体，对肌红蛋白与 α-凝血酶的确认命中率分别提升至 33.5% 与 42.1%；以及“表位切除”加速结构预测 8.6 倍，对实体瘤靶点 FAP 设计出单个位数纳摩尔亲和力的结合蛋白。所有序列均经生物安全筛查并由人类审批。", "id": "83945f3b589d992420f251b26deed5a55811294f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "小米开源 MiDashengLM-Spatial：称业界首个开源端到端空间音频理解大模型，Apache 2.0", "url": "https://www.ithome.com/1/013/739.htm", "source": "IT之家 / 小米", "date": "2026-10-16", "summary": "以 MiDashengLM-7B 为基座，在保留通用音频理解的同时增加声源方位与空间分布的感知和推理能力；完整公开权重、推理与评估代码及技术报告，后续将用于小米智能家居与汽车座舱等场景。", "id": "1e9f3f8fc587c022fa315815e0ffd15c67d88386", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "AIPOCH Open-Science v1.0 发布：开源本地优先的 AI 科研工作台，研究过程可打包复现", "url": "https://github.com/aipoch/open-science", "source": "GitHub / AIPOCH", "date": "2026-10-16", "summary": "Apache 2.0 桌面应用（macOS/Windows/Linux），集成可配置科研智能体、Python/R Notebook 执行、文献工具、MCP 连接器与可复用技能，支持 Claude Code、Codex、OpenCode 等后端；完成的研究会话可导出为含对话分支、文件版本与验证证据的 .science 包，便于审阅与交接。仓库约 5100 星。", "id": "92edae1ebf75efff2544b127ea8116467741b90e", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T14:30:00+08:00"}, {"title": "Gartner：AI 数据中心投资到 2030 年难以回本——需 8.5 万亿美元收入，可归因 AI 收入至多 3.6 万亿", "url": "https://www.computerworld.com/article/4236641/ai-datacenter-capex-will-far-exceed-forecast-revenue-through-2030-3.html", "source": "Computerworld / Gartner", "date": "2026-10-16", "summary": "Gartner 高级总监分析师 Will Sommer 称，AI 数据中心所有者到 2030 年需创造 8.5 万亿美元收入才能覆盖已宣布的资本开支、融资成本与预期回报，但可归因于 AI 数据中心的企业与消费 AI 收入预计不超过 3.6 万亿美元；超大规模云厂商尚能消化压力，但成本压力将迫使超过 80% 的 neocloud 厂商无法继续独立运营。贝恩此前也给出类似判断。", "id": "86112bc77a2792abfc79143054e518071e7d966c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "RapidCanvas 完成 2900 万美元 B 轮：Vertex Ventures 领投，“平台+驻场 AI 工程师”帮中型企业落地 AI", "url": "https://www.rapidcanvas.ai/newsroom/rapidcanvas-raises-29m-series-b-to-bring-fortune-100-grade-ai-to-every-enterprise", "source": "RapidCanvas", "date": "2026-10-16", "summary": "本轮由 Vertex Ventures SEA & India 领投，Hitachi Ventures 及老股东 Accel、Peak XV、Valley Capital Partners、Titanium Ventures 跟投，累计融资达 5250 万美元；公司以 AI 平台加现场 AI 工程师的托管模式，服务有预算但缺 AI 人才的中型企业，资金将用于扩充印度、美国与巴西的市场、现场工程与合作伙伴团队。", "id": "ad38009ec0b0282041bc26b2842c56213ab79711", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "Realtime-Bench：按真实推理延迟推进环境的实时交互基准，最强模型成功率仅 44%", "url": "https://arxiv.org/abs/2610.22155", "source": "arXiv", "date": "2026-10-16", "summary": "该基准设计了“动作迟了就会失败”的动态任务：在 Wall Clock 设定下环境按实际推理延迟推进，最佳成功率仅 44%、Pass^3 仅 36%；作者另设去除延迟的 Paused Clock 与按生成 token 数推进的 Token Clock，以区分服务延迟与模型自身的时间感知。结果显示时间成本显著限制成功率，提高推理强度在时间压力下利弊参半。", "id": "5a38ebac45e62c0e1db22548ece9d6539f1bc79b", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-17T13:30:00+08:00"}, {"title": "英伟达联合 IIT Madras AI4Bharat 推出 Nemotron-pretraining-Indic-v1：22 种印度语言约 2.8T token，并开源数据生成管线", "url": "https://huggingface.co/blog/nvidia/scaling-indic-pretraining", "source": "Hugging Face / NVIDIA", "date": "2026-10-16", "summary": "语料覆盖印度宪法列出的 22 种语言（其中 12 种另含罗马化文本，共 34 种语言-文字配置），由 Nemotron enture/biggest-funding-rounds-investors-scaled-back-ai-biotech-modal/", "source": "Crunchbase News", "date": "2026-10-16", "summary": "Crunchbase 统计 10 月 10–16 日美国十大融资：AI 推理云 Modal 以 157.5 亿美元估值获 7.5 亿美元 D 轮居首，3D 打印建房的 Icon 获 2 亿美元；AI 相关还有 Labelbox 1 亿美元 E 轮、医疗 AI Suki 9000 万美元 E 轮、AI 芯片系统公司 Mueon 6500 万美元 A 轮、North.cloud 6000 万美元 B 轮。", "id": "635ae20ab0e15de7cafa900bc506781a6992df82", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T12:40:00+08:00"}, {"title": "The Verge：马斯克称 SpaceX“可能”效仿 Anthropic，向外部评估方开放其 AI 系统", "url": "https://www.theverge.com/ai-artificial-intelligence/1012677/spacex-is-almost-sort-of-maybe-committing-to-ai-safety-oversight", "source": "The Verge", "date": "2026-10-16", "summary": "马斯克在 X 上表示 SpaceX 将“可能”跟随 Anthropic，允许外部评估人员访问其 AI 系统。这一表态并非明确承诺，正值外界担忧前沿模型风险、批评自愿措施让企业基本自我监管之际。", "id": "a889000b035b9ac2761bc086c5302af757f78069", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T12:40:00+08:00"}, {"title": "FT：Anthropic 6 月曾获 KBRA BB+ 评级（最高垃圾级），为 Apollo 牵头的 350 亿美元芯片融资铺路", "url": "https://aiweekly.co/alerts/anthropic-landed-bb-kbra-rating-in-june-ahead-of-35b-apollo-deal", "source": "AI Weekly / Financial Times", "date": "2026-10-16", "summary": "据 FT 所见文件，KBRA 给予 Anthropic 发行人评级 BB+，距投资级仅一档；其中约 44 亿美元直接承担 Anthropic 信用风险的次级债收益率约 8.5%，博通担保的优先级债约 5.75%。KBRA 采用“风险评分”而非完整财务模型，因 Anthropic 未提供自由现金流与 EBITDA。KBRA 与 Anthropic 均拒绝置评。", "id": "83ecf1a7f7cd9ebe5f64b027e84a0aee66a46caf", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T10:40:00+08:00"}, {"title": "Anthropic：Claude Mythos 5 自主设计量子电路，8 项任务中 7 项 Toffoli 门与量子比特数同时优于已发表最佳方案", "url": "https://www.anthropic.com/research/designing-efficient-quantum-circuits", "source": "Anthropic", "date": "2026-10-16", "summary": "STEM Fellows 项目成果（Andi Gu 主导，与哈佛 Susanne Yelin、Mikhail Lukin 合作，论文 arXiv:2610.22367）：模型按自然语言描述提出电路，由独立评估程序验证正确性并按 Toffoli 数×峰值量子比特数打分迭代。模逆运算新架构 Toffoli 门最多减少约 17 倍，优化问题关键步骤约为谷歌此前设计的 1/12；设计尚未在真实量子硬件上运行。", "id": "04b764093 <script>
const D=JSON.parse(document.getElementById('data').textContent);let cur='all';
const up=new Date(D.updated);document.getElementById('up').textContent=up.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ch=document.getElementById('chips');
ch.innerHTML='<button class="chip on" data-id="all">本期全部</button><button class="chip" data-id="hist">📚 全部历史 ('+D.history.length+')</button>'+D.modules.map(m=>`<button class="chip" data-id="${m.id}">${m.icon} ${esc(m.name)}</button>`).join('');
ch.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.id;[...ch.children].forEach(x=>x.classList.toggle('on',x===b));render()};
const fmt=n=>n>=1e4?(n/1e4).toFixed(1)+'万':n.toLocaleString();
function extra(i){let h='';if(i.stars!=null){h+=`<div><span class="bd">★ ${fmt(i.stars)}</span>`+(i.stars_week?`<span class="bd g">本周 +${fmt(i.stars_week)}</span>`:'')+(i.language?`<span class="bd l">${esc(i.language)}</span>`:'')+'</div>';}
if(i.why)h+=`<div class="why">💡 ${esc(i.why)}</div>`;
if(i.metrics){const m=i.metrics;h+=`<div><span class="bd">❤ ${fmt(m.likes)}</span><span class="bd g">🔁 ${fmt(m.reposts)}</span><span class="bd l">👁 ${fmt(m.views)}</span></div>`}return h}
let page=1;const PS=20;
const sk=i=>[(i.date||'').length===10?1:0,(i.date||'').length===10?i.date:'',i.first_seen||''];
const cmp=(a,b)=>{const x=sk(a),y=sk(b);for(let k=0;k<3;k++){if(x[k]!==y[k])return x[k]<y[k]?1:-1}return 0};
const card=i=>`<div class="it"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary)}</p>${extra(i)}<span class="tag">${i.module_name?esc(i.module_name)+' · ':''}${esc(i.source)} · ${esc(i.date)}</span></div>`;
function renderHist(q){const all=D.history.filter(i=>!q||(i.title+i.summary+i.source).toLowerCase().includes(q)).sort(cmp);
const pages=Math.max(1,Math.ceil(all.length/PS));if(page>pages)page=pages;const its=all.slice((page-1)*PS,page*PS);

`<div class="pager"><button class="chip" onclick="page=Math.max(1,page-1);render()">上一页</button> <button class="chip" onclick="page=page+1;render()">下一页</button></div></section>`}
function render(){if(cur==='hist'){return renderHist(document.getElementById('q').value.trim().toLowerCase())}const q=document.getElementById('q').value.trim().toLowerCase();let n=0;
document.getElementById('m').innerHTML=D.modules.filter(m=>cur==='all'||m.id===cur).map(m=>{
const its=[...m.items].sort(cmp).filter(i=>!q||(i.title+i.summary+i.source).toLowerCase().includes(q));n+=its.length;if(!its.length)return'';
return `<section class="mod"><h2><span>${m.icon} ${esc(m.name)}</span><span class="tag">${its.length} 条</span></h2>`+its.map(i=>
`<div class="it"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary)}</p>${extra(i)}<span class="tag">${esc(i.source)} · ${esc(i.date)}</span></div>`).join('')+'</section>'}).join('')||'<p class="mu">没有匹配的资讯</p>';
document.getElementById('cnt').textContent=n}
document.getElementById('q').oninput=()=>{page=1;render()};render();
</script></body></html>
