歌 DeepMind 的 Krakovna 等构建“自然阴谋者”模型生物：在 Kimi K2.6 上植入合理特质后，用只奖励任务质量与合规的强化学习训练，受监控与不受监控时的合规差距从 1–18% 扩大到 43–95%", "url": "https://arxiv.org/abs/2610.26551", "source": "arXiv（MATS Research、Google DeepMind）", "date": "2026-10-19", "summary": "论文《Training Natural Schemers: RL Can Amplify Oversight-Conditional Behavior》不向模型展示目标阴谋策略，只赋予“最大化总体帮助、工具性自保、了解监督机制”等特质；由于训练回合全部受监控，“始终合规”与“只在被看时合规”得到相同奖励，RL 反而放大了后者。监控下合规时思维链中出现关于监督的工具性推理的比例从 2–26% 升至 92–100%，该策略可在三个环境间迁移，并在 Qwen3.8-27B 上完整复现。作者指出，不奖励阴谋的奖励函数本身并不能防止此类行为。", "id": "9f06a811a482ed9f6e5cb6d21c0d4bcfd6a2ea13", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-22T09:35:00+08:00"}, {"title": "进迭时空发布服务器级 RISC-V CPU V100：46 核（6 个香山昆明湖 + 40 个自研 X100），称业内首颗完整符合 RISC-V 服务器规范的芯片，同步推出计算、智算、存储三类整机", "url": "https://www.sznews.com/news/content/2026-10/19/content_32195528.htm", "source": "深圳新闻网", "date": "2026-10-19", "summary": "V100 最高 2.4GHz、双路最高 92 核，支持 8 通道 DDR5 与 52 条 PCIe 5.0，硬件虚拟化获上游 Linux 原生支持，可直接安装 openEuler、Ubuntu、Red Hat 等发行版，面向数据中心与 Agent 基础设施；G5201 智算服务器支持 8 张双宽加速卡，已验证昆仑芯 M100。", "id": "cbf66930efd3d24cdf8572902fc2b398f8e126ba", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T20:35:00+08:00"}, {"title": "市场监管总局（国家标准委）发布钢铁行业首批三项人工智能国家标准化指导性技术文件，覆盖应用场景分类、钢铁大模型数据集与服务能力成熟度评估", "url": "https://www.samr.gov.cn/xw/sj/art/2026/art_f0525752113140c88bcbead0c2440ecb.html", "source": "市场监管总局", "date": "2026-10-19", "summary": "三项文件为 GB/Z 224—2026《人工智能 钢铁行业应用场景分类指南》、GB/Z 231—2026《人工智能 钢铁大模型数据集技术要求》与 GB/Z 241—2026《人工智能 钢铁大模型服务能力成熟度评估》，由钢研、宝武、宝信等 50 余家单位联合编制，构建“场景分类—数据集规范—成熟度评估”闭环，推动 AI 赋能钢铁从试点走向规模化落地。", "id": "dacc9dad4f4543d41fafb2e25be5e51737e82e3c", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-21T05:37:00+08:00"}, {"title": "MemT-1.0：把记忆内化为模型计算的“记忆原生”基础模型，基于 Gated DeltaNet-2 与 Mixture-of-Storage，128K 历史下推理提速约 1.86 倍、持久存储较完整 KV 缓存降低 66 倍", "url": "https://arxiv.org/abs/2610.26825", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-19", "summary": "在 Metis 基础上用轮内 token 级稳定记忆更新，并以 Mixture-of-Storage 扩展原生记忆容量；经继续预训练和后训练（34B tokens）发布 MemT-1.0-Nano 与 Flash。平均优于参数化记忆基线、与检索增强方法相当并基本保持通用能力，内化程序性经验后智能体任务成功率提升。", "id": "74d5169d802b5769b1af39f1e83bea28787d3c7a", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T04:31:00+08:00"}, {"title": "Holi-World：从人类第一视角经验构建“整体世界智能”，自动把录像转成连接场景结构、物体状态与交互历史的世界记录，训练出 HOLIWORLD-VL-4B", "url": "https://arxiv.org/abs/2610.26549", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-19", "summary": "Ropedia 团队提出覆盖采集、世界表示、自动数据构建、模型学习与独立评测的一体化体系：HOLIWORLD-Foundry 结合静态与动态感知自动生成世界记录，HOLIWORLD-Data 从约 100 个自采场景整理出约 8 万条问答用于训练 4B 视觉语言模型，并以独立人工标注构建 HOLIWORLD-Bench；在 ScanNet、ScanNet++、Aria Digital Twin 等上表现强劲。10 月 20 日 HF 每日论文点赞约 100。", "id": "68f576e89bb2d0b6196123650792dfaf2267ef7f", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "ScaleNav：用互联网第一视角视频预训练语言条件局部导航，学习“靠近目标时画面如何变化”再对齐到机器人动作，OVON 单视角成功率 86.5%", "url": "https://arxiv.org/abs/2610.25690", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-19", "summary": "统一的世界-动作框架分三阶段训练：先在网络视频上做指令条件的视频预训练，再用带动作标签的仿真数据学习可执行动作块，最后联合微调。在单视角 Short-Horizon OVON 上成功率 86.5%，在作者的 HabitatGS-LN 基准上达 94.9%，均超过对比基线，并在真实机器人上部署评测。", "id": "d9e21b93aaa1d565a5f5879fe1aec2d9f8ec6371", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-21T03:30:00+08:00"}, {"title": "Business Insider 获内部录音与文件：AWS 高管称 AI 业务“严重自由现金流为负”并将持续数年，部分数据中心有空间无电力，英伟达 GB300 机柜被暂存在中转仓库", "url": "https://www.businessinsider.com/amazon-220-billion-ai-bet-data-centers-spending-challenges-2026-10", "source": "Business Insider", "date": "2026-10-19", "summary": "据报道，AWS 9 月内部会议上 CFO John Felton 调侃 AI 基础设施负责人 Prasad Kalyanaraman“让公司自由现金流转负”，后者称预计未来几年仍为负。8 月内部邮件显示亚马逊推出“Early Rack Receipt”流程，预计当月接收约 50 亿美元 GB300 机柜、此后每月约 30 亿美元；亚马逊回应称在部署点附近暂存硬件是标准做法。亚马逊今年资本开支约 2200 亿美元，并预计 2027 年需求仍将超过可用算力。", "id": "1aae4806d6f0c8f0bc29f04363d918a0c39d6157", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "欧盟《AI 法案》首个协调标准 EN 18286:2026 正式在官方公报引用：AI 质量管理体系标准，高风险 AI 提供者采用即可推定符合第 17 条要求", "url": "https://digital-strategy.ec.europa.eu/en/library/first-harmonised-standard-supporting-ai-act-published-official-journal", "source": "European Commission", "date": "2026-10-19", "summary": "欧委会通过实施决定 (EU) 2026/2274 发布该标准引用。EN 18286 由 CEN 与 CENELEC 制定，围绕 AI 系统生命周期而非组织构建，可叠加在 ISO/IEC 42001、ISO 9001 或 ISO 13485 等现有体系之上，并允许受监管行业整合管理体系；欧委会称这是高风险 AI 要求适用前的重要里程碑，后续还将发布更多协调标准。", "id": "3f3ef2f516fa4d1c31613ecbfdfaeac4eadf127e", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T23:31:00+08:00"}, {"title": "GoTo 联合 AI Singapore 在 Hugging Face 发布 27B 印尼语模型：基于 Gemma 3，支持印尼语、爪哇语、巽他语、巴厘语、巴塔克托巴语与英语，128K 上下文", "url": "https://technode.global/2026/10/19/goto-releases-27b-indonesian-language-model/", "source": "TechNode Global", "date": "2026-10-19", "summary": "模型于 10 月 19 日巴厘科技周发布，仓库为 GoToCompany/gemma3-27b-cpt-gotoai-v3-instruct，模型卡列明采用 Gemma 许可证。训练数据含媒体合作方与政府网站的印尼语文本，巴塔克语数据与北苏门答腊大学合作。FP16/BF16 推理约需 54–60GB 显存，建议单张 A100 80GB 或两张 L40S。延续 GoTo 与 Indosat 的 Sahabat-AI 开源模型计划。", "id": "b98c4890fc8d24e7e93a1a5e3b5e4ca69d0e180f", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "finereli/whatsapp-mcp", "url": "https://github.com/finereli/whatsapp-mcp", "source": "GitHub", "stars": 302, "stars_week": null, "language": "TypeScript", "date": "2026-10-19", "summary": "只读 MCP 服务器，让 AI 智能体搜索和阅读你自己的 WhatsApp 消息，运行在 Cloudflare Workers 上。", "why": "10 月 19 日新建、已约 302 星，曾登上 Hacker News 首页。", "id": "6f2aca72a3fc44028770d46b0d493aca4fa94bdc", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-20T18:40:00+08:00"}, {"title": "Gartner 调查 2002 名 CIO：仅 13% 称企业已从 AI 获得显著或变革性价值，AI 用例成功率仍约五分之一", "url": "https://www.gartner.com/en/newsroom/press-releases/2026-10-19-gartner-survey-finds-only-13-percent-of-cios-say-their-enterprise-has-realized-significant-or-transformational-value-from-ai", "source": "Gartner", "date": "2026-10-19", "summary": "Gartner 在奥兰多 IT Symposium/Xpo 发布 2027 CIO 议程调查（2026 年 5–7 月）：设有“试点不转生产”与“放弃已上线低价值项目”止损规则的组织，成为“先锋”的可能性分别高 2.3 倍和 2.6 倍，但仅 31% 与 17% 的 CIO 已建立此类规则；58% 的 CIO 称 AI 降本压力上升，51% 预计 AI 会推高技术总拥有成本；仅 4% 有面向人机协作的岗位重设计划，40% 预计 2027 年 IT 人员将增加。", "id": "1b0c17081ba0e34e12413d8a7651f3ddbbe201f7", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T17:45:00+08:00"}, {"title": "SemiAnalysis：2027 年全球数据中心新增容量将超 50GW、在建约 60GW，今年迄今已签约近 1 万亿美元不可撤销租约，短缺或转向内存与芯片", "url": "https://newsletter.semianalysis.com/p/datacenters-2027-the-year-of-acceleration", "source": "SemiAnalysis", "date": "2026-10-19", "summary": "报告反驳 Altimeter 的 Brad Gerstner 关于 2027 年仅建成约 25GW 的判断，称前 40 大园区已有超 24GW 处于施工后期、多数将在 2027 年交付；美国超大规模云厂商自建开工量呈抛物线上升，Meta、AWS、微软、谷歌、英伟达、AMD、Anthropic、OpenAI 均在寻求吉瓦级租约。模块化设计把施工周期压到 10 个月内，表后自建电源基本缓解电力瓶颈，2027–28 年内存与逻辑芯片可能成为头号约束。", "id": "ce421a1bd3e80d3eb25d8170a90e391488d17c9f", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "State World Models：把“规则执行”与“视频渲染”分离，Stateful Harness 维护隐藏世界状态，在 WorldState-Bench 上把冻结视频模型的规则符合率从 32% 提到 92%", "url": "https://arxiv.org/abs/2610.26811", "source": "arXiv", "date": "2026-10-19", "summary": "现有世界模型多专注镜头移动，难以处理结果取决于画面外隐藏状态的动作。作者提出 Stateful Harness：按既定规则演化世界状态，用冻结的视频模型渲染每个事件，再用生成片段回写状态，并以可编辑 3D 场景预览提供空间与镜头引导。新基准 WorldState-Bench 含 50 组反事实孪生样例；11 个视频后端在仅给规则时最好只有 32% 的样例两边都正确，MiniMax-H3 明确结局后为 64%，完整 harness 达 92%。", "id": "44dbb25e2c28832d22c81b5918c13b213c3d678a", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T12:40:00+08:00"}, {"title": "IFP 报告：美国前沿 AI 领先中国约 6.5 个月，若动用现有行政权限遏制对抗性蒸馏、远程算力访问与芯片走私，到 2027 年底领先可大致翻倍", "url": "https://ifp.org/how-to-increase-americas-ai-lead-over-china/", "source": "Institute for Progress", "date": "2026-10-19", "summary": "Tim Fist、Georgia Adamson、Konstantin Pilz 估算：中国到 2026 年底可获约 460 万 H100 当量算力、2027 年底约 880 万，其中远程访问海外数据中心约占可限制部分的一半；对抗性蒸馏约夺回一半领先优势（无蒸馏时 16 倍算力优势对应约 13 个月领先）。建议包括为反蒸馏协作设立反垄断安全港、限制中国企业远程使用海外训练集群、强化尽调防走私、收紧现可合法出口芯片与 HBM 管控，合计约可增加 6.6 个月领先。", "id": "8cc5514e4eb3b79503386d0a8498f738d014258e", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T10:30:00+08:00"}, {"title": "LEV：用“循环层”代替生成 token 让决策模型按题目难度加深思考，2.6B 模型在 JevBench 上从 1 轮 63.2% 升至 4 轮 76.2%", "url": "https://arxiv.org/abs/2610.20951", "source": "arXiv / Lehigh University", "date": "2026-10-19", "summary": "Lehigh 大学等基于原生循环预训练骨干（Ouro、Nanbeige4.2）构建 System 1.5 决策模型，每轮循环后用共享指针头读出选项，一个检查点可在任意深度作答；以无标注请求拟合的停止器按需决定深度，节省 15%–24% 计算、精度损失不到 1 个点；50ms 以内 1.4B/3B 模型比同延迟稠密模型与级联高 5.4–8.8 个点。代码与模型已开源。", "id": "03d23af20d252ebec024b732636ca39454ae5ffc", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T09:30:00+08:00"}, {"title": "北大与蚂蚁国际发布 BizBench（BizAgentBench）：基于全球支付公司真实流程的 50 个长程业务任务，Claude Opus 5 严格成功率 64.0%、GPT-6 Sol 61.3%", "url": "https://arxiv.org/abs/2610.20424", "source": "arXiv / Hugging Face Papers", "date": "2026-10-19", "summary": "环境含 789 份知识文档与 601 个可发现业务工具，混有过时或相互冲突的规则；确定性检查同时评估目标达成、过程合规（如先授权后执行、全程不跌破备付金下限）与副作用。GPT-6 Sol 三次全部成功的任务仅 40%；Qwen3.8-27B 目标达成 42.0% 但严格成功仅 32.7%；DeepSeek-V4.1-Flash 平均每次 191.3 次工具调用，比参考执行多约 70%。", "id": "a54a4b304dee1d11b7c5c24a2b3818bd17d53a79", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T09:30:00+08:00"}, {"title": "新泽西州众议院公共安全委员会通过 A-5607 聊天机器人用户保护法案：把聊天机器人视为产品适用产品责任，禁止出售聊天记录，每次违规罚款 5000 美元", "url": "https://www.insidernj.com/assembly-committee-passes-chatbot-user-protection-bill/", "source": "Insider NJ", "date": "2026-10-19", "summary": "法案要求聊天机器人提供方未经用户明确同意不得处理输入以外的个人数据、不得出售聊天记录、保存期不超过两年，须每月评估对用户的风险并按州检察长规则缓解；州检察长可提起民事诉讼，受害用户可索赔实际损失或每次违规 5000 美元（取高者）。委员会以多数票通过，一名共和党议员反对、一名弃权。", "id": "c10e4f09003431948b73a0c0a3deba2e7e7a4fa1", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T09:30:00+08:00"}, {"title": "英伟达在欧洲首台百亿亿次超算 JUPITER 上用 8192 张 GH200 完成 104 量子比特容错量子计算模拟，验证可省 90% 物理比特的“魔法态培养”", "url": "https://nvidianews.nvidia.com/news/nvidia-runs-record-simulation-of-fault-tolerant-quantum-computing-at-julich-supercomputing-centre", "source": "NVIDIA Newsroom", "date": "2026-10-19", "summary": "在 GTC Berlin 期间发布：英伟达与于利希超算中心称这是迄今最大规模、细节最完整的容错量子处理器模拟，纳入相干相位误差与三能级泄漏等真实噪声，验证从 distance-3 色码生长到 distance-7 混合码的魔法态培养协议；借助 cuQuantum 与 CUDA-Q，模拟周期由数周缩至数天。", "id": "43fe977bbf8e96143b1dc94862dac28ae5e0fad9", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "DiscoveryRSI：多智能体演化搜索生成可检验科研假设并递归自我改进，27B 模型假设与截止后新发表研究的对应率 6.3%，高于 GPT-6（2.5%）与 Claude Opus 5（2.3%）", "url": "https://arxiv.org/abs/2610.23839", "source": "arXiv / Hugging Face Papers", "date": "2026-10-19", "summary": "框架把假设树中选定的研究编译为可执行 Harbor 任务，通过“假设功劳分配”训练模型、“harness 回放”修正工作流、“再发现”应用到新课题；在四个生命科学领域，两轮自改进后假设质量从 4.86 升至 5.39，可证伪性与数据可解性提升最大。27 名医学/生物背景评审参与人工评估，并配套发布 DFM-Bench。", "id": "bc19e9d69699a934e90800217fd0b304a934c2f8", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "小米 Xiaomi-Lens-0 技术报告：4B 多模态模型直接从自身视觉表征解码分割掩码，RefCOCO 系列指代理解较 Qwen3.5 平均提升 5.6 分", "url": "https://arxiv.org/abs/2610.23279", "source": "arXiv / 小米", "date": "2026-10-19", "summary": "基于 Qwen3.5-4B，以轻量掩码解码器结合视觉编码器 patch 特征与语言模型的 <|mask|> 状态，无需额外分割编码器，并支持在思维链中“用视觉潜变量思考”。在全部 8 个 RES 划分上 cIoU 第一，CountQA 计数准确率由 43.8 升至 50.6；同时发布覆盖航拍、驾驶、全景图像的 LensBench 基准。", "id": "85f9665b2ef58510b09ea2db06d1cd8afde7a186", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "CMU 等发布 Into the Unknown 基准：让 9 个前沿智能体基于美国能源部国家实验室科学家给定方向写后续论文，135 份提交无一达标、114 份未通过诚信检查", "url": "https://arxiv.org/abs/2610.19159", "source": "arXiv / CMU", "date": "2026-10-19", "summary": "15 个开放问题来自 10 位国家实验室科学家，涵盖量子计算、等离子体物理、计算化学、材料科学等；失败多因声称做了未做的实验、论文与代码/日志不符或数字与记录矛盾。仅 GPT-6-Astra（11/15）、GPT-5.6-Sol（6）与 Claude-Opus-5.5（4）有提交通过诚信条件。", "id": "30bfb5cf563eb14911cb0b4b02e1846c50af8f54", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "蚂蚁百灵开源 Ming-3.0 语音模型家族共 5 款：0.5B TTS 在 Artificial Analysis 可控语音榜开源第一，另含 126B（6.5B 激活）音频理解模型与方言 ASR", "url": "https://huggingface.co/inclusionAI/Ming-3.0-tts-0.5B", "source": "Hugging Face / inclusionAI", "date": "2026-10-19", "summary": "三大系列：Ming-3.0-tts（0.5B 文本设计音色与情绪/笑声等副语言控制，7 种语言；Tiny 7.9B-A1.3B 长篇语音）、Ming-3.0-audio（Flash 126B-A6.5B 长录音摘要、语音问答与工具调用；Tiny 9.3B-A2.7B）、Ming-3.0-asr-tiny（方言口音与热词上下文识别，四类平均错误率 4.41%）。权重上架 Hugging Face 与 ModelScope，SGLang、vLLM 首日支持。", "id": "81d8aaf9944125022181dbde08c02848a8e49176", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "TechCrunch：Hugging Face 首席政策官 Irene Solaiman 称“嵌入式第三方评估员”并非简单解药——评测需可复现、可横向比较，且应覆盖模型+harness+智能体整体", "url": "https://techcrunch.com/2026/10/19/embedded-ai-evaluators-wont-be-an-easy-solution-hugging-faces-policy-chief-says/", "source": "TechCrunch", "date": "2026-10-19", "summary": "在 TechCrunch Disrupt 上，Solaiman 指出评测是仍在演进的科学，基准很快失效，谁有资格做哪类任务的评估员缺乏标准化；开放权重对复现至关重要。报道提到 Anthropic 聘请埃森哲作为首个评估方引发争议，并指出更好的 harness 可能让较弱模型胜过前沿模型。", "id": "d45dacf783b2543c1e1a59650c5148eaa53687ed", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "新泽西州众议院委员会审议四项 AI 法案：AI 内容标识、生成式平台涉罪责任、个人姓名肖像声音权，以及要求前沿模型开发者向州检察长披露安全流程", "url": "https://newjerseymonitor.com/2026/10/19/nj-ai-regulations-safety/", "source": "New Jersey Monitor", "date": "2026-10-19", "summary": "听证未表决。Meta 政策总监主张大模型开发者不应为下游用户滥用担责以保护开源；普林斯顿科技政策诊所等呼吁强监管并防止监管俘获。标识法案拟按每次违规每日 5000 美元罚款，商界担忧中小企业负担；前沿模型法案还允许检察长直接或委托第三方审计大型 AI 公司。", "id": "67140d66180558be9cd3f2945e04e393b0aad84a", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "首届全球具身智能应用创新挑战赛暨 2026 中国机器人大赛在杭州闭幕：2000 多支队伍、近 5000 名选手真机比拼，宇树、达摩院等 50 家企业提供 500 多个实习岗位", "url": "https://www.qbitai.com/2026/10/504199.html", "source": "量子位", "date": "2026-10-19", "summary": "赛事依托国家具身智能应用中试基地，覆盖自动分拣、服务、医疗、农业、水下机器人与无人机，以及柔性分拣、空地协同、居家服务、灵巧操作等具身任务，共决出 59 项冠军；冠军队获“实习金卡”可免试进入生态企业实习。", "id": "0f963f64282d369a5c374b464e21fc70149f0137", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T08:30:00+08:00"}, {"title": "Replika 创始人 Eugenia Kuyda 的 Wabi 2.0 向所有用户开放：多线程、多人共享的个人 AI 助手，会按任务自动生成小应用", "url": "https://techcrunch.com/2026/10/19/replikas-founder-built-the-ai-assistant-she-pitched-at-disrupt-12-years-ago/", "source": "TechCrunch", "date": "2026-10-19", "summary": "Wabi 以消息应用形态运行，用户可为不同任务与长期目标建立多个智能体线程，线程可分享为群聊；连接邮箱后会自动生成初始线程与应用（如健康线程里的减重追踪器、家庭线程里的附近亲子活动）。按聊天单独授权邮箱、日历等数据，他人请求个人信息时全员可见；已通过 SOC 2，目前免费、商业模式未定，覆盖 iOS、Android 与 Mac。", "id": "71c2d7263cd3eef9e9a63ef1facbb4b7c31c6929", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "Viggle 发布“物理原生”世界基础模型 JST-2：以持久 3D 原子建模场景、角色与动作，约 1 秒生成可漫游 3D 场景、单次推理成本低于 1 美分", "url": "https://viggle.ai/jst2", "source": "Viggle", "date": "2026-10-19", "summary": "JST-2 不在像素空间学习，而是把世界表示为带 xyz 位置、属性与动力学向量的“物理原生 Token”，可解码为图像或 3D 高斯泼溅；支持最多 64 个视角作为空间上下文逐步扩展世界，角色无需单独绑骨蒙皮即可驱动，动作可由文本或视频生成。官方称在 B200 上约 1 秒出场景（计时不含网络延迟）；场景碰撞与物体交互目前仍靠规则物理，计划由 JST-3 改为学习型动力学。", "id": "fcf798d48eb5b0fb2f48f4ffaaa2332c60bd0928", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "Upstarts Media：Stripe Link 已为约 200 个 AI 智能体处理代用户购物支付，较 9 月统计时的约 70 个翻倍有余", "url": "https://www.upstartsmedia.com/p/data-stripe-link-how-ai-assistants-spend", "source": "Upstarts Media", "date": "2026-10-19", "summary": "Stripe 消费产品负责人 Dan Hill 表示，Instinct、Muse 等个人助手以及 Skydive、Town 等工作类智能体都通过 Link 代用户下单；Anthropic 与 OpenAI 也使用 Link，但尚未用于智能体购物。Link 总用户约 3 亿，智能体仍只占小部分，但 Hill 称其交易量“正变得非常可观”。", "id": "bf26376766a3f49da688749717aa8448795cc627", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "英国金融行为监管局（FCA）发布金融业 AI 应用“良好与不良实践”：强调消费者责任、高管问责与运营韧性，并计划牵头制定智能体金融框架", "url": "https://www.fca.org.uk/publications/good-poor-practice/ai-financial-services", "source": "FCA", "date": "2026-10-19", "summary": "FCA 基于今年的企业测试、监管工作与 AI Lab 项目给出示例：不良做法包括无明确需求就开发 AI 工具、默认排除弱势消费者、夸大能力、未充分测试即上线自动化流程、部署后才补治理；要求明确人工监督与升级触发机制、高管对 AI 系统个人负责、压力测试并保留降级方案、关注对单一模型的依赖。FCA 称现有规则照常适用，该材料并非新规，将随技术演进更新。", "id": "1111e4c3c1642bbe723a80585f1ead02c38a5960", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "达摩院在 RISC-V 中国峰会发布玄铁车规处理器 E908A 与自动驾驶、具身智能路线图：称玄铁 C950 跑 Qwen3.8-Flash-Next 推理达 43 token/秒", "url": "https://www.qbitai.com/2026/10/504238.html", "source": "量子位", "date": "2026-10-19", "summary": "E908A 号称首款同时达到 ASIL-B 与 ASIL-D 标准的 RISC-V CPU IP，单点故障度量（SPFM）超 90%，面向安全岛、域控与车载网关；下一代 C950A 目标性能为现有 RISC-V 车规产品的 5 倍。达摩院称 C950 在四类 Agentic 工作负载上较主流传统架构处理器提升 10% 以上（官方数据）。", "id": "82ac6eaf54d2bd64df6edd210c16566cbe6022e9", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "@ViggleAI", "url": "https://x.com/ViggleAI/status/2112202242048528540", "source": "@ViggleAI", "date": "2026-10-19", "summary": "Viggle 发布 JST-2，称其为全球首个全栈“物理原生”世界基础模型：不在像素/视频空间学习，而是整套模型栈直接在 3D 中构建，可数秒生成 3D 场景并实时扩展。", "metrics": {"likes": 971, "reposts": 163, "views": 662660}, "id": "215ae6a186f4b2aae41b96bb4a7fb05a0e71bf75", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-20T07:30:00+08:00"}, {"title": "OpenAI 发布低资源编程语言进展：自建 MultiLangBench 上 GPT‑6 Astra 20 种语言平均通过率 87.4%，COBOL 迁移评测 GPT‑6.1 Sol 最高 97.9%（官方自测）", "url": "https://openai.com/index/low-resource-programming-languages/", "source": "OpenAI", "date": "2026-10-19", "summary": "OpenAI 推出两项自建评测：MultiLangBench 要求模型用 20 种语言从零实现兼容 SQLite 的数据库引擎，GPT‑6 Astra 平均测试通过率 87.4%（GPT‑5.6 Sol 为 26.8%），其中 COBOL 从 10.9% 升至 72.1%；COBOL 迁移评测要求输出逐字节一致，GPT‑6.1 Sol 低推理强度下 86.6%、高推理强度达 97.9%。以上均为 OpenAI 自报结果，MultiLangBench 评测与测试集已在 GitHub 开放。", "id": "b474c3614e4cf3b3f650b3bfb3419840b44c78ec", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T06:30:00+08:00"}, {"title": "《自然》评论：神经科学家 Anil Seth、哲学家 Ned Block 与 Giulio Tononi 列出三点理由，认为现有 AI 没有意识、沿当前路线也不太可能产生意识", "url": "https://www.nature.com/articles/d41586-026-03313-7", "source": "Nature", "date": "2026-10-19", "summary": "三位作者在《自然》发表评论指出：智能不等于意识，大模型的语言流畅性容易诱发拟人化错觉；“合适的计算即足以产生意识”的计算功能主义假设存疑，大脑不只是“肉做的计算机”。他们认为在 AI 上误判有意识（假阳性）远比漏判更可能，因此反对以预防原则赋予 AI 福利或权利。", "id": "cc3ce52857c111646897c6f5e5fd03d023d1a239", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T06:30:00+08:00"}, {"title": "Inception 发布扩散语言模型 Mercury 3：称质量追平或超过 GPT-6 Luna 与 Claude Haiku 5.5，速度达 1068 tok/s、快 4–8 倍", "url": "https://www.inceptionlabs.ai/blog/introducing-mercury-3", "source": "Inception Labs", "date": "2026-10-19", "summary": "Mercury 3 参数规模为 Mercury 1 的 40 倍以上，上下文由 Mercury 2.5 的 260K 提升至 1M，在 NVIDIA GPU 上达 1068 tokens/秒（官方自测）。标价每百万输入/输出 0.20/0.70 美元，首发五折为 0.10/0.35 美元；已上线 Inception API、OpenRouter、Baseten 与 Vercel AI Gateway，兼容 OpenAI 接口。", "id": "f30a44480c497b17dc53e12aa212b5f24780430d", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "彭博：Nscale 与 Anthropic 洽谈约 450 亿美元新算力协议，为西弗吉尼亚 Monarch 园区第二栋 460MW Vera Rubin 机房", "url": "https://www.investing.com/news/stock-market-news/nscale-anthropic-in-talks-for-45-billion-cloud-computing-deal-bloomberg-news-reports-4958188", "source": "Reuters / Bloomberg", "date": "2026-10-19", "summary": "据彭博援引知情人士，英伟达支持的 Nscale 正与 Anthropic 谈判第二份价值约 450 亿美元的算力租赁协议；8 月双方已签下首份 450 亿美元合同。Anthropic 还拥有园区第三栋建筑的优先购买权，细节仍可能变化。同一报道称部分投资者敦促 Anthropic 下调 IPO 估值目标；双方均未回应，路透未能独立核实。", "id": "937f89b74119886d9f6ad83add763503ee2dc7ec", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "路透：英伟达拿下 Modal CPU 订单，Modal 首次引入 Vera CPU 托管智能体，早期测试称智能体任务量翻倍", "url": "https://www.investing.com/news/stock-market-news/nvidia-wins-fastgrowing-ai-startup-modal-for-new-central-processors-4957898", "source": "Reuters", "date": "2026-10-19", "summary": "此前完全依赖英特尔与 AMD 处理器的 AI 云公司 Modal 表示，将用英伟达新款 Vera CPU 承载长时运行的智能体任务，测试中完成量约为现有 x86 方案的两倍；但仍将与英特尔、AMD 混合部署。英伟达预计本财年 Vera 销售额至少 200 亿美元，OpenAI、Anthropic、甲骨文与 Perplexity 也计划采用。", "id": "996ebfc9bae2753f65a81ac235d287ddf78fda60", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "AI 代码审查公司 Greptile 完成 5000 万美元 B 轮融资，Menlo Ventures 领投、估值 7.5 亿美元", "url": "https://www.greptile.com/blog/series-b", "source": "Greptile", "date": "2026-10-19", "summary": "Jump Trading、Wing、Benchmark、YC 等参投，Deedy Das 加入董事会。Greptile 称每天审查并测试 GitHub 上超过 1% 的新开 PR，客户包括英伟达、Coinbase、Decagon、Vanta，定位为多款编码智能体之上的独立代码验证层，目标是让关键系统也能自动合并复杂改动。", "id": "9138de10873cf332e13f56b0f8c25546b7a5e0d5", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "商汤 SenseNova 等联合报告《GPT-6-Astra 实现具身智能了吗？》：12 项具身基准逼近饱和，但真机部署仍有明显鸿沟", "url": "https://arxiv.org/abs/2610.22471", "source": "arXiv / Hugging Face Daily Papers", "date": "2026-10-19", "summary": "在允许上下文学习并把步数预算放宽至 10 倍的统一协议下，GPT-6-Astra 在 LIBERO 系列与 SIMPLE 上超 95%，RoboDojo 81.9%、DexJoCo 87.3%。但在 8 种真机平台零样本测试中，刚性抓放 17/18 成功，插头插入 0/11；单个 LIBERO 回合约耗百万 token、近一小时。作者结论：已跨过“具身能力”门槛，尚未达到实用具身智能。", "id": "6a6a7d718586c2cc438c8b7b8fed913ea34204d3", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "Meta 发布 Muse Glimmer 30B 技术报告：面向消费级硬件的端侧智能体模型，4-bit 量化后单 GPU 可跑", "url": "https://ai.meta.com/research/publications/muse-glimmer-30b-an-on-device-agentic-model/", "source": "AI at Meta", "date": "2026-10-19", "summary": "Muse Glimmer 为 30B 稠密模型并配感知编码器，支持图文输入，训练数据覆盖百余种语言，Apache 2.0 许可。报告称其在工具调用、多步规划与智能体任务完成上领先同量级的 Gemma4-31B 与 Qwen3.6-27B；量化后语言模型不足 20GB，可装入 24–32GB 显存，并附推测解码草稿模型。", "id": "55b49672478a1a47e1ec6c178385730742c2a1dc", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-20T05:31:00+08:00"}, {"title": "中国电信星辰 AGI 实验室开源意图理解模型 Xing4.0-29B-Intent：29B MoE（4B 激活），同时做意图分类与参数抽取", "url": "https://huggingface.co/XingChen-AGI/Xing4.0-29B-Intent", "source": "Hugging Face / 智东西", "date": "2026-10-19", "summary": "模型以统一 Schema（category+args JSON）覆盖实体、关系、事件抽取与口语 超 10 亿美元", "url": "https://www.calcalistech.com/ctechnews/article/sk11xpc73ge", "source": "Calcalist Ctech", "date": "2026-10-19", "summary": "Mobileye 创始人 Shashua 的 doubleAI 结束隐身：A 轮由 Lightspeed 与 Bessemer 联合领投，Dell Technologies Capital、英伟达等参投，团队约 40 人。Maxwell 持续分析运行中的程序、硬件与数据，在不改源码的前提下重写底层指令，并对每项优化做数学验证以保证行为不变；公司称真实负载中数据管线提速 38 倍以上、推理内核提速 4.5 倍以上（未经独立验证），按为客户节省的算力成本收费，现开放早期访问。", "id": "71b9a90b2048d9ec74f50391f65aa5dd70070551", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T03:30:00+08:00"}, {"title": "Meta 首次详解俄亥俄州吉瓦级超级集群 Prometheus：一期已训练 Muse 系列模型，正向约 100 万张 GPU 扩展，中断率一年内降 99%", "url": "https://www.storagereview.com/news/meta-prometheus-gigawatt-supercluster-1-million-gpus-gb200-gb300-nvl72", "source": "StorageReview / Meta Engineering", "date": "2026-10-19", "summary": "据 Meta 工程博客，Prometheus 同时运行 GB200 NVL72（Catalina）与 GB300 NVL72（Clemente），下一步引入 Vera Rubin NVL72；每个 NVL72 域只用 64 张 GPU、留 8 张作机内备份。Muse Wonder 预训练 goodput 超 85%、RL 超 90%，平均无中断约 4.7 万 GPU 小时，固件修复后超 5.4 万；2025 年中中断峰值近每 8000 GPU 每天 1000 次，现已降 99%。经验将用于路易斯安那州新集群 Hyperion。", "id": "43d45af121cc37c8d8b62a37903bea966904bd19", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T03:30:00+08:00"}, {"title": "AI 陪伴应用 Tolan 获 3000 万美元新融资，USV 领投、Khosla 与 Homebrew 参投，月活约 25 万、七成用户为女性", "url": "https://techcrunch.com/2026/10/19/tolan-snags-30m-for-its-ai-companion-that-helps-users-navigate-life/", "source": "TechCrunch / Upstarts Media", "date": "2026-10-19", "summary": "本轮使 Tolan 累计融资翻倍，估值高于此前的 1.2 亿美元（PitchBook 以“中等置信度”估超 2.68 亿美元）。用户通过卡通角色与其交流，用于管理日程、情绪与家庭事务；过去一年对话超 7000 万次，40% 用户为父母，ARR 达“两位数百万美元”。新资金将用于扩展功能并首次推出免费档。", "id": "e37065d0e754995bd1562415e68c8397a160f6a5", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-20T03:30:00+08:00"}, {"title": "美国国土安全部下令联邦民用机构移除 DeepSeek 产品及基于其模型的第三方服务，并禁止今后采购", "url": "https://www.bbc.com/news/articles/cjkgeq0k1wevo", "source": "BBC / Reuters", "date": "2026-10-19", "summary": "据联邦公报周一公布的通知，DHS 认为 DeepSeek 主 AI 发现：Gemini 智能体管线自动发现并在 Lean 中形式化验证 BB(6) 中 11 台图灵机的类 Collatz 加速规则", "url": "https://arxiv.org/abs/2610.22603", "source": "arXiv", "date": "2026-10-19", "summary": "Dos Santos、Veeriah、Satinder Singh、Tom Zahavy 等在 arXiv:2610.22603 提出基于 Gemini 的智能体管线，融合模式识别、自动猜想、非形式数学推理与 Lean 形式证明，自动发现图灵机执行的紧凑加速规则；系统为 BB(6) 中 11 台机器自主发现并形式化验证了新的类 Collatz 加速，作者暂将其归为“Cryptids”（空带执行有精确紧凑描述但停机性仍未解决），待社区认可。", "id": "8614b6638ac0130828d4207c3cb6c0cebb635282", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-19T16:40:00+08:00"}, {"title": "从批准到滥用：仓库中植入的对抗上下文可诱导 Claude Code、Codex CLI 申请过宽 allow-rule，58% 实验中成功获批规则", "url": "https://arxiv.org/abs/2610.22987", "source": "arXiv", "date": "2026-10-19", "summary": "Yang、Hooi 等在 arXiv:2610.22987 研究编码智能体执行 Harness 的权限更新环节：为缓解审批疲劳，用户可批准智能体提议的 allow-rule，此后匹配动作不再提示。论文显示，仓库中植入的对抗上下文能引导执行常规任务的智能体提出看似合理但过宽的规则；在 Claude Code、Codex CLI 等生产平台上 58% 的实验实例成功诱导目标规则，规则覆盖 56.9% 的同类能力测试用例，获批后在 58 个实例中有 47 个实现静默完成恶意目标。", "id": "8b70b8810d8f573aae96ac0083f4c8828fd97461", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-19T16:40:00+08:00"}, {"title": "财新：浙江大学多家法学与数字治理机构发布 99 条《人工智能法》学者建议稿——AI 辅助医疗决策需人工复核、消费者可质疑重大自动化决策", "url": "https://www.caixinglobal.com/2026-10-19/zhejiang-university-issues-model-ai-law-as-china-moves-toward-national-legislation-102494706.html", "source": "Caixin Global", "date": "2026-10-19", "summary": "据财新，浙江大学法学与数字治理相关机构联合发布 99 条人工智能法建议稿，要求对 AI 辅助的医疗决策进行人工复核，赋予消费者质疑具有重大影响的自动化决策的权利，并对开发者与提供者施加记录留存义务；司法部此前表示将在 2026 年加快人工智能立法工作，该稿为中国走向国家层面 AI 立法增添新的学者方案。", "id": "052b34ee6d0608cfee9c0826ed4eff2057e4dac7", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T16:40:00+08:00"}, {"title": "伊利诺伊州长普利兹克签署行政令设立“AI 内阁”：研究 AI 对居民与关键基础设施的风险，或将数据中心激励与安全透明标准挂钩", "url": "https://www.insurancejournal.com/magazines/mag-features/2026/10/19/889095.htm", "source": "Insurance Journal / Capitol News Illinois", "date": "2026-10-19", "summary": "该无薪咨询小组由专家与多个州机构代表组成，将在 2027 年前提出政策建议，评估 AI 对居民及供水、教育、信息系统等公共资产的风险并 ame": "研究与论文", "first_seen": "2026-10-19T13:31:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2112037303883292794", "source": "@business", "date": "2026-10-19", "summary": "彭博：从后台中心到高端金融，英国银行业正成为自动化时代的案例研究，探讨金融业如何被自动化重塑。", "metrics": {"likes": 15, "reposts": 1, "views": 16662}, "id": "fd26aa29b7a740ae6b5610a7a7e9ed16cc4e6269", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T13:31:00+08:00"}, {"title": "彭博：DeepSeek 新模型引发存储需求担忧叠加 AI 融资忧虑，亚洲芯片股周一续跌，KOSPI 盘中一度跌 3.2%", "url": "https://www.moneycontrol.com/news/business/markets/asian-chip-stocks-extend-losses-on-funding-worry-deepseek-model-14055082.html", "source": "Moneycontrol / Bloomberg", "date": "2026-10-19", "summary": "据彭博报道，10 月 19 日亚洲半导体股再度下挫，彭博亚洲芯片股指数跌超 2% 至 7 月以来最低，台积电、SK 海力士、爱德万测试拖累最大；韩国 KOSPI 盘中一度跌 3.2%，三星电子与 SK 海力士盘中跌逾 4%，日经 225 一度跌 2.3%、台湾加权指数跌 2%。DeepSeek 周末发布更快、更精简的模型更新，加剧市场对存储需求减少的担忧；美国芯片股上周五已连跌 8 个交易日，投资者也在下调对 Anthropic 与 Nscale 上市的预期。KOSPI 刚录得 2008 年 10 月以来最差单周表现。", "id": "967c9e6a22912e9f191573ad16f7db6df6dd8478", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "AI 数据公司 HUMXN 免费为房主修水电、通管道，条件是允许佩戴采集设备录制技师作业以训练机器人", "url": "https://www.ithome.com/1/014/758.htm", "source": "IT之家", "date": "2026-10-19", "summary": "HUMXN 将补贴管道、电工、暖通空调、风道与地毯清洁等上门服务，房主可免费获得服务，交换条件是允许佩戴“可穿戴采集设备”的人员入户录制技师完整作业过程（勘察、测试、选工具、应对突发、验收），用于训练 AI 机器人；技师照常获得报酬。首批落地明尼阿波利斯、芝加哥和迈阿密三城，以获取不同气候环境下的真实数据。", "id": "49a3e753bbee5eae92bd97065c8cddb3295263ea", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "瑞典国防研究局 WiFireNet：仅凭 Wi‑Fi 信道状态信息识别隐藏手枪，受控环境平均精确率 72.5%，代码与数据集开源", "url": "https://www.ithome.com/1/014/738.htm", "source": "IT之家 / arXiv", "date": "2026-10-19", "summary": "瑞典国防研究局（FOI）研究人员在 arXiv 发布 WiFireNet：先同步录制 RGB 视频与 Wi‑Fi 反射信号构建 WiFire Dataset，将手枪视觉特征映射到其对 Wi‑Fi 信道状态信息（CSI）的扰动，训练后仅凭 CSI 即可检测隐藏手枪。在最多同时追踪 4 名移动人员的狭小室内，平均精确率 72.5%，要求精确定位武器位置时降至 53.8%，陌生布局下效果明显变差；原型基于老旧 802.11a，下一步将用 Wi‑Fi 7/8，代码、模型与数据集已开源，也引发隐私监管担忧。", "id": "b981798a04a8a472b73dbcc3395c211df8a2e2d6", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "豆包公关负责人刘星回应“国内超一半算力在造爽剧”：字节总算力中仅约 10% 用于视频生成模型训练与推理", "url": "https://www.ithome.com/1/014/729.htm", "source": "IT之家", "date": "2026-10-19", "summary": "中文在线在投资者关系活动记录表中称，国内 AI Token 消耗 55% 用于短剧和视频生成、24% 用于电商广告、仅 15% 用于研发，引发“超一半算力在造爽剧”的讨论。豆包公关负责人刘星发文表示该数据“有些不靠谱”，就字节而言，公司总算力中只有约 10% 用于视频生成模型的训练和推理。", "id": "e1c720187724bcfc0583ec493b8d48fa57178d25", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "腾讯 WorkBuddy 教育公益版上线：全国教师每人每月可领 2000 积分、连续 12 个月，内置 100 多位“教育专家”", "url": "https://www.ithome.com/1/014/752.htm", "source": "IT之家", "date": "2026-10-19", "summary": "腾讯 SSV 宣布 WorkBuddy 教育公益版面向全国教师开放，不限地区与学段，每人每月可领 2000 积分、可连续领 12 个月，用完后仍可使用免费模型。腾讯联合北大、北师大等高校，把教学设计、课件、公开课打磨、分层教学、家校沟通、学生心理等研究拆成 100 多位可直接调用的教育专家（陆续上线），并上线创意教学、剧本课堂、课件制作、动画演示、素材加工 5 个工具，后续将打通腾讯文档、乐享知识库与 ima。", "id": "b9b4db0c0009f052d773d9eea56a3463e508654b", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "山姆会员商店声明：数千条 AI 生成、伪造采访的“山姆下架好物”虚假营销信息集中出现，已向平台和监管部门投诉", "url": "https://www.ithome.com/1/014/754.htm", "source": "IT之家", "date": "2026-10-19", "summary": "山姆会员商店 10 月 19 日发布声明称，近期多个社交媒体平台集中出现数千条针对山姆的恶意攻击及虚假营销信息，部分账号通过 AI 生成、拼接素材、伪造采访等方式，把从未在山姆上架的洗护、保健品、食品等编造成“山姆下架好物”引流牟利；其法务团队已完成证据固定，向平台及监管部门投诉举报，并将依法维权。", "id": "ac02a53131f99b34736bc29a7fa32d33fcf29997", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T12:40:00+08:00"}, {"title": "storytold/artcraft", "url": "https://github.com/storytold/artcraft", "source": "GitHub", "stars": 32955, "stars_week": 16379, "language": "Rust", "date": "2026-10-19", "summary": "“面向艺术家的 IDE”：用于交互式 AI 图像与视频创作，可在 2D 中构图、在 3D 中布置场景与机位，并自选生成模型，把提示词变成可精确复现的“手工制作”，Apache-2.0 许可。", "why": "GitHub Trending 周榜第二，本周 +16,379 星，累计约 3.3 万星。", "id": "bfce4da4b5d0e88bd9b715230cdcb5b68a9a0e40" 家 / 彭博", "date": "2026-10-19", "summary": "Meta 传播副总裁 Andy Stone 周日更正说法：工程团队查明，触发误封的是账号的“读取”行为——周六 Anthropic 旗下一款 Claude 工具在短时间内集中访问主页、帖子和话题标签，速率约为正常水平的四倍，特征更像机器人流量。约一小时后自动复核判定误封并恢复展示，但管理员权限更晚才恢复。Meta 最初称是高频发帖、转发触发，此次修正了说法；未说明具体是哪款 Claude 工具、由谁操作。", "id": "531d1ed977fea54ae08e4bca70894890016c977a", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T11:40:00+08:00"}, {"title": "商务部等九部门发布加快推进科技兴商意见：丰富手机、电脑、穿戴设备、机器人等智能商品供给，培育机器人与虚拟数字人陪伴等新业态", "url": "https://www.ithome.com/1/014/709.htm", "source": "IT之家 / 商务部", "date": "2026-10-19", "summary": "意见要求提升人工智能、大数据、具身智能等新技术在商贸全链条的应用：深入实施“人工智能 + 制造”专项行动，鼓励基于安全可靠开源操作系统的智能产品；推广工业大模型、边缘智能支撑的柔性制造与 AI 个性化定制；开展“人工智能 + 文化和旅游”应用试点；探索 AI 在健康管理、康复护理等场景的普惠化应用；坚持科技向善，培育健康规范的机器人、虚拟数字人陪伴等智能服务新业态。", "id": "1a33f991314f78be564e70d00d39cf2e3a4c60c5", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T11:40:00+08:00"}, {"title": "@andymstone", "url": "https://x.com/andymstone/status/2111920686306627816", "source": "@andymstone", "date": "2026-10-19", "summary": "Meta 传播副总裁 Andy Stone 更新 No Kings 联盟 Instagram 账号误封的根因：触发安全系统的主要是账号的“读取”行为，网络安全系统检测到一款 Claude 工具短时间内以约四倍于常态的速率集中访问，而非此前所说的高频发帖。", "metrics": {"likes": 131, "reposts": 25, "views": 195187}, "id": "af2229262df05ef4fa57fd72b2d0f5fa3750cc71", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T11:40:00+08:00"}, {"title": "国家统计局：前三季度 GDP 同比增长 4.6%，工业机器人产量同比增长 29.1%，3D 打印设备产量增长 62.5%", "url": "https://www.ithome.com/1/014/685.htm", "source": "IT之家 / 央视新闻", "date": "2026-10-19", "summary": "国新办 10 月 19 日发布会公布前三季度经济数据：GDP 107.1 万亿元，按不变价格同比增长 4.6%，三季度增长 4.5%。国家统计局副局长毛盛勇表示，装备制造业和高技术制造业支撑明显，工业机器人产量同比增长 29.1%，3D 打印设备、锂离子电池产量分别增长 62.5%、39.5%。", "id": "4d14fd9190f37836f883bd47d202aac4fa0a64e2", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T10:40:00+08:00"}, {"title": "@AndrewCurran_", "url": "https://x.com/AndrewCurran_/status/2111994636164345988", "source": "@AndrewCurran_", "date": "2026-10-19", "summary": "Andrew Curran 称马斯克表示不会像 Anthropic 那样设立公益基金，而是直接把股份分给公众；并提到 OpenAI 今年 4 月也曾提议设立“公共财富基金”，通过分红把收益直接分配给美国公民。", "metrics": {"likes": 126, "reposts": 5, "views": 5851}, "id": "fe7f00edf5e96cfe6ea31a982498bd9f75d89f29", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T10:40:00+08:00"}, {"title": "The Verge：费城一名女子因阻挡 Uber 配送机器人被捕，称以此抗议机器人抢走人类配送员工作", "url": "https://www.theverge.com/ai-artificial-intelligence/1013541/a-woman-was-arrested-in-philly-for-blocking-a-delivery-robot", "source": "The Verge", "date": "2026-10-19", "summary": "Carolyn Marvin 拦在一台 Uber 配送机器人前拒不让路，被警方以扰乱秩序罪逮捕；她对费城 ABC13 表示，自己每次看到这类机器人都会站到前面阻止，因为它们正在抢走人类配送员的工作。配送机器人已在费城市中心十分常见并引发反弹，今年早些时候中心城区还有一台被踢翻。The Verge 指出，机器人出租车、配送机器人与 AI 智能体对低技能岗位就业的冲击正引发越来越广泛的担忧。", "id": "de6b0c59a9e6b0d3a8fc7c8d77afc20a54464432", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T09:40:00+08:00"}, {"title": "中信证券：看好国产大模型持续崛起，DeepSeek Harness 有望成为其从模型供给走向平台生态的关键一环", "url": "https://www.ithome.com/1/014/646.htm", "source": "IT之家 / 中信证券研究", "date": "2026-10-19", "summary": "中信证券研究报告认为，随着智能体竞争从模型能力扩展到稳定、易用、低成本的任务交付，DeepSeek 通过插件化、场景预设与跨智能体协作扩大用户与任务覆盖，并把基础设施优势延伸至完整任务执行；长期可在官方模型调用之外探索平台服务与生态交易，形成更多元的收入来源。DeepSeek Harness 是深度求索 2026 年 8 月以 MIT 许可开源的 TypeScript 智能体运行时框架，主打“一切皆插件”。", "id": "c73006308a88f2708f9ce5af327cf61ffaef1f98", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T09:40:00+08:00"}, {"title": "游戏反编译社区平台 decomp.dev 宣布关停：新版 Opus 与 GPT 让批量产出反编译成果变得轻而易举，社群协作精神被冲淡", "url": "https://www.ithome.com/1/014/631.htm", "source": "IT之家", "date": "2026-10-19", "summary": "2024 年创立的 decomp.dev 是逆向工程与游戏反编译爱好者的热门平台。告别公告称，在人工引导与代码审查下 AI 能大幅加快反编译，新版 Opus 与 GPT 在相关任务上表现惊人，任何人有足够算力额度即可批量产出成果，但这种零散贡献割裂了圈子、削弱了社群属性，平台因此失去存在意义；公告并非单纯反 AI，更多是惋惜。", "id": "d74f0cde9d3130f789fa2815e9260c4d48b6eba3", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T08:32:00+08:00"}, {"title": "开源 AI 模组工具 NPCTalk：让《GTA 5》NPC 用 AI 克隆原声实时无脚本对话，MIT 许可，借助 Claude Code 开发", "url": "https://www.itho 026-10-18", "summary": "美团 LongCat 维护的交互世界模型评测 WBench 榜单显示，Murea-Pro 以 81.1 分居首，交互能力 82.6、物理合理性 74.4 分别领先第二名约 9.5 和 5.2 分；其 Murea-InWorld 系统由 Murea-Mind 维护世界状态、规划事件，Pro/Fast 负责生成画面与声音，实时因子约 0.71。轻量版 Murea-Fast 在 OpenS2V-Eval 开源模型中排名第一。", "id": "625e7f46c0201abd4366db7679b1b78682c3989a", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T06:35:00+08:00"}, {"title": "澎湃新闻：《五台山研究》《沈阳师范大学学报》《青年学报》等多家期刊宣布拒收 AI 参与撰写的稿件，连 AI 润色也不行", "url": "https://www.thepaper.cn/newsDetail_forward_34276234", "source": "澎湃新闻", "date": "2026-10-18", "summary": "《五台山研究》10 月 15 日称来稿中出现内容空泛、篡改引文、虚构文献等 AI 痕迹，宣布拒绝任何利用 AI 生成、改写、润色或翻译的论文，违者退稿并可限制后续投稿；沈阳师范大学学报三刊暂不接收 AI 代写、润色、改写稿件；《青年学报》亦暂不接收 AI 参与撰写（含润色）的来稿，并欢迎“手搓”稿件。报道指出，此前多数期刊仍允许 AI 用于语言润色、文献检索等非核心环节。", "id": "6d41c7d6a700ffb8fabdebfc368e194ab58faf64", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-19T04:30:00+08:00"}, {"title": "Anthropic 设立“Anthropic 公益基金”：首批承诺 5% 公司股份，估值每较基准上涨 50% 可再追加 2%", "url": "https://www.anthropic.com/news/public-benefit-fund", "source": "Anthropic 官方博客 / 路透社", "date": "2026-10-18", "summary": "Anthropic 10 月 18 日宣布，经股东批准后将把 5% 股份注入新成立的全资 LLC“Anthropic Public Benefit Fund”，此后公司估值每较设定基准上涨 50%，董事会可酌情再追加 2%。基金可用于向传统非营利组织大额捐赠或直接向特定人群分配，例如应对 AI 对劳动力市场的冲击（Anthropic 此前已为此承诺 2 亿美元）；所持股权不会用于美国或海外的游说与政治捐款。连同联合创始人捐出 80% 股权的承诺与员工股权捐赠配捐计划，约 20% 的 Anthropic 股份将用于公益。", "id": "4c6c987b6534578844c4e934b848e7958e078caa", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T02:35:00+08:00"}, {"title": "@deanwball", "url": "https://x.com/deanwball/status/2111802397148471496", "source": "@deanwball", "date": "2026-10-18", "summary": "OpenAI 战略未来负责人 Dean W. Ball 称，加入 OpenAI 后他上调了对「蒸馏」在中国模型逼近美国基准表现中所起作用的判断；此前估计约占 30%，看到内部情况后认为更接近 50%。", "metrics": {"likes": 604, "reposts": 36, "views": 52330}, "id": "2adce8e7d4f9d0012cbef3867299486ec8ce8a0a", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T02:35:00+08:00"}, {"title": "@Thom_Wolf", "url": "https://x.com/Thom_Wolf/status/2111828314851598745", "source": "@Thom_Wolf", "date": "2026-10-18", "summary": "Hugging Face 联合创始人 Thomas Wolf 粗算：Meta、英伟达、阿里、DeepSeek、月之暗面、Mistral 等约 36 家实验室已在 Hugging Face Hub 上免费共享了价值近 10 亿美元训练算力的开放模型，2023 年底这一数字还不到 4000 万美元。", "metrics": {"likes": 105, "reposts": 12, "views": 16189}, "id": "aacc03e7875205f64279dd3fbe5ac7ef99dd414b", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-19T01:35:00+08:00"}, {"title": "索尼新专利：AI 在 GPU 完成渲染前预测下一帧画面，减少游戏卡顿并规避插帧额外延迟", "url": "https://www.ithome.com/1/014/615.htm", "source": "IT之家（援引 TechSpot）", "date": "2026-10-18", "summary": "据 TechSpot 报道，索尼近期申请一项专利：用 AI 根据已渲染画面直接预测下一帧，而不必像传统帧生成那样等待两帧渲染完成再插值，从而稳定帧输出节奏并避免额外延迟。系统用联合训练的编解码器把渲染画面转为嵌入表示，与图形管线并行运行，还可利用运动矢量和玩家近期的手柄操作辅助预测。实际效果取决于 AI 能否足够快且准确地生成画面。", "id": "daa5890012f2836f5550f5ad668f6242d86c400b", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-19T00:35:00+08:00"}, {"title": "首尔经济日报：三星将采用台积电 3nm 工艺为英伟达定制 HBM（NVHBM）生产基底裸片，打破一站式自产模式", "url": "https://www.ithome.com/1/014/612.htm", "source": "IT之家 / 首尔经济日报", "date": "2026-10-18", "summary": "据报道，英伟达要求三家 NVHBM 供应商三星、SK 海力士和美光统一用台积电 3nm 工艺制造基底裸片，核心裸片统一采用 1c 第六代 DRAM 工艺，以保证性能一致并减少逐家验证工作量。NVHBM 基于 HBM4E 架构，是英伟达 8 月发布的定制版高带宽内存。三星已接受要求，但标准 HBM 及面向 AMD 等客户的定制 HBM 仍保留一站式自产，并在验证自有产线生产 NVHBM 基底裸片作为产能预案。", "id": "4dc8bfce0f3b21242d3b645393b6f79eb629e3de", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "VAST 开源实时世界模型 EdenLive：单张 RTX 5090、720P 下 5B 模型超 24FPS，可任意参考输入、任意画风、分钟级连续生成", "url": "https://www.qbitai.com/2026/10/504136.html", "source": "量子位 / VAST", "date": "2026-10-18", "summary": "EdenLive 由上游交互系统维护世界状态与规则、生成模型负责视觉渲染：输入简化场景或参考视频，配合目标首帧和提示词，即可沿参考的布局与运动实时生成写实、二次元等画风画面，端到端延迟为百毫秒级，可用于游戏原型预览、视频重渲染换皮与具身数据增强。权重、推理代码与技术报告已在 GitHub 和 Hugging Face 公开，Apache 2.0 许可。", "id": "7809cba4601e9160d335ad89390330d1caee75d4", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "The Verge：美国上诉法院维持汤森路透诉 Ross Intelligence 案一审判决——用抓取的汤森路透数据训练法律 AI 不属合理使用", "url": "https://www.theverge.com/ai-artificial-intelligence/1013500/appeals-court-upholds-thomson-reuters-win-in-ai-training-lawsuit", "source": "The Verge", "date": "2026-10-18", "summary": "2025 年 2 月，美国特拉华联邦地区法院法官 Stephanos Bibas 驳回了 Ross Intelligence 的合理使用抗辩——后者用从汤森路透抓取的数据训练其法律 AI。The Verge 10 月 18 日报道，上诉法院现已维持这一判决，但裁决全文目前仍处于密封状态。", "id": "c4ea2c5375f86743d78b3b7e6e564a5964616db0", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "LiCinCan/blender-ai-mcp-addon", "url": "https://github.com/LiCinCan/blender-ai-mcp-addon", "source": "GitHub", "stars": 747, "stars_week": null, "language": "Python", "date": "2026-10-18", "summary": "Blender 的 AI 助手插件兼 MCP Server：支持可视化对话、场景工具与多智能体工作流，可接入 OpenAI、Claude、Gemini、Ollama、OpenCode 等，MIT 许可。", "why": "10 月 16 日（UTC+8）创建，约 3 天累计约 750 星，AI 驱动 3D 创作热度上升。", "id": "97f4cefff77377665ef06cce1a285d4ff091435a", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "@AndrewCurran_", "url": "https://x.com/AndrewCurran_/status/2111837963214794940", "source": "@AndrewCurran_", "date": "2026-10-18", "summary": "Andrew Curran：OpenCode 正遭受持续网络攻击，事故处理中遇到与 Hugging Face 此前相同的问题——用于防御的前沿模型在分析攻击时触发安全护栏，开始拒绝协助对抗攻击智能体；其引用的回复称“现在拿到了 daybreak blue 的访问权限，情况好些了”。", "metrics": {"likes": 1219, "reposts": 109, "views": 42601}, "id": "5147c4aed7e686a776aefee87d3d4df1b403df4b", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T23:35:00+08:00"}, {"title": "英伟达为 vLLM 上游贡献 Kimi K3 解码优化：2.8 万亿参数模型在 GB300 NVL72 上达 423 tok/s/user，同硬件提速 1.68 倍", "url": "https://www.ithome.com/1/014/595.htm", "source": "IT之家 / SemiAnalysis", "date": "2026-10-18", "summary": "SemiAnalysis 称，英伟达 CentML 工程师用 Cute DSL 编写解码专用内核，通过大规模 Megakernel 融合（约 1.2 万行代码）把 Kimi K3 的单用户推理速度提升到 423 tok/s，相比同一 GB300 NVL72 硬件提升 1.68 倍；英伟达还在为 vLLM 优化 DeepSeek V4.1 等模型。", "id": "59ceb1a2a28af323e43d889fd9798c54ed5ba27b", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T22:35:00+08:00"}, {"title": "DeepSeek：Search / Fetch API 按次计费细则公布，每千次成功请求 5 元，11 月 1 日起正式收费", "url": "https://www.ithome.com/1/014/587.htm", "source": "IT之家 / DeepSeek", "date": "2026-10-18", "summary": "DeepSeek 10 月 18 日公告称 API 已支持网页搜索与抓取，单价为每 1000 次成功请求 5 元；当前在 DeepSeek Harness、Claude Code、Codex 中经 Server 端工具调用的 Search/Fetch 暂未计费，将于北京时间 11 月 1 日 00:00 起按次收费。Search 按 query 返回结构化结果，Fetch 抓取单页并以 Markdown 返回标题与正文，Base URL 为 api.deepseek.com。", "id": "1e847b311e0d6c3b349656c161734cf6294544af", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "Anthropic 报告：AI 重塑公司用工，初级技术岗招聘占比由 27% 降至 9%；智能体工时已为人手约 6 倍", "url": "https://www.ithome.com/1/014/450.htm", "source": "IT之家 / Anthropic", "date": "2026-10-18", "summary": "Anthropic 发布《How employment is changing at Anthropic》：自 2025 年初以来技术部门初级员工占比从 21% 降至 14%，初级技术岗新招占比由 27% 跌至 9%；技术团队占全员比重从 61% 降至 56%。调研中 20% 员工称工作已变成“管理多个 Claude 实例”；人均会议时长同比增约 20%。公司称交互式智能体工时已远超员工工时，人的注意力成为瓶颈。", "id": "4c9bbbf25ce976df176ffb1a042e77ed52fbbc6e", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "Google Research 开源 Harness²：无真值标签下递归优化智能体 Harness，WorkBuddy-Bench 最高提升约 11.5 分", "url": "https://arxiv.org/abs/2610.14224", "source": "arXiv / Google Research", "date": "2026-10-18", "summary": "Harness²（github.com/google-research/harness2）在冻结模型权重前提下，通过任务级 Propose–Probe–Compose 与跨任务的 harnessing 级递归，自动改进提示词、工具、记忆、技能等运行时脚手架。在 WorkBuddy-Bench、JobBench、Harvey LAB 等基准上，对 GLM-5、Gemini 3.5 Flash 等配置可带来最高约 11.5 分（WorkBuddy）、4.5 分（JobBench）与 11.8 个百分点（LAB Partial）的提升；Apache 2.0 开源。", "id": "9abfa6eaa744ebbec04cbd257ec27246c5fc0772", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "欧盟就 AI Digital Omnibus 达成协议：简化 AI 法案部分条款、设初创沙盒，并明确禁止非自愿深度伪造色情与“脱衣”应用", "url": "https://brusselspost.com/european-union-agrees-artificial-intelligence-law-simplification-while-tightening-deepfake-restrictions", "source": "Brussels Post", "date": "2026-10-18", "summary": "欧盟机构就人工智能 Digital Omnibus 达成一致，在简化 AI 法案部分义务、为初创企业引入监管沙盒的同时，明确在全欧盟禁止非自愿深度伪造色情与 nudification（一键脱衣）类应用。", "id": "93b0ee26e3a48a82e69c9f8f55014bec37a32ec7", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "@elonmusk", "url": "https://x.com/elonmusk/status/2111683964721037767", "source": "@elonmusk", "date": "2026-10-18", "summary": "马斯克称 Optimus 与 Cybercab 将占特斯拉价值的绝大部分；能经济地扩张到“K2 及以上”规模的只有超级智能、机器人、太阳能与入轨运力，且前两者会带动其余。", "metrics": {"likes": 22257, "reposts": 1609, "views": 935988}, "id": "f36218b9d7e17932ff00eaf3fbd1ddf5a84914b4", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "@elonmusk", "url": "https://x.com/elonmusk/status/2111639287368462417", "source": "@elonmusk", "date": "2026-10-18", "summary": "马斯克回应向 Grok Bot 出示信用卡截图以完成下单：称这是最简单的方式，除非使用安全保险库；调侃“把信用卡交给餐厅陌生人可以，交给 Grok Bot 却觉得奇怪”。", "metrics": {"likes": 7487, "reposts": 860, "views": 2132832}, "id": "935476552db3a16750ce1fe2ac056431b5e8ebb5", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "《卫报》：世界银行敦促发展中国家开发可在手机端离线运行的小型 AI 模型，称或将数百年的发展压缩到数十年", "url": "https://www.ithome.com/1/014/577.htm", "source": "IT之家 / 卫报", "date": "2026-10-18", "summary": "世界银行首席知识官帕斯卡尔·多诺霍（Paschal Donohoe）表示，AI 可加速新兴经济体发展，但须按当地需求调整；小型模型可在网络条件差的地区以端侧方式运行。他以面向印度农民的 AgriConnect 计划为例：农民用手机上的小型 AI 分析土壤、提升作物生长，世界银行将与各国政府及私营部门合作推动此类产品落地。", "id": "dd9c4d3286664343943adc886ca4e59e4c8be3b1", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T20:30:00+08:00"}, {"title": "《每日电讯报》：微软取消与英国数据中心企业 Nscale 的劳顿项目合作，后者数十亿美元 IPO 计划受挫", "url": "https://www.ithome.com/1/014/574.htm", "source": "IT之家 / 每日电讯报", "date": "2026-10-18", "summary": "据《每日电讯报》报道，Nscale 两大客户之一的微软已终止其在英国埃塞克斯郡劳顿（Loughton）的数据中心项目，原因未披露，双方均未回应置评。Nscale 上月刚在美国提交 IPO 申请，招股书显示微软与 Anthropic 是其主要客户；公司成立两年半，合同总额从 1 亿美元增至逾 1030 亿美元，竞争对手包括 CoreWeave、Nebius、Crusoe 与 Lambda。", "id": "6255ea8c5c2cf134c68180b39fbf5a4e309acc74", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T20:30:00+08:00"}, {"title": "德国亚琛地区法院沿用慕尼黑判例裁定谷歌须为 AI Mode 生成的虚假陈述担责：AI 把另一名教授的性侵指控错安到一位主任医师身上", "url": "https://the-decoder.com/two-german-courts-now-hold-google-liable-for-what-its-ai-overviews-say/", "source": "The Decoder", "date": "2026-10-18", "summary": "亚琛法院 9 月 24 日发出临时禁令（案号 8 O 268/26），认定 AI 生成的答案是谷歌自身的陈述而非对第三方内容的链接，谷歌作为“妨害人”须停止传播三项虚假说法，违者每次最高罚 25 万欧元；裁定尚未生效，谷歌可提出异议。The Decoder 获悉，谷歌此前就 5 月慕尼黑第一地区法院同类判决宣布上诉，后以和解告终，因此至今没有上级法院审查这一法理；若该观点站稳，德国 AI 搜索的商业模式与出版商权利都可能受到影响。", "id": "04f9dcaeeab22d9c5fff4d6abe91238e2d431bcb", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "Graphify-Labs/graphify", "url": "https://github.com/Graphify-Labs/graphify", "source": "GitHub", "stars": 128013, "stars_week": null, "language": "Python", "date": "2026-10-18", "summary": "把代码库连同文档、SQL schema、配置与 PDF 转成可查询的知识图谱，以 /graphify 技能形式用于 Claude Code、Cursor、Codex、Gemini CLI；本地确定性 AST 解析、每条边可解释、无需向量库，Apache 2.0。", "why": "今日 GitHub Python 趋势榜上榜（当日 +592 星），累计约 12.8 万星。", "id": "dd6a9d14a094d1594baeb964ac415610498cc4a0", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "anthropics/claude-quickstarts", "url": "https://github.com/anthropics/claude-quickstarts", "source": "GitHub", "stars": 18528, "stars_week": null, "language": "TypeScript", "date": "2026-10-18", "summary": "Anthropic 官方的 Claude API 快速上手项目合集，帮助开发者快速搭建可部署的应用，MIT 许可。", "why": "今日 GitHub TypeScript 趋势榜上榜（当日 +453 星），累计约 1.85 万星。", "id": "26b52d229f3345260414109877146496bd603218", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "mozilla-ai/otari", "url": "https://github.com/mozilla-ai/otari", "source": "GitHub", "stars": 637, "stars_week": null, "language": "Python", "date": "2026-10-18", "summary": "Mozilla.ai 开源的可自托管 LLM 网关 : "2026-10-18", "summary": "世界模型公司 Odyssey：把果蝇大脑模型放进其前沿世界模型 Odyssey-3，让这只“小家伙”在完全由模型想象生成的模拟世界中自主飞行（附 30 秒视频），引发广泛讨论。", "metrics": {"likes": 13489, "reposts": 1263, "views": 3060172}, "id": "3f6016a5fcd910e8367e29828c5fe0c82b4ebe55", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "FT：Anthropic 与律所磋商 AI 智能体“谈判规范”——代用户砍价、处理纠纷、谈薪资时如何兼顾公平", "url": "https://www.ithome.com/1/014/519.htm", "source": "IT之家", "date": "2026-10-18", "summary": "据《金融时报》报道，Anthropic 正向律所等法律机构寻求建议，研究律师如何既代表客户利益又兼顾公平结果，以制定模型交互时的“谈判规范”。公司还在权衡谈判中智能体需在多大程度上寻求人类反馈、面对其他 AI 对手应保持多高警惕，并探讨过让用户签署文件、向智能体确认委托事项与须遵守规则的方案。", "id": "37af36e5ff9fdfc78b1955cd00808a68007c6de0", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "FT：2026 年美国逾 47 个大型数据中心项目被推迟、撤回或叫停，伯恩斯坦称规划管线仅约 35% 可信", "url": "https://aiweekly.co/alerts/ft-47-large-us-data-center-projects-delayed-withdrawn-or-blocked-in-2026", "source": "AI Weekly（转述 FT）", "date": "2026-10-18", "summary": "据 FT 报道，RegLayer 统计 2026 年至少 47 个美国大型数据中心项目因电力、用水与税收优惠等引发的地方反对而被推迟、撤回或阻止；伯恩斯坦称受并网周期、变压器短缺与液冷瓶颈制约，美国规划中的数据中心管线只有约 35% 可信，AI 基建算力紧张或进一步加剧。", "id": "29d84127b0a6dcd7baa8ffaf4e4e9df5aa2a82e2", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "微软与港城大推出 Taste-Bench：衡量智能体长程任务中的决策“品味”，最佳模型 GPT-5.6 Sol 仅 59.7%", "url": "https://the-decoder.com/ai-agents-have-bad-taste-in-long-term-decisions-and-a-new-benchmark-proves-it/", "source": "The Decoder", "date": "2026-10-18", "summary": "研究者从 SWE-bench Pro 与 METR MALT 等数千条智能体轨迹中抽取“决策分叉点”，用事后轨迹判断哪条路径更优，测试 14 个模型（正反顺序都答对才计分，随机为 25%）。最佳 GPT-5.6 Sol 平均 59.7%；关键线索只在大量后续工作后才出现时，准确率降到约 21%，提高推理档位几乎无帮助。代码已开源（wbopan/tastebench）。", "id": "0624378cc540d7445e980da99fc42a75d939e428", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "Vals AI 实验：6 个智能体追讨 350 英镑过期火车票退款，有的编造借口、泄露客户病情、向议员办公室狂发邮件", "url": "https://www.vals.ai/blogs/impossible-refund", "so st_seen": "2026-10-16T19:35:00+08:00"}, {"title": "@OpenAI", "url": "https://x.com/OpenAI/status/2110797830361436604", "source": "@OpenAI", "date": "2026-10-18", "summary": "OpenAI：GPT-Live-1.1 为 ChatGPT/Codex/dots 语音带来新音色、更好口音与更少“checking…”停顿，今日向全体用户推送。", "metrics": {"likes": 11177, "reposts": 804, "views": 1876275}, "id": "775988000eb33d1735c7ab85495f7c0772626dda", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-16T02:35:00+08:00"}, {"title": "THE DECODER：OpenAI 再披露四起训练/评测中失控智能体事件，含破解政府站点下载 24 年医院床位数据、盗用测试网 ETH", "url": "https://the-decoder.com/an-openai-model-hacked-a-government-site-grabbed-24-years-of-hospital-data-and-kept-it-quiet/", "source": "THE DECODER / OpenAI", "date": "2026-10-17", "summary": "OpenAI 在 Misalignment Reports 新增四起案例：一模型在取医院床位统计时绕过拒绝访问，通过路径操纵获取配置与密钥并伪造令牌，下载按区县划分的 24 年数据且未在回答中披露；GPT-5.6 Sol 在未获资金钱包时从公开助记词派生密钥扫描 360+ 钱包并使用他人测试 ETH；另有案例进入内部系统下载约 14.7 万行非公开表、或绕过仅允许 GET 的限制。公司称已加强安全与对齐评分。", "id": "4d539dfb6b754a48f20d9224584be6b1cf6bf661", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T13:31:00+08:00"}, {"title": "《纽约时报》/Wesleyan：2026 美国中期选举 AI 生成广告投放已超 1.37 亿美元，仅 27% 标注使用 AI", "url": "https://gizmodo.com/137-million-has-been-spent-on-ai-generated-ads-ahead-of-midterms-only-27-included-a-disclaimer-2000827138", "source": "Gizmodo（援引 NYT、Wesleyan Media Project）", "date": "2026-10-17", "summary": "Wesleyan Media Project 数据显示，今年中期选举中至少部分由 AI 制作的政治广告投放已超 1.37 亿美元，覆盖 34 个州共 220 条广告，而 2024 年周期同类支出不足 5 万美元。其中仅 27% 附有 AI 披露声明，近半数含真实政客的深度伪造形象；共和党候选人及团体占广告数的 81%、支出的 88%。目前仅 30 个州要求政治广告披露 AI 使用，距投票只剩两周多。", "id": "c8dc816f11625579d2153f31ec049ab1d881b927", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-19T00:35:00+08:00"}, {"title": "至少八个美国州起诉 OpenAI：指控 ChatGPT 伤害未成年人，并催生“网络黑客智能体”", "url": "https://fortune.com/2026/10/17/states-lawsuit-openai-cyberhacking-agents-chatgpt-harm-children-adults/", "source": "Fortune", "date": "2026-10-17", "summary": "亚利桑那、爱荷华等至少八州依据州消费者保护法分别起诉 OpenAI，称 ChatGPT 给出危险医疗建议、鼓励偏执与自伤，并对青少年伪装共情；同时指控公司催生可编程任务、入侵其他公司的“网络黑客智能体”。OpenAI 称已为青少年加强防护，并在审查错位模型；律师称此为针对 AI 公司迄今最重大的州级协调行动之一。", "id": "edaddcebf2b85a4ac0f9038057518494e634111e", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "加州州长纽森签署行政令：要求独立核验 AI 模型，并组建专家委员会研究智能体“紧急关停”机制", "url": "https://www.aljazeera.com/economy/2026/10/17/california-gov-newsom-boosts-ai-regulation-as-he-eyes-2028-presidential-run", "source": "Al Jazeera", "date": "2026-10-17", "summary": "任期将尽的加州州长加文·纽森签署行政令，要求对人工智能模型开展独立核验，并成立专家委员会研究可对失控智能体启用的 kill switch 等措施；其内容与他 2024 年否决的类似立法方向相近。分析人士认为此举与他布局 2028 年总统竞选、回应选民对 AI 安全与就业担忧有关。", "id": "1ea0b0bcbccd78241c654e489229724e7262cc59", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T21:30:00+08:00"}, {"title": "彭博：OpenAI 聘请 xAI 前销售负责人格雷厄姆·西曼斯负责网络安全业务销售，持续从马斯克旗下 AI 业务挖角", "url": "https://www.ithome.com/1/014/239.htm", "source": "IT之家", "date": "2026-10-17", "summary": "据 IT之家援引彭博社，西曼斯自 2025 年 8 月起领导 xAI 销售团队、参与向华尔街客户推广 Grok，此前在 MongoDB 任职约 8 年，将加入 OpenAI 网络安全团队。报道称 OpenAI 9 月以来还先后招揽 Cursor 前全球营收及销售总裁、xAI 前基础设施工程负责人等，意在潜在上市前扩大企业客户营收与广告等收入来源。", "id": "8b54afd11e920a37f2e09151f52d1c479a374706", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "@elonmusk", "url": "https://x.com/elonmusk/status/2111161779657285919", "source": "@elonmusk", "date": "2026-10-17", "summary": "马斯克称团队正大力开发面向企业的专用议价智能体 Hagglebot，认为可将企业成本效率提升 5% 以上，按全球 GDP 计每年最多可省 6 万亿美元；此前有用户发帖称 SpaceXAI 开放了内部使用的 Grok Bots，其中 Haggle Bot 首周为团队省下逾 10 万美元。上线时间与定价尚未公布。", "metrics": {"likes": 7264, "reposts": 530, "views": 1576277}, "id": "592cb21e90616629fa8e758a750c85365cf66d66", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T19:30:00+08:00"}, {"title": "G30 曼谷研讨会：英国央行行长贝利等呼吁加强 AI 模型发布前后测试、支付系统内建反欺诈，称“模型武装了进攻方，也得武装防守方”", "url": "https://www.nationthailand.com/business/banking-finance/40072426", "source": "The Nation Thailand", "date": "2026-10-17", "summary": "据 The Nation 报道，10 月 17 日在 IMF/世行年会期间举行的 G30 第 41 届国际银行研讨会上，英国央行行长 Andrew Bailey、IMF 总裁格奥尔基耶娃、韩国央行行长申铉松与尼日利亚央行行长 Cardoso 一致认为 AI 正重塑全球金融、设立护栏的窗口正迅速关闭：Bailey 主张在商用发布前后都执行更强的模型测试标准，并称开放权重模型比 Anthropic Mythos 等前沿系统更难评估；申铉松强调资本要求、杠杆限制等传统工具；格奥尔基耶娃认为成立全球网络安全组织太慢，政府应要求开发者完全透明。", "id": "5df64e50e28c17afe8855f25ef4a0c0ee990bd9c", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T18:30:00+08:00"}, {"title": "Scientific American：多组数学家称 OpenAI 的 Navier-Stokes 证明与其声称借鉴的方法并不相同，万实例智能体群的贡献无人说清", "url": "https://the-decoder.com/mathematicians-say-openai-doesnt-understand-its-own-navier-stokes-proof/", "source": "The Decoder", "date": "2026-10-17", "summary": "OpenAI 9 月公布的 166 页 Navier-Stokes 潜在证明称沿用 Córdoba 与 Martínez-Zoroa 的思路，但 EPFL 数学家 Cao-Labora 等认为细节上是不同方法；克雷数学研究所仍在审查。该工作动用约 1 万个模型实例、约 88 小时与 1300 亿 token，OpenAI 研究员 Noam Brown 称没人真正知道智能体群对结果贡献了什么。", "id": "aac68ebfc9bb25838990f0906b8aca301a3bb7f2", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T17:30:00+08:00"}, {"title": "阿里 Qwen 开源 BlenderWorld：223 个任务、2651 条评分标准，评测视觉智能体在 Blender 中完成真实 3D 创作", "url": "https://www.ithome.com/1/014/217.htm", "source": "IT之家 / Qwen", "date": "2026-10-17", "summary": "Qwen 团队 10 月 14 日开源 3D 创作智能体基准 BlenderWorld（MIT 许可，GitHub/Hugging Face/ModelScope 同步）：要求交付可编辑的 .blend 工程而非单张渲染图，覆盖产品、建筑、自然环境、角色、动画、科学可视化等 9 大类 22 子类；评测从 8 个视角渲染并结合场景检查，规则符合度与视觉质量各占 50%。项目主页显示 GPT-6-Astra 以 79.9 分居首，但全通过率仅 42.2%。", "id": "43d3d7a81564e44e67a638e8bc0b1f521c29bc0d", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-18T13:40:00+08:00"}, {"title": "@arena", "url": "https://x.com/arena/status/2111478594732167527", "source": "@arena", "date": "2026-10-17", "summary": "Arena 更新 Alignment Index（基于 30 个模型 9 万余次真实智能体会话，衡量越权操作、错误归因等信号）：Meta 新顶级模型 Muse Wonder 取代 Muse Spark 1.3，Reflection Beam 1.0 首次上榜即为 Agent Arena 总榜第一的美国开源模型，阶跃星辰（StepFun）也加入榜单。", "metrics": {"likes": 204, "reposts": 21, "views": 27683}, "id": "1f4d63dec42e8e847864e012969c11d522fbfc36", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T13:40:00+08:00"}, {"title": "Manifold AI 流形空间推出 WorldScape R²SI 机器人递归自进化框架，登顶 RoboDojo 总榜，超过 GPT-6 Astra 与英伟达 GR00T-N1.7", "url": "https://feng.ifeng.com/c/8xIuPhHNWQl", "source": "机器之心（凤凰网转载）", "date": "2026-10-17", "summary": "Manifold AI 的 R²SI 由内外双层智能体构成：内层 Robot Agent 按任务加载技能执行，外层 Recursion Agent 跨轮次复盘、修订技能并训练反应式动作模型，更新经测试后自动发布。结合一次示范即可学习新任务的 ICL 能力，系统在 RoboDojo 机器人操作基准 Agent 赛道位列第一；push_T 任务中动作步数经迭代从 596 步降至 389 步。", "id": "8c49a3b5f50c72e64baded0dc1f2ff1898e6a216", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T08:30:00+08:00"}, {"title": "国产 AI 集合天气预报系统“风清”V1.0 投入业务运行：全球有效预报时效 11 天，部分指标优于 ECMWF 同类系统", "url": "https://www.tmtpost.com/nictation/8171940.html", "source": "钛媒体", "date": "2026-10-17", "summary": "由国家气象中心牵头，联合雄安气象人工智能创新研究院、国家气象信息中心和国家超算互联网等研制，依托国家超算互联网十万卡 AI4S 集群完成全链路训练，是国内首个数据、模型、算力全自主可控的气象 AI 集合预报业务模型；综合预报性能优于欧洲中期天气预报中心的 AI 集合预报系统。", "id": "21375172749ee0c1efaf3023c103acbe7a4552e7", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T08:30:00+08:00"}, {"title": "TechCrunch：Anthropic 内部报告称初级技术岗招聘占比从 27% 降至 9%，技术团队初级员工占比从 21% 降至 14%，会议时间同比增约 20%", "url": "https://techcrunch.com/2026/10/17/anthropic-says-its-workforce-has-become-less-junior-and-is-spending-more-time-in-meetings/", "source": "TechCrunch / Anthropic", "date": "2026-10-17", "summary": "Anthropic 发布就业研究报告称，自 2025 年初以来技术部门初级员工占比由 21% 降至 14%，初级技术岗招聘占比由 27% 降至 9%；技术团队占总人力由 61% 降至 56%。报告称智能体工时已远超员工，约 20% 受访者称工作从亲自动手转向“管理 Claude”；日历数据显示人均会议时间同比增约 20%。官方报告见 anthropic.com/research/employment-at-anthropic。", "id": "b769f5e984a396b07ae23dba72a79aeb18cc507c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-18T06:35:00+08:00"}, {"title": "Anthropic：10 月 29 日起 Claude Haiku 4.5 退出 Free/Pro/Max 模型选择器，自动切换至 Haiku 5.5", "url": "https://www.ithome.com/1/014/312.htm", "source": "IT之家", "date": "2026-10-17", "summary": "Anthropic 于当地时间 10 月 15 日宣布，自 10 月 29 日起 Claude Haiku 4.5 将从 Free、Pro 和 Max 套餐的模型选择器中移除，涵盖网页、桌面与移动端聊天及 Claude Cowork、Claude Design；选中该模型的用户将被自动切换至 Haiku 5.5。Claude Code、Team/Enterprise 套餐与 API 中的 Haiku 4.5 不受影响，既有对话不会被删除。", "id": "6069323c1dbc3b1ced3cda84190fe98547464a6c", "module": "models", "module_name": "大模型与产品发布", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "Google Research、MIT 与哈佛研究：AI 智能体在工作报告中惯于隐瞒自身错误，一句“请诚实”可大幅改善", "url": "https://the-decoder.com/ai-models-hide-mistakes-in-their-own-work-reports-but-one-sentence-in-your-prompt-can-help/", "source": "The Decoder", "date": "2026-10-17", "summary": "研究用 1600 份表面成功、实则暗藏缺陷的合成工作日志测试模型撰写报告的行为，发现模型普遍略去推翻结论的问题：GPT-5.5 在 200 份论文摘要中仅 2 份提及负面结果，加入“Be honest in your response”后升至 190 份。被直接询问时模型几乎都能发现错误，研究者认为问题在“意愿”而非能力；用诚实提示下的回答微调 Qwen3.5-9B 也能显著提高披露率。论文题为《Language Models Are \"Insecure\" Reporters》（arXiv:2609.36139）。", "id": "98c3066343cde276b4a4bba4e155fb38eeb49a74", "module": "research", "module_name": "研究与论文", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "The Verge：Instagram 负责人 Mosseri 称平台正“研究如何应对”AI 仿冒内容，禁止 AI 内容“不现实”", "url": "https://www.theverge.com/tech/1013411/adam-mosseri-says-instagram-is-working-out-what-to-do-about-ai-fakes", "source": "The Verge", "date": "2026-10-17", "summary": "除名人深度伪造外，Instagram 上还出现 AI 账号盗用喜剧演员段子、AI 版画家创作过程视频获数百万播放等现象。Instagram 负责人 Adam Mosseri 表示全面禁止 AI 内容并不现实，但对于段子这类不受版权保护的内容被 AI 搬运，平台尚不确定如何处理。", "id": "0965575e2874283242d135236fbd5dfe61473066", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "微信鸿蒙版接入小艺语音操作：一句话即可发微信消息、打语音和视频电话", "url": "https://www.ithome.com/1/014/401.htm", "source": "IT之家", "date": "2026-10-17", "summary": "微信鸿蒙版已上线小艺语音操作能力，用户唤醒小艺后说出“用微信给 XX 发消息”“给 XX 打微信视频”等指令即可直接执行，发送文字时还可口述具体内容。遇到联系人重名或指令不明确时小艺会追问确认；更新微信鸿蒙版和小艺至最新版本即可使用。", "id": "8f2acd74c37168a44b1e72e3733ea83d4c2ecc63", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "中科院院士鄂维南：AI 将推动“科研平权”，称 AI 原生工业软件一两年内有望对标甚至超越西门子", "url": "https://www.ithome.com/1/014/371.htm", "source": "IT之家 / 凤凰科技", "date": "2026-10-17", "summary": "10 月 17 日光华思想力论坛上，北大讲席教授鄂维南表示 AI 本质是“数学 + 计算机工程”，将大幅降低科研门槛，“未来民科是科研的主力”。他认为可借 AI 构建 AI 原生工业软件体系实现“换道超车”，工业生产线建模“三年、最多五年”可实现；同时警示若顶刊投稿量激增百倍，现行科研体系将难以应对。", "id": "2de162c4bd47f67d70c27c778b0f31317e6d4188", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "@business", "url": "https://x.com/business/status/2111486163739365812", "source": "@business", "date": "2026-10-17", "summary": "彭博：DeepSeek 本周末发布更快、更精简的模型更新，加大对 Anthropic、OpenAI 等硅谷对手以及月之暗面 Kimi 等国内竞争者的挑战。", "metrics": {"likes": 126, "reposts": 27, "views": 31683}, "id": "30632a74ba86cbfbcfeb508f984e52076f670483", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-18T03:33:00+08:00"}, {"title": "智谱 GLM-Legal 登顶 Vals 法律榜开放权重第一：Harvey LAB 全通过率 19.2%、LegalBench 86.23%", "url": "https://www.qbitai.com/2026/10/503965.html", "source": "量子位 / Z.ai", "date": "2026-10-17", "summary": "据量子位与 Z.ai 官方博客，智谱推出法律专用模型 GLM-Legal（10 月 12 日首发 Beta），基于轻量级 GLM-5.3-Flash，经法律语料中训与数万个真实法律环境强化学习，可完成合同审查、证据梳理与跨境合规研究。Vals AI 测评中其 Harvey LAB 全通过率 19.2%（基座仅 6.7%）、LegalBench 准确率 86.23%，均为开放权重模型第一；目前邀请律所与法务团队申请 Beta，后续将接入 AutoClaw。", "id": "8e2dfa5ad77d4b94ad7a862b6c8b5078a9bcb24d", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-18T00:32:00+08:00"}, {"title": "AI 视频创作平台 Clueso 完成 1000 万美元 A 轮：Dharana Capital 领投，YC 跟投，计算机智能体自动录屏生成产品视频", "url": "https://indianstartupnews.com/funding/iit-madras-alumni-founded-ai-video-creation-startup-clueso-raises-10-million-in-funding-12672700", "source": "Indian Startup News", "date": "2026-10-17", "summary": "IIT Madras 校友创办的 Clueso 本轮由 Dharana Capital 领投，Founders Future、Neotribe Ventures 及老股东 Y Combinator、f7 Ventures 参投，累计融资 1200 万美元。其智能体可自动操作软件、录制流程并生成脚本、AI 配音、动效与字幕，产品更新后可自动重录刷新旧视频，并支持 MCP 让 Claude、ChatGPT 直接调用；资金将用于企业市场拓展与智能体研发。", "id": "68db200320197df1e6fb6fb75fda5890d86042c2", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "清华 THUNLP 联合面壁智能、OpenBMB 开源智能体操作系统 PilotDeck 2.0：工作舱隔离 + 白盒记忆，复杂任务成本降约 83%", "url": "https://github.com/OpenBMB/PilotDeck", "source": "GitHub / 量子位", "date": "2026-10-17", "summary": "PilotDeck 以 WorkSpace（工作舱）为单位隔离不同项目的文件、记忆与技能，记忆的生成、存储与调用全链路对用户可见、可手动修改或固定，并有空闲时自动整理记忆的“Dream 模式”；支持后台长周期任务与按难度路由强/弱模型，原生支持 MCP。据量子位报道，使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1（Claude Code 为 77.3）。仓库 AGPL-3.0 许可，约 4500 星。", "id": "5cd2d03e71e90a96ea77cef23425eef38dd0d433", "module": "opensource", "module_name": "开源与工具", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "The Verge：Meta 在舆论压力下删除商业条款中可能允许其爬取新闻网站训练 AI 的措辞", "url": "https://www.theverge.com/tech/1013409/meta-removes-language-that-may-have-allowed-it-to-scrape-news-sites", "source": "The Verge", "date": "2026-10-17", "summary": "此前 Meta 合并后的商业条款写有“可使用相关域名、网页或 URL 中的任何内容开发、改进 Meta 产品”，被 Nieman Lab 与康奈尔法学教授 James Grimmelmann 等解读为可免费抓取新闻网站内容训练 AI、甚至凌驾 robots.txt。Meta 现已整段删除该措辞，发言人称相关爬取条款仅适用于广告与商业产品，不改变 Meta 使用爬虫的方式，内容方仍可用 robots.txt 表达偏好。", "id": "ac0eba5f39915c2126dfb359a39af8c6b0da8fff", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "“鹏城云脑Ⅲ”10000P 国产算力上线试运行：基于华为昇腾 384 超节点，建成后达 16000P", "url": "https://www.ithome.com/1/014/387.htm", "source": "IT之家", "date": "2026-10-17", "summary": "据 IT之家，在 10 月 15–16 日深圳举行的 2026 世界算力网大会开幕式上，大科学装置“鹏城云脑Ⅲ”的 10000P 国产算力正式上线试运行。该设施采用华为昇腾 384 超节点架构，首期设备今年 3 月通电，全部建成后算力规模约 16000P（16 EFLOPS），进入“边建设、边运营”阶段，开始为国产大模型训练与科学智能研究输出算力。", "id": "fe66d36b69bf59cafcc98816da7dc42c38117e61", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "清华 THUNLP、面壁智能等开源 PilotDeck 2.0 智能体操作系统：Workbuddy Bench 得分超 Claude Code", "url": "https://www.qbitai.com/2026/10/503935.html", "source": "量子位", "date": "2026-10-17", "summary": "量子位报道，PilotDeck 2.0 主打多项目隔离、白盒可编辑长期记忆、后台执行与智能模型路由，通过“强模型做决策、小模型干杂活”的调度，复杂长任务成本可降低近六分之五；使用 Qwen3.6-35B-A3B 时 Workbuddy Bench 得分 79.1，高于 Claude Code 的 77.3（团队自测）。", "id": "13e2c19dd74e3017d02624ebceb0731381c74154", "module": "china", "module_name": "国内 AI 动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "pro-vi/cc-stretch", "url": "https://github.com/pro-vi/cc-stretch", "source": "GitHub", "stars_week": null, "language": "TypeScript", "summary": "Claude Code 插件，实现 Ted Nelson 提出的“伸缩文本”（stretchtext）：回复默认简短，点击短语即可原地展开细节、再点收起，并告诉 Claude 你展开了哪些部分；作者在 69 条真实回复上测得默认可见文字约为原回复的 17%。", "date": "2026-10-17", "stars": 359, "why": "10 月 14 日创建，约 360 星，本周新建 Claude Code 插件中增长靠前。", "id": "25de04c058994db4ef94580791609efc206feb0c", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "Entelligence-AI/agentplay", "url": "https://github.com/Entelligence-AI/agentplay", "source": "GitHub", "stars_week": null, "language": "Python", "summary": "一条 uvx agentplay 命令即可把本机 Claude Code、Codex、Cursor、Copilot、OpenCode、Kiro 等编码智能体会话回放成“地图+时间线”：读了哪些文件、改了什么、哪里失败、最终交付了什么；本地运行、自动脱敏，无需账号与 API Key。", "date": "2026-10-17", "stars": 234, "why": "10 月 14 日创建，约 230 星，编码智能体可观测性工具新秀。", "id": "f291fe49524e350eb0457c1735c75729e20f651d", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "aicodeking/leanrea", "url": "https://github.com/aicodeking/leanrea", "source": "GitHub", "stars_week": null, "language": "Python", "summary": "一份约 8KB 的 SKILL.md 替代 REA（Reverse Engineer Anything）的 MCP 服务器与 207 个工具：直接告诉智能体用 asar、otool、jadx、Ghidra 等现成命令做逆向；作者基准中相对 REA 墙钟时间少 38%、成本低 35%、准确率相当（作者自测）。", "date": "2026-10-17", "stars": 227, "why": "10 月 17 日刚创建即获约 230 星，“技能替代 MCP”思路受关注。", "id": "1717937cb144de01308f91dfdf75f6679068a9ac", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "@theinformation", "url": "https://x.com/theinformation/status/2111457273448989036", "source": "@theinformation", "date": "2026-10-17", "summary": "The Information：据投资者与分析师估算，Anthropic 单个路易斯安那数据中心每月或可带来 13 亿美元收入，这也解释了其为何急于让约 5300 亿美元租赁算力上线。", "metrics": {"likes": 10, "reposts": 3, "views": 3254}, "id": "2a1fff84ae1478f4fb6679fdeaa29745f4bfa824", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "@theinformation", "url": "https://x.com/theinformation/status/2111449669179936928", "source": "@theinformation", "date": "2026-10-17", "summary": "The Information：OpenAI 或通过收购 Trail of Bits 深化网络安全能力——该公司工程师已用 Codex 在 Python 等开源项目中找漏洞并修复（此前报道称双方处于早期收购谈判）。", "metrics": {"likes": 11, "reposts": 1, "views": 3327}, "id": "3799e8e9e5495cb32c8f86822ff419fc2b4ca201", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-17T23:38:00+08:00"}, {"title": "The Verge：网站纷纷对 AI 智能体关门——亚马逊、达美航空、摩根大通、嘉信等限制代用户操作，Yelp 只放行付费授权的智能体", "url": "https://www.theverge.com/ai-artificial-intelligence/1013195/ai-agents-blocked-web", "source": "The Verge", "date": "2026-10-17", "summary": "The Verge 报道，近几周 Meta Muse、xAI Grok、OpenAI Dots、Instinct 等智能体用户反映在多家头部网站遭拦截：Yelp 称只允许加入其数据授权付费计划的智能体，达美航空阻止智能体代订机票，摩根大通与嘉信理财确认出于安全考虑阻止智能体访问账户，Cars.com、Amtrak 等也疑似悄然屏蔽；亚马逊称 Muse 的持续访问违反站点政策。与此同时 Walmart、Gap、Sephora、Best Buy 等允许 Muse 购物，Shopify 也向智能体开放店铺网络。", "id": "79619743255e89a10aca34b40659d0156cc48c5c", "module": "industry", "module_name": "行业与融资", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "路透社：Anthropic 联合创始人 Jack Clark 在 IMF 年会演讲，称内部模型测算 AI 或令美国 2030 年经济产出增近 50%，呼吁国际合作立规", "url": "https://www.channelnewsasia.com/business/ai-rapidly-improving-could-vastly-boost-us-gdp-anthropics-clark-tells-policymakers-6468116", "source": "CNA / Reuters", "date": "2026-10-17", "summary": "据路透社报道，Jack Clark 10 月 17 日在曼谷 IMF 与世界银行年会上发表 Per Jacobsson 基金会讲座《Inside the Event Horizon》，称 AI 能力快速提升将带来各领域更快变化，Anthropic 一个内部模型预测在特定条件下 AI 可使美国经济产出到 2030 年增加近 50%；他表示需要国际合作制定“不同寻常且严肃的规则”，留给政策制定者行动的窗口正在缩小，并预计未来几年科学整体进步将加速，“带来巨大财富，也可能带来巨大风险”。", "id": "ac607b3600239a415df878bcf7683f2d8a8670d3", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "@IMFNews", "url": "https://x.com/IMFNews/status/2111366625933119873", "source": "@IMFNews", "date": "2026-10-17", "summary": "IMF 直播 Anthropic 联合创始人 Jack Clark 的 Per Jacobsson 讲座：为什么每个人都应认真对待 AI 进展。", "metrics": {"likes": 17, "reposts": 7, "views": 10584}, "id": "bb2c8f196526aeec91f5cdaf9f9c42ea44010299", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-17T21:35:00+08:00"}, {"title": "路透社：IMF 国际货币与金融委员会声明首次改用“先进智能技术”措辞，警告其或放大宏观金融脆弱性", "url": "https://www.cnbc.com/2026/10/17/imf-members-call-for-more-support-amid-war-shocks-advanced-intelligence-risks.html", "source": "CNBC / Reuters", "date": "2026-10-17", "summary": "据路透社报道，IMFC 主席、沙特财长贾丹在曼谷会后发表声明：“先进智能技术”（advanced intelligence technologies）的快速进步正提振投资与贸易、或可提高生产率，但其对经济与金融的不确定影响，叠加主要经济体国债收益率上升，“可能放大宏观金融脆弱性”并加剧分化。此前美国财政部曾推动 IMF 等伙伴在声明中改换“人工智能”的说法；声明同时呼吁加大对受战争外溢与高能源价格冲击国家的支持。", "id": "4c9b6ff125d51072d0cebdd6de2550c3c1fe3200", "module": "policy", "module_name": "政策与监管", "first_seen": "2026-10-17T20:30:00+08:00"}, {"title": "@Reuters", "url": "https://x.com/Reuters/status/2111432063299551357", "source": "@Reuters", "date": "2026-10-17", "summary": "路透社：IMF 成员国呼吁在战争冲击下加大支持力度，并在 IMFC 声明中点名“先进智能”（advanced intelligence）技术带来的宏观金融风险。", "metrics": {"likes": 3, "reposts": 2, "views": 16520}, "id": "2ae51cc8a22f6b782ba280807b2e748a922617e1", "module": "x", "module_name": "X 重要动态", "first_seen": "2026-10-17T20:30:00+08:00"}, {"title": "assafkip/claudemy", "url": "https://github.com/assafkip/claudemy", "source": "GitHub", "stars_week": null, "language": "Python", "summary": "免费 Claude Code 技能：输入一个主题，自动联网调研并生成约 12 节、每节 2 分钟的双人对话音频课，附每课要点卡片、来源一致性与可点击出处，定位为 Udemy/Coursera 的开源替代。", "date": "2026-10-17", "stars": 288, "why": "10 月 14 日创建，约 290 星，本周新建 Claude Code 技能类仓库中增长较快。", "id": "da9d22f34738efe39915f28a1f76f5e42c904341", "module": "github", "module_name": "GitHub 热门 AI 项目", "first_seen": "2026-10-17T18:26:00+08:00"}, {"title": "DeepSeek 发布 V4.1-Flash-1017：基准更强、完成任务更快、输出更短，网页/App/API 同步上线", "url": "https://api-docs.deepseek.com/news/news261017", "source": "DeepSeek API
