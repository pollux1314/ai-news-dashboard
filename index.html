<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 资讯面板</title><style>
:root{--bg:#0b1020;--card:#151b2e;--line:#26304d;--tx:#e6e9f2;--mu:#8b93ad;--ac:#6ea8fe}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx)}
header{padding:28px 32px 12px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:28px}.mu{color:var(--mu);font-size:13px}
.bar{padding:0 32px 16px;display:flex;flex-wrap:wrap;gap:8px}
input{flex:1;min-width:220px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
.chip.on{background:var(--ac);color:#000;border-color:var(--ac)}
main{padding:0 32px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.mod h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between}
.it{padding:10px 0;border-top:1px solid var(--line)}.it:first-of-type{border-top:0}
.it a{color:var(--tx);text-decoration:none;font-weight:600}.it a:hover{color:var(--ac)}
.it p{margin:6px 0 4px;font-size:14px;line-height:1.55;color:#c5cbe0}
.tag{font-size:12px;color:var(--mu)}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin-right:6px;background:#2a2f45;color:#ffd666}
.bd.g{color:#7ee2a8}.bd.l{color:#9ec5ff}.pager{margin-top:12px;text-align:center}.why{font-size:13px;color:#a9b3d6;margin:2px 0 6px}
.err{grid-column:1/-1;text-align:center;padding:40px;color:var(--mu)}</style></head><body>
<!-- Static shell: all news is loaded at runtime from the read-only API proxy (Cloudflare Worker -> Tinybird). No data lives in this repo. -->
<header><div><h1>🤖 AI 资讯面板</h1><div class="mu">每条资讯均附原始来源链接 · 数据实时来自 API</div></div>
<div class="mu">最后更新：<b id="up">加载中…</b>（UTC+8）· 共 <b id="cnt">-</b> 条</div></header>
<div class="bar"><input id="q" placeholder="搜索标题、摘要或来源…"><span id="chips"></span></div>
<main id="m"><p class="err">加载中…</p></main>
<script>
const API='https://ai-news-proxy.sjwpollux1314.workers.dev';
const MODS=[{id:'models',icon:'🚀',name:'大模型与产品发布'},{id:'industry',icon:'💰',name:'行业与融资'},{id:'research',icon:'📄',name:'研究与论文'},{id:'opensource',icon:'🛠️',name:'开源与工具'},{id:'policy',icon:'⚖️',name:'政策与监管'},{id:'china',icon:'🇨🇳',name:'国内 AI 动态'},{id:'github',icon:'⭐',name:'GitHub 热门 AI 项目'},{id:'x',icon:'𝕏',name:'X 重要动态'}];
let L=null,cur='all',page=1,hmod='',hseq=0,htimer=null;const PS=20;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mname=id=>(MODS.find(m=>m.id===id)||{}).name||id;
const fmt=n=>n>=1e4?(n/1e4).toFixed(1)+'万':Number(n).toLocaleString();
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
function extra(i){let h='';if(i.stars!=null){h+=`<div><span class="bd">★ ${fmt(i.stars)}</span>`+(i.stars_week?`<span class="bd g">本周 +${fmt(i.stars_week)}</span>`:'')+(i.language?`<span class="bd l">${esc(i.language)}</span>`:'')+(i.note?`<span class="bd">🆕 ${esc(i.note)}</span>`:'')+'</div>';}
if(i.why)h+=`<div class="why">💡 ${esc(i.why)}</div>`;
if(i.metrics){const m=i.metrics;h+=`<div><span class="bd">❤ ${fmt(m.likes||0)}</span><span class="bd g">🔁 ${fmt(m.reposts||0)}</span><span class="bd l">👁 ${fmt(m.views||0)}</span></div>`}return h}
const card=(i,showMod)=>`<div class="it"><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary)}</p>${extra(i)}<span class="tag">${showMod?esc(mname(i.module))+' · ':''}${esc(i.source)} · ${esc(i.date)}</span></div>`;
const errBox=msg=>`<div class="err">⚠️ ${esc(msg)}<br><br><button class="chip" onclick="retry()">重试</button></div>`;
async function api(path){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),10000);
try{const r=await fetch(API+path,{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(to)}}
function setUpdated(u){if(u)$('up').textContent=new Date(u).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
$('chips').innerHTML='<button class="chip on" data-v="latest">🆕 本期最新</button><button class="chip" data-v="hist">📚 全部历史</button><span style="opacity:.4;margin:0 6px">|</span><button class="chip on" data-id="all">全部类型</button>'+MODS.map(m=>`<button class="chip" data-id="${m.id}">${m.icon} ${esc(m.name)}</button>`).join('');
let view='latest';
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;page=1;
if(b.dataset.v){view=b.dataset.v;$('chips').querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b))}
else{cur=b.dataset.id;hmod=cur==='all'?'':cur;$('chips').querySelectorAll('[data-id]').forEach(x=>x.classList.toggle('on',x===b))}
render()};
async function loadLatest(){try{L=await api('/latest?per=8');setUpdated(L.updated);$('chips').querySelector('[data-v=hist]').textContent=`📚 全部历史 (${L.total})`;return true}
catch(e){$('m').innerHTML=errBox('资讯加载失败（'+e.message+'），请稍后重试');$('up').textContent='-';return false}}
function retry(){if(!L)loadLatest().then(ok=>ok&&render());else render()}
function renderMain(){const q=$('q').value.trim().toLowerCase();let n=0;
$('m').innerHTML=MODS.filter(m=>cur==='all'||m.id===cur).map(m=>{const its=(L.modules[m.id]||[]).filter(i=>!q||(i.title+i.summary+i.source).toLowerCase().includes(q));n+=its.length;if(!its.length)return'';
return `<section class="mod"><h2><span>${m.icon} ${esc(m.name)}</span><span class="tag">${its.length} 条</span></h2>`+its.map(i=>card(i,false)).join('')+'</section>'}).join('')||'<p class="mu">没有匹配的资讯</p>';$('cnt').textContent=n}
async function renderHist(){const seq=++hseq,q=$('q').value.trim();
const opts='<option value="">全部模块</option>'+MODS.map(m=>`<option value="${m.id}"${m.id===hmod?' selected':''}>${m.icon} ${esc(m.name)}</option>`).join('');
try{const d=await api(`/history?limit=${PS}&offset=${(page-1)*PS}`+(hmod?`&module=${encodeURIComponent(hmod)}`:'')+(q?`&keyword=${encodeURIComponent(q)}`:''));
if(seq!==hseq||view!=='hist')return;const pages=Math.max(1,Math.ceil(d.total/PS));if(page>pages&&d.total){page=pages;return renderHist()}
setUpdated(d.updated);$('cnt').textContent=d.total;
$('m').innerHTML=`<section class="mod" id="histbox" style="grid-column:1/-1"><h2><span>📚 全部历史${hmod?' · '+esc(mname(hmod)):''}（按日期从新到旧）</span><span class="tag">第 ${page}/${pages} 页 · ${d.total} 条</span></h2>`+
(d.items.map(i=>card(i,true)).join('')||'<p class="mu">没有匹配的资讯</p>')+
`<div class="pager"><button class="chip" onclick="page=Math.max(1,page-1);render()">上一页</button> <button class="chip" onclick="page=page+1;render()">下一页</button></div></section>`;
}
catch(e){if(seq===hseq&&view==='hist')$('m').innerHTML=errBox('历史数据加载失败（'+e.message+'），请稍后重试')}}
function render(){if(view==='hist')return renderHist();if(L)renderMain()}
$('q').oninput=()=>{page=1;if(view==='hist'){clearTimeout(htimer);htimer=setTimeout(render,300)}else render()};
loadLatest().then(ok=>ok&&render());
</script></body></html>
